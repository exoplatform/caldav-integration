caldav.deviceSetup.copyFallback=Kopiering \u00e4r inte tillg\u00e4nglig h\u00e4r. V\u00e4rdet \u00e4r markerat, tryck p\u00e5 Ctrl+C (Cmd+C p\u00e5 Mac) f\u00f6r att kopiera det
caldav.admin.servers.quirks.title=Vad den h\u00e4r servern g\u00f6r
caldav.admin.servers.quirks.subtitle=Differences found by the platform while checking the meeting copies sent here. Tick one to stop treating it as a change.
caldav.admin.servers.quirks.none=No difference found: this server keeps copies as written. Nothing to do.
caldav.admin.servers.quirks.seen.once=Har uppt\u00e4ckts en g\u00e5ng
caldav.admin.servers.quirks.seen.many=Har uppt\u00e4ckts {0} g\u00e5nger
caldav.admin.servers.quirks.dropsConference.label=Den h\u00e4r servern beh\u00e5ller inte l\u00e4nkar till videokonferenser
caldav.admin.servers.quirks.dropsConference.cost=eXo slutar behandla den saknade l\u00e4nken som en \u00e4ndring och m\u00e4rker inte l\u00e4ngre om n\u00e5gon tar bort en.
caldav.admin.servers.quirks.addsCompatibilityMarkers.label=Den h\u00e4r servern l\u00e4gger till kompatibilitetsmark\u00f6rer f\u00f6r Outlook och Thunderbird
caldav.admin.servers.quirks.addsCompatibilityMarkers.cost=Andra kalenderappar l\u00e4gger till de h\u00e4r f\u00e4lten. eXo ignorerar dem och l\u00e4mnar dem som de \u00e4r.
caldav.admin.servers.quirks.addsFormattedDescription.label=Den h\u00e4r servern l\u00e4gger till en formaterad kopia av beskrivningen
caldav.admin.servers.quirks.addsFormattedDescription.cost=En kopia av beskrivningen med formaterad text. eXo ignorerar den och j\u00e4mf\u00f6r i st\u00e4llet versionen med oformaterad text.
caldav.admin.servers.quirks.stampsDefaultPriority.label=Den h\u00e4r servern s\u00e4tter en standardprioritet p\u00e5 varje m\u00f6te som den lagrar
caldav.admin.servers.quirks.stampsDefaultPriority.cost=En prioritet som ingen har valt, tillagd p\u00e5 varje kopia. eXo skriver ingen prioritet alls, s\u00e5 den slutar behandla en prioritet som en \u00e4ndring och m\u00e4rker inte l\u00e4ngre om n\u00e5gon anger en verklig prioritet p\u00e5 den h\u00e4r servern.
caldav.admin.servers.quirks.rewritesDescription.label=Den h\u00e4r servern skriver om inbjudningstexten
caldav.admin.servers.quirks.rewritesDescription.cost=eXo slutar kontrollera beskrivningen av kopior p\u00e5 den h\u00e4r servern, inklusive svarsl\u00e4nkarna i den. En omskriven l\u00e4nk uppt\u00e4cks inte.
caldav.admin.servers.quirks.generic.added.label=Den h\u00e4r servern l\u00e4gger till {0}, som eXo inte skriver
caldav.admin.servers.quirks.generic.added.cost=eXo slutar behandla det som en \u00e4ndring p\u00e5 den h\u00e4r servern.
caldav.admin.servers.quirks.generic.dropped.label=Den h\u00e4r servern beh\u00e5ller inte {0}
caldav.admin.servers.quirks.generic.dropped.cost=eXo slutar behandla avsaknaden som en \u00e4ndring och m\u00e4rker inte l\u00e4ngre om n\u00e5gon tar bort det.
caldav.admin.servers.quirks.generic.rewritten.label=Den h\u00e4r servern skriver om {0}
caldav.admin.servers.quirks.generic.rewritten.cost=eXo slutar kontrollera det v\u00e4rdet p\u00e5 kopior som lagras av den h\u00e4r servern.
caldav.admin.servers.quirks.changesWhatIsWritten=\u00c4ndrar vad eXo skriver i kalendrar p\u00e5 den h\u00e4r servern
caldav.admin.servers.foreignWriters.title=Andra eXo-installationer som skriver hit
caldav.admin.servers.foreignWriters.subtitle=Another eXo instance copies meetings to this server, and the two versions keep correcting each other.
caldav.admin.servers.foreignWriters.none=No other eXo writes to the accounts on this server. Nothing to do.
caldav.admin.servers.foreignWriters.cost=The platform checks and repairs the meetings it sent here.
caldav.admin.servers.foreignWriters.lastSeen=Senast sedd {0}
caldav.admin.servers.foreignWriters.resolution=Anslut en av de tv\u00e5 installationerna till ett annat CalDAV-konto. Under tiden importeras, tas bort eller repareras inget p\u00e5 n\u00e5got annat s\u00e4tt, och de kopior som redan har skrivits finns kvar tills n\u00e5gon tar bort dem.
caldav.admin.servers.quirks.omitsSoloOrganizer.label=Den h\u00e4r servern tar bort organisat\u00f6ren fr\u00e5n en h\u00e4ndelse utan andra deltagare
caldav.admin.servers.quirks.omitsSoloOrganizer.cost=Ingenting \u00e4ndras: p\u00e5 alla servrar utel\u00e4mnar eXo redan organisat\u00f6ren fr\u00e5n h\u00e4ndelser utan andra deltagare. Kopior av h\u00e4ndelser med deltagare anger fortfarande sin organisat\u00f6r.
caldav.error.mainCalendarUnknown=eXo kan inte kopiera dina m\u00f6ten till det h\u00e4r kontot: det anger inte vilken av dess kalendrar som \u00e4r standardkalendern, s\u00e5 det finns ingenstans att l\u00e4gga dem. Kontakta din administrat\u00f6r.
caldav.error.foreignCopy=Det h\u00e4r m\u00f6tet finns redan i ditt kalenderkonto, tillagt av n\u00e5gon annan. eXo l\u00e4mnar den kopian som den \u00e4r.
caldav.error.forbidden=Den h\u00e4r kalendern delas med dig som skrivskyddad, s\u00e5 din \u00e4ndring kan inte sparas i den.

caldav.server.authProviderUnknown=Den autentiseringsmetoden \u00e4r inte tillg\u00e4nglig p\u00e5 den h\u00e4r servern. V\u00e4lj en i listan.
caldav.server.writeChannelUnavailable=Den h\u00e4r servern erbjuder inte det s\u00e4ttet att skriva m\u00f6teskopior. V\u00e4lj standard-CalDAV.
caldav.server.writeChannelNotRecognised=Med de h\u00e4r inst\u00e4llningarna k\u00e4nner till\u00e4gget som erbjuder det h\u00e4r s\u00e4ttet att skriva m\u00f6teskopior inte igen den h\u00e4r servern som en av sina egna. Kontrollera vad som har \u00e4ndrats i serverns inst\u00e4llningar.
caldav.server.url.malformed=Det \u00e4r inte en anv\u00e4ndbar webbadress. Den m\u00e5ste b\u00f6rja med https:// (eller http:// om din administrat\u00f6r till\u00e5ter det) och ange en server.
caldav.server.url.schemeNotAllowed=Endast https-adresser accepteras. Be din administrat\u00f6r att till\u00e5ta http om den h\u00e4r servern saknar certifikat.
caldav.server.url.credentials=Ta bort anv\u00e4ndarnamnet och l\u00f6senordet fr\u00e5n adressen. eXo anv\u00e4nder de inloggningsuppgifter som varje anv\u00e4ndare ansluter med, aldrig s\u00e5dana som skrivits in i adressen.
caldav.server.url.fragment=Ta bort # och allt som f\u00f6ljer efter det. En serveradress inneh\u00e5ller inget fragment.
caldav.server.url.portNotAllowed=Den porten \u00e4r inte till\u00e5ten. Anv\u00e4nd standardporten, eller be din administrat\u00f6r att till\u00e5ta den h\u00e4r.
caldav.server.url.usernameInAuthority=Platsh\u00e5llaren {username} kan bara f\u00f6rekomma efter servernamnet, i s\u00f6kv\u00e4gen. Placera den i s\u00f6kv\u00e4gen, inte i sj\u00e4lva serverns adress.
caldav.server.url.privateAddress=Den adressen pekar in i ditt eget n\u00e4tverk, s\u00e5 den accepteras inte. eXo ansluter fr\u00e5n servern, s\u00e5 en intern adress skulle kunna anv\u00e4ndas f\u00f6r att n\u00e5 datorer som aldrig var avsedda att exponeras. Om den \u00e4r korrekt kan du be din administrat\u00f6r att till\u00e5ta den.
caldav.server.url.unresolvable=Det servernamnet finns inte. Kontrollera stavningen.
caldav.share.calendarNotFound=Den h\u00e4r kalendern finns inte l\u00e4ngre.
caldav.share.notOwner=Bara \u00e4garen till en kalender kan dela den.
caldav.share.notConnected=Anslut ditt kalenderkonto innan du delar en kalender.
caldav.share.calendarNotOnServer=Den h\u00e4r kalendern finns inte p\u00e5 din kalenderserver \u00e4n. F\u00f6rs\u00f6k igen efter n\u00e4sta synkronisering.
caldav.share.notSupported=Din kalenderserver till\u00e5ter inte att eXo delar kalendrar.
caldav.share.shareeRequired=V\u00e4lj en kollega att dela med.
caldav.share.shareeUnknown=Den h\u00e4r kollegan \u00e4r inte en aktiv anv\u00e4ndare.
caldav.share.shareeIsOwner=Du \u00e4ger redan den h\u00e4r kalendern.
caldav.share.shareeNotConnected=Den h\u00e4r kollegan \u00e4r inte ansluten till samma kalenderserver.
caldav.share.samePrincipal=Den h\u00e4r kollegan anv\u00e4nder samma kalenderkonto som du och ser d\u00e4rf\u00f6r redan den h\u00e4r kalendern.
caldav.share.notReadOnly=Den h\u00e4r kollegan har mer \u00e4n l\u00e4sbeh\u00f6righet, som har angetts utanf\u00f6r plattformen. \u00c4ndra det i din kalenderapp.
caldav.share.aclUnreadable=Din kalenderserver l\u00e5ter inte plattformen se vilka den h\u00e4r kalendern delas med.
caldav.share.aclNotUnderstood=Den h\u00e4r kalendern delas p\u00e5 ett s\u00e4tt som plattformen inte kan \u00e4ndra utan risk. Hantera delningen i din kalenderapp.
caldav.share.serverRefused=Din kalenderserver avvisade \u00e4ndringen.
caldav.share.notApplied=Din kalenderserver godtog \u00e4ndringen men till\u00e4mpade den inte.
caldav.share.serverUnavailable=Det gick inte att n\u00e5 din kalenderserver. F\u00f6rs\u00f6k igen senare.
caldav.share.credentials=Din kalenderserver avvisade ditt konto. Kontrollera ditt l\u00f6senord i kalenderinst\u00e4llningarna.
caldav.share.ownerUnknown=Din kalenderserver angav inte vilket konto du \u00e4r ansluten med. F\u00f6rs\u00f6k igen efter n\u00e4sta synkronisering.
caldav.share.foreignAccessNotPreserved=N\u00e5gon har mer \u00e4n l\u00e4sbeh\u00f6righet till den h\u00e4r kalendern, som har angetts utanf\u00f6r plattformen. Om du \u00e4ndrar delningen h\u00e4r kan den beh\u00f6righeten p\u00e5verkas, s\u00e5 hantera den i din kalenderapp.
caldav.share.shareeAddressUnknown=Kalenderservern angav inte den h\u00e4r kollegans e-postadress, s\u00e5 plattformen kunde inte \u00e4ndra kollegans beh\u00f6righet.
caldav.share.shareeHasOtherAccess=Den h\u00e4r kollegan har en annan beh\u00f6righet till den h\u00e4r kalendern, som har angetts utanf\u00f6r plattformen, till exempel att se n\u00e4r du \u00e4r ledig. Om du delar kalendern h\u00e4r ers\u00e4tts den beh\u00f6righeten, s\u00e5 \u00e4ndra den i din kalenderapp.
caldav.share.notOwnedOnServer=Den h\u00e4r kalendern tillh\u00f6r n\u00e5gon annan, eller s\u00e5 f\u00e5r du inte hantera dess delning. Fr\u00e5n plattformen kan du bara dela kalendrar som du \u00e4ger.
caldav.admin.servers.drawer.authentication=Autentisering
caldav.admin.servers.drawer.authProvider=Hur anv\u00e4ndarna autentiserar sig
caldav.admin.servers.drawer.disconnection.title=\u00c4ndra autentiseringen
caldav.admin.servers.drawer.disconnection.one=Om autentiseringen \u00e4ndras kopplas 1 anv\u00e4ndare av den h\u00e4r servern fr\u00e5n.
caldav.admin.servers.drawer.disconnection.many=Om autentiseringen \u00e4ndras kopplas {0} anv\u00e4ndare av den h\u00e4r servern fr\u00e5n.
caldav.admin.servers.drawer.disconnection.question=\u00c4r du s\u00e4ker p\u00e5 att du vill spara?
caldav.admin.servers.drawer.disconnection.confirm=Spara
caldav.admin.servers.drawer.disconnection.cancel=Avbryt
caldav.admin.servers.drawer.disconnection.countFailed=Det gick inte att r\u00e4kna anv\u00e4ndarna av den h\u00e4r servern. Inget sparades, f\u00f6rs\u00f6k igen.
