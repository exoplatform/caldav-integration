caldav.managed.serverNotEligible=Kies een server die is geconfigureerd en actief is. Een gedeactiveerde server is niet bereikbaar, dus niemand zou verbinding kunnen maken met uniforme verbinding.
caldav.managed.providerNotEligible=Met de uniforme verbinding kan deze server geen provider gebruiken die de inloggegevens van elke gebruiker nodig heeft. Schakel de uniforme verbinding uit, of kies een provider met een serviceaccount.
caldav.admin.servers.list.managedLocked=U kunt deze server niet deactiveren of verwijderen zolang de uniforme verbinding deze gebruikt. Schakel eerst de uniforme verbinding uit, in de rij boven de serverlijst.
caldav.managed.serverInUse=U kunt deze server niet deactiveren zolang uniforme verbinding is ingeschakeld, omdat iedereen ermee synchroniseert. Schakel eerst uniforme verbinding uit, in de rij boven de serverlijst.
caldav.managed.connectionLocked=Uw organisatie beheert uw agenda-account: de verbinding ervan kan niet worden gewijzigd.
caldav.managed.refused=De agendaserver van uw organisatie accepteert uw account niet. Neem contact op met uw beheerder.
agenda.caldavCalendar.disconnect.warning=De agenda's die eXo van {0} toont, worden uit uw agenda verwijderd, samen met de kopie\u00ebn van hun gebeurtenissen. Er wordt niets verwijderd op {0}, en de agenda's die u in eXo hebt gemaakt, blijven staan. Verbind het account opnieuw en die agenda's komen terug.
caldav.pendingCopies.title=Kopie\u00ebn van vergaderingen die nog onderweg zijn
caldav.pendingCopies.subtitle={0} van uw vergaderingen zijn in eXo gewijzigd en de wijziging heeft uw agenda nog niet bereikt. eXo blijft het proberen; de volgende synchronisatie op de achtergrond lost ze meestal op.
caldav.calendarStates.title=Agenda's die aandacht nodig hebben
caldav.calendarStates.subtitle={0} van uw agenda's synchroniseren niet normaal
caldav.calendarStates.manage=Bekijken wat er mis is
caldav.calendarStates.drawer.title=Agenda's die aandacht nodig hebben
caldav.calendarStates.drawer.description=Deze agenda's synchroniseren niet zoals de andere. De rest van uw agenda's is niet getroffen.
caldav.calendarStates.explain.REMOTE_CREATE_REFUSED=Uw agenda-account staat niet toe dat eXo er agenda's op maakt, dus deze agenda wordt daar niet naartoe gekopieerd. Agenda's die al op het account bestaan, verschijnen nog steeds in eXo.
caldav.calendarStates.explain.PAUSED=Het synchroniseren van deze agenda is herhaaldelijk mislukt, dus eXo is gestopt met proberen. Synchroniseer nu om opnieuw te beginnen; als het blijft mislukken, verbind het account dan opnieuw.
caldav.calendarStates.explain.EXO_ORPHANED=U hebt deze agenda in eXo verwijderd, en hij kon niet worden verwijderd op uw agenda-account. Hij staat er nog steeds.
caldav.calendarStates.explain.REMOTE_GONE=Deze agenda staat niet meer op uw agenda-account. Er komt niets nieuws meer in binnen, en wat eXo al bevat, blijft ongewijzigd.
caldav.calendarStates.explain.RETIRED_SUBSCRIPTION=Dit is een kopie van een agenda die met u is gedeeld, of van een resource waarop u zich hebt geabonneerd. Deze synchroniseert niet meer, dus wijzigingen hier komen nergens aan. Verwijder deze en het origineel verschijnt onder Gedeeld met mij, alleen-lezen.
caldav.calendarStates.explain.unknown=Deze agenda synchroniseert niet normaal.
