agenda.caldavCalendar.calendarDelete.propagates=Deze agenda staat ook op {0}. Als u hem hier verwijdert, wordt hij daar ook verwijderd, met alle gebeurtenissen erin. Dat geldt ook voor gebeurtenissen die u vanaf uw telefoon of een andere app hebt toegevoegd, en het kan niet ongedaan worden gemaakt.
agenda.caldavCalendar.calendarDelete.keepsRemote=De overeenkomende agenda op {0} wordt niet aangeraakt. Die blijft daar staan met al zijn gebeurtenissen, en eXo toont hem gewoon niet meer.
caldav.hiddenCalendars.title=Verborgen agenda's
caldav.hiddenCalendars.subtitle={0} agenda('s) die u hier hebt verwijderd, staan nog op uw agenda-account
caldav.hiddenCalendars.manage=De verborgen agenda's beheren
caldav.hiddenCalendars.drawer.title=Verborgen agenda's
caldav.hiddenCalendars.drawer.description=U hebt deze agenda's uit eXo verwijderd, maar ervoor gekozen ze op uw account te behouden. Als u er een weer toont, komt die bij de volgende synchronisatie terug, met de gebeurtenissen die er nu in staan.
caldav.hiddenCalendars.showAgain=Weer tonen
caldav.hiddenCalendars.showAgainSuccess={0} komt terug bij de volgende synchronisatie
caldav.hiddenCalendars.showAgainError=Deze agenda kon niet weer worden getoond
caldav.hiddenCalendars.count={0} agenda('s) verborgen in uw agenda
caldav.hiddenCalendars.drawer.about=Agenda's die u in eXo hebt verborgen. Toon er een om die terug te halen: een verwijderde agenda komt bij de volgende synchronisatie terug met de huidige gebeurtenissen, een gedeelde agenda komt meteen terug onder Gedeeld met mij.
caldav.hiddenCalendars.deletedHere=Hier verwijderd, behouden op uw agenda-account
caldav.hiddenCalendars.sharedBy=Gedeeld door {0}
caldav.hiddenCalendars.sharedWithYou=Gedeeld met u
caldav.hiddenCalendars.showAgainSharedSuccess={0} staat weer onder Gedeeld met mij
caldav.hiddenCalendars.notAShare=U kunt alleen agenda's verbergen die met u zijn gedeeld. Als u een van uw eigen agenda's niet meer wilt zien, verwijder die dan en selecteer "Behouden op mijn agenda-account" wanneer daarom wordt gevraagd.
caldav.hiddenCalendars.calendarRequired=Kies de agenda die u wilt verbergen.
caldav.hiddenCalendars.accountUnavailable=Uw agenda-account kon niet worden bereikt, dus deze agenda is niet verborgen. Probeer het zo meteen opnieuw.

caldav.admin.sync.title=Agendasynchronisatie
caldav.admin.sync.description=Hoe vaak en hoe uitgebreid eXo de agenda-accounts leest die uw gebruikers verbinden. Wijzigingen worden van kracht bij de volgende synchronisatie.
caldav.admin.sync.throttleMinutes.label=Wachttijd tussen synchronisaties
caldav.admin.sync.throttleMinutes.help=Bij het openen van de agenda wordt het verbonden account gelezen, waarna het zo lang met rust wordt gelaten, hoe vaak de pagina ook wordt geopend. Zo doet een drukke gebruiker niet bij elke weergave een verzoek.
caldav.admin.sync.pastDays.label=Gebeurtenissen uit het verleden lezen
caldav.admin.sync.pastDays.help=Hoe ver terug in het verleden eXo gebeurtenissen leest. Gebeurtenissen uit het verleden veranderen zelden, dus er minder lezen kost bijna niets en maakt elke synchronisatie lichter.
caldav.admin.sync.futureDays.label=Gebeurtenissen vooruit lezen
caldav.admin.sync.futureDays.help=Hoe ver vooruit eXo gebeurtenissen leest. Dit is de instelling die kost: een breed venster op een account met jaren aan terugkerende vergaderingen is een grote download, die wordt betaald bij de eerste synchronisatie van elke dag.
caldav.admin.sync.sweepStaleMinutes.label=Accounts vernieuwen die ongemoeid zijn gelaten gedurende
caldav.admin.sync.sweepStaleMinutes.help=eXo leest een agenda-account wanneer de eigenaar zijn agenda opent, en die wacht terwijl het account wordt geladen. Accounts die niemand langer dan deze tijd heeft geopend, worden in plaats daarvan op de achtergrond vernieuwd, zodat de volgende agenda opent met de gebeurtenissen er al in.\n\nVerlaag deze waarde voor actuelere agenda's, maar meer serververzoeken. Verhoog de waarde als de agendaservers traag zijn of een snelheidslimiet hebben.
caldav.admin.sync.sweepBatchSize.label=Agenda's per achtergronduitvoering
caldav.admin.sync.sweepBatchSize.help=Elke uitvoering vernieuwt maximaal dit aantal agenda's, oudste eerst. Verhoog de waarde om sneller bij te werken op een drukke instantie, verlaag de waarde om de belasting te spreiden.
caldav.admin.sync.unit.minutes=minuten
caldav.admin.sync.unit.days=dagen
caldav.admin.sync.unit.calendars=agenda's
caldav.admin.sync.save=Opslaan
caldav.admin.sync.saved=Synchronisatie-instellingen opgeslagen
caldav.admin.sync.saveFailed=Deze instellingen konden niet worden opgeslagen
