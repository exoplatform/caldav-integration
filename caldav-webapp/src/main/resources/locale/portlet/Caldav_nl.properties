caldav.admin.servers.quirks.dropsConference.cost=eXo behandelt de ontbrekende link niet langer als wijziging en merkt niet meer op als iemand er een verwijdert.
caldav.admin.servers.quirks.addsCompatibilityMarkers.label=Deze server voegt compatibiliteitsmarkeringen voor Outlook en Thunderbird toe
caldav.admin.servers.quirks.addsCompatibilityMarkers.cost=Andere agenda-apps voegen deze velden toe. eXo negeert ze en laat ze ongewijzigd.
caldav.admin.servers.quirks.addsFormattedDescription.label=Deze server voegt een opgemaakte kopie van de beschrijving toe
caldav.admin.servers.quirks.addsFormattedDescription.cost=Een kopie van de beschrijving in opgemaakte tekst. eXo negeert die en vergelijkt in plaats daarvan de versie in platte tekst.
caldav.admin.servers.quirks.stampsDefaultPriority.label=Deze server zet een standaardprioriteit op elke vergadering die hij opslaat
caldav.admin.servers.quirks.stampsDefaultPriority.cost=Een prioriteit die niemand heeft gekozen, toegevoegd aan elke kopie. eXo schrijft helemaal geen prioriteit en beschouwt die dus niet langer als een wijziging, maar merkt dan ook niet meer op als iemand op deze server een echte prioriteit instelt.
caldav.admin.servers.quirks.rewritesDescription.label=Deze server herschrijft de uitnodigingstekst
caldav.admin.servers.quirks.rewritesDescription.cost=eXo controleert de beschrijving van kopie\u00ebn op deze server niet langer, inclusief de antwoordlinks erin. Een herschreven link wordt niet opgemerkt.
caldav.admin.servers.quirks.generic.added.label=Deze server voegt {0} toe, wat eXo niet schrijft
caldav.admin.servers.quirks.generic.added.cost=eXo behandelt dit op deze server niet langer als wijziging.
caldav.admin.servers.quirks.generic.dropped.label=Deze server bewaart {0} niet
caldav.admin.servers.quirks.generic.dropped.cost=eXo behandelt het ontbreken ervan niet langer als wijziging en merkt niet meer op als iemand het verwijdert.
caldav.admin.servers.quirks.generic.rewritten.label=Deze server herschrijft {0}
caldav.admin.servers.quirks.generic.rewritten.cost=eXo controleert die waarde niet langer op kopie\u00ebn die door deze server zijn opgeslagen.
caldav.admin.servers.quirks.changesWhatIsWritten=Verandert wat eXo in agenda's op deze server schrijft
caldav.admin.servers.foreignWriters.title=Andere eXo-installaties die hier schrijven
caldav.admin.servers.foreignWriters.subtitle=Een andere eXo heeft kopie\u00ebn van vergaderingen geschreven in de accounts op deze server. Beide herstellen dezelfde kopie\u00ebn, en geen van beide kan de schrijfacties van de ander onderscheiden van een wijziging die iemand heeft aangebracht.
caldav.admin.servers.foreignWriters.none=Er is geen andere eXo gezien die in de accounts op deze server schrijft. Zo ziet een server eruit waarnaar alleen deze installatie schrijft, en er is geen actie nodig.
caldav.admin.servers.foreignWriters.cost=eXo controleert de kopie\u00ebn van vergaderingen die het hier heeft geplaatst en herstelt wat is gewijzigd, in de veronderstelling dat het ze allemaal zelf heeft geschreven. Kopie\u00ebn die deze andere installatie heeft geschreven, worden meegeteld en vergeleken alsof ze van eXo zelf zijn.
caldav.admin.servers.foreignWriters.lastSeen=Laatst gezien op {0}
caldav.admin.servers.foreignWriters.resolution=Koppel een van de twee installaties aan een ander CalDAV-account. Intussen wordt hier niets anders ge\u00efmporteerd, verwijderd of hersteld, en de al geschreven kopie\u00ebn blijven staan totdat iemand ze verwijdert.
caldav.admin.servers.quirks.omitsSoloOrganizer.label=Deze server laat de organisator weg uit een gebeurtenis zonder andere deelnemers
caldav.admin.servers.quirks.omitsSoloOrganizer.cost=Er verandert niets: op elke server laat eXo de organisator al weg uit gebeurtenissen zonder andere deelnemers. Kopie\u00ebn van gebeurtenissen met deelnemers noemen hun organisator nog steeds.
caldav.error.mainCalendarUnknown=eXo kan uw vergaderingen niet naar dit account kopi\u00ebren: het account meldt niet welke van zijn agenda's de standaardagenda is, dus er is geen plek om ze neer te zetten. Neem contact op met uw beheerder.
caldav.error.foreignCopy=Deze vergadering staat al in uw agenda-account, toegevoegd door iemand anders. eXo laat die kopie zoals die is.
caldav.error.forbidden=Deze agenda is alleen-lezen met u gedeeld, dus uw wijziging kan er niet in worden opgeslagen.

caldav.server.authProviderUnknown=Die authenticatiemethode is niet beschikbaar op deze server. Kies er een uit de lijst.
caldav.server.writeChannelUnavailable=Deze server biedt deze manier van schrijven van kopie\u00ebn van vergaderingen niet aan. Kies standaard CalDAV.
caldav.server.writeChannelNotRecognised=Met deze instellingen herkent de add-on die deze manier van schrijven van kopie\u00ebn van vergaderingen aanbiedt, deze server niet als een van de zijne. Controleer wat er is gewijzigd in de serverinstellingen.
caldav.server.url.malformed=Dat is geen bruikbaar webadres. Het moet beginnen met https:// (of http:// als uw beheerder dat toestaat) en een server noemen.
caldav.server.url.schemeNotAllowed=Alleen https-adressen worden geaccepteerd. Vraag uw beheerder om http toe te staan als deze server geen certificaat heeft.
caldav.server.url.credentials=Verwijder de gebruikersnaam en het wachtwoord uit het adres. eXo gebruikt de inloggegevens waarmee elke gebruiker verbinding maakt, nooit gegevens die in het adres zijn geschreven.
caldav.server.url.fragment=Verwijder de # en alles wat erna komt. Een serveradres bevat geen fragment.
caldav.server.url.portNotAllowed=Die poort is niet toegestaan. Gebruik de standaardpoort, of vraag uw beheerder om deze poort toe te staan.
caldav.server.url.usernameInAuthority=De placeholder {username} mag alleen na de servernaam staan, in het pad. Zet hem in het pad, niet in het adres van de server zelf.
caldav.server.url.privateAddress=Dat adres verwijst naar uw eigen netwerk, dus het wordt niet geaccepteerd. eXo maakt verbinding vanaf de server, dus een intern adres zou gebruikt kunnen worden om machines te bereiken die nooit bedoeld waren om te worden blootgesteld. Als het adres juist is, vraag uw beheerder dan om het toe te staan.
caldav.server.url.unresolvable=Die servernaam bestaat niet. Controleer de spelling.
caldav.share.calendarNotFound=Deze agenda bestaat niet meer.
caldav.share.notOwner=Alleen de eigenaar van een agenda kan deze delen.
caldav.share.notConnected=Koppel uw agenda-account voordat u een agenda deelt.
caldav.share.calendarNotOnServer=Deze agenda staat nog niet op uw agendaserver. Probeer het opnieuw na de volgende synchronisatie.
caldav.share.notSupported=Uw agendaserver staat eXo niet toe agenda's te delen.
caldav.share.shareeRequired=Kies een collega om mee te delen.
caldav.share.shareeUnknown=Deze collega is geen actieve gebruiker.
caldav.share.shareeIsOwner=U bent al eigenaar van deze agenda.
caldav.share.shareeNotConnected=Deze collega is niet verbonden met dezelfde agendaserver.
caldav.share.samePrincipal=Deze collega gebruikt hetzelfde agenda-account als u en ziet deze agenda dus al.
caldav.share.notReadOnly=Deze collega heeft meer dan leestoegang, ingesteld buiten het platform. Wijzig dit in uw agenda-app.
caldav.share.aclUnreadable=Uw agendaserver laat het platform niet zien met wie deze agenda is gedeeld.
caldav.share.aclNotUnderstood=Deze agenda is gedeeld op een manier die het platform niet veilig kan wijzigen. Beheer het delen ervan in uw agenda-app.
caldav.share.serverRefused=Uw agendaserver heeft de wijziging geweigerd.
caldav.share.notApplied=Uw agendaserver heeft de wijziging geaccepteerd, maar niet toegepast.
caldav.share.serverUnavailable=Uw agendaserver kon niet worden bereikt. Probeer het later opnieuw.
caldav.share.credentials=Uw agendaserver heeft uw account geweigerd. Controleer uw wachtwoord in de agenda-instellingen.
caldav.share.ownerUnknown=Uw agendaserver heeft niet aangegeven met welk account u bent verbonden. Probeer het opnieuw na de volgende synchronisatie.
caldav.share.foreignAccessNotPreserved=Iemand heeft meer dan leestoegang tot deze agenda, ingesteld buiten het platform. Als u het delen hier wijzigt, kan dat die toegang be\u00efnvloeden, dus beheer dit in uw agenda-app.
caldav.share.shareeAddressUnknown=De agendaserver heeft het e-mailadres van deze collega niet doorgegeven, dus het platform kon de toegang niet wijzigen.
caldav.share.shareeHasOtherAccess=Deze collega heeft een andere toegang tot deze agenda, ingesteld buiten het platform, zoals zien wanneer u vrij bent. Delen vanuit hier zou die toegang vervangen, dus wijzig dit in uw agenda-app.
caldav.share.notOwnedOnServer=Deze agenda is van iemand anders, of u mag het delen ervan niet beheren. Vanuit het platform kunt u alleen agenda's delen waarvan u de eigenaar bent.
caldav.admin.servers.drawer.authentication=Authenticatie
caldav.admin.servers.drawer.authProvider=Hoe gebruikers zich authenticeren
caldav.admin.servers.drawer.disconnection.title=De authenticatie wijzigen
caldav.admin.servers.drawer.disconnection.one=Het wijzigen van de authenticatie koppelt 1 gebruiker van deze server los.
caldav.admin.servers.drawer.disconnection.many=Het wijzigen van de authenticatie koppelt {0} gebruikers van deze server los.
caldav.admin.servers.drawer.disconnection.question=Weet u zeker dat u wilt opslaan?
caldav.admin.servers.drawer.disconnection.confirm=Opslaan
caldav.admin.servers.drawer.disconnection.cancel=Annuleren
caldav.admin.servers.drawer.disconnection.countFailed=De gebruikers van deze server konden niet worden geteld. Er is niets opgeslagen, probeer het opnieuw.
