caldav.admin.servers.url=Server-URL
caldav.admin.servers.url.placeholder=https://caldav.example.org/dav/cal/{username}/
caldav.admin.servers.url.hint=De URL mag een placeholder {username} bevatten, die wordt vervangen door het account waarmee elke gebruiker verbinding maakt.
caldav.admin.servers.url.reachabilityHint=eXo maakt verbinding vanaf de server, niet vanuit de browser van de gebruiker, dus dit adres hoeft alleen bereikbaar te zijn vanaf de server. Interne adressen worden geweigerd, tenzij uw implementatie ze toestaat, omdat eXo anders gebruikt zou kunnen worden om machines te bereiken die nooit bedoeld waren om te worden blootgesteld.
caldav.admin.servers.url.corsHint=Gebruikers maken verbinding vanuit hun browser, dus het adres moet dezelfde origin hebben als het platform of CORS-headers verzenden: een externe server zonder die headers moet via het eigen adres van het platform worden aangeboden.
