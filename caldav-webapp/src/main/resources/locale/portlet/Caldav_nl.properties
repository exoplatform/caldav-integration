caldav.admin.servers.answerLinks.hint=Voeg links Accepteren, Weigeren en Voorlopig toe aan de beschrijving van elke gekopieerde vergadering. Schakel dit alleen uit als de agendaclients al hun eigen antwoordknoppen tonen, anders kunnen gebruikers helemaal niet antwoorden.
caldav.admin.servers.mirrorTarget.label=Waar kopie\u00ebn van vergaderingen worden geschreven
caldav.admin.servers.mirrorTarget.appliesTo=Geldt voor gebruikers die kopie\u00ebn van vergaderingen ingeschakeld houden in hun eigen agenda-instellingen.
caldav.admin.servers.mirrorTarget.dedicated.label=Een aparte agenda eXo Meetings
caldav.admin.servers.mirrorTarget.dedicated.consequence=Houdt eXo-vergaderingen gescheiden van de eigen gebeurtenissen van de gebruiker. Op sommige servers wordt een aparte agenda niet meegenomen in de beschikbaarheid, waardoor collega's de tijden van eXo-vergaderingen als vrij zien en er geen antwoordknoppen op de kopie\u00ebn verschijnen.
caldav.admin.servers.mirrorTarget.main.label=De hoofdagenda van het account
caldav.admin.servers.mirrorTarget.main.consequence=Kopie\u00ebn tellen mee voor de beschikbaarheid van de gebruiker, en de eigen antwoordknoppen van de server verschijnen waar de server die aanbiedt. Kies dit pas wanneer kopie\u00ebn probleemloos synchroniseren op deze server.
caldav.admin.servers.mirrorTarget.moves=Als u dit wijzigt, worden de bestaande kopie\u00ebn van elke gebruiker bij de volgende synchronisaties verplaatst. De oude agenda eXo Meetings blijft leeg staan.
caldav.admin.servers.writeChannel.label=Hoe kopie\u00ebn van vergaderingen worden geschreven
caldav.admin.servers.writeChannel.hint=Geldt voor elke kopie die eXo op deze server schrijft of verwijdert, voor elke gebruiker.
caldav.admin.servers.writeChannel.caldav.label=Standaard CalDAV
caldav.admin.servers.writeChannel.caldav.consequenceAnyServer=Werkt met elke CalDAV-server. Sommige servers sturen hun eigen uitnodigingen voor een vergadering die op deze manier is geschreven: genodigden op dezelfde server ontvangen die dan twee keer, en een antwoord dat ze geven op de eigen kopie van de server bereikt eXo nooit.
caldav.admin.servers.writeChannel.unavailable.label=Een schrijfkanaal dat dit platform niet meer aanbiedt ({0})
caldav.admin.servers.writeChannel.unavailable.consequence=De add-on die kopie\u00ebn op deze manier schrijft, is niet ge\u00efnstalleerd, dus elke kopie voor deze server wordt geweigerd totdat deze opnieuw is ge\u00efnstalleerd of u overschakelt naar standaard CalDAV.
caldav.admin.servers.drawer.add.success=De CalDAV-server is toegevoegd
caldav.admin.servers.drawer.add.error=De CalDAV-server kon niet worden toegevoegd. Controleer de waarden en probeer het opnieuw.
