caldav.admin.servers.quirks.title=Wat deze server doet
caldav.admin.servers.quirks.subtitle=Door eXo gezien bij het controleren van de kopie\u00ebn van vergaderingen die hierheen zijn verzonden. Vink er een aan om die niet langer als wijziging te behandelen.
caldav.admin.servers.quirks.none=Niets te verontschuldigen: eXo heeft op deze server niets gevonden wat het als wijziging behandelt. Zo ziet een server eruit die kopie\u00ebn getrouw opslaat, en die heeft geen aandacht nodig.
