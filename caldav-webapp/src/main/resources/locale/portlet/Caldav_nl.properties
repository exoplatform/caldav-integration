caldav.admin.servers.preset.label=Welke server is dit?
caldav.admin.servers.preset.stalwart.label=Stalwart
caldav.admin.servers.preset.stalwart.summary=Ik heb de servernaam en het adresformaat ingevuld. Stalwart behoudt wat eXo verzendt, dus de instelling is om alles te behouden in plaats van de uitzonderingen voor de hele implementatie over te nemen.\n\nKopie\u00ebn gaan naar een aparte agenda eXo Meetings. Antwoordlinks zijn uitgeschakeld, omdat Stalwart antwoorden vanuit elke agenda accepteert en de eigen knoppen Accepteren en Weigeren van de client al werken op de kopie.\n\nControleer alles voordat u opslaat.
caldav.admin.servers.preset.other.label=Een andere server
caldav.admin.servers.preset.other.summary=Er is niets ingevuld. Een ontbrekende server is een server die we niet hebben getest, niet een die niet wordt ondersteund. Vul het formulier zelf in, en eXo stelt instellingen voor zodra de eerste gebeurtenissen zijn gesynchroniseerd.
caldav.admin.servers.preset.changesWhatIsWritten=Een hiervan verandert wat eXo in de agenda's van uw gebruikers schrijft, niet alleen wat eXo vergelijkt.
caldav.admin.servers.name=Naam
