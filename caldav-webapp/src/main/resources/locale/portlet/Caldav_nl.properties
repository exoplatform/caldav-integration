caldav.tuning.throttleOutOfRange=De wachttijd tussen synchronisaties moet tussen 0 minuten en \u00e9\u00e9n dag liggen.
caldav.tuning.pastDaysOutOfRange=Lezen in het verleden moet tussen 0 en 365 dagen liggen.
caldav.tuning.futureDaysOutOfRange=Vooruit lezen moet tussen 1 en 365 dagen liggen.
caldav.tuning.sweepStaleOutOfRange=De vertraging voor vernieuwen op de achtergrond moet tussen 1 minuut en \u00e9\u00e9n week liggen.
caldav.tuning.sweepBatchOutOfRange=De achtergronduitvoering moet tussen 1 en 500 agenda's verwerken.
caldav.admin.sync.summary={1} dagen terug en {2} dagen vooruit lezen. Een agenda die net is geopend, wacht {0} minuten voordat het account opnieuw wordt gelezen; een account dat niemand opent, wordt na {3} minuten op de achtergrond vernieuwd.
caldav.admin.sync.cancel=Annuleren
