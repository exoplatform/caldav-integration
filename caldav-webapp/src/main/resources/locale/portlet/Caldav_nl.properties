caldav.admin.servers.title=CalDAV-servers
caldav.admin.servers.subtitle=Voeg de CalDAV-servers toe waarmee gebruikers een persoonlijk account kunnen verbinden. Persoonlijke agenda's worden in beide richtingen gesynchroniseerd met Mijn agenda's. eXo-vergaderingen worden in \u00e9\u00e9n richting gekopieerd, alleen naar de persoonlijke agenda.
