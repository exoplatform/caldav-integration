caldav.admin.sync.reports.subtitle=Hoe elke verbonden server tijdens de laatste synchronisatie met kopie\u00ebn van vergaderingen is omgegaan. Dit wordt alleen in het geheugen bewaard, dus de tabel is na een herstart leeg totdat de accounts opnieuw synchroniseren.
caldav.admin.sync.reports.none=Geen enkel verbonden account heeft sinds de laatste herstart zijn kopie\u00ebn van vergaderingen gecontroleerd. Dit wordt ingevuld naarmate ze synchroniseren.
caldav.admin.sync.reports.checked={0} kopie\u00ebn gecontroleerd, {1} ontbrekend, {2} gewijzigd, {3} herschreven, {4} ongemoeid gelaten.
caldav.admin.sync.reports.moved=Verplaatst naar de nieuwe bestemming: {0} kopie\u00ebn verplaatst, {1} oude kopie\u00ebn die de server niet wilde verwijderen, {2} konden niet worden geschreven.
