caldav.admin.servers.quirks.title=Cosa fa questo server
caldav.admin.servers.quirks.subtitle=Rilevato da eXo durante la verifica delle copie delle riunioni inviate qui. Ne selezioni uno per non considerarlo pi\u00f9 una modifica.
caldav.admin.servers.quirks.none=Nulla da ignorare: eXo non ha trovato su questo server nulla che consideri una modifica. \u00c8 ci\u00f2 che accade con un server che conserva fedelmente le copie, e non richiede alcuna attenzione.
caldav.admin.servers.quirks.seen.once=Visto una volta
caldav.admin.servers.quirks.seen.many=Visto {0} volte
caldav.admin.servers.quirks.dropsConference.label=Questo server non conserva i link di videoconferenza
caldav.admin.servers.quirks.dropsConference.cost=eXo smette di considerare il link mancante come una modifica e non si accorger\u00e0 pi\u00f9 se qualcuno ne rimuove uno.
caldav.admin.servers.quirks.addsCompatibilityMarkers.label=Questo server aggiunge indicatori di compatibilit\u00e0 per Outlook e Thunderbird
caldav.admin.servers.quirks.addsCompatibilityMarkers.cost=Altre app di calendario aggiungono questi campi. eXo li ignora e li lascia invariati.
caldav.admin.servers.quirks.addsFormattedDescription.label=Questo server aggiunge una copia formattata della descrizione
caldav.admin.servers.quirks.addsFormattedDescription.cost=Una copia in formato RTF della descrizione. eXo la ignora e confronta invece la versione in testo semplice.
caldav.admin.servers.quirks.stampsDefaultPriority.label=Questo server applica una priorit\u00e0 predefinita a ogni riunione che conserva
caldav.admin.servers.quirks.stampsDefaultPriority.cost=Una priorit\u00e0 che nessuno ha scelto, aggiunta a ogni copia. eXo non scrive alcuna priorit\u00e0, quindi smette di considerarla una modifica, e non si accorger\u00e0 pi\u00f9 se qualcuno imposta una priorit\u00e0 reale su questo server.
caldav.admin.servers.quirks.rewritesDescription.label=Questo server riscrive il testo dell'invito
caldav.admin.servers.quirks.rewritesDescription.cost=eXo smette di verificare la descrizione delle copie su questo server, compresi i link di risposta al suo interno. Un link riscritto non verr\u00e0 rilevato.
caldav.admin.servers.quirks.generic.added.label=Questo server aggiunge {0}, che eXo non scrive
caldav.admin.servers.quirks.generic.added.cost=eXo smette di considerarlo una modifica su questo server.
caldav.admin.servers.quirks.generic.dropped.label=Questo server non conserva {0}
caldav.admin.servers.quirks.generic.dropped.cost=eXo smette di considerarne l'assenza come una modifica e non si accorger\u00e0 pi\u00f9 se qualcuno lo rimuove.
caldav.admin.servers.quirks.generic.rewritten.label=Questo server riscrive {0}
caldav.admin.servers.quirks.generic.rewritten.cost=eXo smette di verificare quel valore sulle copie conservate da questo server.
caldav.admin.servers.quirks.changesWhatIsWritten=Modifica ci\u00f2 che eXo scrive nei calendari su questo server
caldav.admin.servers.foreignWriters.title=Altre installazioni eXo che scrivono qui
caldav.admin.servers.foreignWriters.subtitle=Un'altra installazione eXo ha scritto copie di riunioni negli account di questo server. Entrambe riparano le stesse copie e nessuna delle due riesce a distinguere le scritture dell'altra da una modifica fatta da qualcuno.
caldav.admin.servers.foreignWriters.none=Nessun'altra installazione eXo \u00e8 stata vista scrivere negli account di questo server. \u00c8 ci\u00f2 che accade con un server su cui scrive solo questa installazione, e non richiede alcuna attenzione.
caldav.admin.servers.foreignWriters.cost=eXo verifica le copie delle riunioni che ha inviato qui e ripara ci\u00f2 che \u00e8 cambiato, presupponendo di averle scritte tutte. Le copie scritte da quest'altra installazione vengono contate e confrontate come se fossero di eXo.
caldav.admin.servers.foreignWriters.lastSeen=Visto l'ultima volta il {0}
caldav.admin.servers.foreignWriters.resolution=Colleghi una delle due installazioni a un account CalDAV diverso. Nel frattempo nulla viene importato, rimosso o riparato in modo diverso e le copie gi\u00e0 scritte restano finch\u00e9 qualcuno non le elimina.
caldav.admin.servers.quirks.omitsSoloOrganizer.label=Questo server rimuove l'organizzatore da un evento senza altri partecipanti
caldav.admin.servers.quirks.omitsSoloOrganizer.cost=Nulla cambia: su ogni server, eXo omette gi\u00e0 l'organizzatore dagli eventi senza altri partecipanti. Le copie degli eventi con partecipanti continuano a indicare il proprio.
caldav.error.mainCalendarUnknown=eXo non pu\u00f2 copiare le Sue riunioni su questo account: l'account non indica quale dei suoi calendari \u00e8 quello predefinito, quindi non c'\u00e8 dove inserirle. Contatti il Suo amministratore.
caldav.error.foreignCopy=Questa riunione \u00e8 gi\u00e0 presente nel Suo account di calendario, aggiunta da qualcun altro. eXo lascia invariata quella copia.
caldav.error.forbidden=Questo calendario \u00e8 condiviso con Lei in sola lettura, quindi la Sua modifica non pu\u00f2 essere salvata.

caldav.server.authProviderUnknown=Questo metodo di autenticazione non \u00e8 disponibile su questo server. Ne scelga uno dall'elenco.
caldav.server.writeChannelNotSupported=L'importazione calendario BlueMind funziona solo con un server BlueMind, che eXo riconosce dalla presenza di "BlueMind" nel nome del server. Scelga CalDAV standard oppure mantenga BlueMind nel nome.
caldav.server.url.malformed=Questo non \u00e8 un indirizzo web utilizzabile. Deve iniziare con https:// (o http:// se il Suo amministratore lo consente) e indicare un server.
caldav.server.url.schemeNotAllowed=Sono accettati solo indirizzi https. Chieda al Suo amministratore di consentire http se questo server non ha un certificato.
caldav.server.url.credentials=Rimuova nome utente e password dall'indirizzo. eXo usa le credenziali con cui si connette ciascun utente, mai quelle scritte nell'indirizzo.
caldav.server.url.fragment=Rimuova il carattere # e tutto ci\u00f2 che segue. Un indirizzo di server non contiene frammenti.
caldav.server.url.portNotAllowed=Questa porta non \u00e8 consentita. Usi la porta standard o chieda al Suo amministratore di consentire questa.
caldav.server.url.usernameInAuthority=Il segnaposto {username} pu\u00f2 comparire solo dopo il nome del server, nel percorso. Lo inserisca nel percorso, non nell'indirizzo del server stesso.
caldav.server.url.privateAddress=Questo indirizzo punta all'interno della Sua rete, quindi non \u00e8 accettato. eXo si connette dal server, quindi un indirizzo interno potrebbe essere usato per raggiungere macchine che non dovevano mai essere esposte. Se \u00e8 corretto, chieda al Suo amministratore di consentirlo.
caldav.server.url.unresolvable=Questo nome di server non esiste. Verifichi l'ortografia.
caldav.share.calendarNotFound=Questo calendario non esiste pi\u00f9.
caldav.share.notOwner=Solo il proprietario di un calendario pu\u00f2 condividerlo.
caldav.share.notConnected=Colleghi il Suo account di calendario prima di condividere un calendario.
caldav.share.calendarNotOnServer=Questo calendario non \u00e8 ancora sul Suo server di calendario. Riprovi dopo la prossima sincronizzazione.
caldav.share.notSupported=Il Suo server di calendario non consente a eXo di condividere calendari.
caldav.share.shareeRequired=Scelga un collega con cui condividere.
caldav.share.shareeUnknown=Questo collega non \u00e8 un utente attivo.
caldav.share.shareeIsOwner=\u00c8 gi\u00e0 proprietario di questo calendario.
caldav.share.shareeNotConnected=Questo collega non \u00e8 connesso allo stesso server di calendario.
caldav.share.samePrincipal=Questo collega usa il Suo stesso account di calendario, quindi vede gi\u00e0 questo calendario.
caldav.share.notReadOnly=Questo collega ha un accesso superiore alla sola visualizzazione, impostato al di fuori della piattaforma. Lo modifichi nella Sua app di calendario.
caldav.share.aclUnreadable=Il Suo server di calendario non consente alla piattaforma di vedere con chi \u00e8 condiviso questo calendario.
caldav.share.aclNotUnderstood=Questo calendario \u00e8 condiviso in un modo che la piattaforma non pu\u00f2 modificare in sicurezza. Ne gestisca la condivisione nella Sua app di calendario.
caldav.share.serverRefused=Il Suo server di calendario ha rifiutato la modifica.
caldav.share.notApplied=Il Suo server di calendario ha accettato la modifica ma non l'ha applicata.
caldav.share.serverUnavailable=Impossibile raggiungere il Suo server di calendario. Riprovi pi\u00f9 tardi.
caldav.share.credentials=Il Suo server di calendario ha rifiutato il Suo account. Verifichi la password nelle impostazioni dell'agenda.
caldav.share.ownerUnknown=Il Suo server di calendario non ha indicato con quale account \u00e8 connesso. Riprovi dopo la prossima sincronizzazione.
caldav.share.foreignAccessNotPreserved=Qualcuno ha un accesso superiore alla sola visualizzazione a questo calendario, impostato al di fuori della piattaforma. Modificare qui la condivisione potrebbe influire su quell'accesso, quindi la gestisca nella Sua app di calendario.
caldav.share.shareeAddressUnknown=Il server di calendario non ha fornito l'indirizzo email di questo collega, quindi la piattaforma non ha potuto modificarne l'accesso.
caldav.share.shareeHasOtherAccess=Questo collega ha un altro tipo di accesso a questo calendario, impostato al di fuori della piattaforma, ad esempio la visualizzazione della Sua disponibilit\u00e0. Condividerlo qui lo sostituirebbe, quindi lo modifichi nella Sua app di calendario.
caldav.share.notOwnedOnServer=Questo calendario appartiene a qualcun altro oppure non \u00e8 autorizzato a gestirne la condivisione. Dalla piattaforma pu\u00f2 condividere solo i calendari di cui \u00e8 proprietario.
caldav.admin.servers.drawer.authentication=Autenticazione
caldav.admin.servers.drawer.authProvider=Come si autenticano gli utenti
caldav.admin.servers.drawer.disconnection.title=Modifica l'autenticazione
caldav.admin.servers.drawer.disconnection.one=La modifica dell'autenticazione disconnette 1 utente di questo server.
caldav.admin.servers.drawer.disconnection.many=La modifica dell'autenticazione disconnette {0} utenti di questo server.
caldav.admin.servers.drawer.disconnection.question=\u00c8 sicuro di voler salvare?
caldav.admin.servers.drawer.disconnection.confirm=Salva
caldav.admin.servers.drawer.disconnection.cancel=Annulla
caldav.admin.servers.drawer.disconnection.countFailed=Impossibile contare gli utenti di questo server. Nulla \u00e8 stato salvato, riprovi.
