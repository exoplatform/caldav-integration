caldav.admin.servers.copies.title=Copie delle riunioni
caldav.admin.servers.answerLinks.label=Aggiungere link di risposta alla copia
caldav.admin.servers.answerLinks.hint=Aggiunge i link Accetta, Rifiuta e Forse alla descrizione di ogni riunione copiata. Disattivi questa opzione solo se i client di calendario mostrano gi\u00e0 i propri pulsanti di risposta, altrimenti gli utenti non potranno rispondere affatto.
caldav.admin.servers.mirrorTarget.label=Dove vengono scritte le copie delle riunioni
caldav.admin.servers.mirrorTarget.appliesTo=Si applica agli utenti che mantengono attive le copie delle riunioni nelle impostazioni della propria agenda.
caldav.admin.servers.mirrorTarget.dedicated.label=Un calendario dedicato Riunioni eXo
caldav.admin.servers.mirrorTarget.dedicated.consequence=Mantiene le riunioni eXo separate dagli eventi dell'utente. Su alcuni server, un calendario separato \u00e8 escluso dalla disponibilit\u00e0, quindi i colleghi vedono gli orari delle riunioni eXo come liberi e sulle copie non compaiono pulsanti di risposta.
caldav.admin.servers.mirrorTarget.main.label=Il calendario principale dell'account
caldav.admin.servers.mirrorTarget.main.consequence=Le copie contano per la disponibilit\u00e0 dell'utente e i pulsanti di risposta del server compaiono dove li offre. Scelga questa opzione solo quando le copie si sincronizzano correttamente su questo server.
caldav.admin.servers.mirrorTarget.moves=Questa modifica sposta le copie esistenti di ogni utente nel corso delle sue prossime sincronizzazioni. Il vecchio calendario Riunioni eXo resta al suo posto, vuoto.
caldav.admin.servers.writeChannel.label=Come vengono scritte le copie delle riunioni
caldav.admin.servers.writeChannel.hint=Si applica a ogni copia che eXo scrive o rimuove su questo server, per ogni utente.
caldav.admin.servers.writeChannel.caldav.label=CalDAV standard
caldav.admin.servers.writeChannel.caldav.consequence=Funziona con ogni server CalDAV. Su BlueMind, una copia scritta in questo modo fa s\u00ec che BlueMind invii i propri inviti per la riunione: gli invitati sullo stesso server lo ricevono due volte e una risposta data sulla copia di BlueMind non raggiunge mai eXo.
caldav.admin.servers.writeChannel.bluemindImport.label=Importazione calendario BlueMind
caldav.admin.servers.writeChannel.bluemindImport.consequence=Scrive ogni copia tramite l'API di importazione di BlueMind, che non invia alcun invito proprio, quindi eXo resta l'unico mittente. Solo per BlueMind. Torni a CalDAV standard per annullare.
caldav.admin.servers.writeChannel.unavailable.label=Un accesso che questa piattaforma non offre pi\u00f9 ({0})
caldav.admin.servers.writeChannel.unavailable.consequence=Il componente aggiuntivo che scrive le copie in questo modo non \u00e8 installato, quindi ogni copia per questo server viene rifiutata finch\u00e9 non viene reinstallato o finch\u00e9 non passa a CalDAV standard.
