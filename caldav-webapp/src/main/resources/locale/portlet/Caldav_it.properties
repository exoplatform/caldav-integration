caldav.admin.managed.off.confirm.message=Gli utenti sceglieranno di nuovo il proprio server CalDAV. Gli account che gli utenti hanno collegato autonomamente a {0} continuano a sincronizzarsi.
caldav.admin.managed.off.confirm.disconnect.one=1 account collegato dalla connessione unificata verr\u00e0 disconnesso.
caldav.admin.managed.off.confirm.disconnect.many={0} account collegati dalla connessione unificata verranno disconnessi.
caldav.admin.managed.off.countFailed=Impossibile contare gli account collegati dalla connessione unificata. La connessione unificata resta attiva, riprovi.
