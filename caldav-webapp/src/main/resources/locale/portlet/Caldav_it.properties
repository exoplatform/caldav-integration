caldav.admin.servers.modal.delete.title=Elimina il server CalDAV
caldav.admin.servers.modal.delete.message=Il server scomparir\u00e0 dai connettori di tutti gli utenti. Gli account ancora collegati impediscono l'eliminazione.
caldav.admin.servers.modal.delete.confirmDelete=Delete
caldav.admin.servers.modal.delete.cancelDelete=Cancel
agenda.caldavCalendar.calendarDelete.propagates=Questo calendario si trova anche su {0}. Eliminarlo qui lo elimina anche l\u00ec, con tutti i suoi eventi, compresi quelli aggiunti dal telefono o da un'altra app. L'operazione non pu\u00f2 essere annullata.
agenda.caldavCalendar.calendarDelete.keepsRemote=Il calendario corrispondente su {0} non verr\u00e0 toccato. Resta l\u00ec con tutti i suoi eventi ed eXo smetter\u00e0 semplicemente di mostrarlo.
caldav.hiddenCalendars.title=Calendari nascosti
caldav.hiddenCalendars.subtitle={0} calendari che ha eliminato qui sono ancora nel Suo account di calendario
caldav.hiddenCalendars.manage=Gestisci i calendari nascosti
caldav.hiddenCalendars.drawer.title=Calendari nascosti
caldav.hiddenCalendars.drawer.description=Ha eliminato questi calendari da eXo ma ha scelto di mantenerli nel Suo account. Mostrarne di nuovo uno lo riporta alla sincronizzazione successiva, con gli eventi che contiene in quel momento.
caldav.hiddenCalendars.showAgain=Mostra di nuovo
caldav.hiddenCalendars.showAgainSuccess={0} torner\u00e0 alla prossima sincronizzazione
caldav.hiddenCalendars.showAgainError=Impossibile mostrare di nuovo questo calendario
caldav.hiddenCalendars.count={0} calendario/i nascosto/i dalla Sua agenda
caldav.hiddenCalendars.drawer.about=Calendari che ha nascosto in eXo. Ne mostri uno per ripristinarlo: un calendario eliminato torna alla prossima sincronizzazione con i suoi eventi attuali, uno condiviso torna subito in Condivisi con me.
caldav.hiddenCalendars.deletedHere=Eliminato qui, mantenuto sul Suo account di calendario
caldav.hiddenCalendars.sharedBy=Condiviso da {0}
caldav.hiddenCalendars.sharedWithYou=Condiviso con Lei
caldav.hiddenCalendars.showAgainSharedSuccess={0} \u00e8 di nuovo in Condivisi con me
caldav.hiddenCalendars.notAShare=Pu\u00f2 nascondere solo i calendari condivisi con Lei. Per non vedere pi\u00f9 uno dei Suoi calendari, lo elimini e selezioni "Mantieni sul mio account di calendario" quando richiesto.
caldav.hiddenCalendars.calendarRequired=Scelga il calendario da nascondere.
caldav.hiddenCalendars.accountUnavailable=Impossibile raggiungere il Suo account di calendario, quindi questo calendario non \u00e8 stato nascosto. Riprovi tra un momento.

caldav.admin.sync.title=Sincronizzazione dei calendari
caldav.admin.sync.description=Con quale frequenza e su quale intervallo eXo legge gli account di calendario collegati dai Suoi utenti. Le modifiche hanno effetto alla sincronizzazione successiva.
caldav.admin.sync.throttleMinutes.label=Attesa tra le sincronizzazioni
caldav.admin.sync.throttleMinutes.help=L'apertura dell'agenda legge l'account collegato, poi non lo rilegge per questo intervallo, indipendentemente da quante volte la pagina viene aperta. Evita che un utente molto attivo invii una richiesta a ogni visualizzazione.
caldav.admin.sync.pastDays.label=Leggi eventi passati
caldav.admin.sync.pastDays.help=Fino a quanto indietro nel passato eXo legge gli eventi. Gli eventi passati cambiano raramente, quindi leggerne meno non costa quasi nulla e alleggerisce ogni sincronizzazione.
caldav.admin.sync.futureDays.label=Leggi eventi futuri
caldav.admin.sync.futureDays.help=Fino a quanto avanti eXo legge gli eventi. \u00c8 questo il parametro che pesa: un intervallo ampio su un account con anni di riunioni ricorrenti comporta un download consistente, effettuato alla prima sincronizzazione di ogni giorno.
caldav.admin.sync.sweepStaleMinutes.label=Aggiornare gli account non aperti da
caldav.admin.sync.sweepStaleMinutes.help=eXo legge un account di calendario quando il suo proprietario apre la propria agenda, e l'utente attende durante il caricamento. Gli account che nessuno apre da pi\u00f9 di questo tempo vengono invece aggiornati in background, cos\u00ec all'apertura successiva l'agenda mostra gi\u00e0 i suoi eventi.\n\nRiduca questo valore per agende pi\u00f9 aggiornate ma pi\u00f9 richieste al server. Lo aumenti se i server di calendario sono lenti o soggetti a limiti di richieste.
caldav.admin.sync.sweepBatchSize.label=Calendari per esecuzione in background
caldav.admin.sync.sweepBatchSize.help=Ogni esecuzione aggiorna al massimo questo numero di calendari, partendo dai meno recenti. Lo aumenti per recuperare pi\u00f9 rapidamente su un'istanza molto attiva, lo riduca per distribuire il carico.
caldav.admin.sync.unit.minutes=minuti
caldav.admin.sync.unit.days=giorni
caldav.admin.sync.unit.calendars=calendari
caldav.admin.sync.save=Salva
caldav.admin.sync.saved=Impostazioni di sincronizzazione salvate
caldav.admin.sync.saveFailed=Impossibile salvare queste impostazioni
caldav.tuning.mandatory=Nessuna impostazione inviata
caldav.tuning.throttleOutOfRange=L'attesa tra le sincronizzazioni deve essere compresa tra 0 minuti e un giorno.
caldav.tuning.pastDaysOutOfRange=La lettura del passato deve essere compresa tra 0 e 365 giorni.
caldav.tuning.futureDaysOutOfRange=La lettura in avanti deve essere compresa tra 1 e 365 giorni.
caldav.tuning.sweepStaleOutOfRange=Il ritardo dell'aggiornamento in background deve essere compreso tra 1 minuto e una settimana.
caldav.tuning.sweepBatchOutOfRange=L'esecuzione in background deve elaborare tra 1 e 500 calendari.
caldav.admin.sync.summary=Lettura di {1} giorni indietro e {2} giorni avanti. Un'agenda appena aperta attende {0} minuti prima di rileggere l'account; un account che nessuno apre viene aggiornato in background dopo {3} minuti.
caldav.admin.sync.cancel=Annulla
caldav.admin.sync.reports.title=Copie delle riunioni, per utente
caldav.admin.sync.reports.subtitle=Come ogni server collegato ha gestito le copie delle riunioni durante l'ultima sincronizzazione. Questi dati sono conservati solo in memoria, quindi la tabella \u00e8 vuota dopo un riavvio finch\u00e9 gli account non si sincronizzano di nuovo.
caldav.admin.sync.reports.none=Nessun account collegato ha verificato le proprie copie delle riunioni dall'ultimo riavvio. La tabella si popola man mano che si sincronizzano.
caldav.admin.sync.reports.checked={0} copie verificate, {1} mancanti, {2} alterate, {3} riscritte, {4} lasciate invariate.
caldav.admin.sync.reports.moved=Spostamento nella nuova destinazione: {0} copie spostate, {1} vecchie copie che il server non ha rimosso, {2} non scritte.
caldav.admin.sync.reports.notMoved=Nessun cambio di destinazione in sospeso.
caldav.admin.sync.reports.loadFailed=Impossibile leggere questi conteggi.
caldav.admin.sync.reports.unknownUser=Utente {0}
