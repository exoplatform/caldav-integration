caldav.admin.managed.saved=Ora tutti sono associati a {0}
caldav.admin.managed.cleared=Gli utenti scelgono di nuovo il proprio server CalDAV
caldav.admin.managed.saveFailed=Impossibile attivare la connessione unificata
caldav.admin.managed.clearFailed=Impossibile disattivare la connessione unificata
caldav.managed.serverRequired=Scelga il server con cui tutti devono sincronizzarsi.
caldav.managed.serverNotEligible=Scelga un server configurato e attivo. Un server disattivato non \u00e8 raggiungibile, quindi nessuno potrebbe connettersi con la connessione unificata.
caldav.managed.providerNotEligible=Con la connessione unificata, questo server non pu\u00f2 usare un provider che richiede le credenziali di ciascun utente. Disattivi la connessione unificata o scelga un provider con un account di servizio.
caldav.admin.servers.list.managedLocked=Non \u00e8 possibile disattivare o eliminare questo server mentre la connessione unificata lo utilizza. Disattivi prima la connessione unificata, nella riga sopra l'elenco dei server.
caldav.managed.serverInUse=Non \u00e8 possibile disattivare questo server mentre la connessione unificata \u00e8 attiva, poich\u00e9 tutti si sincronizzano con esso. Disattivi prima la connessione unificata, nella riga sopra l'elenco dei server.
agenda.caldavCalendar.disconnect.warning=I calendari che eXo mostra da {0} verranno rimossi dalla Sua agenda, insieme alle copie dei loro eventi. Nulla viene eliminato su {0} e i calendari creati in eXo restano. Ricolleghi l'account e quei calendari torneranno.
caldav.pendingCopies.title=Copie delle riunioni ancora in arrivo
caldav.pendingCopies.subtitle={0} delle Sue riunioni sono state modificate in eXo e la modifica non ha ancora raggiunto il Suo calendario. eXo continua a riprovare; la prossima sincronizzazione in background di solito le risolve.
caldav.calendarStates.title=Calendari che richiedono attenzione
caldav.calendarStates.subtitle={0} dei Suoi calendari non si sincronizzano normalmente
caldav.calendarStates.manage=Vedi il problema
caldav.calendarStates.drawer.title=Calendari che richiedono attenzione
caldav.calendarStates.drawer.description=Questi calendari non si sincronizzano come gli altri. Gli altri Suoi calendari non sono interessati.
caldav.calendarStates.explain.REMOTE_CREATE_REFUSED=Il Suo account di calendario non consente a eXo di creare calendari, quindi questo non viene copiato l\u00ec. I calendari gi\u00e0 esistenti sull'account compaiono comunque in eXo.
caldav.calendarStates.explain.PAUSED=La sincronizzazione di questo calendario non \u00e8 riuscita pi\u00f9 volte, quindi eXo ha smesso di riprovare. Sincronizzi ora per ricominciare; se continua a non riuscire, ricolleghi l'account.
caldav.calendarStates.explain.EXO_ORPHANED=Ha eliminato questo calendario in eXo, ma non \u00e8 stato possibile eliminarlo sul Suo account di calendario. \u00c8 ancora l\u00ec.
caldav.calendarStates.explain.REMOTE_GONE=Questo calendario non \u00e8 pi\u00f9 presente sul Suo account di calendario. Non vi arriver\u00e0 nulla di nuovo e ci\u00f2 che eXo contiene gi\u00e0 resta invariato.
caldav.calendarStates.explain.RETIRED_SUBSCRIPTION=Questa \u00e8 una copia di un calendario condiviso con Lei o di una risorsa a cui si \u00e8 iscritto. Non viene pi\u00f9 sincronizzata, quindi le modifiche fatte qui non vanno da nessuna parte. La elimini e l'originale comparir\u00e0 in Condivisi con me, in sola lettura.
caldav.calendarStates.explain.unknown=Questo calendario non si sincronizza normalmente.
caldav.calendarStates.lastSynchronised={0}
caldav.calendarStates.syncNow=Sincronizza ora
caldav.calendarStates.synchronised=I Suoi calendari sono stati sincronizzati. Le copie delle Sue riunioni vengono verificate in background.
caldav.calendarStates.syncFailed=Impossibile sincronizzare il Suo account di calendario
