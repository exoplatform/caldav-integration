caldav.error.cors=Il server \u00e8 raggiungibile ma ha rifiutato la richiesta cross-origin del browser (non invia intestazioni CORS). Chieda al Suo amministratore di renderlo disponibile dall'indirizzo della piattaforma.
caldav.admin.servers.title=Server CalDAV
caldav.admin.servers.subtitle=Aggiunga i server CalDAV a cui gli utenti possono collegare un account personale. I calendari personali si sincronizzano in entrambe le direzioni con I miei calendari. Le riunioni eXo vengono copiate in una sola direzione, solo nel calendario personale.
caldav.admin.servers.add=Aggiungi
caldav.admin.servers.noServers=Nessun server CalDAV ancora dichiarato
caldav.admin.servers.list.name=Nome
caldav.admin.servers.list.activate=Attiva
caldav.admin.servers.list.actions=Azioni
caldav.admin.servers.preset.label=Di quale server si tratta?
caldav.admin.servers.preset.bluemind.label=Bluemind
caldav.admin.servers.preset.bluemind.summary=Il nome del server, il formato dell'indirizzo e le limitazioni note di BlueMind sono gi\u00e0 compilati: nessun link di videoconferenza, marcatori di Outlook e Thunderbird, una descrizione duplicata, una priorit\u00e0 predefinita su ogni evento.\n\nLe copie vanno nel calendario principale, non in uno dedicato, e i link di risposta restano attivi. Controlli le prime sincronizzazioni sul Suo server e verifichi tutto prima di salvare.
caldav.admin.servers.preset.stalwart.label=Stalwart
caldav.admin.servers.preset.stalwart.summary=Ho compilato il nome del server e il formato dell'indirizzo. Stalwart conserva ci\u00f2 che eXo invia, quindi \u00e8 impostato per mantenere tutto invece di ereditare le eccezioni definite per l'intera installazione.\n\nLe copie vanno in un calendario dedicato Riunioni eXo. I link di risposta sono disattivati, poich\u00e9 Stalwart accetta risposte da qualsiasi calendario e i pulsanti Accetta e Rifiuta del client funzionano gi\u00e0 sulla copia.\n\nVerifichi prima di salvare.
caldav.admin.servers.preset.other.label=Un altro server
caldav.admin.servers.preset.other.summary=Non viene compilato nulla. Un server non elencato \u00e8 un server che non abbiamo testato, non uno non supportato. Compili il modulo e eXo suggerir\u00e0 le impostazioni dopo la sincronizzazione dei primi eventi.
caldav.admin.servers.preset.changesWhatIsWritten=Una di queste modifiche cambia ci\u00f2 che eXo scrive nei calendari dei Suoi utenti, non solo ci\u00f2 che confronta.
caldav.admin.servers.name=Nome
caldav.admin.servers.name.placeholder=Nome mostrato agli utenti
caldav.admin.servers.description=Descrizione
caldav.admin.servers.description.placeholder=Descrizione facoltativa mostrata agli utenti
caldav.admin.servers.url=URL del server
caldav.admin.servers.url.placeholder=https://caldav.example.org/dav/cal/{username}/
caldav.admin.servers.url.hint=L'URL pu\u00f2 contenere un segnaposto {username}, sostituito dall'account con cui ciascun utente si collega.
caldav.admin.servers.url.reachabilityHint=eXo si collega dal server, non dal browser dell'utente, quindi questo indirizzo deve essere raggiungibile solo dal server. Gli indirizzi interni vengono rifiutati a meno che la Sua installazione non li consenta, perch\u00e9 altrimenti eXo potrebbe essere usato per raggiungere macchine che non dovevano essere esposte.
caldav.admin.servers.url.corsHint=Gli utenti si collegano dal proprio browser, quindi l'indirizzo deve condividere l'origine della piattaforma o inviare intestazioni CORS: un server di terze parti che ne \u00e8 privo deve essere esposto tramite l'indirizzo della piattaforma.
