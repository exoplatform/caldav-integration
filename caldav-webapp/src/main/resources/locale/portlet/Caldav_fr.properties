caldav.admin.servers.modal.delete.title=Supprimer le serveur CalDAV
caldav.admin.servers.modal.delete.message=Le serveur va dispara\u00eetre des connecteurs de chaque utilisateur. Les comptes qui lui sont toujours connect\u00e9s bloquent la suppression.
caldav.admin.servers.modal.delete.confirmDelete=Delete
caldav.admin.servers.modal.delete.cancelDelete=Cancel
agenda.caldavCalendar.calendarDelete.propagates=Ce calendrier est \u00e9galement sur {0}. La supprimer ici la supprime aussi, avec chaque \u00e9v\u00e9nement dans elle. Cela inclut les \u00e9v\u00e9nements que vous avez ajout\u00e9s depuis votre t\u00e9l\u00e9phone ou une autre application, et cela ne peut pas \u00eatre annul\u00e9.
agenda.caldavCalendar.calendarDelete.keepsRemote=Le calendrier correspondant sur {0} ne sera pas touch\u00e9. Il reste avec tous ses \u00e9v\u00e9nements, et eXo cessera tout simplement de le montrer.
caldav.hiddenCalendars.title=Calendriers masqu\u00e9s
caldav.hiddenCalendars.subtitle={0} calendrier(s) que vous avez supprim\u00e9 ici sont toujours sur votre compte calendrier
caldav.hiddenCalendars.manage=G\u00e9rer les calendriers masqu\u00e9s
caldav.hiddenCalendars.drawer.title=Calendriers masqu\u00e9s
caldav.hiddenCalendars.drawer.description=Vous avez supprim\u00e9 ces calendriers d'eXo mais avez choisi de les conserver sur votre compte. L'affichage le ram\u00e8ne \u00e0 nouveau \u00e0 la prochaine synchronisation, avec les \u00e9v\u00e9nements qu'il tient maintenant.
caldav.hiddenCalendars.showAgain=Afficher \u00e0 nouveau
caldav.hiddenCalendars.showAgainSuccess={0} sera affich\u00e9 \u00e0 nouveau \u00e0 la prochaine synchronisation
caldav.hiddenCalendars.showAgainError=Ce calendrier n'a pas pu \u00eatre affich\u00e9 \u00e0 nouveau
caldav.hiddenCalendars.count={0} Calendrier(s) masqu\u00e9(s) de votre agenda
caldav.hiddenCalendars.drawer.about=Calendars you've hidden in eXo. Show one to bring it back: a deleted calendar returns at the next sync with its current events, a shared one returns immediately under Shared with me.
caldav.hiddenCalendars.deletedHere=Supprim\u00e9 ici, conserv\u00e9 sur votre compte de calendrier
caldav.hiddenCalendars.sharedBy=Partag\u00e9 par {0}
caldav.hiddenCalendars.sharedWithYou=Partag\u00e9 avec vous
caldav.hiddenCalendars.showAgainSharedSuccess={0} est de nouveau list\u00e9 dans "Partag\u00e9 avec moi"
caldav.hiddenCalendars.notAShare=Vous ne pouvez masquer que les calendriers partag\u00e9s avec vous. Pour arr\u00eater de voir l'un des v\u00f4tres, supprimez-le et s\u00e9lectionnez "Garder sur mon compte de calendrier" lorsque vous le demandez.
caldav.hiddenCalendars.calendarRequired=Choisissez le calendrier \u00e0 masquer.
caldav.hiddenCalendars.accountUnavailable=Votre compte de calendrier n'a pas pu \u00eatre atteint, ce calendrier n'a donc pas \u00e9t\u00e9 masqu\u00e9. R\u00e9essayez dans un instant.

caldav.admin.sync.title=Synchronisation de l'agenda
caldav.admin.sync.description=\u00c0 quelle fr\u00e9quence et \u00e0 quelle fr\u00e9quence eXo lit les comptes de calendrier que vos utilisateurs se connectent. Les changements prennent effet lors de la prochaine synchronisation.
caldav.admin.sync.throttleMinutes.label=Attendre entre les synchronisations
caldav.admin.sync.throttleMinutes.help=L'ouverture de l'agenda lit le compte connect\u00e9, puis le laisse seul pour ce long combien de fois la page est ouverte. Cela emp\u00eache un utilisateur occup\u00e9 de faire une requ\u00eate sur chaque rendu.
caldav.admin.sync.pastDays.label=Lire les \u00e9v\u00e9nements du pass\u00e9
caldav.admin.sync.pastDays.help=Jusqu'o\u00f9 dans le pass\u00e9 eXo lit les \u00e9v\u00e9nements. Les \u00e9v\u00e9nements pass\u00e9s changent rarement, donc la lecture moins co\u00fbteuse d'entre eux ne co\u00fbte presque rien et rend chaque synchronisation plus l\u00e9g\u00e8re.
caldav.admin.sync.futureDays.label=Lire les \u00e9v\u00e9nements \u00e0 l'avance
caldav.admin.sync.futureDays.help=Dans quelle mesure eXo lit les \u00e9v\u00e9nements. C'est celui qui co\u00fbte : une grande fen\u00eatre sur un compte avec des ann\u00e9es de r\u00e9unions r\u00e9currentes est un t\u00e9l\u00e9chargement important, pay\u00e9 \u00e0 la premi\u00e8re synchronisation de chaque jour.
caldav.admin.sync.sweepStaleMinutes.label=Rafra\u00eechir les comptes laiss\u00e9s intacts
caldav.admin.sync.sweepStaleMinutes.help=eXo lit un compte de calendrier quand son propri\u00e9taire ouvre son agenda, et celui-ci attend pendant le chargement. Les comptes que personne n'a ouverts depuis plus longtemps que ce d\u00e9lai sont rafra\u00eechis en arri\u00e8re-plan, pour que le prochain agenda s'ouvre avec ses \u00e9v\u00e9nements d\u00e9j\u00e0 charg\u00e9s.\n\nDiminuez ce d\u00e9lai pour des agendas plus \u00e0 jour, mais plus de requ\u00eates vers les serveurs. Augmentez-le si les serveurs de calendrier sont lents ou limitent leur fr\u00e9quence de r\u00e9ponse.
caldav.admin.sync.sweepBatchSize.label=Calendriers par ex\u00e9cution en arri\u00e8re-plan
caldav.admin.sync.sweepBatchSize.help=Chaque run se rafra\u00eechit au plus ce nombre de calendriers, les plus anciens en premier. Levez le pour rattraper plus rapidement une instance occup\u00e9e, abaissez le pour r\u00e9pandre la charge.
caldav.admin.sync.unit.minutes=minutes
caldav.admin.sync.unit.days=jours
caldav.admin.sync.unit.calendars=calendrier
caldav.admin.sync.save=Enregistrer
caldav.admin.sync.saved=Param\u00e8tres de synchronisation enregistr\u00e9s
caldav.admin.sync.saveFailed=Ces param\u00e8tres n'ont pas pu \u00eatre sauvegard\u00e9s
caldav.tuning.mandatory=Aucun param\u00e8tre n'a \u00e9t\u00e9 envoy\u00e9
caldav.tuning.throttleOutOfRange=L'attente entre les synchronisations doit \u00eatre comprise entre 0 minutes et un jour.
caldav.tuning.pastDaysOutOfRange=La lecture des \u00e9v\u00e9nements pass\u00e9s doit \u00eatre comprise entre 0 et 365 jours.
caldav.tuning.futureDaysOutOfRange=La lecture anticip\u00e9e doit \u00eatre comprise entre 1 et 365 jours.
caldav.tuning.sweepStaleOutOfRange=Le d\u00e9lai de mise \u00e0 jour de l'arri\u00e8re-plan doit \u00eatre compris entre 1 minute et une semaine.
caldav.tuning.sweepBatchOutOfRange=L'ex\u00e9cution en arri\u00e8re-plan doit prendre entre 1 et 500 calendriers.
caldav.admin.sync.summary=eXo lit les \u00e9v\u00e9nements sur {1} jours pass\u00e9s et {2} jours \u00e0 venir. Il relit un compte apr\u00e8s son ouverture au bout de {0} minutes, et rafra\u00eechit en arri\u00e8re-plan les comptes non ouverts au bout de {3} minutes.
caldav.admin.sync.cancel=Annuler
caldav.admin.sync.reports.title=Copies de r\u00e9union, par utilisateur
caldav.admin.sync.reports.subtitle=Comment chaque serveur connect\u00e9 a g\u00e9r\u00e9 les copies de r\u00e9unions lors de la derni\u00e8re synchronisation. Ceci est conserv\u00e9 en m\u00e9moire uniquement, donc la table est vide apr\u00e8s un red\u00e9marrage jusqu'\u00e0 ce que les comptes se synchronisent \u00e0 nouveau.
caldav.admin.sync.reports.none=Aucun compte connect\u00e9 n'a v\u00e9rifi\u00e9 les copies de sa r\u00e9union depuis le dernier red\u00e9marrage. Cela se remplit au moment de la synchronisation.
caldav.admin.sync.reports.checked={0} copies v\u00e9rifi\u00e9es, {1} manquantes, {2} alt\u00e9r\u00e9es, {3} r\u00e9\u00e9crites, {4} rest\u00e9es seules.
caldav.admin.sync.reports.moved=D\u00e9plac\u00e9 vers la nouvelle destination : {0} copies ont \u00e9t\u00e9 d\u00e9plac\u00e9es, l'ancienne copie {1} que le serveur ne supprimera pas, {2} n'a pas pu \u00eatre \u00e9crite.
caldav.admin.sync.reports.notMoved=Aucun changement de destination n'\u00e9tait en suspens.
caldav.admin.sync.reports.loadFailed=Ces chiffres n'ont pas pu \u00eatre charg\u00e9s. R\u00e9essayez dans un instant.
caldav.admin.sync.reports.unknownUser=Utilisateur {0}
caldav.admin.managed.title=Compte centralis\u00e9
caldav.admin.managed.off=Les utilisateurs se connectent \u00e0 leur propre compte.
caldav.admin.managed.on=Tout le monde se synchronise avec {0}.
caldav.admin.managed.noServers=Aucun serveur n'a encore \u00e9t\u00e9 d\u00e9clar\u00e9.
caldav.admin.managed.drawer.title=Compte centralis\u00e9
caldav.admin.managed.drawer.description=Choisissez le serveur CalDAV avec lequel tout le monde se synchronise. Les utilisateurs ne peuvent pas se connecter ou d\u00e9connecter leur propre compte, mais ceux existants continuent \u00e0 se synchroniser.
caldav.admin.managed.drawer.serverLabel=Serveur
caldav.admin.managed.drawer.noServers=Aucun serveur CalDAV n'est encore d\u00e9clar\u00e9, il n'y a donc rien \u00e0 g\u00e9rer pour tout le monde. Ajoutez-en un d'abord, activez-le, puis revenez.
caldav.admin.managed.drawer.apply=Appliquer
caldav.admin.managed.drawer.cancel=Annuler
caldav.admin.managed.saved=Tout le monde se synchronise avec {0}.
caldav.admin.managed.cleared=Les utilisateurs choisissent \u00e0 nouveau leur propre serveur CalDAV
caldav.admin.managed.saveFailed=Le compte centralis\u00e9 n'a pas pu \u00eatre activ\u00e9
caldav.admin.managed.clearFailed=Le compte centralis\u00e9 n'a pas pu \u00eatre d\u00e9sactiv\u00e9
caldav.managed.serverNotEligible=Choisissez un serveur configur\u00e9 et actif. Un serveur d\u00e9sactiv\u00e9 ne peut pas \u00eatre atteint, donc personne ne pourra se connecter en mode g\u00e9r\u00e9.
caldav.managed.serverInUse=Vous ne pouvez pas d\u00e9sactiver ce serveur lorsque le mode g\u00e9r\u00e9 est activ\u00e9, car tout le monde se synchronise avec lui. D\u00e9sactiver le mode g\u00e9r\u00e9 en premier, dans la ligne au-dessus de la liste des serveurs.
agenda.caldavCalendar.disconnect.warning=Les calendriers que eXo montre de {0} seront supprim\u00e9s de votre agenda, ainsi que les copies de leurs \u00e9v\u00e9nements. Rien n'est supprim\u00e9 sur {0}, et les calendriers que vous avez cr\u00e9\u00e9s sur eXo restent. Reconnectez le compte et ces calendriers reviendront.
caldav.pendingCopies.title=Des copies de r\u00e9union sont encore en route
caldav.pendingCopies.subtitle={0} de vos r\u00e9unions modifi\u00e9es dans eXo ne sont pas encore \u00e0 jour dans votre calendrier. eXo continue d'essayer, la prochaine synchronisation en arri\u00e8re-plan devrait les r\u00e9gler.
caldav.calendarStates.title=Calendriers n\u00e9cessitant une attention
caldav.calendarStates.subtitle={0} de vos calendriers ne sont pas synchronis\u00e9s normalement
caldav.calendarStates.manage=Voir ce qui ne va pas
caldav.calendarStates.drawer.title=Calendriers n\u00e9cessitant une attention
caldav.calendarStates.drawer.description=Ces calendriers ne sont pas synchronis\u00e9s comme les autres. Les autres calendriers ne sont pas affect\u00e9s.
caldav.calendarStates.explain.REMOTE_CREATE_REFUSED=Votre compte de calendrier ne permet pas \u00e0 eXo de cr\u00e9er des calendriers dessus, donc celui-ci n'est pas copi\u00e9 l\u00e0. Les calendriers qui existent d\u00e9j\u00e0 sur le compte apparaissent toujours dans eXo.
caldav.calendarStates.explain.PAUSED=La synchronisation de ce calendrier a \u00e9chou\u00e9 \u00e0 plusieurs reprises, eXo a donc cess\u00e9 d'essayer. Synchronisez maintenant pour recommencer ; si elle \u00e9choue, reconnectez le compte.
caldav.calendarStates.explain.EXO_ORPHANED=Vous avez supprim\u00e9 ce calendrier dans eXo et il n'a pas pu \u00eatre supprim\u00e9 sur votre compte de calendrier. Il est toujours l\u00e0.
caldav.calendarStates.explain.REMOTE_GONE=Ce calendrier n'est plus sur votre compte calendrier. Rien de nouveau ne vous arrivera et ce qu'eXo contient est intact.
caldav.calendarStates.explain.RETIRED_SUBSCRIPTION=Ceci est une copie d'un calendrier partag\u00e9 avec vous, ou d'une ressource \u00e0 laquelle vous vous \u00eates abonn\u00e9. Il n'est plus synchronis\u00e9, donc les changements ici vont nulle part. Supprimez-le et l'original appara\u00eet sous Partag\u00e9 avec moi, en lecture seule.
caldav.calendarStates.explain.unknown=Ce calendrier ne synchronise pas normalement.
caldav.calendarStates.lastSynchronised={0}
caldav.calendarStates.syncNow=Synchroniser maintenant
