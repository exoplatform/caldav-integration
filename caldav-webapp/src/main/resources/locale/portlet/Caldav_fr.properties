caldav.share.calendarNotFound=Ce calendrier n'existe plus.
caldav.share.notOwner=Seul le propri\u00e9taire d'un calendrier peut le partager.
caldav.share.notConnected=Connectez votre compte de calendrier avant de partager un calendrier.
caldav.share.calendarNotOnServer=Ce calendrier n'est pas encore sur votre serveur de calendrier. R\u00e9essayez apr\u00e8s la prochaine synchronisation.
caldav.share.notSupported=Votre serveur de calendrier ne permet pas le partage des calendriers de la plateforme.
caldav.share.shareeRequired=Choisissez un coll\u00e8gue avec qui partager.
caldav.share.shareeUnknown=Ce coll\u00e8gue n'est pas un utilisateur actif.
caldav.share.shareeIsOwner=Vous poss\u00e9dez d\u00e9j\u00e0 ce calendrier.
caldav.share.shareeNotConnected=Ce coll\u00e8gue n'est pas connect\u00e9 au m\u00eame serveur de calendrier.
caldav.share.samePrincipal=Ce coll\u00e8gue utilise le m\u00eame compte de calendrier que vous, donc il voit d\u00e9j\u00e0 ce calendrier.
caldav.share.notReadOnly=Ce coll\u00e8gue a plus que des droits d'acc\u00e8s, d\u00e9finis en dehors de la plateforme. Modifiez le dans votre application de calendrier.
caldav.share.aclUnreadable=Votre serveur de calendrier ne permet pas \u00e0 la plateforme de voir avec qui ce calendrier est partag\u00e9.
caldav.share.aclNotUnderstood=Ce calendrier est partag\u00e9 d'une mani\u00e8re que la plateforme ne peut pas changer en toute s\u00e9curit\u00e9. G\u00e9rez son partage dans votre application de calendrier.
caldav.share.serverRefused=Votre serveur de calendrier a refus\u00e9 la modification.
caldav.share.notApplied=Votre serveur de calendrier a accept\u00e9 le changement mais ne l'a pas appliqu\u00e9.
caldav.share.serverUnavailable=Votre serveur de calendrier n'a pas pu \u00eatre atteint. R\u00e9essayez plus tard.
caldav.share.credentials=Votre serveur d'agenda a refus\u00e9 votre compte. V\u00e9rifiez votre mot de passe dans les param\u00e8tres de l'agenda.
caldav.share.ownerUnknown=Votre serveur de calendrier n'a pas dit avec quel compte vous \u00eates connect\u00e9. R\u00e9essayez apr\u00e8s la prochaine synchronisation.
caldav.share.precondition.allowed-principal=il n'accepte pas le compte de ce coll\u00e8gue
caldav.share.precondition.recognized-principal=il ne reconna\u00eet pas le compte de ce coll\u00e8gue
caldav.share.precondition.no-ace-conflict=une autre r\u00e8gle d'acc\u00e8s sur ce calendrier entre en conflit avec celle-ci
caldav.share.precondition.limited-number-of-aces=ce calendrier est d\u00e9j\u00e0 partag\u00e9 avec autant de personnes qu'il le permet
caldav.share.precondition.grant-only=ce calendrier contient une r\u00e8gle d'acc\u00e8s qu'il n'accepte pas
caldav.share.precondition.no-invert=ce calendrier contient une r\u00e8gle d'acc\u00e8s qu'il n'accepte pas
caldav.share.precondition.no-abstract=ce calendrier contient une r\u00e8gle d'acc\u00e8s qu'il n'accepte pas
caldav.share.foreignAccessNotPreserved=Quelqu'un a plus que l'acc\u00e8s \u00e0 ce calendrier, mis en dehors de la plateforme. La modification du partage ici pourrait affecter cet acc\u00e8s, alors g\u00e9rez-le dans votre application de calendrier.
caldav.share.drawer.subscriptionRequired=Sur ce serveur de messagerie, les coll\u00e8gues ne voient qu'un calendrier partag\u00e9 apr\u00e8s s'y \u00eatre abonn\u00e9. D'ici l\u00e0, il n'appara\u00eet pas dans leur application de calendrier ou sur la plateforme.
caldav.share.shareeAddressUnknown=Le serveur de calendrier n'a pas fourni l'adresse e-mail de ce coll\u00e8gue, donc la plateforme n'a pas pu modifier son acc\u00e8s.
caldav.share.shareeHasOtherAccess=Ce coll\u00e8gue a un autre acc\u00e8s \u00e0 ce calendrier, mis en dehors de la plateforme, comme voir quand vous \u00eates libre. Le partager ici remplacerait cela, donc modifiez-le dans votre application de calendrier.
caldav.share.notOwnedOnServer=Ce calendrier appartient \u00e0 quelqu'un d'autre, ou vous n'\u00eates pas autoris\u00e9 \u00e0 g\u00e9rer son partage. Vous ne pouvez partager que les calendriers que vous poss\u00e9dez depuis la plateforme.
caldav.share.drawer.meetingCopies=Ce calendrier contient \u00e9galement des copies de vos r\u00e9unions de plateforme. Toute personne avec qui vous le partagez les verra \u00e9galement, y compris les titres, les descriptions et les espaces.
caldav.share.confirm.meetingCopies.title=Partagez un calendrier avec vos r\u00e9unions ?
caldav.share.confirm.meetingCopies.ok=Partager
caldav.share.confirm.cancel=Annuler
