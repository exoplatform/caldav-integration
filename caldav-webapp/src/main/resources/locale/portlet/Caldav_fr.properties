caldav.admin.servers.deactivate.success=Le serveur CalDAV a \u00e9t\u00e9 d\u00e9sactiv\u00e9
caldav.admin.servers.activate.error=Le serveur CalDAV n'a pas pu \u00eatre activ\u00e9
caldav.admin.servers.deactivate.error=Le serveur CalDAV n'a pas pu \u00eatre d\u00e9sactiv\u00e9
