caldav.error.credentials=Le serveur CalDAV a refus\u00e9 ce nom d'utilisateur ou ce mot de passe. V\u00e9rifiez-les et r\u00e9essayez.
caldav.error.connection=Le serveur CalDAV ne peut pas \u00eatre atteint. R\u00e9essayez plus tard ou contactez votre administrateur.
