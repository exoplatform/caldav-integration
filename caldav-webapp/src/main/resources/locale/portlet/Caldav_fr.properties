caldav.deviceSetup.title=Vos calendriers sur votre t\u00e9l\u00e9phone
caldav.deviceSetup.subtitle=Ajoutez vos calendriers eXo \u00e0 votre application de calendrier de t\u00e9l\u00e9phone ou de bureau
caldav.deviceSetup.action=Mise en place
caldav.deviceSetup.drawer.title=Vos calendriers sur votre t\u00e9l\u00e9phone
caldav.deviceSetup.drawer.description=N'importe quelle application de calendrier CalDAV peut afficher vos calendriers connect\u00e9s. Utilisez ces d\u00e9tails lors de l'ajout du compte :
caldav.deviceSetup.serverAddress=Adresse du serveur
caldav.deviceSetup.username=Nom d'utilisateur
caldav.deviceSetup.passwordNote=Utilisez le mot de passe pour ce compte de calendrier, le m\u00eame que vous l'avez connect\u00e9 \u00e0 eXo avec. eXo n'a pas de mot de passe s\u00e9par\u00e9.
caldav.deviceSetup.copy=Copier {0}
