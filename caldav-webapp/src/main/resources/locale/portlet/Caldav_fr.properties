caldav.admin.servers.drawer.caldavSettings=Param\u00e8tres CalDAV
caldav.admin.servers.copies.title=Copies de r\u00e9union
caldav.admin.servers.answerLinks.label=Ajouter des liens de r\u00e9ponse \u00e0 la copie
caldav.admin.servers.answerLinks.hint=Ajouter les liens Accept, Decline et Tentative \u00e0 la description de chaque r\u00e9union copi\u00e9e. D\u00e9sactiver cette option uniquement si les clients de calendrier affichent d\u00e9j\u00e0 leurs propres boutons de r\u00e9ponse, sinon les utilisateurs ne seront pas en mesure de r\u00e9pondre du tout.
caldav.admin.servers.mirrorTarget.label=L\u00e0 o\u00f9 les copies de la r\u00e9union sont \u00e9crites
caldav.admin.servers.mirrorTarget.appliesTo=S'applique aux utilisateurs qui gardent les copies des r\u00e9unions activ\u00e9es dans leurs propres param\u00e8tres d'agenda.
caldav.admin.servers.mirrorTarget.dedicated.label=Un calendrier d\u00e9di\u00e9 R\u00e9unions eXo
caldav.admin.servers.mirrorTarget.dedicated.consequence=Garde les r\u00e9unions eXo s\u00e9par\u00e9es des propres \u00e9v\u00e9nements de l'utilisateur. Sur certains serveurs, un calendrier s\u00e9par\u00e9 n'est pas disponible, ainsi les coll\u00e8gues voient les heures de r\u00e9union eXo comme des boutons gratuits et aucune r\u00e9ponse n'appara\u00eet sur les copies.
caldav.admin.servers.mirrorTarget.main.label=Le calendrier principal du compte
caldav.admin.servers.mirrorTarget.main.consequence=Les copies comptent pour la disponibilit\u00e9 de l'utilisateur, et les boutons de r\u00e9ponse du serveur apparaissent l\u00e0 o\u00f9 il les offre. Choisissez ceci seulement une fois que les copies sont bien synchronis\u00e9es sur ce serveur.
caldav.admin.servers.mirrorTarget.moves=Changer ceci d\u00e9place les copies existantes de chaque utilisateur par rapport \u00e0 leurs prochaines synchronisations. L'ancien calendrier des r\u00e9unions eXo est laiss\u00e9 en place, vide.
