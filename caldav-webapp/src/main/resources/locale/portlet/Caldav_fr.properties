caldav.error.cors=Le serveur est joignable mais a refus\u00e9 la requ\u00eate inter-origine du navigateur (il n'envoie aucun en-t\u00eate CORS). Demandez \u00e0 votre administrateur de le servir depuis la propre adresse de la plateforme.
caldav.admin.servers.title=Serveurs CalDAV
caldav.admin.servers.subtitle=Ajouter les serveurs CalDAV o\u00f9 les utilisateurs peuvent se connecter \u00e0 un compte personnel. Les calendriers personnels se synchronisent dans les deux sens avec Mes calendriers. Les r\u00e9unions eXo sont copi\u00e9es d'une fa\u00e7on, dans le calendrier personnel seulement.
caldav.admin.servers.add=Ajouter
caldav.admin.servers.noServers=Aucun serveur CalDAV d\u00e9clar\u00e9 pour le moment
caldav.admin.servers.list.name=Nom
caldav.admin.servers.list.activate=Activer
caldav.admin.servers.list.actions=Actions
caldav.admin.servers.preset.label=Quel est le serveur ?
caldav.admin.servers.preset.bluemind.label=Bluemind
caldav.admin.servers.preset.bluemind.summary=Le nom du serveur, le format d'adresse et les limitations connues de BlueMind sont pr\u00e9remplis : pas de liens de visioconf\u00e9rence, marqueurs Outlook et Thunderbird, description dupliqu\u00e9e, priorit\u00e9 par d\u00e9faut sur chaque \u00e9v\u00e9nement.\n\nLes copies vont dans le calendrier principal, pas dans un calendrier d\u00e9di\u00e9, et les liens de r\u00e9ponse restent activ\u00e9s. V\u00e9rifiez les premi\u00e8res synchronisations sur votre serveur, et relisez l'ensemble avant d'enregistrer.
caldav.admin.servers.preset.stalwart.label=Stalwart
caldav.admin.servers.preset.stalwart.summary=J'ai pr\u00e9rempli le nom du serveur et le format d'adresse. Stalwart conserve ce qu'eXo lui envoie, il est donc configur\u00e9 pour tout garder plut\u00f4t que d'h\u00e9riter des exceptions d\u00e9finies pour l'ensemble du d\u00e9ploiement.\n\nLes copies vont dans un calendrier d\u00e9di\u00e9 eXo Meetings. Les liens de r\u00e9ponse sont d\u00e9sactiv\u00e9s, car Stalwart accepte une r\u00e9ponse envoy\u00e9e depuis n'importe quel calendrier et les boutons Accepter et Refuser du client fonctionnent d\u00e9j\u00e0 sur la copie.\n\nRelisez avant d'enregistrer.
caldav.admin.servers.preset.other.label=Un autre serveur
caldav.admin.servers.preset.other.summary=Rien n'est rempli. Un serveur manquant est celui que nous n'avons pas test\u00e9, pas un serveur non pris en charge. Remplissez le formulaire vous-m\u00eame, et eXo vous proposera des r\u00e9glages une fois que les premiers \u00e9v\u00e9nements auront \u00e9t\u00e9 synchronis\u00e9s.
caldav.admin.servers.preset.changesWhatIsWritten=L'une de ces modifications modifie ce qu'eXo \u00e9crit dans les calendriers de vos utilisateurs, et pas seulement ce qu'il compare.
caldav.admin.servers.name=Nom
caldav.admin.servers.name.placeholder=Nom affich\u00e9 aux utilisateurs
caldav.admin.servers.description=Description
caldav.admin.servers.description.placeholder=Description facultative affich\u00e9e aux utilisateurs
caldav.admin.servers.url=URL du serveur
caldav.admin.servers.url.placeholder=https://caldav.example.org/dav/cal/{username}/
caldav.admin.servers.url.hint=L'URL peut contenir un placeholder {username} , remplac\u00e9 par le compte avec lequel chaque utilisateur se connecte.
caldav.admin.servers.url.reachabilityHint=eXo se connecte \u00e0 partir du serveur, pas du navigateur de l'utilisateur, donc cette adresse n'a besoin que d'\u00eatre joignable par le serveur. Les adresses internes sont refus\u00e9es \u00e0 moins que votre d\u00e9ploiement ne le permet, car eXo pourrait autrement \u00eatre utilis\u00e9 pour atteindre des machines qui n'ont jamais \u00e9t\u00e9 cens\u00e9es \u00eatre expos\u00e9es.
caldav.admin.servers.url.corsHint=Les utilisateurs se connectent depuis leur navigateur, donc l'adresse doit partager l'origine de la plate-forme ou envoyer des en-t\u00eates CORS \u2014 un serveur tiers sans eux doit \u00eatre front\u00e9 sur la propre adresse de la plateforme.
