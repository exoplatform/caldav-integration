caldav.deviceSetup.copyFallback=La copie n'est pas disponible ici, la valeur est s\u00e9lectionn\u00e9e, appuyez sur Ctrl+C (Cmd+C sur Mac) pour la copier
caldav.admin.servers.quirks.title=Ce que fait ce serveur
caldav.admin.servers.quirks.subtitle=Vu par eXo lors de la v\u00e9rification des copies de la r\u00e9union pouss\u00e9 ici. Cochez une pour arr\u00eater de traiter comme un changement.
caldav.admin.servers.quirks.none=Rien \u00e0 excuser : eXo n'a rien trouv\u00e9 sur ce serveur qu'il traite comme un changement. C'est \u00e0 quoi ressemble fid\u00e8lement un serveur de stockage de copies et il ne n\u00e9cessite aucune attention.
caldav.admin.servers.quirks.seen.once=Vu une fois
caldav.admin.servers.quirks.seen.many=Vu {0} fois
caldav.admin.servers.quirks.dropsConference.label=Ce serveur ne conserve pas les liens de la vid\u00e9oconf\u00e9rence
caldav.admin.servers.quirks.dropsConference.cost=eXo arr\u00eate de traiter le lien manquant comme un changement et ne le remarque plus si quelqu'un en supprime un.
caldav.admin.servers.quirks.addsCompatibilityMarkers.label=Ce serveur ajoute des marqueurs de compatibilit\u00e9 Outlook et Thunderbird
caldav.admin.servers.quirks.addsCompatibilityMarkers.cost=D'autres applications de calendrier ajoutent ces champs. eXo les ignore et les laisse tels quels.
caldav.admin.servers.quirks.addsFormattedDescription.label=Ce serveur ajoute une copie format\u00e9e de la description
caldav.admin.servers.quirks.addsFormattedDescription.cost=Une copie texte riche de la description. eXo l'ignore et compare la version en texte brut \u00e0 la place.
caldav.admin.servers.quirks.rewritesDescription.label=Ce serveur r\u00e9\u00e9crit le texte d'invitation
caldav.admin.servers.quirks.rewritesDescription.cost=eXo cesse de v\u00e9rifier la description des copies sur ce serveur, y compris les liens de r\u00e9ponse \u00e0 l'int\u00e9rieur. Un lien r\u00e9\u00e9crit ne sera pas d\u00e9tect\u00e9.
caldav.admin.servers.quirks.generic.added.label=Ce serveur ajoute {0}, que eXo n'\u00e9crit pas
caldav.admin.servers.quirks.generic.added.cost=eXo cesse de le traiter comme un changement sur ce serveur.
caldav.admin.servers.quirks.generic.dropped.label=Ce serveur ne conserve pas {0}
caldav.admin.servers.quirks.generic.dropped.cost=eXo arr\u00eate de traiter son absence comme un changement et ne remarque plus si quelqu'un la supprime.
caldav.admin.servers.quirks.generic.rewritten.label=Ce serveur r\u00e9\u00e9crit {0}
caldav.admin.servers.quirks.generic.rewritten.cost=eXo arr\u00eate de v\u00e9rifier cette valeur sur les copies stock\u00e9es par ce serveur.
caldav.admin.servers.quirks.changesWhatIsWritten=Modifie ce qu'eXo \u00e9crit dans les calendriers sur ce serveur
caldav.admin.servers.quirks.omitsSoloOrganizer.label=Ce serveur retire l'organisateur d'un \u00e9v\u00e9nement avec aucun autre participant
caldav.admin.servers.quirks.omitsSoloOrganizer.cost=Rien ne change : sur chaque serveur, eXo quitte d\u00e9j\u00e0 l'organisateur des \u00e9v\u00e9nements sans aucun autre participant. Des copies d'\u00e9v\u00e9nements avec des participants nomment toujours les leurs.
caldav.error.mainCalendarUnknown=eXo ne peut pas copier vos r\u00e9unions sur ce compte : il ne rapporte pas lequel de ses calendriers est la valeur par d\u00e9faut, donc il n'y a nulle part o\u00f9 les mettre. Contactez votre administrateur.
caldav.error.foreignCopy=Cette r\u00e9union est d\u00e9j\u00e0 dans votre compte de calendrier, ajout\u00e9 par quelqu'un d'autre. La plateforme conserve cette copie telle qu'elle est.
caldav.error.forbidden=Ce calendrier est partag\u00e9 avec vous en lecture seule, votre changement ne peut donc pas \u00eatre enregistr\u00e9.

caldav.server.url.malformed=Ce n'est pas une adresse web utilisable. Il doit commencer par https:// (ou http:// si votre administrateur l'autorise) et nommer un serveur.
caldav.server.url.schemeNotAllowed=Seules les adresses https sont accept\u00e9es. Demandez \u00e0 votre administrateur d'autoriser http si ce serveur n'a pas de certificat.
caldav.server.url.credentials=Supprimez le nom d'utilisateur et le mot de passe de l'adresse. eXo utilise les identifiants que chaque utilisateur se connecte, jamais ceux qui sont \u00e9crits dans l'adresse.
caldav.server.url.fragment=Supprimez le # et tout ce qui suit : une adresse de serveur ne contient aucun fragment.
caldav.server.url.portNotAllowed=Ce port n'est pas autoris\u00e9. Utilisez le port standard, ou demandez \u00e0 votre administrateur de l'autoriser.
caldav.server.url.usernameInAuthority=Le placeholder {username} ne peut appara\u00eetre qu'apr\u00e8s le nom du serveur, dans le chemin. Mettez-le dans le chemin, pas dans l'adresse du serveur lui-m\u00eame.
caldav.server.url.privateAddress=Cette adresse pointe \u00e0 l'int\u00e9rieur de votre propre r\u00e9seau, donc elle n'est pas accept\u00e9e. eXo se connecte depuis le serveur, donc une adresse interne peut \u00eatre utilis\u00e9e pour atteindre des machines qui n'ont jamais \u00e9t\u00e9 cens\u00e9es \u00eatre expos\u00e9es. Si c'est correct, demandez \u00e0 votre administrateur de l'autoriser.
caldav.server.url.unresolvable=Ce nom de serveur n'existe pas. V\u00e9rifiez l'orthographe.
caldav.share.menu=Partager
caldav.share.drawer.title=Partager
caldav.share.drawer.about=Mes coll\u00e8gues que vous ajoutez peuvent voir ce calendrier en lecture seule, sous "Partag\u00e9 avec moi" dans la plateforme et dans n'importe quelle application de calendrier connect\u00e9e au m\u00eame serveur. Ils peuvent le cacher, mais pas le changer.
caldav.share.drawer.sameServerOnly=Seuls les coll\u00e8gues connect\u00e9s au m\u00eame serveur de calendrier peuvent \u00eatre ajout\u00e9s.
caldav.share.picker.placeholder=Ajouter un coll\u00e8gue
caldav.share.picker.noData=Aucun coll\u00e8gue connect\u00e9 \u00e0 ce serveur de calendrier ne correspond
