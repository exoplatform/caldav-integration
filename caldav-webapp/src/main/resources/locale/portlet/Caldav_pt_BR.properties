caldav.admin.servers.drawer.cancel=Cancelar
caldav.admin.servers.drawer.updateTheIcon=Atualizar o \u00edcone
caldav.admin.servers.drawer.button.chooseIcon=Escolher
caldav.admin.servers.drawer.upload=Enviar
caldav.admin.servers.drawer.resetDefault=Voltar ao \u00edcone padr\u00e3o
caldav.admin.servers.drawer.tooBigFile=A imagem deve ter menos de 100 kB
caldav.admin.servers.drawer.uploadingError=N\u00e3o foi poss\u00edvel enviar a imagem. Tente novamente.
caldav.admin.servers.drawer.caldavSettings=Configura\u00e7\u00f5es do CalDAV
caldav.admin.servers.copies.title=C\u00f3pias das reuni\u00f5es
caldav.admin.servers.answerLinks.label=Adicionar links de resposta \u00e0 c\u00f3pia
caldav.admin.servers.answerLinks.hint=Adiciona links Aceitar, Recusar e Talvez \u00e0 descri\u00e7\u00e3o de cada reuni\u00e3o copiada. Desative esta op\u00e7\u00e3o somente se os clientes de agenda j\u00e1 exibirem seus pr\u00f3prios bot\u00f5es de resposta; caso contr\u00e1rio, os usu\u00e1rios n\u00e3o poder\u00e3o responder de forma alguma.
caldav.admin.servers.mirrorTarget.label=Onde as c\u00f3pias das reuni\u00f5es s\u00e3o gravadas
caldav.admin.servers.mirrorTarget.appliesTo=Aplica-se aos usu\u00e1rios que mant\u00eam as c\u00f3pias das reuni\u00f5es ativadas nas pr\u00f3prias configura\u00e7\u00f5es da agenda.
caldav.admin.servers.mirrorTarget.dedicated.label=Uma agenda dedicada eXo Meetings
caldav.admin.servers.mirrorTarget.dedicated.consequence=Mant\u00e9m as reuni\u00f5es do eXo separadas dos eventos do pr\u00f3prio usu\u00e1rio. Em alguns servidores, uma agenda separada n\u00e3o \u00e9 considerada na disponibilidade, ent\u00e3o os colegas veem os hor\u00e1rios das reuni\u00f5es do eXo como livres e nenhum bot\u00e3o de resposta aparece nas c\u00f3pias.
caldav.admin.servers.mirrorTarget.main.label=A agenda principal da conta
caldav.admin.servers.mirrorTarget.main.consequence=As c\u00f3pias contam para a disponibilidade do usu\u00e1rio, e os bot\u00f5es de resposta do pr\u00f3prio servidor aparecem onde ele os oferece. Escolha esta op\u00e7\u00e3o somente quando as c\u00f3pias forem sincronizadas corretamente neste servidor.
caldav.admin.servers.mirrorTarget.moves=Alterar esta op\u00e7\u00e3o move as c\u00f3pias existentes de cada usu\u00e1rio ao longo das pr\u00f3ximas sincroniza\u00e7\u00f5es. A antiga agenda eXo Meetings \u00e9 mantida no lugar, vazia.
caldav.admin.servers.writeChannel.label=Como as c\u00f3pias das reuni\u00f5es s\u00e3o gravadas
caldav.admin.servers.writeChannel.hint=Aplica-se a todas as c\u00f3pias que o eXo grava ou remove neste servidor, para todos os usu\u00e1rios.
caldav.admin.servers.writeChannel.caldav.label=CalDAV padr\u00e3o
caldav.admin.servers.writeChannel.caldav.consequence=Funciona com todos os servidores CalDAV. No BlueMind, uma c\u00f3pia gravada dessa forma faz o BlueMind enviar os pr\u00f3prios convites para a reuni\u00e3o: os convidados no mesmo servidor o recebem duas vezes, e uma resposta dada na c\u00f3pia do pr\u00f3prio BlueMind nunca chega ao eXo.
caldav.admin.servers.writeChannel.bluemindImport.label=Importa\u00e7\u00e3o de agenda do BlueMind
caldav.admin.servers.writeChannel.bluemindImport.consequence=Grava cada c\u00f3pia pela API de importa\u00e7\u00e3o do pr\u00f3prio BlueMind, que n\u00e3o envia nenhum convite pr\u00f3prio, ent\u00e3o o eXo continua sendo o \u00fanico remetente. Somente BlueMind. Volte para o CalDAV padr\u00e3o para desfazer.
caldav.admin.servers.writeChannel.unavailable.label=Uma via que esta plataforma n\u00e3o oferece mais ({0})
caldav.admin.servers.writeChannel.unavailable.consequence=O complemento que grava as c\u00f3pias dessa forma n\u00e3o est\u00e1 instalado, ent\u00e3o todas as c\u00f3pias para este servidor s\u00e3o recusadas at\u00e9 que ele seja instalado novamente ou que voc\u00ea mude para o CalDAV padr\u00e3o.
caldav.admin.servers.drawer.add.success=O servidor CalDAV foi adicionado
caldav.admin.servers.drawer.add.error=N\u00e3o foi poss\u00edvel adicionar o servidor CalDAV. Verifique os valores e tente novamente.
caldav.admin.servers.drawer.edit.success=O servidor CalDAV foi atualizado
caldav.admin.servers.drawer.edit.error=N\u00e3o foi poss\u00edvel atualizar o servidor CalDAV. Verifique os valores e tente novamente.
caldav.admin.servers.activate.success=O servidor CalDAV foi ativado
caldav.admin.servers.deactivate.success=O servidor CalDAV foi desativado
caldav.admin.servers.activate.error=N\u00e3o foi poss\u00edvel ativar o servidor CalDAV
caldav.admin.servers.deactivate.error=N\u00e3o foi poss\u00edvel desativar o servidor CalDAV
caldav.admin.servers.delete.success=O servidor CalDAV foi exclu\u00eddo
caldav.admin.servers.delete.error=N\u00e3o foi poss\u00edvel excluir o servidor CalDAV
caldav.admin.servers.delete.referenced={0} conta(s) conectada(s) ainda usam este servidor. Desative-o e deixe que se desconectem antes de exclu\u00ed-lo.
caldav.admin.servers.modal.delete.title=Excluir o servidor CalDAV
