caldav.admin.servers.modal.delete.confirmDelete=Delete
caldav.admin.servers.modal.delete.cancelDelete=Cancel
agenda.caldavCalendar.calendarDelete.propagates=Esta agenda tamb\u00e9m est\u00e1 em {0}. Exclu\u00ed-la aqui tamb\u00e9m a exclui l\u00e1, com todos os eventos que ela cont\u00e9m. Isso inclui eventos que voc\u00ea adicionou pelo celular ou por outro aplicativo, e n\u00e3o pode ser desfeito.
agenda.caldavCalendar.calendarDelete.keepsRemote=A agenda correspondente em {0} n\u00e3o ser\u00e1 alterada. Ela permanece l\u00e1 com todos os seus eventos, e o eXo simplesmente deixar\u00e1 de exibi-la.
caldav.hiddenCalendars.title=Calend\u00e1rios ocultos
caldav.hiddenCalendars.subtitle={0} agenda(s) que voc\u00ea excluiu aqui ainda est\u00e3o na sua conta de agenda
caldav.hiddenCalendars.manage=Gerenciar as agendas ocultas
caldav.hiddenCalendars.drawer.title=Calend\u00e1rios ocultos
caldav.hiddenCalendars.drawer.description=Voc\u00ea excluiu estas agendas do eXo, mas optou por mant\u00ea-las na sua conta. Exibir uma delas novamente a traz de volta na pr\u00f3xima sincroniza\u00e7\u00e3o, com os eventos que ela cont\u00e9m agora.
caldav.hiddenCalendars.showAgain=Mostrar novamente
caldav.hiddenCalendars.showAgainSuccess={0} voltar\u00e1 na pr\u00f3xima sincroniza\u00e7\u00e3o
caldav.hiddenCalendars.showAgainError=N\u00e3o foi poss\u00edvel exibir esta agenda novamente
caldav.hiddenCalendars.count={0} agenda(s) oculta(s) da sua agenda
caldav.hiddenCalendars.drawer.about=Agendas que voc\u00ea ocultou no eXo. Exiba uma para traz\u00ea-la de volta: uma agenda exclu\u00edda volta na pr\u00f3xima sincroniza\u00e7\u00e3o com os eventos atuais, uma agenda compartilhada volta imediatamente em Compartilhadas comigo.
caldav.hiddenCalendars.deletedHere=Exclu\u00edda aqui, mantida na sua conta de agenda
caldav.hiddenCalendars.sharedBy=Compartilhado por {0}
caldav.hiddenCalendars.sharedWithYou=Compartilhado com voc\u00ea
caldav.hiddenCalendars.showAgainSharedSuccess={0} est\u00e1 de volta em Compartilhadas comigo
caldav.hiddenCalendars.notAShare=Voc\u00ea s\u00f3 pode ocultar agendas compartilhadas com voc\u00ea. Para deixar de ver uma das suas, exclua-a e selecione "Manter na minha conta de agenda" quando solicitado.
caldav.hiddenCalendars.calendarRequired=Escolha a agenda a ocultar.
caldav.hiddenCalendars.accountUnavailable=N\u00e3o foi poss\u00edvel acessar sua conta de agenda, ent\u00e3o esta agenda n\u00e3o foi ocultada. Tente novamente em instantes.

caldav.admin.sync.title=Sincroniza\u00e7\u00e3o de agendas
caldav.admin.sync.description=Com que frequ\u00eancia e com que amplitude o eXo l\u00ea as contas de agenda que seus usu\u00e1rios conectam. As altera\u00e7\u00f5es entram em vigor na pr\u00f3xima sincroniza\u00e7\u00e3o.
caldav.admin.sync.throttleMinutes.label=Intervalo entre sincroniza\u00e7\u00f5es
caldav.admin.sync.throttleMinutes.help=Abrir a agenda l\u00ea a conta conectada e depois a deixa em paz por este tempo, independentemente de quantas vezes a p\u00e1gina for aberta. Isso impede que um usu\u00e1rio muito ativo fa\u00e7a uma solicita\u00e7\u00e3o a cada exibi\u00e7\u00e3o.
caldav.admin.sync.pastDays.label=Ler eventos do passado
caldav.admin.sync.pastDays.help=At\u00e9 quando no passado o eXo l\u00ea eventos. Eventos passados raramente mudam, ent\u00e3o ler menos deles n\u00e3o custa quase nada e torna cada sincroniza\u00e7\u00e3o mais leve.
caldav.admin.sync.futureDays.label=Ler eventos futuros
caldav.admin.sync.futureDays.help=At\u00e9 quando no futuro o eXo l\u00ea eventos. \u00c9 esta op\u00e7\u00e3o que pesa: uma janela ampla em uma conta com anos de reuni\u00f5es recorrentes \u00e9 um download grande, feito na primeira sincroniza\u00e7\u00e3o de cada dia.
caldav.admin.sync.sweepStaleMinutes.label=Atualizar contas n\u00e3o abertas h\u00e1
caldav.admin.sync.sweepStaleMinutes.help=O eXo l\u00ea uma conta de agenda quando o propriet\u00e1rio abre a agenda dele, e ele espera enquanto ela carrega. As contas que ningu\u00e9m abriu por mais tempo que isso s\u00e3o atualizadas em segundo plano, para que a pr\u00f3xima agenda abra com os eventos j\u00e1 dispon\u00edveis.\n\nDiminua este valor para ter agendas mais atualizadas, mas com mais solicita\u00e7\u00f5es ao servidor. Aumente-o se os servidores de agenda forem lentos ou tiverem limite de requisi\u00e7\u00f5es.
caldav.admin.sync.sweepBatchSize.label=Agendas por execu\u00e7\u00e3o em segundo plano
caldav.admin.sync.sweepBatchSize.help=Cada execu\u00e7\u00e3o atualiza no m\u00e1ximo este n\u00famero de agendas, das mais antigas para as mais recentes. Aumente-o para recuperar o atraso mais r\u00e1pido em uma inst\u00e2ncia movimentada, diminua-o para distribuir a carga.
caldav.admin.sync.unit.minutes=minutos
caldav.admin.sync.unit.days=dias
caldav.admin.sync.unit.calendars=agendas
caldav.admin.sync.save=Salvar
caldav.admin.sync.saved=Configura\u00e7\u00f5es de sincroniza\u00e7\u00e3o salvas
caldav.admin.sync.saveFailed=N\u00e3o foi poss\u00edvel salvar estas configura\u00e7\u00f5es
caldav.tuning.mandatory=Nenhuma configura\u00e7\u00e3o foi enviada
caldav.tuning.throttleOutOfRange=O intervalo entre sincroniza\u00e7\u00f5es deve estar entre 0 minutos e um dia.
caldav.tuning.pastDaysOutOfRange=A leitura do passado deve estar entre 0 e 365 dias.
caldav.tuning.futureDaysOutOfRange=A leitura do futuro deve estar entre 1 e 365 dias.
caldav.tuning.sweepStaleOutOfRange=O prazo da atualiza\u00e7\u00e3o em segundo plano deve estar entre 1 minuto e uma semana.
caldav.tuning.sweepBatchOutOfRange=A execu\u00e7\u00e3o em segundo plano deve processar entre 1 e 500 agendas.
caldav.admin.sync.summary=Lendo {1} dias para tr\u00e1s e {2} dias para a frente. Uma agenda que acabou de ser aberta aguarda {0} minutos antes de ler a conta novamente; uma conta que ningu\u00e9m abre \u00e9 atualizada em segundo plano ap\u00f3s {3} minutos.
caldav.admin.sync.cancel=Cancelar
caldav.admin.sync.reports.title=C\u00f3pias das reuni\u00f5es, por usu\u00e1rio
caldav.admin.sync.reports.subtitle=Como cada servidor conectado tratou as c\u00f3pias das reuni\u00f5es durante a \u00faltima sincroniza\u00e7\u00e3o. Isso fica apenas na mem\u00f3ria, ent\u00e3o a tabela fica vazia ap\u00f3s uma reinicializa\u00e7\u00e3o at\u00e9 que as contas sejam sincronizadas novamente.
caldav.admin.sync.reports.none=Nenhuma conta conectada verificou suas c\u00f3pias de reuni\u00f5es desde a \u00faltima reinicializa\u00e7\u00e3o. Isto ser\u00e1 preenchido \u00e0 medida que elas forem sincronizadas.
caldav.admin.sync.reports.checked={0} c\u00f3pias verificadas, {1} ausentes, {2} alteradas, {3} reescritas, {4} mantidas como est\u00e3o.
caldav.admin.sync.reports.moved=Movidas para o novo destino: {0} c\u00f3pias movidas, {1} c\u00f3pias antigas que o servidor n\u00e3o quis remover, {2} n\u00e3o puderam ser gravadas.
caldav.admin.sync.reports.notMoved=Nenhuma mudan\u00e7a de destino estava pendente.
caldav.admin.sync.reports.loadFailed=N\u00e3o foi poss\u00edvel ler estas contagens.
caldav.admin.sync.reports.unknownUser=Usu\u00e1rio {0}
caldav.admin.managed.title=Conex\u00e3o unificada
caldav.admin.managed.off=Os usu\u00e1rios conectam a pr\u00f3pria conta.
caldav.admin.managed.on=Todos est\u00e3o vinculados a {0}.
caldav.admin.managed.noServers=Nenhum servidor declarado ainda.
caldav.admin.managed.onExcept=Todos est\u00e3o vinculados a {0}, exceto {1} grupo(s) ou espa\u00e7o(s) exclu\u00eddo(s).
caldav.admin.managed.off.confirm.title=Desativar a conex\u00e3o unificada?
caldav.admin.managed.off.confirm.message=Os usu\u00e1rios voltar\u00e3o a escolher o pr\u00f3prio servidor CalDAV. As contas que os pr\u00f3prios usu\u00e1rios conectaram a {0} continuam sincronizando.
caldav.admin.managed.off.confirm.disconnect.one=1 conta vinculada pela conex\u00e3o unificada ser\u00e1 desconectada.
caldav.admin.managed.off.confirm.disconnect.many={0} contas vinculadas pela conex\u00e3o unificada ser\u00e3o desconectadas.
caldav.admin.managed.off.countFailed=N\u00e3o foi poss\u00edvel contar as contas vinculadas pela conex\u00e3o unificada. A conex\u00e3o unificada permanece ativada, tente novamente.
caldav.admin.managed.off.confirm.question=Tem certeza de que deseja desativ\u00e1-la?
caldav.admin.managed.off.confirm.ok=Desativar
caldav.admin.managed.off.confirm.cancel=Manter ativada
caldav.admin.managed.saved=Agora todos est\u00e3o vinculados a {0}
caldav.admin.managed.cleared=Os usu\u00e1rios voltam a escolher o pr\u00f3prio servidor CalDAV
caldav.admin.managed.saveFailed=N\u00e3o foi poss\u00edvel ativar a conex\u00e3o unificada
caldav.admin.managed.clearFailed=N\u00e3o foi poss\u00edvel desativar a conex\u00e3o unificada
caldav.managed.serverRequired=Escolha o servidor com o qual todos devem sincronizar.
caldav.managed.serverNotEligible=Escolha um servidor configurado e ativo. Um servidor desativado n\u00e3o pode ser acessado, ent\u00e3o ningu\u00e9m conseguiria se conectar com a conex\u00e3o unificada.
caldav.managed.providerNotEligible=Na conex\u00e3o unificada, este servidor n\u00e3o pode usar um provedor que precise das credenciais de cada usu\u00e1rio. Desative a conex\u00e3o unificada ou escolha um provedor com uma conta de servi\u00e7o.
caldav.admin.servers.list.managedLocked=Voc\u00ea n\u00e3o pode desativar nem excluir este servidor enquanto a conex\u00e3o unificada o utiliza. Desative primeiro a conex\u00e3o unificada, na linha acima da lista de servidores.
caldav.managed.serverInUse=Voc\u00ea n\u00e3o pode desativar este servidor enquanto a conex\u00e3o unificada estiver ativada, pois todos sincronizam com ele. Desative primeiro a conex\u00e3o unificada, na linha acima da lista de servidores.
agenda.caldavCalendar.disconnect.warning=As agendas que o eXo exibe de {0} ser\u00e3o removidas da sua agenda, junto com as c\u00f3pias dos eventos delas. Nada \u00e9 exclu\u00eddo em {0}, e as agendas que voc\u00ea criou no eXo permanecem. Reconecte a conta e essas agendas voltar\u00e3o.
caldav.pendingCopies.title=C\u00f3pias de reuni\u00f5es ainda a caminho
caldav.pendingCopies.subtitle={0} das suas reuni\u00f5es foram alteradas no eXo e a altera\u00e7\u00e3o ainda n\u00e3o chegou \u00e0 sua agenda. O eXo continua tentando; a pr\u00f3xima sincroniza\u00e7\u00e3o em segundo plano geralmente resolve isso.
caldav.calendarStates.title=Agendas que precisam de aten\u00e7\u00e3o
caldav.calendarStates.subtitle={0} das suas agendas n\u00e3o est\u00e3o sincronizando normalmente
caldav.calendarStates.manage=Ver o que est\u00e1 errado
caldav.calendarStates.drawer.title=Agendas que precisam de aten\u00e7\u00e3o
caldav.calendarStates.drawer.description=Estas agendas n\u00e3o est\u00e3o sincronizando como as outras. As demais agendas n\u00e3o s\u00e3o afetadas.
caldav.calendarStates.explain.REMOTE_CREATE_REFUSED=Sua conta de agenda n\u00e3o permite que o eXo crie agendas nela, ent\u00e3o esta n\u00e3o \u00e9 copiada para l\u00e1. As agendas que j\u00e1 existem na conta continuam aparecendo no eXo.
caldav.calendarStates.explain.PAUSED=A sincroniza\u00e7\u00e3o desta agenda falhou repetidamente, ent\u00e3o o eXo parou de tentar. Sincronize agora para recome\u00e7ar; se continuar falhando, reconecte a conta.
caldav.calendarStates.explain.EXO_ORPHANED=Voc\u00ea excluiu esta agenda no eXo, e n\u00e3o foi poss\u00edvel exclu\u00ed-la na sua conta de agenda. Ela ainda est\u00e1 l\u00e1.
caldav.calendarStates.explain.REMOTE_GONE=Esta agenda n\u00e3o est\u00e1 mais na sua conta de agenda. Nada de novo chegar\u00e1 a ela, e o que o eXo j\u00e1 possui permanece intacto.
caldav.calendarStates.explain.RETIRED_SUBSCRIPTION=Esta \u00e9 uma c\u00f3pia de uma agenda compartilhada com voc\u00ea ou de um recurso que voc\u00ea assinou. Ela n\u00e3o \u00e9 mais sincronizada, ent\u00e3o as altera\u00e7\u00f5es feitas aqui n\u00e3o v\u00e3o a lugar nenhum. Exclua-a e a original aparecer\u00e1 em Compartilhadas comigo, somente leitura.
caldav.calendarStates.explain.unknown=Esta agenda n\u00e3o est\u00e1 sincronizando normalmente.
caldav.calendarStates.lastSynchronised={0}
caldav.calendarStates.syncNow=Sincronizar agora
caldav.calendarStates.synchronised=Suas agendas foram sincronizadas. As c\u00f3pias das suas reuni\u00f5es est\u00e3o sendo verificadas em segundo plano.
caldav.calendarStates.syncFailed=N\u00e3o foi poss\u00edvel sincronizar sua conta de calend\u00e1rio
caldav.deviceSetup.title=Suas agendas no celular
caldav.deviceSetup.subtitle=Adicione suas agendas do eXo ao aplicativo de agenda do seu celular ou computador
caldav.deviceSetup.action=Configurar
caldav.deviceSetup.drawer.title=Suas agendas no celular
caldav.deviceSetup.drawer.description=Qualquer aplicativo de agenda CalDAV pode exibir suas agendas conectadas. Use estes dados ao adicionar a conta:
caldav.deviceSetup.serverAddress=Endere\u00e7o do servidor
caldav.deviceSetup.username=Nome de usu\u00e1rio
caldav.deviceSetup.passwordNote=Use a senha desta conta de agenda, a mesma com a qual voc\u00ea a conectou ao eXo. O eXo n\u00e3o tem uma senha pr\u00f3pria separada.
caldav.deviceSetup.copy=Copiar {0}
caldav.deviceSetup.copied={0} copiado
caldav.deviceSetup.copyFallback=A c\u00f3pia n\u00e3o est\u00e1 dispon\u00edvel aqui, o valor est\u00e1 selecionado, pressione Ctrl+C (Cmd+C no Mac) para copi\u00e1-lo
caldav.admin.servers.quirks.title=O que este servidor faz
caldav.admin.servers.quirks.subtitle=Observado pelo eXo ao verificar as c\u00f3pias de reuni\u00f5es enviadas para c\u00e1. Marque um item para deixar de trat\u00e1-lo como uma altera\u00e7\u00e3o.
caldav.admin.servers.quirks.none=Nada a ignorar: o eXo n\u00e3o encontrou nada neste servidor que trate como uma altera\u00e7\u00e3o. \u00c9 assim que se comporta um servidor que armazena as c\u00f3pias fielmente, e ele n\u00e3o precisa de aten\u00e7\u00e3o.
caldav.admin.servers.quirks.seen.once=Observado uma vez
caldav.admin.servers.quirks.seen.many=Observado {0} vezes
caldav.admin.servers.quirks.dropsConference.label=Este servidor n\u00e3o mant\u00e9m os links de videoconfer\u00eancia
caldav.admin.servers.quirks.dropsConference.cost=O eXo deixa de tratar o link ausente como uma altera\u00e7\u00e3o e n\u00e3o perceber\u00e1 mais se algu\u00e9m remover um.
caldav.admin.servers.quirks.addsCompatibilityMarkers.label=Este servidor adiciona marcadores de compatibilidade do Outlook e do Thunderbird
caldav.admin.servers.quirks.addsCompatibilityMarkers.cost=Outros aplicativos de agenda adicionam estes campos. O eXo os ignora e os deixa como est\u00e3o.
caldav.admin.servers.quirks.addsFormattedDescription.label=Este servidor adiciona uma c\u00f3pia formatada da descri\u00e7\u00e3o
caldav.admin.servers.quirks.addsFormattedDescription.cost=Uma c\u00f3pia em rich text da descri\u00e7\u00e3o. O eXo a ignora e compara a vers\u00e3o em texto simples.
caldav.admin.servers.quirks.stampsDefaultPriority.label=Este servidor atribui uma prioridade padr\u00e3o a cada reuni\u00e3o que armazena
caldav.admin.servers.quirks.stampsDefaultPriority.cost=Uma prioridade que ningu\u00e9m escolheu, adicionada a cada c\u00f3pia. O eXo n\u00e3o grava nenhuma prioridade, ent\u00e3o deixa de tratar uma prioridade como altera\u00e7\u00e3o e n\u00e3o perceber\u00e1 mais se algu\u00e9m definir uma prioridade real neste servidor.
caldav.admin.servers.quirks.rewritesDescription.label=Este servidor reescreve o texto do convite
caldav.admin.servers.quirks.rewritesDescription.cost=O eXo deixa de verificar a descri\u00e7\u00e3o das c\u00f3pias neste servidor, incluindo os links de resposta nela. Um link reescrito passar\u00e1 despercebido.
caldav.admin.servers.quirks.generic.added.label=Este servidor adiciona {0}, que o eXo n\u00e3o escreve
caldav.admin.servers.quirks.generic.added.cost=O eXo deixa de tratar isso como uma altera\u00e7\u00e3o neste servidor.
caldav.admin.servers.quirks.generic.dropped.label=Este servidor n\u00e3o mant\u00e9m {0}
caldav.admin.servers.quirks.generic.dropped.cost=O eXo deixa de tratar a aus\u00eancia disso como uma altera\u00e7\u00e3o e n\u00e3o perceber\u00e1 mais se algu\u00e9m o remover.
caldav.admin.servers.quirks.generic.rewritten.label=Este servidor reescreve {0}
caldav.admin.servers.quirks.generic.rewritten.cost=O eXo deixa de verificar esse valor nas c\u00f3pias armazenadas por este servidor.
caldav.admin.servers.quirks.changesWhatIsWritten=Altera o que o eXo escreve nas agendas deste servidor
caldav.admin.servers.foreignWriters.title=Outras implanta\u00e7\u00f5es do eXo gravando aqui
caldav.admin.servers.foreignWriters.subtitle=Outro eXo gravou c\u00f3pias de reuni\u00f5es nas contas deste servidor. Ambos est\u00e3o reparando as mesmas c\u00f3pias, e nenhum deles consegue distinguir as grava\u00e7\u00f5es do outro de uma altera\u00e7\u00e3o feita por algu\u00e9m.
caldav.admin.servers.foreignWriters.none=Nenhum outro eXo foi visto gravando nas contas deste servidor. \u00c9 assim que se comporta um servidor em que s\u00f3 esta implanta\u00e7\u00e3o grava, e ele n\u00e3o precisa de aten\u00e7\u00e3o.
caldav.admin.servers.foreignWriters.cost=O eXo verifica as c\u00f3pias de reuni\u00f5es que enviou para c\u00e1 e repara o que mudou, supondo que gravou todas elas. As c\u00f3pias gravadas por essa outra implanta\u00e7\u00e3o s\u00e3o contadas e comparadas como se fossem do pr\u00f3prio eXo.
caldav.admin.servers.foreignWriters.lastSeen=Visto pela \u00faltima vez em {0}
caldav.admin.servers.foreignWriters.resolution=Conecte uma das duas implanta\u00e7\u00f5es a outra conta CalDAV. Enquanto isso, nada aqui \u00e9 importado, removido ou reparado de forma diferente, e as c\u00f3pias j\u00e1 gravadas permanecem at\u00e9 que algu\u00e9m as exclua.
caldav.admin.servers.quirks.omitsSoloOrganizer.label=Este servidor remove o organizador de um evento sem outros participantes
caldav.admin.servers.quirks.omitsSoloOrganizer.cost=Nada muda: em todos os servidores, o eXo j\u00e1 deixa o organizador fora dos eventos sem outros participantes. As c\u00f3pias de eventos com participantes continuam indicando o organizador.
caldav.error.mainCalendarUnknown=O eXo n\u00e3o pode copiar suas reuni\u00f5es para esta conta: ela n\u00e3o informa qual das suas agendas \u00e9 a padr\u00e3o, ent\u00e3o n\u00e3o h\u00e1 onde coloc\u00e1-las. Entre em contato com o administrador.
caldav.error.foreignCopy=Esta reuni\u00e3o j\u00e1 est\u00e1 na sua conta de agenda, adicionada por outra pessoa. O eXo mant\u00e9m essa c\u00f3pia como est\u00e1.
caldav.error.forbidden=Esta agenda est\u00e1 compartilhada com voc\u00ea somente para leitura, ent\u00e3o sua altera\u00e7\u00e3o n\u00e3o pode ser salva nela.

caldav.server.authProviderUnknown=Este m\u00e9todo de autentica\u00e7\u00e3o n\u00e3o est\u00e1 dispon\u00edvel neste servidor. Escolha um na lista.
caldav.server.writeChannelNotSupported=A importa\u00e7\u00e3o de agenda do BlueMind s\u00f3 funciona com um servidor BlueMind, que o eXo reconhece por "BlueMind" no nome do servidor. Escolha o CalDAV padr\u00e3o ou mantenha BlueMind no nome.
caldav.server.url.malformed=Este n\u00e3o \u00e9 um endere\u00e7o web utiliz\u00e1vel. Ele deve come\u00e7ar com https:// (ou http:// se o administrador permitir) e indicar um servidor.
caldav.server.url.schemeNotAllowed=Somente endere\u00e7os https s\u00e3o aceitos. Pe\u00e7a ao administrador para permitir http se este servidor n\u00e3o tiver certificado.
caldav.server.url.credentials=Remova o nome de usu\u00e1rio e a senha do endere\u00e7o. O eXo usa as credenciais com as quais cada usu\u00e1rio se conecta, nunca as escritas no endere\u00e7o.
caldav.server.url.fragment=Remova o # e tudo o que vem depois dele. Um endere\u00e7o de servidor n\u00e3o cont\u00e9m fragmento.
caldav.server.url.portNotAllowed=Esta porta n\u00e3o \u00e9 permitida. Use a porta padr\u00e3o ou pe\u00e7a ao administrador para permitir esta.
caldav.server.url.usernameInAuthority=O marcador {username} s\u00f3 pode aparecer depois do nome do servidor, no caminho. Coloque-o no caminho, n\u00e3o no endere\u00e7o do pr\u00f3prio servidor.
caldav.server.url.privateAddress=Este endere\u00e7o aponta para dentro da sua pr\u00f3pria rede, por isso n\u00e3o \u00e9 aceito. O eXo se conecta a partir do servidor, ent\u00e3o um endere\u00e7o interno poderia ser usado para alcan\u00e7ar m\u00e1quinas que nunca deveriam ter sido expostas. Se ele estiver correto, pe\u00e7a ao administrador para permiti-lo.
caldav.server.url.unresolvable=Este nome de servidor n\u00e3o existe. Verifique a grafia.
caldav.share.calendarNotFound=Este calend\u00e1rio n\u00e3o existe mais.
caldav.share.notOwner=Somente o propriet\u00e1rio de uma agenda pode compartilh\u00e1-la.
caldav.share.notConnected=Conecte sua conta de agenda antes de compartilhar uma agenda.
caldav.share.calendarNotOnServer=Esta agenda ainda n\u00e3o est\u00e1 no seu servidor de agenda. Tente novamente ap\u00f3s a pr\u00f3xima sincroniza\u00e7\u00e3o.
caldav.share.notSupported=Seu servidor de agenda n\u00e3o permite que o eXo compartilhe agendas.
caldav.share.shareeRequired=Escolha um colega com quem compartilhar.
caldav.share.shareeUnknown=Este colega n\u00e3o \u00e9 um usu\u00e1rio ativo.
caldav.share.shareeIsOwner=Voc\u00ea j\u00e1 \u00e9 o propriet\u00e1rio desta agenda.
caldav.share.shareeNotConnected=Este colega n\u00e3o est\u00e1 conectado ao mesmo servidor de agenda.
caldav.share.samePrincipal=Este colega usa a mesma conta de agenda que voc\u00ea, ent\u00e3o ele j\u00e1 v\u00ea esta agenda.
caldav.share.notReadOnly=Este colega tem mais do que acesso de visualiza\u00e7\u00e3o, definido fora da plataforma. Altere isso no seu aplicativo de agenda.
caldav.share.aclUnreadable=Seu servidor de agenda n\u00e3o permite que a plataforma veja com quem esta agenda est\u00e1 compartilhada.
caldav.share.aclNotUnderstood=Esta agenda est\u00e1 compartilhada de uma forma que a plataforma n\u00e3o pode alterar com seguran\u00e7a. Gerencie o compartilhamento dela no seu aplicativo de agenda.
caldav.share.serverRefused=Seu servidor de agenda recusou a altera\u00e7\u00e3o.
caldav.share.notApplied=Seu servidor de agenda aceitou a altera\u00e7\u00e3o, mas n\u00e3o a aplicou.
caldav.share.serverUnavailable=N\u00e3o foi poss\u00edvel acessar seu servidor de agenda. Tente novamente mais tarde.
caldav.share.credentials=Seu servidor de agenda recusou sua conta. Verifique sua senha nas configura\u00e7\u00f5es da agenda.
caldav.share.ownerUnknown=Seu servidor de agenda n\u00e3o informou com qual conta voc\u00ea est\u00e1 conectado. Tente novamente ap\u00f3s a pr\u00f3xima sincroniza\u00e7\u00e3o.
caldav.share.foreignAccessNotPreserved=Algu\u00e9m tem mais do que acesso de visualiza\u00e7\u00e3o a esta agenda, definido fora da plataforma. Alterar o compartilhamento aqui poderia afetar esse acesso, ent\u00e3o gerencie-o no seu aplicativo de agenda.
caldav.share.shareeAddressUnknown=O servidor de agenda n\u00e3o forneceu o endere\u00e7o de e-mail deste colega, ent\u00e3o a plataforma n\u00e3o p\u00f4de alterar o acesso dele.
caldav.share.shareeHasOtherAccess=Este colega tem outro acesso a esta agenda, definido fora da plataforma, como ver quando voc\u00ea est\u00e1 livre. Compartilh\u00e1-la aqui substituiria esse acesso, ent\u00e3o altere isso no seu aplicativo de agenda.
caldav.share.notOwnedOnServer=Esta agenda pertence a outra pessoa ou voc\u00ea n\u00e3o tem permiss\u00e3o para gerenciar o compartilhamento dela. Pela plataforma, voc\u00ea s\u00f3 pode compartilhar agendas das quais \u00e9 propriet\u00e1rio.
caldav.admin.servers.drawer.authentication=Autentica\u00e7\u00e3o
caldav.admin.servers.drawer.authProvider=Como os usu\u00e1rios se autenticam
caldav.admin.servers.drawer.disconnection.title=Alterar a autentica\u00e7\u00e3o
caldav.admin.servers.drawer.disconnection.one=Alterar a autentica\u00e7\u00e3o desconecta 1 usu\u00e1rio deste servidor.
caldav.admin.servers.drawer.disconnection.many=Alterar a autentica\u00e7\u00e3o desconecta {0} usu\u00e1rios deste servidor.
caldav.admin.servers.drawer.disconnection.question=Tem certeza de que deseja salvar?
caldav.admin.servers.drawer.disconnection.confirm=Salvar
caldav.admin.servers.drawer.disconnection.cancel=Cancelar
caldav.admin.servers.drawer.disconnection.countFailed=N\u00e3o foi poss\u00edvel contar os usu\u00e1rios deste servidor. Nada foi salvo, tente novamente.
