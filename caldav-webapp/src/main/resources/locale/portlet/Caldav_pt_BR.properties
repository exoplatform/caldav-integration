caldav.error.credentials=O servidor CalDAV recusou este nome de usu\u00e1rio ou senha. Verifique-os e tente novamente.
caldav.error.connection=N\u00e3o \u00e9 poss\u00edvel acessar o servidor CalDAV. Tente novamente mais tarde ou entre em contato com o administrador.
caldav.error.notCaldav=Este endere\u00e7o n\u00e3o respondeu como uma agenda CalDAV. Entre em contato com o administrador para verificar o endere\u00e7o do servidor configurado.
caldav.error.cors=O servidor est\u00e1 acess\u00edvel, mas recusou a solicita\u00e7\u00e3o de origem cruzada do navegador (ele n\u00e3o envia cabe\u00e7alhos CORS). Pe\u00e7a ao administrador para servi-lo a partir do pr\u00f3prio endere\u00e7o da plataforma.
caldav.admin.servers.title=Servidores CalDAV
caldav.admin.servers.subtitle=Adicione os servidores CalDAV aos quais os usu\u00e1rios podem conectar uma conta pessoal. As agendas pessoais s\u00e3o sincronizadas nos dois sentidos com Minhas agendas. As reuni\u00f5es do eXo s\u00e3o copiadas em um \u00fanico sentido, somente para a agenda pessoal.
caldav.admin.servers.add=Adicionar
caldav.admin.servers.noServers=Nenhum servidor CalDAV declarado ainda
caldav.admin.servers.list.name=Nome
caldav.admin.servers.list.activate=Ativar
caldav.admin.servers.list.actions=A\u00e7\u00f5es
caldav.admin.servers.preset.label=Que servidor \u00e9 este?
caldav.admin.servers.preset.bluemind.label=Bluemind
caldav.admin.servers.preset.bluemind.summary=O nome do servidor, o formato do endere\u00e7o e as limita\u00e7\u00f5es conhecidas do BlueMind est\u00e3o preenchidos: sem links de videoconfer\u00eancia, marcadores do Outlook e do Thunderbird, uma descri\u00e7\u00e3o duplicada, uma prioridade padr\u00e3o em cada evento.\n\nAs c\u00f3pias v\u00e3o para a agenda principal, n\u00e3o para uma dedicada, e os links de resposta permanecem ativos. Verifique as primeiras sincroniza\u00e7\u00f5es no seu servidor e revise tudo antes de salvar.
caldav.admin.servers.preset.stalwart.label=Stalwart
caldav.admin.servers.preset.stalwart.summary=Preenchi o nome do servidor e o formato do endere\u00e7o. O Stalwart preserva o que o eXo envia, por isso est\u00e1 configurado para manter tudo em vez de herdar as exce\u00e7\u00f5es de toda a implanta\u00e7\u00e3o.\n\nAs c\u00f3pias v\u00e3o para uma agenda dedicada eXo Meetings. Os links de resposta est\u00e3o desativados, pois o Stalwart aceita respostas de qualquer agenda e os bot\u00f5es Aceitar e Recusar do pr\u00f3prio cliente j\u00e1 funcionam na c\u00f3pia.\n\nRevise antes de salvar.
caldav.admin.servers.preset.other.label=Outro servidor
caldav.admin.servers.preset.other.summary=Nada est\u00e1 preenchido. Um servidor ausente \u00e9 um que ainda n\u00e3o testamos, n\u00e3o um que n\u00e3o \u00e9 compat\u00edvel. Preencha o formul\u00e1rio voc\u00ea mesmo, e o eXo sugerir\u00e1 configura\u00e7\u00f5es assim que os primeiros eventos forem sincronizados.
caldav.admin.servers.preset.changesWhatIsWritten=Uma destas op\u00e7\u00f5es altera o que o eXo escreve nas agendas dos seus usu\u00e1rios, n\u00e3o apenas o que ele compara.
caldav.admin.servers.name=Nome
caldav.admin.servers.name.placeholder=Nome exibido aos usu\u00e1rios
caldav.admin.servers.description=Descri\u00e7\u00e3o
caldav.admin.servers.description.placeholder=Descri\u00e7\u00e3o opcional exibida aos usu\u00e1rios
caldav.admin.servers.url=URL do servidor
caldav.admin.servers.url.placeholder=https://caldav.example.org/dav/cal/{username}/
caldav.admin.servers.url.hint=A URL pode conter um marcador {username}, substitu\u00eddo pela conta com a qual cada usu\u00e1rio se conecta.
caldav.admin.servers.url.reachabilityHint=O eXo se conecta a partir do servidor, n\u00e3o do navegador do usu\u00e1rio, portanto este endere\u00e7o s\u00f3 precisa estar acess\u00edvel a partir do servidor. Endere\u00e7os internos s\u00e3o recusados, a menos que sua implanta\u00e7\u00e3o os permita, pois caso contr\u00e1rio o eXo poderia ser usado para alcan\u00e7ar m\u00e1quinas que nunca deveriam ter sido expostas.
caldav.admin.servers.url.corsHint=Os usu\u00e1rios se conectam pelo navegador, portanto o endere\u00e7o deve ter a mesma origem da plataforma ou enviar cabe\u00e7alhos CORS. Um servidor de terceiros sem esses cabe\u00e7alhos deve ser servido pelo pr\u00f3prio endere\u00e7o da plataforma.
caldav.admin.servers.drawer.add.title=Adicionar um servidor CalDAV
