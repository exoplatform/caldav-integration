caldav.error.cors=El servidor es accesible, pero ha rechazado la solicitud de origen cruzado del navegador (no env\u00eda cabeceras CORS). Pida a su administrador que lo sirva desde la propia direcci\u00f3n de la plataforma.
caldav.admin.servers.title=Servidores CalDAV
caldav.admin.servers.subtitle=A\u00f1ada los servidores CalDAV en los que los usuarios pueden conectar una cuenta personal. Los calendarios personales se sincronizan en ambos sentidos con Mis calendarios. Las reuniones de eXo se copian en un solo sentido, \u00fanicamente en el calendario personal.
caldav.admin.servers.add=A\u00f1adir
caldav.admin.servers.noServers=A\u00fan no se ha declarado ning\u00fan servidor CalDAV
caldav.admin.servers.list.name=Nombre
caldav.admin.servers.list.activate=Activar
caldav.admin.servers.list.actions=Acciones
caldav.admin.servers.preset.label=\u00bfQu\u00e9 servidor es este?
caldav.admin.servers.preset.bluemind.label=Bluemind
caldav.admin.servers.preset.bluemind.summary=Se rellenan el nombre del servidor, el formato de la direcci\u00f3n y las limitaciones conocidas de BlueMind: sin enlaces de videoconferencia, marcadores de Outlook y Thunderbird, una descripci\u00f3n duplicada y una prioridad predeterminada en cada evento.\n\nLas copias van al calendario principal, no a uno dedicado, y los enlaces de respuesta siguen activados. Compruebe las primeras sincronizaciones en su servidor y revise todo antes de guardar.
caldav.admin.servers.preset.stalwart.label=Stalwart
caldav.admin.servers.preset.stalwart.summary=He rellenado el nombre del servidor y el formato de la direcci\u00f3n. Stalwart conserva lo que env\u00eda eXo, as\u00ed que est\u00e1 configurado para conservarlo todo en lugar de heredar las excepciones de toda la implantaci\u00f3n.\n\nLas copias van a un calendario eXo Meetings dedicado. Los enlaces de respuesta est\u00e1n desactivados, ya que Stalwart acepta respuestas desde cualquier calendario y los botones Aceptar y Rechazar del propio cliente ya funcionan en la copia.\n\nRevise antes de guardar.
caldav.admin.servers.preset.other.label=Otro servidor
caldav.admin.servers.preset.other.summary=No se rellena nada. Un servidor que no figura en la lista es uno que no hemos probado, no uno incompatible. Rellene el formulario usted mismo y eXo sugerir\u00e1 una configuraci\u00f3n en cuanto se hayan sincronizado los primeros eventos.
caldav.admin.servers.preset.changesWhatIsWritten=Uno de estos cambia lo que eXo escribe en los calendarios de sus usuarios, no solo lo que compara.
caldav.admin.servers.name=Nombre
caldav.admin.servers.name.placeholder=Nombre que ven los usuarios
caldav.admin.servers.description=Descripci\u00f3n
caldav.admin.servers.description.placeholder=Descripci\u00f3n opcional que ven los usuarios
caldav.admin.servers.url=URL del servidor
caldav.admin.servers.url.placeholder=https://caldav.example.org/dav/cal/{username}/
caldav.admin.servers.url.hint=La URL puede contener un marcador {username}, que se sustituye por la cuenta con la que se conecta cada usuario.
caldav.admin.servers.url.reachabilityHint=eXo se conecta desde el servidor, no desde el navegador del usuario, por lo que esta direcci\u00f3n solo tiene que ser accesible desde el servidor. Las direcciones internas se rechazan salvo que su implantaci\u00f3n las permita, ya que, de lo contrario, eXo podr\u00eda usarse para llegar a m\u00e1quinas que nunca debieron quedar expuestas.
caldav.admin.servers.url.corsHint=Los usuarios se conectan desde su navegador, por lo que la direcci\u00f3n debe compartir el origen de la plataforma o enviar cabeceras CORS: un servidor de terceros que no las env\u00ede debe exponerse a trav\u00e9s de la propia direcci\u00f3n de la plataforma.
