caldav.admin.servers.modal.delete.title=Eliminar el servidor CalDAV
caldav.admin.servers.modal.delete.message=El servidor desaparecer\u00e1 de los conectores de todos los usuarios. Las cuentas que sigan conectadas a \u00e9l impiden la eliminaci\u00f3n.
caldav.admin.servers.modal.delete.confirmDelete=Delete
caldav.admin.servers.modal.delete.cancelDelete=Cancel
agenda.caldavCalendar.calendarDelete.propagates=Este calendario tambi\u00e9n est\u00e1 en {0}. Si lo elimina aqu\u00ed, tambi\u00e9n se eliminar\u00e1 all\u00ed, con todos sus eventos. Eso incluye los eventos que a\u00f1adi\u00f3 desde su tel\u00e9fono u otra aplicaci\u00f3n, y no se puede deshacer.
agenda.caldavCalendar.calendarDelete.keepsRemote=No se tocar\u00e1 el calendario correspondiente en {0}. Permanecer\u00e1 all\u00ed con todos sus eventos y eXo simplemente dejar\u00e1 de mostrarlo.
caldav.hiddenCalendars.title=Calendarios ocultos
caldav.hiddenCalendars.subtitle={0} calendario(s) que elimin\u00f3 aqu\u00ed siguen en su cuenta de calendario
caldav.hiddenCalendars.manage=Gestionar los calendarios ocultos
caldav.hiddenCalendars.drawer.title=Calendarios ocultos
caldav.hiddenCalendars.drawer.description=Elimin\u00f3 estos calendarios de eXo, pero eligi\u00f3 conservarlos en su cuenta. Si vuelve a mostrar uno, reaparecer\u00e1 en la pr\u00f3xima sincronizaci\u00f3n con los eventos que contenga en ese momento.
caldav.hiddenCalendars.showAgain=Volver a mostrar
caldav.hiddenCalendars.showAgainSuccess={0} volver\u00e1 a aparecer en la pr\u00f3xima sincronizaci\u00f3n
caldav.hiddenCalendars.showAgainError=No se ha podido volver a mostrar este calendario
caldav.hiddenCalendars.count={0} calendario(s) oculto(s) en su agenda
caldav.hiddenCalendars.drawer.about=Calendarios que ha ocultado en eXo. Muestre uno para recuperarlo: un calendario eliminado vuelve en la pr\u00f3xima sincronizaci\u00f3n con sus eventos actuales y uno compartido vuelve inmediatamente en Compartidos conmigo.
caldav.hiddenCalendars.deletedHere=Eliminado aqu\u00ed, conservado en su cuenta de calendario
caldav.hiddenCalendars.sharedBy=Compartido por {0}
caldav.hiddenCalendars.sharedWithYou=Compartido con usted
caldav.hiddenCalendars.showAgainSharedSuccess={0} vuelve a estar en Compartidos conmigo
caldav.hiddenCalendars.notAShare=Solo puede ocultar los calendarios compartidos con usted. Para dejar de ver uno de los suyos, elim\u00ednelo y seleccione \u00abConservar en mi cuenta de calendario\u00bb cuando se le pregunte.
caldav.hiddenCalendars.calendarRequired=Elija el calendario que desea ocultar.
caldav.hiddenCalendars.accountUnavailable=No se ha podido contactar con su cuenta de calendario, por lo que este calendario no se ha ocultado. Int\u00e9ntelo de nuevo en un momento.

caldav.admin.sync.title=Sincronizaci\u00f3n de calendarios
caldav.admin.sync.description=Con qu\u00e9 frecuencia y con qu\u00e9 alcance lee eXo las cuentas de calendario que conectan sus usuarios. Los cambios se aplican en la pr\u00f3xima sincronizaci\u00f3n.
caldav.admin.sync.throttleMinutes.label=Espera entre sincronizaciones
caldav.admin.sync.throttleMinutes.help=Al abrir la agenda se lee la cuenta conectada y, despu\u00e9s, se deja tranquila durante este tiempo, por muchas veces que se abra la p\u00e1gina. As\u00ed se evita que un usuario muy activo haga una solicitud en cada carga.
caldav.admin.sync.pastDays.label=Leer eventos pasados
caldav.admin.sync.pastDays.help=Hasta qu\u00e9 punto del pasado lee eXo los eventos. Los eventos pasados rara vez cambian, por lo que leer menos apenas cuesta nada y aligera cada sincronizaci\u00f3n.
caldav.admin.sync.futureDays.label=Leer eventos futuros
caldav.admin.sync.futureDays.help=Hasta qu\u00e9 punto del futuro lee eXo los eventos. Este es el que tiene coste: un intervalo amplio en una cuenta con a\u00f1os de reuniones peri\u00f3dicas supone una descarga grande, que se paga en la primera sincronizaci\u00f3n de cada d\u00eda.
caldav.admin.sync.sweepStaleMinutes.label=Actualizar las cuentas sin abrir desde hace
caldav.admin.sync.sweepStaleMinutes.help=eXo lee una cuenta de calendario cuando su propietario abre su agenda, y este espera mientras se carga. Las cuentas que nadie ha abierto durante m\u00e1s tiempo que este se actualizan en segundo plano, de modo que la pr\u00f3xima agenda se abre con sus eventos ya cargados.\n\nReduzca este valor para tener agendas m\u00e1s actualizadas a cambio de m\u00e1s solicitudes al servidor. Aum\u00e9ntelo si los servidores de calendario son lentos o limitan las solicitudes.
caldav.admin.sync.sweepBatchSize.label=Calendarios por ejecuci\u00f3n en segundo plano
caldav.admin.sync.sweepBatchSize.help=Cada ejecuci\u00f3n actualiza como m\u00e1ximo este n\u00famero de calendarios, empezando por los m\u00e1s antiguos. Aum\u00e9ntelo para ponerse al d\u00eda m\u00e1s r\u00e1pido en una instancia con mucha actividad o red\u00fazcalo para repartir la carga.
caldav.admin.sync.unit.minutes=minutos
caldav.admin.sync.unit.days=d\u00edas
caldav.admin.sync.unit.calendars=calendarios
caldav.admin.sync.save=Guardar
caldav.admin.sync.saved=Configuraci\u00f3n de sincronizaci\u00f3n guardada
