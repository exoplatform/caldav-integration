caldav.tuning.mandatory=No se ha enviado ninguna configuraci\u00f3n
caldav.tuning.throttleOutOfRange=La espera entre sincronizaciones debe estar entre 0 minutos y un d\u00eda.
caldav.tuning.pastDaysOutOfRange=La lectura del pasado debe estar entre 0 y 365 d\u00edas.
caldav.tuning.futureDaysOutOfRange=La lectura del futuro debe estar entre 1 y 365 d\u00edas.
caldav.tuning.sweepStaleOutOfRange=El retraso de la actualizaci\u00f3n en segundo plano debe estar entre 1 minuto y una semana.
caldav.tuning.sweepBatchOutOfRange=La ejecuci\u00f3n en segundo plano debe procesar entre 1 y 500 calendarios.
caldav.admin.sync.summary=Se leen {1} d\u00edas hacia atr\u00e1s y {2} d\u00edas hacia delante. Una agenda que se acaba de abrir espera {0} minutos antes de volver a leer la cuenta; una cuenta que nadie abre se actualiza en segundo plano al cabo de {3} minutos.
caldav.admin.sync.cancel=Cancelar
caldav.admin.sync.reports.title=Copias de reuniones, por usuario
caldav.admin.sync.reports.subtitle=C\u00f3mo gestion\u00f3 cada servidor conectado las copias de reuniones durante la \u00faltima sincronizaci\u00f3n. Esta informaci\u00f3n solo se guarda en memoria, por lo que la tabla est\u00e1 vac\u00eda despu\u00e9s de un reinicio hasta que las cuentas vuelvan a sincronizarse.
caldav.admin.sync.reports.none=Ninguna cuenta conectada ha comprobado sus copias de reuniones desde el \u00faltimo reinicio. Esta tabla se ir\u00e1 completando a medida que se sincronicen.
