caldav.admin.servers.copies.title=Copias de reuniones
caldav.admin.servers.answerLinks.label=A\u00f1adir enlaces de respuesta a la copia
caldav.admin.servers.answerLinks.hint=A\u00f1ade enlaces Aceptar, Rechazar y Provisional a la descripci\u00f3n de cada reuni\u00f3n copiada. Desact\u00edvelo solo si los clientes de calendario ya muestran sus propios botones de respuesta; de lo contrario, los usuarios no podr\u00e1n responder en absoluto.
caldav.admin.servers.mirrorTarget.label=D\u00f3nde se escriben las copias de reuniones
caldav.admin.servers.mirrorTarget.appliesTo=Se aplica a los usuarios que mantienen activadas las copias de reuniones en su propia configuraci\u00f3n de agenda.
caldav.admin.servers.mirrorTarget.dedicated.label=Un calendario eXo Meetings dedicado
caldav.admin.servers.mirrorTarget.dedicated.consequence=Mantiene las reuniones de eXo separadas de los eventos propios del usuario. En algunos servidores, un calendario separado no se tiene en cuenta para la disponibilidad, por lo que los compa\u00f1eros ven las horas de las reuniones de eXo como libres y no aparecen botones de respuesta en las copias.
caldav.admin.servers.mirrorTarget.main.label=El calendario principal de la cuenta
caldav.admin.servers.mirrorTarget.main.consequence=Las copias cuentan para la disponibilidad del usuario y los botones de respuesta propios del servidor aparecen donde este los ofrece. Elija esta opci\u00f3n solo cuando las copias se sincronicen correctamente en este servidor.
caldav.admin.servers.mirrorTarget.moves=Al cambiar esta opci\u00f3n, las copias existentes de cada usuario se trasladan en sus pr\u00f3ximas sincronizaciones. El antiguo calendario eXo Meetings se conserva, vac\u00edo.
caldav.admin.servers.writeChannel.label=C\u00f3mo se escriben las copias de reuniones
caldav.admin.servers.writeChannel.hint=Se aplica a todas las copias que eXo escribe o elimina en este servidor, para todos los usuarios.
caldav.admin.servers.writeChannel.caldav.label=CalDAV est\u00e1ndar
caldav.admin.servers.writeChannel.caldav.consequence=Funciona con todos los servidores CalDAV. En BlueMind, una copia escrita de esta forma hace que BlueMind env\u00ede sus propias invitaciones para la reuni\u00f3n: los invitados del mismo servidor la reciben dos veces y una respuesta que den en la copia propia de BlueMind nunca llega a eXo.
caldav.admin.servers.writeChannel.bluemindImport.label=Importaci\u00f3n de calendario de BlueMind
caldav.admin.servers.writeChannel.bluemindImport.consequence=Escribe cada copia mediante la API de importaci\u00f3n propia de BlueMind, que no env\u00eda ninguna invitaci\u00f3n propia, de modo que eXo sigue siendo el \u00fanico remitente. Solo BlueMind. Vuelva a CalDAV est\u00e1ndar para deshacerlo.
caldav.admin.servers.writeChannel.unavailable.label=Una v\u00eda que esta plataforma ya no ofrece ({0})
caldav.admin.servers.writeChannel.unavailable.consequence=El complemento que escribe las copias de esta forma no est\u00e1 instalado, por lo que se rechazan todas las copias para este servidor hasta que se vuelva a instalar o se cambie a CalDAV est\u00e1ndar.
