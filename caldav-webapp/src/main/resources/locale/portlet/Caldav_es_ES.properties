caldav.admin.managed.off.confirm.disconnect.one=Se desconectar\u00e1 1 cuenta vinculada por el modo gestionado.
caldav.admin.managed.off.confirm.disconnect.many=Se desconectar\u00e1n {0} cuentas vinculadas por el modo gestionado.
