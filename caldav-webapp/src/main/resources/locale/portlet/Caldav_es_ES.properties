caldav.admin.managed.clearFailed=No se ha podido desactivar el modo gestionado
caldav.managed.serverRequired=Elija el servidor con el que todos deben sincronizarse.
caldav.managed.serverNotEligible=Elija un servidor configurado y activo. No se puede acceder a un servidor desactivado, por lo que nadie podr\u00eda conectarse en modo gestionado.
caldav.managed.providerNotEligible=En modo gestionado, este servidor no puede usar un proveedor que necesite las credenciales de cada usuario. Desactive el modo gestionado o elija un proveedor con cuenta de servicio.
caldav.admin.servers.list.managedLocked=No puede desactivar ni eliminar este servidor mientras el modo gestionado lo utilice. Desactive primero el modo gestionado, en la fila situada encima de la lista de servidores.
caldav.managed.serverInUse=No puede desactivar este servidor mientras el modo gestionado est\u00e9 activado, ya que todos se sincronizan con \u00e9l. Desactive primero el modo gestionado, en la fila situada encima de la lista de servidores.
agenda.caldavCalendar.disconnect.warning=Los calendarios que eXo muestra de {0} se quitar\u00e1n de su agenda, junto con las copias de sus eventos. No se elimina nada en {0} y los calendarios que cre\u00f3 en eXo se mantienen. Si vuelve a conectar la cuenta, esos calendarios reaparecer\u00e1n.
caldav.pendingCopies.title=Copias de reuniones a\u00fan en camino
caldav.pendingCopies.subtitle={0} de sus reuniones han cambiado en eXo y el cambio a\u00fan no ha llegado a su calendario. eXo sigue intent\u00e1ndolo; la pr\u00f3xima sincronizaci\u00f3n en segundo plano suele resolverlas.
