caldav.deviceSetup.serverAddress=Direcci\u00f3n del servidor
caldav.deviceSetup.username=Nombre de usuario
caldav.deviceSetup.passwordNote=Use la contrase\u00f1a de esta cuenta de calendario, la misma con la que la conect\u00f3 a eXo. eXo no tiene una contrase\u00f1a propia aparte.
caldav.deviceSetup.copy=Copiar {0}
caldav.deviceSetup.copied={0} copiado
caldav.deviceSetup.copyFallback=Aqu\u00ed no se puede copiar; el valor est\u00e1 seleccionado, pulse Ctrl+C (Cmd+C en Mac) para copiarlo
caldav.admin.servers.quirks.title=Qu\u00e9 hace este servidor
caldav.admin.servers.quirks.subtitle=Detectado por eXo al comprobar las copias de reuniones enviadas aqu\u00ed. Marque uno para dejar de tratarlo como un cambio.
caldav.admin.servers.quirks.none=Nada que excusar: eXo no ha encontrado en este servidor nada que trate como un cambio. As\u00ed es un servidor que almacena las copias fielmente, y no requiere atenci\u00f3n.
caldav.admin.servers.quirks.seen.once=Visto una vez
caldav.admin.servers.quirks.seen.many=Visto {0} veces
caldav.admin.servers.quirks.dropsConference.label=Este servidor no conserva los enlaces de videoconferencia
caldav.admin.servers.quirks.dropsConference.cost=eXo deja de tratar la falta del enlace como un cambio y ya no detectar\u00e1 si alguien elimina uno.
caldav.admin.servers.quirks.addsCompatibilityMarkers.label=Este servidor a\u00f1ade marcadores de compatibilidad con Outlook y Thunderbird
caldav.admin.servers.quirks.addsCompatibilityMarkers.cost=Otras aplicaciones de calendario a\u00f1aden estos campos. eXo los ignora y los deja como est\u00e1n.
caldav.admin.servers.quirks.addsFormattedDescription.label=Este servidor a\u00f1ade una copia con formato de la descripci\u00f3n
caldav.admin.servers.quirks.addsFormattedDescription.cost=Una copia en texto enriquecido de la descripci\u00f3n. eXo la ignora y compara en su lugar la versi\u00f3n en texto sin formato.
caldav.admin.servers.quirks.stampsDefaultPriority.label=Este servidor asigna una prioridad predeterminada a cada reuni\u00f3n que almacena
caldav.admin.servers.quirks.stampsDefaultPriority.cost=Una prioridad que nadie eligi\u00f3, a\u00f1adida a cada copia. eXo no escribe ninguna prioridad, as\u00ed que deja de tratarla como un cambio, y ya no detectar\u00e1 si alguien define una prioridad real en este servidor.
caldav.admin.servers.quirks.rewritesDescription.label=Este servidor reescribe el texto de la invitaci\u00f3n
caldav.admin.servers.quirks.rewritesDescription.cost=eXo deja de comprobar la descripci\u00f3n de las copias en este servidor, incluidos los enlaces de respuesta que contiene. Un enlace reescrito pasar\u00e1 desapercibido.
caldav.admin.servers.quirks.generic.added.label=Este servidor a\u00f1ade {0}, que eXo no escribe
caldav.admin.servers.quirks.generic.added.cost=eXo deja de tratarlo como un cambio en este servidor.
caldav.admin.servers.quirks.generic.dropped.label=Este servidor no conserva {0}
caldav.admin.servers.quirks.generic.dropped.cost=eXo deja de tratar su ausencia como un cambio y ya no detectar\u00e1 si alguien lo elimina.
caldav.admin.servers.quirks.generic.rewritten.label=Este servidor reescribe {0}
caldav.admin.servers.quirks.generic.rewritten.cost=eXo deja de comprobar ese valor en las copias almacenadas por este servidor.
caldav.admin.servers.quirks.changesWhatIsWritten=Cambia lo que eXo escribe en los calendarios de este servidor
caldav.admin.servers.foreignWriters.title=Otras implantaciones de eXo que escriben aqu\u00ed
caldav.admin.servers.foreignWriters.subtitle=Otra instancia de eXo ha escrito copias de reuniones en las cuentas de este servidor. Ambas reparan las mismas copias y ninguna puede distinguir lo que escribe la otra de un cambio hecho por alguien.
caldav.admin.servers.foreignWriters.none=No se ha visto ninguna otra instancia de eXo escribiendo en las cuentas de este servidor. As\u00ed es un servidor en el que solo escribe esta implantaci\u00f3n, y no requiere atenci\u00f3n.
caldav.admin.servers.foreignWriters.cost=eXo comprueba las copias de reuniones que ha enviado aqu\u00ed y repara lo que ha cambiado, suponiendo que las escribi\u00f3 todas. Las copias que escribi\u00f3 esta otra implantaci\u00f3n se cuentan y comparan como si fueran de eXo.
caldav.admin.servers.foreignWriters.lastSeen=Visto por \u00faltima vez el {0}
caldav.admin.servers.foreignWriters.resolution=Conecte una de las dos implantaciones a otra cuenta CalDAV. Mientras tanto, aqu\u00ed no se importa, elimina ni repara nada de forma distinta, y las copias ya escritas permanecen hasta que alguien las elimine.
caldav.admin.servers.quirks.omitsSoloOrganizer.label=Este servidor quita el organizador de los eventos sin otros participantes
caldav.admin.servers.quirks.omitsSoloOrganizer.cost=No cambia nada: en todos los servidores, eXo ya omite el organizador en los eventos sin otros participantes. Las copias de los eventos con participantes siguen indicando el suyo.
caldav.error.mainCalendarUnknown=eXo no puede copiar sus reuniones en esta cuenta: no indica cu\u00e1l de sus calendarios es el predeterminado, as\u00ed que no hay d\u00f3nde ponerlas. P\u00f3ngase en contacto con su administrador.
caldav.error.foreignCopy=Esta reuni\u00f3n ya est\u00e1 en su cuenta de calendario, a\u00f1adida por otra persona. eXo deja esa copia como est\u00e1.
caldav.error.forbidden=Este calendario se comparte con usted en modo de solo lectura, por lo que su cambio no se puede guardar en \u00e9l.

caldav.server.authProviderUnknown=Ese m\u00e9todo de autenticaci\u00f3n no est\u00e1 disponible en este servidor. Elija uno de la lista.
caldav.server.writeChannelNotSupported=La importaci\u00f3n de calendario de BlueMind solo funciona con un servidor BlueMind, que eXo reconoce por \u00abBlueMind\u00bb en el nombre del servidor. Elija CalDAV est\u00e1ndar o mantenga BlueMind en el nombre.
caldav.server.url.malformed=No es una direcci\u00f3n web utilizable. Debe empezar por https:// (o http:// si su administrador lo permite) e indicar un servidor.
caldav.server.url.schemeNotAllowed=Solo se aceptan direcciones https. Pida a su administrador que permita http si este servidor no tiene certificado.
caldav.server.url.credentials=Quite el nombre de usuario y la contrase\u00f1a de la direcci\u00f3n. eXo usa las credenciales con las que se conecta cada usuario, nunca las escritas en la direcci\u00f3n.
caldav.server.url.fragment=Quite el # y todo lo que va detr\u00e1s. Una direcci\u00f3n de servidor no lleva fragmento.
caldav.server.url.portNotAllowed=Ese puerto no est\u00e1 permitido. Use el puerto est\u00e1ndar o pida a su administrador que permita este.
caldav.server.url.usernameInAuthority=El marcador {username} solo puede aparecer despu\u00e9s del nombre del servidor, en la ruta. Col\u00f3quelo en la ruta, no en la direcci\u00f3n del propio servidor.
caldav.server.url.privateAddress=Esa direcci\u00f3n apunta al interior de su propia red, por lo que no se acepta. eXo se conecta desde el servidor, de modo que una direcci\u00f3n interna podr\u00eda usarse para llegar a m\u00e1quinas que nunca debieron quedar expuestas. Si es correcta, pida a su administrador que la permita.
caldav.server.url.unresolvable=Ese nombre de servidor no existe. Compruebe la ortograf\u00eda.
caldav.share.calendarNotFound=Este calendario ya no existe.
caldav.share.notOwner=Solo el propietario de un calendario puede compartirlo.
caldav.share.notConnected=Conecte su cuenta de calendario antes de compartir un calendario.
caldav.share.calendarNotOnServer=Este calendario a\u00fan no est\u00e1 en su servidor de calendario. Int\u00e9ntelo de nuevo despu\u00e9s de la pr\u00f3xima sincronizaci\u00f3n.
caldav.share.notSupported=Su servidor de calendario no permite que eXo comparta calendarios.
caldav.share.shareeRequired=Elija un compa\u00f1ero con quien compartirlo.
caldav.share.shareeUnknown=Este compa\u00f1ero no es un usuario activo.
caldav.share.shareeIsOwner=Ya es el propietario de este calendario.
caldav.share.shareeNotConnected=Este compa\u00f1ero no est\u00e1 conectado al mismo servidor de calendario.
caldav.share.samePrincipal=Este compa\u00f1ero usa la misma cuenta de calendario que usted, por lo que ya ve este calendario.
caldav.share.notReadOnly=Este compa\u00f1ero tiene m\u00e1s que acceso de lectura, definido fuera de la plataforma. C\u00e1mbielo en su aplicaci\u00f3n de calendario.
caldav.share.aclUnreadable=Su servidor de calendario no permite que la plataforma vea con qui\u00e9n se comparte este calendario.
caldav.share.aclNotUnderstood=Este calendario se comparte de una forma que la plataforma no puede cambiar de forma segura. Gestione su uso compartido en su aplicaci\u00f3n de calendario.
caldav.share.serverRefused=Su servidor de calendario rechaz\u00f3 el cambio.
caldav.share.notApplied=Su servidor de calendario acept\u00f3 el cambio, pero no lo aplic\u00f3.
caldav.share.serverUnavailable=No se ha podido contactar con su servidor de calendario. Int\u00e9ntelo de nuevo m\u00e1s tarde.
caldav.share.credentials=Su servidor de calendario rechaz\u00f3 su cuenta. Compruebe su contrase\u00f1a en la configuraci\u00f3n de la agenda.
caldav.share.ownerUnknown=Su servidor de calendario no indic\u00f3 con qu\u00e9 cuenta est\u00e1 conectado. Int\u00e9ntelo de nuevo despu\u00e9s de la pr\u00f3xima sincronizaci\u00f3n.
caldav.share.foreignAccessNotPreserved=Alguien tiene m\u00e1s que acceso de lectura a este calendario, definido fuera de la plataforma. Cambiar el uso compartido aqu\u00ed podr\u00eda afectar a ese acceso, as\u00ed que gesti\u00f3nelo en su aplicaci\u00f3n de calendario.
caldav.share.shareeAddressUnknown=El servidor de calendario no proporcion\u00f3 la direcci\u00f3n de correo de este compa\u00f1ero, por lo que la plataforma no ha podido cambiar su acceso.
caldav.share.shareeHasOtherAccess=Este compa\u00f1ero tiene otro acceso a este calendario, definido fuera de la plataforma, como ver cu\u00e1ndo est\u00e1 usted disponible. Compartirlo aqu\u00ed lo sustituir\u00eda, as\u00ed que c\u00e1mbielo en su aplicaci\u00f3n de calendario.
caldav.share.notOwnedOnServer=Este calendario pertenece a otra persona o no tiene permiso para gestionar su uso compartido. Desde la plataforma solo puede compartir los calendarios de los que es propietario.
