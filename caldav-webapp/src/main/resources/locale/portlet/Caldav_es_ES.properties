caldav.calendarStates.manage=Ver qu\u00e9 ocurre
caldav.calendarStates.drawer.title=Calendarios que requieren atenci\u00f3n
caldav.calendarStates.drawer.description=Estos calendarios no se est\u00e1n sincronizando como los dem\u00e1s. El resto de sus calendarios no se ve afectado.
caldav.calendarStates.explain.REMOTE_CREATE_REFUSED=Su cuenta de calendario no permite que eXo cree calendarios en ella, por lo que este no se copia all\u00ed. Los calendarios que ya existen en la cuenta siguen apareciendo en eXo.
caldav.calendarStates.explain.PAUSED=La sincronizaci\u00f3n de este calendario fall\u00f3 varias veces, as\u00ed que eXo dej\u00f3 de intentarlo. Sincronice ahora para volver a empezar; si sigue fallando, vuelva a conectar la cuenta.
caldav.calendarStates.explain.EXO_ORPHANED=Elimin\u00f3 este calendario en eXo y no se ha podido eliminar en su cuenta de calendario. Sigue all\u00ed.
caldav.calendarStates.explain.REMOTE_GONE=Este calendario ya no est\u00e1 en su cuenta de calendario. No llegar\u00e1 nada nuevo a \u00e9l y lo que eXo ya tiene se mantiene intacto.
caldav.calendarStates.explain.RETIRED_SUBSCRIPTION=Esta es una copia de un calendario compartido con usted o de un recurso al que se suscribi\u00f3. Ya no se sincroniza, por lo que los cambios que haga aqu\u00ed no llegan a ninguna parte. Elim\u00ednela y el original aparecer\u00e1 en Compartidos conmigo, en modo de solo lectura.
caldav.calendarStates.explain.unknown=Este calendario no se est\u00e1 sincronizando con normalidad.
