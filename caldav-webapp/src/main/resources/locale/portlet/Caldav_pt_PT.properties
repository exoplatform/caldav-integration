caldav.admin.servers.drawer.cancel=Cancelar
caldav.admin.servers.drawer.updateTheIcon=Atualizar o \u00edcone
caldav.admin.servers.drawer.button.chooseIcon=Escolher
caldav.admin.servers.drawer.upload=Carregar
caldav.admin.servers.drawer.resetDefault=Voltar ao \u00edcone predefinido
caldav.admin.servers.drawer.tooBigFile=A imagem deve ter menos de 100 kB
caldav.admin.servers.drawer.uploadingError=N\u00e3o foi poss\u00edvel carregar a imagem. Tente novamente.
caldav.admin.servers.drawer.caldavSettings=Defini\u00e7\u00f5es CalDAV
caldav.admin.servers.copies.title=C\u00f3pias das reuni\u00f5es
caldav.admin.servers.answerLinks.label=Adicionar liga\u00e7\u00f5es de resposta \u00e0 c\u00f3pia
caldav.admin.servers.answerLinks.hint=Adiciona liga\u00e7\u00f5es Aceitar, Recusar e Provis\u00f3rio \u00e0 descri\u00e7\u00e3o de cada reuni\u00e3o copiada. Desative esta op\u00e7\u00e3o apenas se os clientes de calend\u00e1rio j\u00e1 apresentarem os seus pr\u00f3prios bot\u00f5es de resposta; caso contr\u00e1rio, os utilizadores n\u00e3o poder\u00e3o responder de todo.
caldav.admin.servers.mirrorTarget.label=Onde s\u00e3o escritas as c\u00f3pias das reuni\u00f5es
caldav.admin.servers.mirrorTarget.appliesTo=Aplica-se aos utilizadores que mant\u00eam as c\u00f3pias das reuni\u00f5es ativadas nas defini\u00e7\u00f5es da sua agenda.
caldav.admin.servers.mirrorTarget.dedicated.label=Um calend\u00e1rio eXo Meetings dedicado
caldav.admin.servers.mirrorTarget.dedicated.consequence=Mant\u00e9m as reuni\u00f5es do eXo separadas dos eventos do pr\u00f3prio utilizador. Em alguns servidores, um calend\u00e1rio separado n\u00e3o \u00e9 tido em conta na disponibilidade, pelo que os colegas veem os hor\u00e1rios das reuni\u00f5es do eXo como livres e n\u00e3o aparecem bot\u00f5es de resposta nas c\u00f3pias.
caldav.admin.servers.mirrorTarget.main.label=O calend\u00e1rio principal da conta
caldav.admin.servers.mirrorTarget.main.consequence=As c\u00f3pias contam para a disponibilidade do utilizador e os bot\u00f5es de resposta do pr\u00f3prio servidor aparecem onde este os disponibiliza. Escolha esta op\u00e7\u00e3o apenas quando as c\u00f3pias sincronizarem corretamente neste servidor.
caldav.admin.servers.mirrorTarget.moves=Alterar esta op\u00e7\u00e3o move as c\u00f3pias existentes de cada utilizador ao longo das sincroniza\u00e7\u00f5es seguintes. O antigo calend\u00e1rio eXo Meetings \u00e9 mantido, vazio.
caldav.admin.servers.writeChannel.label=Como s\u00e3o escritas as c\u00f3pias das reuni\u00f5es
caldav.admin.servers.writeChannel.hint=Aplica-se a todas as c\u00f3pias que o eXo escreve ou remove neste servidor, para todos os utilizadores.
caldav.admin.servers.writeChannel.caldav.label=CalDAV padr\u00e3o
caldav.admin.servers.writeChannel.caldav.consequence=Funciona com qualquer servidor CalDAV. No BlueMind, uma c\u00f3pia escrita desta forma faz com que o BlueMind envie os seus pr\u00f3prios convites para a reuni\u00e3o: os convidados no mesmo servidor recebem-nos duas vezes, e uma resposta que deem na c\u00f3pia do pr\u00f3prio BlueMind nunca chega ao eXo.
caldav.admin.servers.writeChannel.bluemindImport.label=Importa\u00e7\u00e3o de calend\u00e1rio BlueMind
caldav.admin.servers.writeChannel.bluemindImport.consequence=Escreve cada c\u00f3pia atrav\u00e9s da API de importa\u00e7\u00e3o do pr\u00f3prio BlueMind, que n\u00e3o envia qualquer convite, pelo que o eXo continua a ser o \u00fanico remetente. Apenas BlueMind. Volte ao CalDAV padr\u00e3o para anular.
caldav.admin.servers.writeChannel.unavailable.label=Uma via que esta plataforma j\u00e1 n\u00e3o disponibiliza ({0})
caldav.admin.servers.writeChannel.unavailable.consequence=O suplemento que escreve as c\u00f3pias desta forma n\u00e3o est\u00e1 instalado, pelo que todas as c\u00f3pias para este servidor s\u00e3o recusadas at\u00e9 que seja novamente instalado ou at\u00e9 mudar para CalDAV padr\u00e3o.
caldav.admin.servers.drawer.add.success=O servidor CalDAV foi adicionado
caldav.admin.servers.drawer.add.error=N\u00e3o foi poss\u00edvel adicionar o servidor CalDAV. Verifique os valores e tente novamente.
caldav.admin.servers.drawer.edit.success=O servidor CalDAV foi atualizado
caldav.admin.servers.drawer.edit.error=N\u00e3o foi poss\u00edvel atualizar o servidor CalDAV. Verifique os valores e tente novamente.
caldav.admin.servers.activate.success=O servidor CalDAV foi ativado
caldav.admin.servers.deactivate.success=O servidor CalDAV foi desativado
caldav.admin.servers.activate.error=N\u00e3o foi poss\u00edvel ativar o servidor CalDAV
caldav.admin.servers.deactivate.error=N\u00e3o foi poss\u00edvel desativar o servidor CalDAV
caldav.admin.servers.delete.success=O servidor CalDAV foi eliminado
caldav.admin.servers.delete.error=N\u00e3o foi poss\u00edvel eliminar o servidor CalDAV
