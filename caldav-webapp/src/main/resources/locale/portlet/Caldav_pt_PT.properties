caldav.admin.managed.clearFailed=N\u00e3o foi poss\u00edvel desativar a liga\u00e7\u00e3o unificada
caldav.managed.serverRequired=Escolha o servidor com que todos devem sincronizar.
caldav.managed.serverNotEligible=Escolha um servidor configurado e ativo. Um servidor desativado n\u00e3o pode ser contactado, pelo que ningu\u00e9m conseguiria ligar-se atrav\u00e9s da liga\u00e7\u00e3o unificada.
caldav.managed.providerNotEligible=Com a liga\u00e7\u00e3o unificada, este servidor n\u00e3o pode utilizar um fornecedor que necessite das credenciais de cada utilizador. Desative a liga\u00e7\u00e3o unificada ou escolha um fornecedor com uma conta de servi\u00e7o.
caldav.admin.servers.list.managedLocked=N\u00e3o \u00e9 poss\u00edvel desativar nem eliminar este servidor enquanto a liga\u00e7\u00e3o unificada o utilizar. Desative primeiro a liga\u00e7\u00e3o unificada, na linha acima da lista de servidores.
caldav.managed.serverInUse=N\u00e3o \u00e9 poss\u00edvel desativar este servidor enquanto a liga\u00e7\u00e3o unificada estiver ativa, pois todos sincronizam com ele. Desative primeiro a liga\u00e7\u00e3o unificada, na linha acima da lista de servidores.
agenda.caldavCalendar.disconnect.warning=Os calend\u00e1rios que o eXo apresenta a partir de {0} ser\u00e3o removidos da sua agenda, juntamente com as c\u00f3pias dos respetivos eventos. Nada \u00e9 eliminado em {0} e os calend\u00e1rios que criou no eXo mant\u00eam-se. Volte a ligar a conta e esses calend\u00e1rios regressam.
caldav.pendingCopies.title=C\u00f3pias de reuni\u00f5es ainda a caminho
caldav.pendingCopies.subtitle={0} das suas reuni\u00f5es foram alteradas no eXo e a altera\u00e7\u00e3o ainda n\u00e3o chegou ao seu calend\u00e1rio. O eXo continua a tentar; normalmente, a pr\u00f3xima sincroniza\u00e7\u00e3o em segundo plano resolve a situa\u00e7\u00e3o.
caldav.calendarStates.title=Calend\u00e1rios que requerem aten\u00e7\u00e3o
caldav.calendarStates.subtitle={0} dos seus calend\u00e1rios n\u00e3o est\u00e3o a sincronizar normalmente
caldav.calendarStates.manage=Ver o problema
caldav.calendarStates.drawer.title=Calend\u00e1rios que requerem aten\u00e7\u00e3o
caldav.calendarStates.drawer.description=Estes calend\u00e1rios n\u00e3o est\u00e3o a sincronizar como os restantes. Os outros calend\u00e1rios n\u00e3o s\u00e3o afetados.
caldav.calendarStates.explain.REMOTE_CREATE_REFUSED=A sua conta de calend\u00e1rio n\u00e3o permite que o eXo crie calend\u00e1rios nela, pelo que este n\u00e3o \u00e9 copiado para l\u00e1. Os calend\u00e1rios que j\u00e1 existem na conta continuam a aparecer no eXo.
caldav.calendarStates.explain.PAUSED=A sincroniza\u00e7\u00e3o deste calend\u00e1rio falhou repetidamente, pelo que o eXo deixou de tentar. Sincronize agora para recome\u00e7ar; se continuar a falhar, volte a ligar a conta.
caldav.calendarStates.explain.EXO_ORPHANED=Eliminou este calend\u00e1rio no eXo e n\u00e3o foi poss\u00edvel elimin\u00e1-lo na sua conta de calend\u00e1rio. Continua l\u00e1.
caldav.calendarStates.explain.REMOTE_GONE=Este calend\u00e1rio j\u00e1 n\u00e3o est\u00e1 na sua conta de calend\u00e1rio. Nada de novo chegar\u00e1 a ele e o que o eXo j\u00e1 cont\u00e9m permanece intacto.
caldav.calendarStates.explain.RETIRED_SUBSCRIPTION=Esta \u00e9 uma c\u00f3pia de um calend\u00e1rio partilhado consigo ou de um recurso que subscreveu. J\u00e1 n\u00e3o sincroniza, pelo que as altera\u00e7\u00f5es aqui n\u00e3o v\u00e3o para lado nenhum. Elimine-a e o original aparece em Partilhados comigo, s\u00f3 de leitura.
caldav.calendarStates.explain.unknown=Este calend\u00e1rio n\u00e3o est\u00e1 a sincronizar normalmente.
caldav.calendarStates.lastSynchronised={0}
caldav.calendarStates.syncNow=Sincronizar agora
caldav.calendarStates.synchronised=Os seus calend\u00e1rios foram sincronizados. As c\u00f3pias das suas reuni\u00f5es est\u00e3o a ser verificadas em segundo plano.
caldav.calendarStates.syncFailed=N\u00e3o foi poss\u00edvel sincronizar a sua conta de calend\u00e1rio
caldav.deviceSetup.title=Os seus calend\u00e1rios no telem\u00f3vel
caldav.deviceSetup.subtitle=Adicione os seus calend\u00e1rios eXo \u00e0 aplica\u00e7\u00e3o de calend\u00e1rio do telem\u00f3vel ou do computador
caldav.deviceSetup.action=Configurar
caldav.deviceSetup.drawer.title=Os seus calend\u00e1rios no telem\u00f3vel
caldav.deviceSetup.drawer.description=Qualquer aplica\u00e7\u00e3o de calend\u00e1rio CalDAV pode apresentar os seus calend\u00e1rios ligados. Utilize estes dados ao adicionar a conta:
caldav.deviceSetup.serverAddress=Endere\u00e7o do servidor
caldav.deviceSetup.username=Nome de utilizador
caldav.deviceSetup.passwordNote=Utilize a palavra-passe desta conta de calend\u00e1rio, a mesma com que a ligou ao eXo. O eXo n\u00e3o tem uma palavra-passe pr\u00f3pria separada.
caldav.deviceSetup.copy=Copiar: {0}
caldav.deviceSetup.copied=Copiado: {0}
caldav.deviceSetup.copyFallback=A c\u00f3pia n\u00e3o est\u00e1 dispon\u00edvel aqui; o valor est\u00e1 selecionado, prima Ctrl+C (Cmd+C no Mac) para o copiar
caldav.admin.servers.quirks.title=O que este servidor faz
caldav.admin.servers.quirks.subtitle=Observado pelo eXo ao verificar as c\u00f3pias das reuni\u00f5es enviadas para aqui. Assinale um para deixar de o tratar como uma altera\u00e7\u00e3o.
caldav.admin.servers.quirks.none=Nada a desculpar: o eXo n\u00e3o encontrou nada neste servidor que trate como uma altera\u00e7\u00e3o. \u00c9 assim que se apresenta um servidor que guarda as c\u00f3pias fielmente, e n\u00e3o requer aten\u00e7\u00e3o.
caldav.admin.servers.quirks.seen.once=Observado uma vez
caldav.admin.servers.quirks.seen.many=Observado {0} vezes
caldav.admin.servers.quirks.dropsConference.label=Este servidor n\u00e3o mant\u00e9m as liga\u00e7\u00f5es de videoconfer\u00eancia
caldav.admin.servers.quirks.dropsConference.cost=O eXo deixa de tratar a liga\u00e7\u00e3o em falta como uma altera\u00e7\u00e3o e deixar\u00e1 de detetar se algu\u00e9m remover uma.
caldav.admin.servers.quirks.addsCompatibilityMarkers.label=Este servidor adiciona marcadores de compatibilidade com Outlook e Thunderbird
caldav.admin.servers.quirks.addsCompatibilityMarkers.cost=Outras aplica\u00e7\u00f5es de calend\u00e1rio adicionam estes campos. O eXo ignora-os e deixa-os como est\u00e3o.
caldav.admin.servers.quirks.addsFormattedDescription.label=Este servidor adiciona uma c\u00f3pia formatada da descri\u00e7\u00e3o
caldav.admin.servers.quirks.addsFormattedDescription.cost=Uma c\u00f3pia em texto formatado da descri\u00e7\u00e3o. O eXo ignora-a e compara antes a vers\u00e3o em texto simples.
caldav.admin.servers.quirks.stampsDefaultPriority.label=Este servidor atribui uma prioridade predefinida a cada reuni\u00e3o que guarda
caldav.admin.servers.quirks.stampsDefaultPriority.cost=Uma prioridade que ningu\u00e9m escolheu, adicionada a cada c\u00f3pia. O eXo n\u00e3o escreve qualquer prioridade, pelo que deixa de tratar uma prioridade como uma altera\u00e7\u00e3o e deixar\u00e1 de detetar se algu\u00e9m definir uma prioridade real neste servidor.
caldav.admin.servers.quirks.rewritesDescription.label=Este servidor reescreve o texto do convite
caldav.admin.servers.quirks.rewritesDescription.cost=O eXo deixa de verificar a descri\u00e7\u00e3o das c\u00f3pias neste servidor, incluindo as liga\u00e7\u00f5es de resposta que cont\u00e9m. Uma liga\u00e7\u00e3o reescrita n\u00e3o ser\u00e1 detetada.
caldav.admin.servers.quirks.generic.added.label=Este servidor adiciona {0}, que o eXo n\u00e3o escreve
caldav.admin.servers.quirks.generic.added.cost=O eXo deixa de o tratar como uma altera\u00e7\u00e3o neste servidor.
caldav.admin.servers.quirks.generic.dropped.label=Este servidor n\u00e3o mant\u00e9m {0}
caldav.admin.servers.quirks.generic.dropped.cost=O eXo deixa de tratar a sua aus\u00eancia como uma altera\u00e7\u00e3o e deixar\u00e1 de detetar se algu\u00e9m o remover.
caldav.admin.servers.quirks.generic.rewritten.label=Este servidor reescreve {0}
caldav.admin.servers.quirks.generic.rewritten.cost=O eXo deixa de verificar esse valor nas c\u00f3pias guardadas por este servidor.
caldav.admin.servers.quirks.changesWhatIsWritten=Altera o que o eXo escreve nos calend\u00e1rios deste servidor
caldav.admin.servers.foreignWriters.title=Outras implementa\u00e7\u00f5es eXo a escrever aqui
caldav.admin.servers.foreignWriters.subtitle=Outro eXo escreveu c\u00f3pias de reuni\u00f5es nas contas deste servidor. Ambos est\u00e3o a reparar as mesmas c\u00f3pias e nenhum consegue distinguir as escritas do outro de uma altera\u00e7\u00e3o feita por algu\u00e9m.
caldav.admin.servers.foreignWriters.none=N\u00e3o foi detetado nenhum outro eXo a escrever nas contas deste servidor. \u00c9 assim que se apresenta um servidor onde apenas esta implementa\u00e7\u00e3o escreve, e n\u00e3o requer aten\u00e7\u00e3o.
caldav.admin.servers.foreignWriters.cost=O eXo verifica as c\u00f3pias das reuni\u00f5es que enviou para aqui e repara o que mudou, assumindo que as escreveu todas. As c\u00f3pias escritas por esta outra implementa\u00e7\u00e3o s\u00e3o contadas e comparadas como se fossem do pr\u00f3prio eXo.
caldav.admin.servers.foreignWriters.lastSeen=Detetado pela \u00faltima vez em {0}
caldav.admin.servers.foreignWriters.resolution=Ligue uma das duas implementa\u00e7\u00f5es a uma conta CalDAV diferente. Entretanto, nada aqui \u00e9 importado, removido ou reparado de forma diferente, e as c\u00f3pias j\u00e1 escritas permanecem at\u00e9 algu\u00e9m as eliminar.
caldav.admin.servers.quirks.omitsSoloOrganizer.label=Este servidor remove o organizador de um evento sem outros participantes
caldav.admin.servers.quirks.omitsSoloOrganizer.cost=Nada muda: em todos os servidores, o eXo j\u00e1 omite o organizador dos eventos sem outros participantes. As c\u00f3pias de eventos com participantes continuam a indicar o seu organizador.
caldav.error.mainCalendarUnknown=O eXo n\u00e3o consegue copiar as suas reuni\u00f5es para esta conta: a conta n\u00e3o indica qual dos seus calend\u00e1rios \u00e9 o predefinido, pelo que n\u00e3o h\u00e1 onde as colocar. Contacte o administrador.
caldav.error.foreignCopy=Esta reuni\u00e3o j\u00e1 est\u00e1 na sua conta de calend\u00e1rio, adicionada por outra pessoa. O eXo deixa essa c\u00f3pia como est\u00e1.
caldav.error.forbidden=Este calend\u00e1rio est\u00e1 partilhado consigo s\u00f3 de leitura, pelo que a sua altera\u00e7\u00e3o n\u00e3o pode ser guardada nele.

caldav.server.authProviderUnknown=Esse m\u00e9todo de autentica\u00e7\u00e3o n\u00e3o est\u00e1 dispon\u00edvel neste servidor. Escolha um da lista.
caldav.server.writeChannelNotSupported=A importa\u00e7\u00e3o de calend\u00e1rio BlueMind s\u00f3 funciona com um servidor BlueMind, que o eXo reconhece por "BlueMind" no nome do servidor. Escolha CalDAV padr\u00e3o ou mantenha BlueMind no nome.
caldav.server.url.malformed=Este n\u00e3o \u00e9 um endere\u00e7o web utiliz\u00e1vel. Deve come\u00e7ar por https:// (ou http:// se o administrador o permitir) e indicar um servidor.
caldav.server.url.schemeNotAllowed=S\u00f3 s\u00e3o aceites endere\u00e7os https. Pe\u00e7a ao administrador para permitir http se este servidor n\u00e3o tiver certificado.
caldav.server.url.credentials=Remova o nome de utilizador e a palavra-passe do endere\u00e7o. O eXo utiliza as credenciais com que cada utilizador se liga, nunca as escritas no endere\u00e7o.
caldav.server.url.fragment=Remova o # e tudo o que vem a seguir. Um endere\u00e7o de servidor n\u00e3o tem fragmento.
caldav.server.url.portNotAllowed=Esta porta n\u00e3o \u00e9 permitida. Utilize a porta padr\u00e3o ou pe\u00e7a ao administrador para permitir esta.
caldav.server.url.usernameInAuthority=O marcador {username} s\u00f3 pode aparecer depois do nome do servidor, no caminho. Coloque-o no caminho e n\u00e3o no endere\u00e7o do pr\u00f3prio servidor.
caldav.server.url.privateAddress=Esse endere\u00e7o aponta para o interior da sua pr\u00f3pria rede, pelo que n\u00e3o \u00e9 aceite. O eXo liga-se a partir do servidor, pelo que um endere\u00e7o interno poderia ser utilizado para aceder a m\u00e1quinas que nunca deveriam ter sido expostas. Se estiver correto, pe\u00e7a ao administrador para o permitir.
caldav.server.url.unresolvable=Esse nome de servidor n\u00e3o existe. Verifique a ortografia.
caldav.share.calendarNotFound=Este calend\u00e1rio j\u00e1 n\u00e3o existe.
caldav.share.notOwner=S\u00f3 o propriet\u00e1rio de um calend\u00e1rio o pode partilhar.
caldav.share.notConnected=Ligue a sua conta de calend\u00e1rio antes de partilhar um calend\u00e1rio.
caldav.share.calendarNotOnServer=Este calend\u00e1rio ainda n\u00e3o est\u00e1 no seu servidor de calend\u00e1rio. Tente novamente ap\u00f3s a pr\u00f3xima sincroniza\u00e7\u00e3o.
caldav.share.notSupported=O seu servidor de calend\u00e1rio n\u00e3o permite que o eXo partilhe calend\u00e1rios.
caldav.share.shareeRequired=Escolha um colega com quem partilhar.
caldav.share.shareeUnknown=Este colega n\u00e3o \u00e9 um utilizador ativo.
caldav.share.shareeIsOwner=J\u00e1 \u00e9 o propriet\u00e1rio deste calend\u00e1rio.
caldav.share.shareeNotConnected=Este colega n\u00e3o est\u00e1 ligado ao mesmo servidor de calend\u00e1rio.
caldav.share.samePrincipal=Este colega utiliza a mesma conta de calend\u00e1rio que o utilizador, pelo que j\u00e1 v\u00ea este calend\u00e1rio.
caldav.share.notReadOnly=Este colega tem mais do que acesso de visualiza\u00e7\u00e3o, definido fora da plataforma. Altere-o na sua aplica\u00e7\u00e3o de calend\u00e1rio.
caldav.share.aclUnreadable=O seu servidor de calend\u00e1rio n\u00e3o permite que a plataforma veja com quem este calend\u00e1rio est\u00e1 partilhado.
caldav.share.aclNotUnderstood=Este calend\u00e1rio est\u00e1 partilhado de uma forma que a plataforma n\u00e3o consegue alterar com seguran\u00e7a. Gira a partilha na sua aplica\u00e7\u00e3o de calend\u00e1rio.
caldav.share.serverRefused=O seu servidor de calend\u00e1rio recusou a altera\u00e7\u00e3o.
caldav.share.notApplied=O seu servidor de calend\u00e1rio aceitou a altera\u00e7\u00e3o, mas n\u00e3o a aplicou.
caldav.share.serverUnavailable=N\u00e3o foi poss\u00edvel contactar o seu servidor de calend\u00e1rio. Tente novamente mais tarde.
caldav.share.credentials=O seu servidor de calend\u00e1rio recusou a sua conta. Verifique a palavra-passe nas defini\u00e7\u00f5es da agenda.
caldav.share.ownerUnknown=O seu servidor de calend\u00e1rio n\u00e3o indicou com que conta est\u00e1 ligado. Tente novamente ap\u00f3s a pr\u00f3xima sincroniza\u00e7\u00e3o.
caldav.share.foreignAccessNotPreserved=Algu\u00e9m tem mais do que acesso de visualiza\u00e7\u00e3o a este calend\u00e1rio, definido fora da plataforma. Alterar a partilha aqui pode afetar esse acesso, por isso gira-a na sua aplica\u00e7\u00e3o de calend\u00e1rio.
caldav.share.shareeAddressUnknown=O servidor de calend\u00e1rio n\u00e3o forneceu o endere\u00e7o de email deste colega, pelo que a plataforma n\u00e3o conseguiu alterar o seu acesso.
caldav.share.shareeHasOtherAccess=Este colega tem outro acesso a este calend\u00e1rio, definido fora da plataforma, como ver quando est\u00e1 dispon\u00edvel. Partilh\u00e1-lo aqui substituiria esse acesso, por isso altere-o na sua aplica\u00e7\u00e3o de calend\u00e1rio.
caldav.share.notOwnedOnServer=Este calend\u00e1rio pertence a outra pessoa ou n\u00e3o tem permiss\u00e3o para gerir a sua partilha. S\u00f3 pode partilhar a partir da plataforma os calend\u00e1rios de que \u00e9 propriet\u00e1rio.
caldav.admin.servers.drawer.authentication=Autentica\u00e7\u00e3o
caldav.admin.servers.drawer.authProvider=Como os utilizadores se autenticam
caldav.admin.servers.drawer.disconnection.title=Alterar a autentica\u00e7\u00e3o
caldav.admin.servers.drawer.disconnection.one=Alterar a autentica\u00e7\u00e3o desliga 1 utilizador deste servidor.
caldav.admin.servers.drawer.disconnection.many=Alterar a autentica\u00e7\u00e3o desliga {0} utilizadores deste servidor.
caldav.admin.servers.drawer.disconnection.question=Tem a certeza de que pretende guardar?
caldav.admin.servers.drawer.disconnection.confirm=Guardar
caldav.admin.servers.drawer.disconnection.cancel=Cancelar
caldav.admin.servers.drawer.disconnection.countFailed=N\u00e3o foi poss\u00edvel contar os utilizadores deste servidor. Nada foi guardado, tente novamente.
