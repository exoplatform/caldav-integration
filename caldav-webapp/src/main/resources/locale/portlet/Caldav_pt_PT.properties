caldav.pendingCopies.subtitle={0} reuni\u00f5es alteradas no eXo ainda n\u00e3o foram atualizadas no seu calend\u00e1rio. A pr\u00f3xima sincroniza\u00e7\u00e3o dever\u00e1 recuper\u00e1-las.
caldav.calendarStates.title=Calend\u00e1rios que requerem aten\u00e7\u00e3o
