caldav.error.credentials=O servidor CalDAV recusou este nome de utilizador ou palavra-passe. Verifique-os e tente novamente.
caldav.error.connection=N\u00e3o \u00e9 poss\u00edvel contactar o servidor CalDAV. Tente novamente mais tarde ou contacte o administrador.
caldav.error.notCaldav=Este endere\u00e7o n\u00e3o respondeu como um calend\u00e1rio CalDAV. Contacte o administrador para verificar o endere\u00e7o do servidor configurado.
caldav.error.cors=O servidor est\u00e1 acess\u00edvel, mas recusou o pedido de origem cruzada do navegador (n\u00e3o envia cabe\u00e7alhos CORS). Pe\u00e7a ao administrador para o disponibilizar a partir do endere\u00e7o da pr\u00f3pria plataforma.
caldav.admin.servers.title=Servidores CalDAV
caldav.admin.servers.subtitle=Adicione os servidores CalDAV onde os utilizadores podem ligar uma conta pessoal. Os calend\u00e1rios pessoais sincronizam nos dois sentidos com Os meus calend\u00e1rios. As reuni\u00f5es do eXo s\u00e3o copiadas num s\u00f3 sentido, apenas para o calend\u00e1rio pessoal.
caldav.admin.servers.add=Adicionar
caldav.admin.servers.noServers=Ainda n\u00e3o foi declarado nenhum servidor CalDAV
caldav.admin.servers.list.name=Nome
caldav.admin.servers.list.activate=Ativar
caldav.admin.servers.list.actions=A\u00e7\u00f5es
caldav.admin.servers.preset.label=Que servidor \u00e9 este?
caldav.admin.servers.preset.bluemind.label=Bluemind
caldav.admin.servers.preset.bluemind.summary=O nome do servidor, o formato do endere\u00e7o e as limita\u00e7\u00f5es conhecidas do BlueMind est\u00e3o preenchidos: sem liga\u00e7\u00f5es de videoconfer\u00eancia, marcadores do Outlook e do Thunderbird, uma descri\u00e7\u00e3o duplicada, uma prioridade predefinida em cada evento.\n\nAs c\u00f3pias v\u00e3o para o calend\u00e1rio principal, n\u00e3o para um calend\u00e1rio dedicado, e as liga\u00e7\u00f5es de resposta permanecem ativas. Verifique as primeiras sincroniza\u00e7\u00f5es no seu servidor e reveja tudo antes de guardar.
caldav.admin.servers.preset.stalwart.label=Stalwart
caldav.admin.servers.preset.stalwart.summary=Preenchi o nome do servidor e o formato do endere\u00e7o. O Stalwart preserva o que o eXo envia, pelo que est\u00e1 definido para manter tudo em vez de herdar as exce\u00e7\u00f5es de toda a implementa\u00e7\u00e3o.\n\nAs c\u00f3pias v\u00e3o para um calend\u00e1rio dedicado eXo Meetings. As liga\u00e7\u00f5es de resposta est\u00e3o desativadas, uma vez que o Stalwart aceita respostas a partir de qualquer calend\u00e1rio e os bot\u00f5es Aceitar e Recusar do pr\u00f3prio cliente j\u00e1 funcionam na c\u00f3pia.\n\nReveja antes de guardar.
caldav.admin.servers.preset.other.label=Outro servidor
caldav.admin.servers.preset.other.summary=Nada \u00e9 preenchido. Um servidor que n\u00e3o consta da lista \u00e9 um servidor que ainda n\u00e3o test\u00e1mos, n\u00e3o um servidor n\u00e3o suportado. Preencha o formul\u00e1rio e o eXo sugerir\u00e1 defini\u00e7\u00f5es assim que os primeiros eventos forem sincronizados.
caldav.admin.servers.preset.changesWhatIsWritten=Uma destas op\u00e7\u00f5es altera o que o eXo escreve nos calend\u00e1rios dos utilizadores, e n\u00e3o apenas o que compara.
caldav.admin.servers.name=Nome
caldav.admin.servers.name.placeholder=Nome apresentado aos utilizadores
caldav.admin.servers.description=Descri\u00e7\u00e3o
caldav.admin.servers.description.placeholder=Descri\u00e7\u00e3o opcional apresentada aos utilizadores
caldav.admin.servers.url=URL do servidor
caldav.admin.servers.url.placeholder=https://caldav.example.org/dav/cal/{username}/
caldav.admin.servers.url.hint=O URL pode conter um marcador {username}, substitu\u00eddo pela conta com que cada utilizador se liga.
caldav.admin.servers.url.reachabilityHint=O eXo liga-se a partir do servidor, n\u00e3o do navegador do utilizador, pelo que este endere\u00e7o s\u00f3 precisa de estar acess\u00edvel a partir do servidor. Os endere\u00e7os internos s\u00e3o recusados, a menos que a sua implementa\u00e7\u00e3o os permita, uma vez que, caso contr\u00e1rio, o eXo poderia ser utilizado para aceder a m\u00e1quinas que nunca deveriam ter sido expostas.
caldav.admin.servers.url.corsHint=Os utilizadores ligam-se a partir do navegador, pelo que o endere\u00e7o deve partilhar a origem da plataforma ou enviar cabe\u00e7alhos CORS. Um servidor de terceiros sem esses cabe\u00e7alhos deve ser disponibilizado atrav\u00e9s do endere\u00e7o da pr\u00f3pria plataforma.
