caldav.admin.sync.futureDays.help=At\u00e9 onde s\u00e3o lidos os eventos futuros. Um per\u00edodo longo torna mais pesada a primeira sincroniza\u00e7\u00e3o de cada dia.
caldav.admin.sync.sweepStaleMinutes.label=Atualizar as contas n\u00e3o abertas h\u00e1
caldav.admin.sync.sweepStaleMinutes.help=As contas n\u00e3o abertas h\u00e1 este tempo s\u00e3o atualizadas em segundo plano.
