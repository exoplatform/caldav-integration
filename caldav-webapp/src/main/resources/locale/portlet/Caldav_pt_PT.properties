caldav.admin.servers.modal.delete.title=Eliminar o servidor CalDAV
caldav.admin.servers.modal.delete.message=O servidor desaparecer\u00e1 dos conectores de todos os utilizadores. As contas ainda ligadas a ele impedem a elimina\u00e7\u00e3o.
caldav.admin.servers.modal.delete.confirmDelete=Delete
caldav.admin.servers.modal.delete.cancelDelete=Cancel
agenda.caldavCalendar.calendarDelete.propagates=Este calend\u00e1rio tamb\u00e9m est\u00e1 em {0}. Elimin\u00e1-lo aqui elimina-o tamb\u00e9m l\u00e1, com todos os eventos que cont\u00e9m. Isto inclui eventos que adicionou a partir do telem\u00f3vel ou de outra aplica\u00e7\u00e3o, e n\u00e3o pode ser anulado.
agenda.caldavCalendar.calendarDelete.keepsRemote=O calend\u00e1rio correspondente em {0} n\u00e3o ser\u00e1 alterado. Permanece l\u00e1 com todos os seus eventos e o eXo simplesmente deixar\u00e1 de o apresentar.
caldav.hiddenCalendars.title=Calend\u00e1rios ocultos
caldav.hiddenCalendars.subtitle={0} calend\u00e1rio(s) que eliminou aqui ainda est\u00e1(\u00e3o) na sua conta de calend\u00e1rio
caldav.hiddenCalendars.manage=Gerir os calend\u00e1rios ocultos
caldav.hiddenCalendars.drawer.title=Calend\u00e1rios ocultos
caldav.hiddenCalendars.drawer.description=Eliminou estes calend\u00e1rios do eXo, mas optou por mant\u00ea-los na sua conta. Voltar a mostrar um deles tr\u00e1-lo de volta na pr\u00f3xima sincroniza\u00e7\u00e3o, com os eventos que cont\u00e9m nesse momento.
caldav.hiddenCalendars.showAgain=Mostrar novamente
caldav.hiddenCalendars.showAgainSuccess={0} voltar\u00e1 na pr\u00f3xima sincroniza\u00e7\u00e3o
caldav.hiddenCalendars.showAgainError=N\u00e3o foi poss\u00edvel voltar a mostrar este calend\u00e1rio
caldav.hiddenCalendars.count={0} calend\u00e1rio(s) oculto(s) da sua agenda
caldav.hiddenCalendars.drawer.about=Calend\u00e1rios que ocultou no eXo. Mostre um para o recuperar: um calend\u00e1rio eliminado regressa na pr\u00f3xima sincroniza\u00e7\u00e3o com os eventos atuais, um calend\u00e1rio partilhado regressa imediatamente em Partilhados comigo.
caldav.hiddenCalendars.deletedHere=Eliminado aqui, mantido na sua conta de calend\u00e1rio
caldav.hiddenCalendars.sharedBy=Partilhado por {0}
caldav.hiddenCalendars.sharedWithYou=Partilhado consigo
caldav.hiddenCalendars.showAgainSharedSuccess={0} voltou a Partilhados comigo
caldav.hiddenCalendars.notAShare=S\u00f3 pode ocultar calend\u00e1rios partilhados consigo. Para deixar de ver um dos seus, elimine-o e selecione "Manter na minha conta de calend\u00e1rio" quando lhe for perguntado.
caldav.hiddenCalendars.calendarRequired=Escolha o calend\u00e1rio a ocultar.
caldav.hiddenCalendars.accountUnavailable=N\u00e3o foi poss\u00edvel contactar a sua conta de calend\u00e1rio, pelo que este calend\u00e1rio n\u00e3o foi ocultado. Tente novamente dentro de momentos.

caldav.admin.sync.title=Sincroniza\u00e7\u00e3o de calend\u00e1rios
caldav.admin.sync.description=Com que frequ\u00eancia e amplitude o eXo l\u00ea as contas de calend\u00e1rio que os utilizadores ligam. As altera\u00e7\u00f5es produzem efeito na pr\u00f3xima sincroniza\u00e7\u00e3o.
caldav.admin.sync.throttleMinutes.label=Intervalo entre sincroniza\u00e7\u00f5es
caldav.admin.sync.throttleMinutes.help=Abrir a agenda l\u00ea a conta ligada e depois deixa-a em paz durante este per\u00edodo, independentemente de quantas vezes a p\u00e1gina for aberta. Impede que um utilizador muito ativo fa\u00e7a um pedido a cada apresenta\u00e7\u00e3o.
caldav.admin.sync.pastDays.label=Ler eventos do passado
caldav.admin.sync.pastDays.help=At\u00e9 que ponto no passado o eXo l\u00ea eventos. Os eventos passados raramente mudam, pelo que ler menos custa quase nada e torna cada sincroniza\u00e7\u00e3o mais leve.
caldav.admin.sync.futureDays.label=Ler eventos futuros
caldav.admin.sync.futureDays.help=At\u00e9 que ponto no futuro o eXo l\u00ea eventos. \u00c9 esta a op\u00e7\u00e3o que pesa: um per\u00edodo amplo numa conta com anos de reuni\u00f5es recorrentes representa uma transfer\u00eancia grande, feita na primeira sincroniza\u00e7\u00e3o de cada dia.
caldav.admin.sync.sweepStaleMinutes.label=Atualizar contas sem atividade h\u00e1
caldav.admin.sync.sweepStaleMinutes.help=O eXo l\u00ea uma conta de calend\u00e1rio quando o respetivo titular abre a agenda, e este aguarda enquanto \u00e9 carregada. As contas que ningu\u00e9m abriu h\u00e1 mais tempo do que este valor s\u00e3o atualizadas em segundo plano, para que a pr\u00f3xima agenda abra j\u00e1 com os eventos.\n\nReduza este valor para agendas mais atualizadas, mas com mais pedidos ao servidor. Aumente-o se os servidores de calend\u00e1rio forem lentos ou tiverem limites de pedidos.
caldav.admin.sync.sweepBatchSize.label=Calend\u00e1rios por execu\u00e7\u00e3o em segundo plano
caldav.admin.sync.sweepBatchSize.help=Cada execu\u00e7\u00e3o atualiza no m\u00e1ximo este n\u00famero de calend\u00e1rios, come\u00e7ando pelos mais antigos. Aumente-o para recuperar mais depressa numa inst\u00e2ncia muito ativa, diminua-o para distribuir a carga.
caldav.admin.sync.unit.minutes=minutos
caldav.admin.sync.unit.days=dias
caldav.admin.sync.unit.calendars=calend\u00e1rios
caldav.admin.sync.save=Guardar
caldav.admin.sync.saved=Defini\u00e7\u00f5es de sincroniza\u00e7\u00e3o guardadas
caldav.admin.sync.saveFailed=N\u00e3o foi poss\u00edvel guardar estas defini\u00e7\u00f5es
caldav.tuning.mandatory=N\u00e3o foram enviadas defini\u00e7\u00f5es
caldav.tuning.throttleOutOfRange=O intervalo entre sincroniza\u00e7\u00f5es deve estar entre 0 minutos e um dia.
caldav.tuning.pastDaysOutOfRange=A leitura do passado deve estar entre 0 e 365 dias.
caldav.tuning.futureDaysOutOfRange=A leitura do futuro deve estar entre 1 e 365 dias.
caldav.tuning.sweepStaleOutOfRange=O atraso da atualiza\u00e7\u00e3o em segundo plano deve estar entre 1 minuto e uma semana.
caldav.tuning.sweepBatchOutOfRange=A execu\u00e7\u00e3o em segundo plano deve abranger entre 1 e 500 calend\u00e1rios.
caldav.admin.sync.summary=Leitura de {1} dias para tr\u00e1s e {2} dias para a frente. Uma agenda acabada de abrir aguarda {0} minutos antes de voltar a ler a conta; uma conta que ningu\u00e9m abre \u00e9 atualizada em segundo plano ap\u00f3s {3} minutos.
caldav.admin.sync.cancel=Cancelar
caldav.admin.sync.reports.title=C\u00f3pias das reuni\u00f5es, por utilizador
caldav.admin.sync.reports.subtitle=Como cada servidor ligado tratou as c\u00f3pias das reuni\u00f5es durante a \u00faltima sincroniza\u00e7\u00e3o. Esta informa\u00e7\u00e3o \u00e9 mantida apenas em mem\u00f3ria, pelo que a tabela fica vazia ap\u00f3s um rein\u00edcio at\u00e9 as contas voltarem a sincronizar.
caldav.admin.sync.reports.none=Nenhuma conta ligada verificou as c\u00f3pias das reuni\u00f5es desde o \u00faltimo rein\u00edcio. A tabela \u00e9 preenchida \u00e0 medida que sincronizam.
caldav.admin.sync.reports.checked={0} c\u00f3pias verificadas, {1} em falta, {2} alteradas, {3} reescritas, {4} inalteradas.
caldav.admin.sync.reports.moved=Movidas para o novo destino: {0} c\u00f3pias movidas, {1} c\u00f3pias antigas que o servidor n\u00e3o removeu, {2} n\u00e3o puderam ser escritas.
caldav.admin.sync.reports.notMoved=N\u00e3o havia nenhuma altera\u00e7\u00e3o de destino pendente.
caldav.admin.sync.reports.loadFailed=N\u00e3o foi poss\u00edvel ler estas contagens.
caldav.admin.sync.reports.unknownUser=Utilizador {0}
caldav.admin.managed.title=Liga\u00e7\u00e3o unificada
caldav.admin.managed.off=Os utilizadores ligam a sua pr\u00f3pria conta.
caldav.admin.managed.on=Todos est\u00e3o associados a {0}.
