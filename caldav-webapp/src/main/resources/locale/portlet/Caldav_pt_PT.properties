caldav.admin.managed.onExcept=Todos est\u00e3o associados a {0}, exceto {1} grupo(s) ou espa\u00e7o(s) exclu\u00eddo(s).
caldav.admin.managed.off.confirm.title=Desativar a liga\u00e7\u00e3o unificada?
caldav.admin.managed.off.confirm.message=Os utilizadores voltar\u00e3o a escolher o seu pr\u00f3prio servidor CalDAV. As contas que os pr\u00f3prios utilizadores ligaram a {0} continuam a sincronizar.
caldav.admin.managed.off.confirm.disconnect.one=1 conta associada atrav\u00e9s da liga\u00e7\u00e3o unificada ser\u00e1 desligada.
caldav.admin.managed.off.confirm.disconnect.many={0} contas associadas atrav\u00e9s da liga\u00e7\u00e3o unificada ser\u00e3o desligadas.
caldav.admin.managed.off.countFailed=N\u00e3o foi poss\u00edvel contar as contas associadas atrav\u00e9s da liga\u00e7\u00e3o unificada. A liga\u00e7\u00e3o unificada mant\u00e9m-se ativa, tente novamente.
caldav.admin.managed.off.confirm.question=Tem a certeza de que pretende desativ\u00e1-lo?
caldav.admin.managed.off.confirm.ok=Desativar
caldav.admin.managed.off.confirm.cancel=Manter ativo
