caldav.admin.managed.off.confirm.kept=Os utilizadores voltar\u00e3o a escolher o seu pr\u00f3prio servidor CalDAV. As contas associadas a {0} pela liga\u00e7\u00e3o unificada ser\u00e3o desligadas. As outras contas continuam a ser sincronizadas.
