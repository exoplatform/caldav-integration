caldav.admin.servers.answerLinks.hint=Kopyalanan her toplant\u0131n\u0131n a\u00e7\u0131klamas\u0131na Kabul et, Reddet ve Belki ba\u011flant\u0131lar\u0131 ekleyin. Bunu yaln\u0131zca takvim istemcileri zaten kendi yan\u0131t d\u00fc\u011fmelerini g\u00f6steriyorsa kapat\u0131n; aksi takdirde kullan\u0131c\u0131lar hi\u00e7 yan\u0131t veremez.
