caldav.tuning.throttleOutOfRange=\u0130ki e\u015fitleme aras\u0131ndaki bekleme s\u00fcresi 0 dakika ile bir g\u00fcn aras\u0131nda olmal\u0131d\u0131r.
caldav.tuning.pastDaysOutOfRange=Ge\u00e7mi\u015fi okuma s\u00fcresi 0 ile 365 g\u00fcn aras\u0131nda olmal\u0131d\u0131r.
