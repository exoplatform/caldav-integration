caldav.admin.servers.mirrorTarget.appliesTo=Kendi ajanda ayarlar\u0131nda toplant\u0131 kopyalar\u0131n\u0131 etkin tutan kullan\u0131c\u0131lar i\u00e7in ge\u00e7erlidir.
caldav.admin.servers.mirrorTarget.dedicated.label=\u00d6zel bir eXo Meetings takvimi
caldav.admin.servers.mirrorTarget.dedicated.consequence=eXo toplant\u0131lar\u0131n\u0131 kullan\u0131c\u0131n\u0131n kendi etkinliklerinden ayr\u0131 tutar. Baz\u0131 sunucularda ayr\u0131 bir takvim m\u00fcsaitlik hesab\u0131na kat\u0131lmaz; bu nedenle i\u015f arkada\u015flar\u0131 eXo toplant\u0131 saatlerini bo\u015f g\u00f6r\u00fcr ve kopyalarda yan\u0131t d\u00fc\u011fmeleri g\u00f6r\u00fcnmez.
caldav.admin.servers.mirrorTarget.main.label=Hesab\u0131n ana takvimi
caldav.admin.servers.mirrorTarget.main.consequence=Kopyalar kullan\u0131c\u0131n\u0131n m\u00fcsaitli\u011fine dahil edilir ve sunucunun kendi yan\u0131t d\u00fc\u011fmeleri, sundu\u011fu yerlerde g\u00f6r\u00fcn\u00fcr. Bunu yaln\u0131zca kopyalar bu sunucuda sorunsuz e\u015fitlendikten sonra se\u00e7in.
caldav.admin.servers.mirrorTarget.moves=Bunu de\u011fi\u015ftirmek, her kullan\u0131c\u0131n\u0131n mevcut kopyalar\u0131n\u0131 sonraki e\u015fitlemeler s\u0131ras\u0131nda ta\u015f\u0131r. Eski eXo Meetings takvimi bo\u015f olarak yerinde b\u0131rak\u0131l\u0131r.
