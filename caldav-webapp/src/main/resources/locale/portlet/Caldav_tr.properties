agenda.caldavCalendar.calendarDelete.propagates=Bu takvim \u015furada da bulunuyor: {0}. Burada silmek, i\u00e7indeki t\u00fcm etkinliklerle birlikte orada da siler. Buna telefonunuzdan veya ba\u015fka bir uygulamadan ekledi\u011finiz etkinlikler de dahildir ve bu i\u015flem geri al\u0131namaz.
