caldav.hiddenCalendars.drawer.description=Bu takvimleri eXo'dan sildiniz ancak hesab\u0131n\u0131zda tutmay\u0131 se\u00e7tiniz. Birini yeniden g\u00f6stermek, onu \u015fu an i\u00e7erdi\u011fi etkinliklerle birlikte sonraki e\u015fitlemede geri getirir.
