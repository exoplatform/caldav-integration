caldav.error.mainCalendarUnknown=eXo toplant\u0131lar\u0131n\u0131z\u0131 bu hesaba kopyalayam\u0131yor: hesap, takvimlerinden hangisinin varsay\u0131lan oldu\u011funu bildirmiyor, bu y\u00fczden toplant\u0131lar\u0131 koyacak bir yer yok. Y\u00f6neticinize ba\u015fvurun.
caldav.error.foreignCopy=Bu toplant\u0131, ba\u015fka biri taraf\u0131ndan eklenmi\u015f olarak takvim hesab\u0131n\u0131zda zaten var. eXo bu kopyay\u0131 oldu\u011fu gibi b\u0131rak\u0131r.
caldav.error.forbidden=Bu takvim sizinle salt okunur olarak payla\u015f\u0131ld\u0131, bu nedenle de\u011fi\u015fikli\u011finiz kaydedilemez.

