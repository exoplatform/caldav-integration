caldav.hiddenCalendars.notAShare=Yaln\u0131zca sizinle payla\u015f\u0131lan takvimleri gizleyebilirsiniz. Kendi takvimlerinizden birini g\u00f6rmeyi b\u0131rakmak i\u00e7in onu silin ve soruldu\u011funda "Takvim hesab\u0131mda tut" se\u00e7ene\u011fini se\u00e7in.
