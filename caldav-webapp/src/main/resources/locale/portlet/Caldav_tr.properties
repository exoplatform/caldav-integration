caldav.hiddenCalendars.subtitle=Burada sildi\u011finiz {0} takvim h\u00e2l\u00e2 takvim hesab\u0131n\u0131zda duruyor
caldav.hiddenCalendars.manage=Gizli takvimleri y\u00f6net
