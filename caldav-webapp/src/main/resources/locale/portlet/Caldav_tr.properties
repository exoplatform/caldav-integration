caldav.admin.servers.url.hint=URL, her kullan\u0131c\u0131n\u0131n ba\u011flanmak i\u00e7in kulland\u0131\u011f\u0131 hesapla de\u011fi\u015ftirilen bir {username} yer tutucusu i\u00e7erebilir.
caldav.admin.servers.url.reachabilityHint=eXo, kullan\u0131c\u0131n\u0131n taray\u0131c\u0131s\u0131ndan de\u011fil sunucudan ba\u011flan\u0131r; bu nedenle bu adresin yaln\u0131zca sunucudan eri\u015filebilir olmas\u0131 yeterlidir. Da\u011f\u0131t\u0131m\u0131n\u0131z izin vermedik\u00e7e dahili adresler reddedilir, \u00e7\u00fcnk\u00fc aksi halde eXo hi\u00e7bir zaman d\u0131\u015far\u0131ya a\u00e7\u0131lmas\u0131 ama\u00e7lanmam\u0131\u015f makinelere eri\u015fmek i\u00e7in kullan\u0131labilir.
caldav.admin.servers.url.corsHint=Kullan\u0131c\u0131lar taray\u0131c\u0131lar\u0131ndan ba\u011fland\u0131\u011f\u0131 i\u00e7in adres, platformla ayn\u0131 k\u00f6keni payla\u015fmal\u0131 veya CORS \u00fcst bilgileri g\u00f6ndermelidir: bunlar\u0131 g\u00f6ndermeyen \u00fc\u00e7\u00fcnc\u00fc taraf bir sunucu, platformun kendi adresi \u00fczerinden sunulmal\u0131d\u0131r.
