caldav.admin.sync.summary={1} g\u00fcn geriye ve {2} g\u00fcn ileriye okunuyor. Yeni a\u00e7\u0131lm\u0131\u015f bir ajanda, hesab\u0131 yeniden okumadan \u00f6nce {0} dakika bekler; kimsenin a\u00e7mad\u0131\u011f\u0131 bir hesap {3} dakika sonra arka planda yenilenir.
