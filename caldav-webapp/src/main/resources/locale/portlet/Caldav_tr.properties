caldav.admin.servers.writeChannel.hint=eXo'nun bu sunucuda her kullan\u0131c\u0131 i\u00e7in yazd\u0131\u011f\u0131 veya kald\u0131rd\u0131\u011f\u0131 her kopyaya uygulan\u0131r.
caldav.admin.servers.writeChannel.caldav.label=Standart CalDAV
