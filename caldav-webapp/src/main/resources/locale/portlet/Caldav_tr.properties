caldav.hiddenCalendars.accountUnavailable=Takvim hesab\u0131n\u0131za eri\u015filemedi, bu nedenle bu takvim gizlenmedi. Birazdan tekrar deneyin.

caldav.admin.sync.title=Takvim e\u015fitleme
caldav.admin.sync.description=eXo'nun, kullan\u0131c\u0131lar\u0131n\u0131z\u0131n ba\u011flad\u0131\u011f\u0131 takvim hesaplar\u0131n\u0131 ne s\u0131kl\u0131kta ve ne kapsamda okudu\u011fu. De\u011fi\u015fiklikler sonraki e\u015fitlemede ge\u00e7erli olur.
caldav.admin.sync.throttleMinutes.label=E\u015fitlemeler aras\u0131ndaki bekleme
caldav.admin.sync.throttleMinutes.help=Ajandan\u0131n a\u00e7\u0131lmas\u0131 ba\u011fl\u0131 hesab\u0131 okur, ard\u0131ndan sayfa ka\u00e7 kez a\u00e7\u0131l\u0131rsa a\u00e7\u0131ls\u0131n bu s\u00fcre boyunca hesab\u0131 rahat b\u0131rak\u0131r. Bu, yo\u011fun bir kullan\u0131c\u0131n\u0131n her g\u00f6r\u00fcnt\u00fclemede istek g\u00f6ndermesini \u00f6nler.
caldav.admin.sync.pastDays.label=Ge\u00e7mi\u015fteki etkinlikleri oku
caldav.admin.sync.pastDays.help=eXo'nun etkinlikleri ge\u00e7mi\u015fe ne kadar geriye kadar okudu\u011fu. Ge\u00e7mi\u015f etkinlikler nadiren de\u011fi\u015fir; bu nedenle daha az\u0131n\u0131 okumak neredeyse hi\u00e7bir \u015feye mal olmaz ve her e\u015fitlemeyi hafifletir.
caldav.admin.sync.futureDays.label=\u0130lerideki etkinlikleri oku
caldav.admin.sync.futureDays.help=eXo'nun etkinlikleri ne kadar ileriye kadar okuyaca\u011f\u0131. Maliyetli olan budur: y\u0131llarca s\u00fcren yinelenen toplant\u0131lar\u0131 olan bir hesapta geni\u015f bir aral\u0131k, her g\u00fcn\u00fcn ilk e\u015fitlemesinde \u00f6denen b\u00fcy\u00fck bir indirme demektir.
caldav.admin.sync.sweepStaleMinutes.label=\u015eu s\u00fcredir i\u015flem g\u00f6rmeyen hesaplar\u0131 yenile
caldav.admin.sync.sweepStaleMinutes.help=eXo, bir takvim hesab\u0131n\u0131 sahibi ajandas\u0131n\u0131 a\u00e7t\u0131\u011f\u0131nda okur ve sahibi y\u00fckleme s\u00fcrerken bekler. Bundan daha uzun s\u00fcredir kimsenin a\u00e7mad\u0131\u011f\u0131 hesaplar ise arka planda yenilenir; b\u00f6ylece bir sonraki ajanda, etkinlikleri haz\u0131r \u015fekilde a\u00e7\u0131l\u0131r.\n\nDaha g\u00fcncel ajandalar i\u00e7in bu de\u011feri d\u00fc\u015f\u00fcr\u00fcn, ancak bu daha fazla sunucu iste\u011fi anlam\u0131na gelir. Takvim sunucular\u0131 yava\u015fsa veya h\u0131z s\u0131n\u0131r\u0131 uyguluyorsa de\u011feri y\u00fckseltin.
caldav.admin.sync.sweepBatchSize.label=Arka plan \u00e7al\u0131\u015ft\u0131rmas\u0131 ba\u015f\u0131na takvim
caldav.admin.sync.sweepBatchSize.help=Her \u00e7al\u0131\u015ft\u0131rma, en eskiden ba\u015flayarak en fazla bu say\u0131da takvimi yeniler. Yo\u011fun bir kurulumda daha h\u0131zl\u0131 yeti\u015fmek i\u00e7in art\u0131r\u0131n, y\u00fck\u00fc yaymak i\u00e7in azalt\u0131n.
