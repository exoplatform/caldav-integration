caldav.admin.servers.preset.stalwart.label=Stalwart
caldav.admin.servers.preset.stalwart.summary=Sunucu ad\u0131n\u0131 ve adres bi\u00e7imini doldurdum. Stalwart, eXo'nun g\u00f6nderdiklerini korur; bu nedenle da\u011f\u0131t\u0131m genelindeki istisnalar\u0131 devralmak yerine her \u015feyi tutacak \u015fekilde ayarland\u0131.\n\nKopyalar \u00f6zel bir eXo Meetings takvimine gider. Yan\u0131t ba\u011flant\u0131lar\u0131 kapal\u0131d\u0131r, \u00e7\u00fcnk\u00fc Stalwart yan\u0131tlar\u0131 herhangi bir takvimden kabul eder ve istemcinin kendi Kabul Et ve Reddet i\u015flevleri kopya \u00fczerinde zaten \u00e7al\u0131\u015f\u0131r.\n\nKaydetmeden \u00f6nce g\u00f6zden ge\u00e7irin.
caldav.admin.servers.preset.other.label=Ba\u015fka bir sunucu
caldav.admin.servers.preset.other.summary=Hi\u00e7bir \u015fey doldurulmaz. Listede olmayan bir sunucu, desteklenmeyen de\u011fil, hen\u00fcz test etmedi\u011fimiz bir sunucudur. Formu kendiniz doldurun; ilk etkinlikler e\u015fitlendikten sonra eXo ayar \u00f6nerecektir.
caldav.admin.servers.preset.changesWhatIsWritten=Bunlardan biri, eXo'nun yaln\u0131zca neyi kar\u015f\u0131la\u015ft\u0131rd\u0131\u011f\u0131n\u0131 de\u011fil, kullan\u0131c\u0131lar\u0131n\u0131z\u0131n takvimlerine ne yazd\u0131\u011f\u0131n\u0131 da de\u011fi\u015ftirir.
