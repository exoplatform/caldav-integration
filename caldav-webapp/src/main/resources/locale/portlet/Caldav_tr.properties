caldav.hiddenCalendars.drawer.about=eXo'da gizledi\u011finiz takvimler. Geri getirmek i\u00e7in birini g\u00f6sterin: silinmi\u015f bir takvim bir sonraki e\u015fitlemede g\u00fcncel etkinlikleriyle geri gelir, payla\u015f\u0131lan bir takvim ise hemen Benimle payla\u015f\u0131lanlar alt\u0131nda geri gelir.
caldav.hiddenCalendars.deletedHere=Burada silindi, takvim hesab\u0131n\u0131zda tutuluyor
