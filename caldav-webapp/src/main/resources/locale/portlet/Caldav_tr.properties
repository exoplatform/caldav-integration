caldav.share.shareeUnknown=Bu i\u015f arkada\u015f\u0131 etkin bir kullan\u0131c\u0131 de\u011fil.
caldav.share.shareeIsOwner=Bu takvimin sahibi zaten sizsiniz.
caldav.share.shareeNotConnected=Bu i\u015f arkada\u015f\u0131 ayn\u0131 takvim sunucusuna ba\u011fl\u0131 de\u011fil.
caldav.share.samePrincipal=Bu i\u015f arkada\u015f\u0131 sizinle ayn\u0131 takvim hesab\u0131n\u0131 kullan\u0131yor, bu nedenle bu takvimi zaten g\u00f6r\u00fcyor.
caldav.share.notReadOnly=Bu i\u015f arkada\u015f\u0131n\u0131n, platform d\u0131\u015f\u0131nda ayarlanm\u0131\u015f, g\u00f6r\u00fcnt\u00fclemeden daha fazla eri\u015fimi var. Bunu takvim uygulaman\u0131zda de\u011fi\u015ftirin.
caldav.share.aclUnreadable=Takvim sunucunuz, platformun bu takvimin kimlerle payla\u015f\u0131ld\u0131\u011f\u0131n\u0131 g\u00f6rmesine izin vermiyor.
caldav.share.aclNotUnderstood=Bu takvim, platformun g\u00fcvenli \u015fekilde de\u011fi\u015ftiremeyece\u011fi bir bi\u00e7imde payla\u015f\u0131lm\u0131\u015f. Payla\u015f\u0131m\u0131n\u0131 takvim uygulaman\u0131zda y\u00f6netin.
caldav.share.serverRefused=Takvim sunucunuz de\u011fi\u015fikli\u011fi reddetti.
caldav.share.notApplied=Takvim sunucunuz de\u011fi\u015fikli\u011fi kabul etti ancak uygulamad\u0131.
caldav.share.serverUnavailable=Takvim sunucunuza eri\u015filemedi. Daha sonra tekrar deneyin.
caldav.share.credentials=Takvim sunucunuz hesab\u0131n\u0131z\u0131 reddetti. Ajanda ayarlar\u0131ndan parolan\u0131z\u0131 kontrol edin.
caldav.share.ownerUnknown=Takvim sunucunuz hangi hesapla ba\u011fl\u0131 oldu\u011funuzu bildirmedi. Bir sonraki e\u015fitlemeden sonra tekrar deneyin.
caldav.share.foreignAccessNotPreserved=Birinin bu takvime, platform d\u0131\u015f\u0131nda ayarlanm\u0131\u015f, g\u00f6r\u00fcnt\u00fclemeden daha fazla eri\u015fimi var. Payla\u015f\u0131m\u0131 burada de\u011fi\u015ftirmek bu eri\u015fimi etkileyebilir, bu nedenle bunu takvim uygulaman\u0131zda y\u00f6netin.
caldav.share.shareeAddressUnknown=Takvim sunucusu bu i\u015f arkada\u015f\u0131n\u0131n e-posta adresini sa\u011flamad\u0131, bu nedenle platform eri\u015fimini de\u011fi\u015ftiremedi.
caldav.share.shareeHasOtherAccess=Bu i\u015f arkada\u015f\u0131n\u0131n bu takvime, platform d\u0131\u015f\u0131nda ayarlanm\u0131\u015f ba\u015fka bir eri\u015fimi var (\u00f6rne\u011fin ne zaman m\u00fcsait oldu\u011funuzu g\u00f6rme). Takvimi burada payla\u015fmak bu eri\u015fimin yerini al\u0131r, bu nedenle bunu takvim uygulaman\u0131zda de\u011fi\u015ftirin.
caldav.share.notOwnedOnServer=Bu takvim ba\u015fka birine ait veya payla\u015f\u0131m\u0131n\u0131 y\u00f6netme izniniz yok. Platformdan yaln\u0131zca sahibi oldu\u011funuz takvimleri payla\u015fabilirsiniz.
