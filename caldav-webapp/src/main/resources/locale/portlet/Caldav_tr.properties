caldav.admin.servers.writeChannel.unavailable.consequence=Kopyalar\u0131 bu \u015fekilde yazan eklenti y\u00fckl\u00fc de\u011fil, bu nedenle eklenti yeniden y\u00fcklenene veya siz standart CalDAV'a ge\u00e7ene kadar bu sunucu i\u00e7in her kopya reddedilir.
