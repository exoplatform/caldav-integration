caldav.admin.servers.answerLinks.label=Prid\u0117ti atsakymo nuorodas \u012f kopij\u0105
caldav.admin.servers.answerLinks.hint=\u012e kiekvieno nukopijuoto susitikimo apra\u0161ym\u0105 pridedamos nuorodos \u201ePriimti\u201c, \u201eAtmesti\u201c ir \u201eGalb\u016bt\u201c. I\u0161junkite tai tik tada, jei kalendoriaus kliento programos jau rodo savo atsakymo mygtukus, kitaip vartotojai visai negal\u0117s atsakyti.
caldav.admin.servers.mirrorTarget.label=Kur \u012fra\u0161omos susitikim\u0173 kopijos
caldav.admin.servers.mirrorTarget.appliesTo=Taikoma vartotojams, kurie savo darbotvark\u0117s nustatymuose palieka \u012fjungtas susitikim\u0173 kopijas.
caldav.admin.servers.mirrorTarget.dedicated.label=Atskiras kalendorius \u201eeXo Meetings\u201c
caldav.admin.servers.mirrorTarget.dedicated.consequence=eXo susitikimai laikomi atskirai nuo paties vartotojo \u012fvyki\u0173. Kai kuriuose serveriuose atskiras kalendorius ne\u012ftraukiamas \u012f u\u017eimtum\u0105, tod\u0117l kolegos eXo susitikim\u0173 laik\u0105 mato kaip laisv\u0105, o kopijose nerodomi atsakymo mygtukai.
caldav.admin.servers.mirrorTarget.main.label=Pagrindinis paskyros kalendorius
caldav.admin.servers.mirrorTarget.main.consequence=Kopijos \u012ftraukiamos \u012f vartotojo u\u017eimtum\u0105, o paties serverio atsakymo mygtukai rodomi ten, kur jis juos si\u016blo. Rinkit\u0117s tai tik tada, kai kopijos \u0161iame serveryje sinchronizuojamos be klaid\u0173.
caldav.admin.servers.mirrorTarget.moves=Pakeitus \u0161\u012f nustatym\u0105, kiekvieno vartotojo esamos kopijos perkeliamos per kelis kitus sinchronizavimus. Senasis kalendorius \u201eeXo Meetings\u201c paliekamas savo vietoje, tu\u0161\u010dias.
caldav.admin.servers.writeChannel.label=Kaip ra\u0161omos susitikim\u0173 kopijos
caldav.admin.servers.writeChannel.hint=Taikoma kiekvienai kopijai, kuri\u0105 eXo \u012fra\u0161o arba pa\u0161alina \u0161iame serveryje, visiems vartotojams.
caldav.admin.servers.writeChannel.caldav.label=Standartinis CalDAV
caldav.admin.servers.writeChannel.caldav.consequenceAnyServer=Veikia su bet kuriuo CalDAV serveriu. Kai kurie serveriai siun\u010dia savo kvietimus \u012f taip \u012fra\u0161yt\u0105 susitikim\u0105: tame pa\u010diame serveryje esantys pakviestieji gauna j\u012f du kartus, o atsakymas, kur\u012f jie pateikia serverio kopijoje, niekada nepasiekia eXo.
caldav.admin.servers.writeChannel.unavailable.label=B\u016bdas, kurio \u0161i platforma nebesi\u016blo ({0})
caldav.admin.servers.writeChannel.unavailable.consequence=Priedas, kuris taip ra\u0161o kopijas, ne\u012fdiegtas, tod\u0117l kiekviena \u0161io serverio kopija atmetama, kol jis bus v\u0117l \u012fdiegtas arba persijungsite \u012f standartin\u012f CalDAV.
