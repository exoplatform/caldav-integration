caldav.admin.managed.off.confirm.disconnect.many=Bus atjungta paskyr\u0173, prijungt\u0173 vieningo prisijungimo re\u017eimu: {0}.
caldav.admin.managed.off.countFailed=Nepavyko suskai\u010diuoti vieningo prisijungimo re\u017eimu prijungt\u0173 paskyr\u0173. Vieningas prisijungimas lieka \u012fjungtas, bandykite dar kart\u0105.
