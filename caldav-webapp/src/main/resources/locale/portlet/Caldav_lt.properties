caldav.error.credentials=CalDAV serveris atmet\u0117 \u0161\u012f vartotojo vard\u0105 arba slapta\u017eod\u012f. Patikrinkite juos ir bandykite dar kart\u0105.
caldav.error.connection=Nepavyksta pasiekti CalDAV serverio. Bandykite v\u0117liau arba susisiekite su administratoriumi.
caldav.error.notCaldav=\u0160iuo adresu neatsak\u0117 CalDAV kalendorius. Susisiekite su administratoriumi, kad jis patikrint\u0173 sukonfig\u016bruot\u0105 serverio adres\u0105.
caldav.error.serverNotUsable=\u0160io kalendoriaus serverio dar negalima naudoti: paslauga, per kuri\u0105 jis prisijungia, ne\u012fdiegta. Bandykite v\u0117liau arba susisiekite su administratoriumi.
caldav.error.cors=Serveris pasiekiamas, ta\u010diau atmet\u0117 nar\u0161ykl\u0117s kitos kilm\u0117s (cross-origin) u\u017eklaus\u0105 (jis nesiun\u010dia CORS antra\u0161\u010di\u0173). Papra\u0161ykite administratoriaus, kad serveris b\u016bt\u0173 pasiekiamas per pa\u010dios platformos adres\u0105.
caldav.admin.servers.title=CalDAV serveriai
caldav.admin.servers.subtitle=Prid\u0117kite CalDAV serverius, prie kuri\u0173 vartotojai gali prijungti asmenin\u0119 paskyr\u0105. Asmeniniai kalendoriai sinchronizuojami abiem kryptimis su skiltimi \u201eMano kalendoriai\u201c. eXo susitikimai kopijuojami viena kryptimi, tik \u012f asmenin\u012f kalendori\u0173.
caldav.admin.servers.add=Prid\u0117ti
caldav.admin.servers.noServers=Dar nenurodytas n\u0117 vienas CalDAV serveris
caldav.admin.servers.list.name=Pavadinimas
caldav.admin.servers.list.activate=Aktyvinti
caldav.admin.servers.list.actions=Veiksmai
caldav.admin.servers.preset.label=Koks tai serveris?
caldav.admin.servers.preset.stalwart.label=Stalwart
caldav.admin.servers.preset.stalwart.summary=U\u017epild\u017eiau serverio pavadinim\u0105 ir adreso format\u0105. Stalwart i\u0161saugo tai, k\u0105 siun\u010dia eXo, tod\u0117l nustatyta i\u0161saugoti visk\u0105, o ne paveld\u0117ti viso diegimo i\u0161imtis.\n\nKopijos \u012fra\u0161omos \u012f atskir\u0105 kalendori\u0173 \u201eeXo Meetings\u201c. Atsakymo nuorodos i\u0161jungtos, nes Stalwart priima atsakymus i\u0161 bet kurio kalendoriaus, o pa\u010dios kliento programos mygtukai \u201ePriimti\u201c ir \u201eAtmesti\u201c kopijoje jau veikia.\n\nPrie\u0161 i\u0161saugodami per\u017ei\u016br\u0117kite.
caldav.admin.servers.preset.other.label=Kitas serveris
caldav.admin.servers.preset.other.summary=Niekas neu\u017epildyta. Jei serverio s\u0105ra\u0161e n\u0117ra, vadinasi, mes jo dar nei\u0161band\u0117me, o ne tai, kad jis nepalaikomas. U\u017epildykite form\u0105 patys, o eXo pasi\u016blys nustatymus, kai bus sinchronizuoti pirmieji \u012fvykiai.
caldav.admin.servers.preset.changesWhatIsWritten=Vienas i\u0161 \u0161i\u0173 nustatym\u0173 kei\u010dia tai, k\u0105 eXo \u012fra\u0161o \u012f j\u016bs\u0173 vartotoj\u0173 kalendorius, o ne tik tai, k\u0105 jis lygina.
caldav.admin.servers.name=Pavadinimas
