caldav.admin.servers.delete.success=CalDAV serveris i\u0161trintas
caldav.admin.servers.delete.error=Nepavyko i\u0161trinti CalDAV serverio
caldav.admin.servers.delete.referenced=Prijungt\u0173 paskyr\u0173, kurios vis dar naudoja \u0161\u012f server\u012f: {0}. Prie\u0161 i\u0161trindami server\u012f j\u012f deaktyvinkite ir leiskite paskyroms atsijungti.
caldav.admin.servers.modal.delete.title=I\u0161trinti CalDAV server\u012f
caldav.admin.servers.modal.delete.message=Serveris dings i\u0161 vis\u0173 vartotoj\u0173 jung\u010di\u0173. I\u0161trinti neleis prie jo vis dar prijungtos paskyros.
caldav.admin.servers.modal.delete.confirmDelete=Delete
caldav.admin.servers.modal.delete.cancelDelete=Cancel
agenda.caldavCalendar.calendarDelete.propagates=\u0160is kalendorius taip pat yra paskyroje {0}. I\u0161trynus j\u012f \u010dia, jis bus i\u0161trintas ir ten kartu su visais jo \u012fvykiais. Tai apima ir \u012fvykius, kuriuos prid\u0117jote i\u0161 telefono ar kitos programos, ir \u0161io veiksmo anuliuoti negalima.
agenda.caldavCalendar.calendarDelete.keepsRemote=Atitinkamas kalendorius paskyroje {0} nebus paliestas. Jis liks ten su visais savo \u012fvykiais, o eXo tiesiog nustos j\u012f rodyti.
caldav.hiddenCalendars.title=Pasl\u0117pti kalendoriai
caldav.hiddenCalendars.subtitle=J\u016bs\u0173 kalendoriaus paskyroje vis dar yra \u010dia i\u0161trint\u0173 kalendori\u0173: {0}
caldav.hiddenCalendars.manage=Tvarkyti pasl\u0117ptus kalendorius
caldav.hiddenCalendars.drawer.title=Pasl\u0117pti kalendoriai
caldav.hiddenCalendars.drawer.description=\u0160iuos kalendorius i\u0161tryn\u0117te i\u0161 eXo, bet pasirinkote palikti juos savo paskyroje. V\u0117l parod\u017eius kalendori\u0173, jis sugr\u0105\u017einamas per kit\u0105 sinchronizavim\u0105 su jame dabar esan\u010diais \u012fvykiais.
caldav.hiddenCalendars.showAgain=Rodyti v\u0117l
caldav.hiddenCalendars.showAgainSuccess=Kalendorius {0} sugr\u012f\u0161 per kit\u0105 sinchronizavim\u0105
caldav.hiddenCalendars.showAgainError=Nepavyko v\u0117l parodyti \u0161io kalendoriaus
caldav.hiddenCalendars.count=I\u0161 j\u016bs\u0173 darbotvark\u0117s pasl\u0117pt\u0173 kalendori\u0173: {0}
caldav.hiddenCalendars.drawer.about=Kalendoriai, kuriuos pasl\u0117p\u0117te eXo. Parodykite kalendori\u0173, kad j\u012f sugr\u0105\u017eintum\u0117te: i\u0161trintas kalendorius sugr\u012f\u017eta per kit\u0105 sinchronizavim\u0105 su dabartiniais \u012fvykiais, o bendrinamas sugr\u012f\u017eta i\u0161 karto \u012f skilt\u012f \u201eBendrinama su manimi\u201c.
caldav.hiddenCalendars.deletedHere=I\u0161trinta \u010dia, palikta j\u016bs\u0173 kalendoriaus paskyroje
caldav.hiddenCalendars.sharedBy=Bendrina: {0}
caldav.hiddenCalendars.sharedWithYou=Bendrinama su jumis
caldav.hiddenCalendars.showAgainSharedSuccess=Kalendorius {0} v\u0117l rodomas skiltyje \u201eBendrinama su manimi\u201c
caldav.hiddenCalendars.notAShare=Galite pasl\u0117pti tik su jumis bendrinamus kalendorius. Jei nebenorite matyti savo kalendoriaus, i\u0161trinkite j\u012f ir, kai bus paklausta, pasirinkite \u201ePalikti mano kalendoriaus paskyroje\u201c.
caldav.hiddenCalendars.calendarRequired=Pasirinkite kalendori\u0173, kur\u012f norite pasl\u0117pti.
caldav.hiddenCalendars.accountUnavailable=Nepavyko pasiekti j\u016bs\u0173 kalendoriaus paskyros, tod\u0117l \u0161is kalendorius nebuvo pasl\u0117ptas. Po akimirkos bandykite dar kart\u0105.

caldav.admin.sync.title=Kalendori\u0173 sinchronizavimas
caldav.admin.sync.description=Kaip da\u017enai ir kokia apimtimi eXo skaito j\u016bs\u0173 vartotoj\u0173 prijungtas kalendori\u0173 paskyras. Pakeitimai \u012fsigalioja per kit\u0105 sinchronizavim\u0105.
caldav.admin.sync.throttleMinutes.label=Laukimas tarp sinchronizavim\u0173
caldav.admin.sync.throttleMinutes.help=Atv\u0117rus darbotvark\u0119 nuskaitoma prijungta paskyra, o po to ji nebelie\u010diama tiek laiko, kad ir kiek kart\u0173 puslapis b\u016bt\u0173 atvertas. Tai neleid\u017eia aktyviam vartotojui si\u0173sti u\u017eklausos kiekvien\u0105 kart\u0105 atvaizduojant puslap\u012f.
caldav.admin.sync.pastDays.label=Skaityti praeities \u012fvykius
caldav.admin.sync.pastDays.help=Kaip toli \u012f praeit\u012f eXo skaito \u012fvykius. Praeities \u012fvykiai kei\u010diasi retai, tod\u0117l skaitant j\u0173 ma\u017eiau beveik nieko neprarandama, o kiekvienas sinchronizavimas tampa lengvesnis.
caldav.admin.sync.futureDays.label=Skaityti b\u016bsimus \u012fvykius
caldav.admin.sync.futureDays.help=Kaip toli \u012f ateit\u012f eXo skaito \u012fvykius. B\u016btent \u0161is nustatymas brangiausias: platus laikotarpis paskyroje su daugelio met\u0173 pasikartojan\u010diais susitikimais rei\u0161kia didel\u012f atsisiuntim\u0105, atliekam\u0105 per pirm\u0105j\u012f kiekvienos dienos sinchronizavim\u0105.
caldav.admin.sync.sweepStaleMinutes.label=Atnaujinti paskyras, kurios neatvertos ilgiau nei
caldav.admin.sync.sweepStaleMinutes.help=eXo nuskaito kalendoriaus paskyr\u0105, kai jos savininkas atveria savo darbotvark\u0119, ir jis laukia, kol ji \u012fkeliama. Paskyros, kuri\u0173 niekas neatv\u0117r\u0117 ilgiau nei nurodyta, vietoj to atnaujinamos fone, tod\u0117l kit\u0105 kart\u0105 darbotvark\u0117 atsiveria jau su \u012fvykiais.\n\nSuma\u017einkite \u0161i\u0105 reik\u0161m\u0119, jei norite naujesni\u0173 darbotvarki\u0173, ta\u010diau tai padidins serverio u\u017eklaus\u0173 skai\u010di\u0173. Padidinkite j\u0105, jei kalendori\u0173 serveriai l\u0117ti arba riboja u\u017eklaus\u0173 da\u017en\u012f.
caldav.admin.sync.sweepBatchSize.label=Kalendori\u0173 per vien\u0105 fonin\u012f vykdym\u0105
caldav.admin.sync.sweepBatchSize.help=Per kiekvien\u0105 vykdym\u0105 atnaujinama ne daugiau kaip tiek kalendori\u0173, pradedant seniausiais. Padidinkite reik\u0161m\u0119, kad apkrautoje sistemoje atsilikimas b\u016bt\u0173 pasivytas grei\u010diau, arba suma\u017einkite, kad apkrova pasiskirstyt\u0173 tolygiau.
