caldav.tuning.mandatory=Nebuvo atsi\u0173sta joki\u0173 nustatym\u0173
caldav.tuning.throttleOutOfRange=Laukimas tarp sinchronizavim\u0173 turi b\u016bti nuo 0 minu\u010di\u0173 iki vienos paros.
caldav.tuning.pastDaysOutOfRange=Praeities skaitymo laikotarpis turi b\u016bti nuo 0 iki 365 dien\u0173.
caldav.tuning.futureDaysOutOfRange=B\u016bsim\u0173 \u012fvyki\u0173 skaitymo laikotarpis turi b\u016bti nuo 1 iki 365 dien\u0173.
caldav.tuning.sweepStaleOutOfRange=Foninio atnaujinimo delsa turi b\u016bti nuo 1 minut\u0117s iki vienos savait\u0117s.
caldav.tuning.sweepBatchOutOfRange=Per fonin\u012f vykdym\u0105 turi b\u016bti apdorojama nuo 1 iki 500 kalendori\u0173.
caldav.admin.sync.summary=Skaitoma {1} d. atgal ir {2} d. \u012f priek\u012f. K\u0105 tik atverta darbotvark\u0117 laukia {0} min., kol v\u0117l nuskaito paskyr\u0105; paskyra, kurios niekas neatveria, atnaujinama fone po {3} min.
caldav.admin.sync.cancel=At\u0161aukti
caldav.admin.sync.reports.title=Susitikim\u0173 kopijos pagal vartotoj\u0105
caldav.admin.sync.reports.subtitle=Kaip kiekvienas prijungtas serveris apdorojo susitikim\u0173 kopijas per paskutin\u012f sinchronizavim\u0105. \u0160ie duomenys laikomi tik atmintyje, tod\u0117l po paleidimo i\u0161 naujo lentel\u0117 lieka tu\u0161\u010dia, kol paskyros v\u0117l susinchronizuojamos.
caldav.admin.sync.reports.none=Nuo paskutinio paleidimo i\u0161 naujo n\u0117 viena prijungta paskyra nepatikrino savo susitikim\u0173 kopij\u0173. Lentel\u0117 pildosi, kai paskyros sinchronizuojamos.
caldav.admin.sync.reports.checked=Patikrinta kopij\u0173: {0}, tr\u016bksta: {1}, pakeista: {2}, perra\u0161yta: {3}, nepaliesta: {4}.
caldav.admin.sync.reports.moved=Perkelta \u012f nauj\u0105 paskirties viet\u0105: perkelta kopij\u0173: {0}, sen\u0173 kopij\u0173, kuri\u0173 serveris nepa\u0161alino: {1}, nepavyko \u012fra\u0161yti: {2}.
caldav.admin.sync.reports.notMoved=Nebuvo laukian\u010di\u0173 paskirties vietos pakeitim\u0173.
caldav.admin.sync.reports.loadFailed=Nepavyko nuskaityti \u0161i\u0173 suvestini\u0173.
caldav.admin.sync.reports.unknownUser=Vartotojas {0}
caldav.admin.managed.title=Vieningas prisijungimas
caldav.admin.managed.off=Vartotojai prijungia savo paskyras.
caldav.admin.managed.on=Visi prijungti prie serverio {0}.
caldav.admin.managed.noServers=Dar nenurodytas n\u0117 vienas serveris.
caldav.admin.managed.switchNotice=Prie kito serverio prijungti vartotojai per valand\u0105 arba kito prisijungimo metu perkeliami \u012f \u0161\u012f server\u012f. Kalendoriai i\u0161 ankstesn\u0117s paskyros nebesinchronizuojami.
caldav.admin.managed.onExcept=Visi prijungti prie {0}, i\u0161skyrus ne\u012ftrauktas grupes ar erdves (i\u0161 viso: {1}).
caldav.admin.managed.off.confirm.title=I\u0161jungti viening\u0105 prisijungim\u0105?
caldav.admin.managed.off.confirm.kept=Vartotojai v\u0117l patys rinksis CalDAV server\u012f. Paskyros, vieningo prisijungimo re\u017eimu prijungtos prie {0}, bus atjungtos. Kitos paskyros toliau sinchronizuojamos.
