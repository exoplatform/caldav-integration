caldav.admin.servers.description.placeholder=Neprivalomas vartotojams rodomas apra\u0161ymas
caldav.admin.servers.url=Serverio URL
caldav.admin.servers.url.placeholder=https://caldav.example.org/dav/cal/{username}/
caldav.admin.servers.url.hint=URL gali tur\u0117ti vietos rezervavimo \u017eenkl\u0105 {username}, kuris pakei\u010diamas paskyra, su kuria jungiasi kiekvienas vartotojas.
caldav.admin.servers.url.reachabilityHint=eXo jungiasi i\u0161 serverio, o ne i\u0161 vartotojo nar\u0161ykl\u0117s, tod\u0117l \u0161is adresas turi b\u016bti pasiekiamas tik i\u0161 serverio. Vidiniai adresai atmetami, nebent j\u016bs\u0173 diegimas juos leid\u017eia, nes kitaip eXo gal\u0117t\u0173 b\u016bti panaudotas pasiekti kompiuterius, kurie niekada netur\u0117jo b\u016bti atverti.
caldav.admin.servers.url.corsHint=Vartotojai jungiasi i\u0161 savo nar\u0161ykl\u0117s, tod\u0117l adresas turi b\u016bti tos pa\u010dios kilm\u0117s kaip platforma arba si\u0173sti CORS antra\u0161tes: tre\u010diosios \u0161alies serveris be j\u0173 turi b\u016bti pasiekiamas per pa\u010dios platformos adres\u0105.
