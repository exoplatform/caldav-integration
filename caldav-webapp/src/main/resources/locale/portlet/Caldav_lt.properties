caldav.admin.managed.saved=Dabar visi prijungti prie serverio {0}
caldav.admin.managed.cleared=Vartotojai v\u0117l patys renkasi CalDAV server\u012f
caldav.admin.managed.saveFailed=Nepavyko \u012fjungti vieningo prisijungimo
caldav.admin.managed.clearFailed=Nepavyko i\u0161jungti vieningo prisijungimo
caldav.managed.serverRequired=Pasirinkite server\u012f, su kuriuo visi tur\u0117t\u0173 sinchronizuotis.
caldav.managed.serverNotEligible=Pasirinkite sukonfig\u016bruot\u0105 ir aktyv\u0173 server\u012f. Deaktyvinto serverio pasiekti negalima, tod\u0117l veikiant vieningam prisijungimui niekas negal\u0117t\u0173 prisijungti.
caldav.managed.providerNotEligible=Veikiant vieningam prisijungimui, \u0161is serveris negali naudoti teik\u0117jo, kuriam reikia kiekvieno vartotojo prisijungimo duomen\u0173. I\u0161junkite viening\u0105 prisijungim\u0105 arba pasirinkite teik\u0117j\u0105 su tarnybine paskyra.
caldav.admin.servers.list.managedLocked=Negalite deaktyvinti ar i\u0161trinti \u0161io serverio, kol j\u012f naudoja vieningas prisijungimas. Pirmiausia i\u0161junkite viening\u0105 prisijungim\u0105 eilut\u0117je vir\u0161 serveri\u0173 s\u0105ra\u0161o.
caldav.managed.serverInUse=Negalite deaktyvinti \u0161io serverio, kol \u012fjungtas vieningas prisijungimas, nes visi su juo sinchronizuojasi. Pirmiausia i\u0161junkite viening\u0105 prisijungim\u0105 eilut\u0117je vir\u0161 serveri\u0173 s\u0105ra\u0161o.
caldav.managed.connectionLocked=J\u016bs\u0173 organizacija valdo j\u016bs\u0173 kalendoriaus paskyr\u0105: jos prisijungimo pakeisti negalima.
caldav.managed.refused=J\u016bs\u0173 organizacijos kalendoriaus serveris nepriima j\u016bs\u0173 paskyros. Kreipkit\u0117s \u012f administratori\u0173.
agenda.caldavCalendar.disconnect.warning=Kalendoriai, kuriuos eXo rodo i\u0161 paskyros {0}, bus pa\u0161alinti i\u0161 j\u016bs\u0173 darbotvark\u0117s kartu su j\u0173 \u012fvyki\u0173 kopijomis. Paskyroje {0} niekas nei\u0161trinama, o eXo sukurti kalendoriai lieka. V\u0117l prijungus paskyr\u0105, \u0161ie kalendoriai sugr\u012f\u0161.
caldav.pendingCopies.title=Susitikim\u0173 kopijos dar perduodamos
caldav.pendingCopies.subtitle=J\u016bs\u0173 susitikim\u0173, kurie pasikeit\u0117 eXo, bet pakeitimas dar nepasiek\u0117 j\u016bs\u0173 kalendoriaus: {0}. eXo toliau bando; paprastai kitas foninis sinchronizavimas tai sutvarko.
caldav.calendarStates.title=D\u0117mesio reikalaujantys kalendoriai
caldav.calendarStates.subtitle=\u012eprastai nesinchronizuojam\u0173 j\u016bs\u0173 kalendori\u0173: {0}
caldav.calendarStates.manage=\u017di\u016br\u0117ti, kas negerai
caldav.calendarStates.drawer.title=D\u0117mesio reikalaujantys kalendoriai
caldav.calendarStates.drawer.description=\u0160ie kalendoriai nesinchronizuojami taip, kaip kiti. Kiti j\u016bs\u0173 kalendoriai nepaveikti.
caldav.calendarStates.explain.REMOTE_CREATE_REFUSED=J\u016bs\u0173 kalendoriaus paskyra neleid\u017eia eXo joje kurti kalendori\u0173, tod\u0117l \u0161is kalendorius ten nekopijuojamas. Paskyroje jau esantys kalendoriai vis tiek rodomi eXo.
caldav.calendarStates.explain.PAUSED=\u0160io kalendoriaus sinchronizavimas kelis kartus nepavyko, tod\u0117l eXo nustojo bandyti. Sinchronizuokite dabar, kad prad\u0117tum\u0117te i\u0161 naujo; jei vis tiek nepavyksta, i\u0161 naujo prijunkite paskyr\u0105.
caldav.calendarStates.explain.EXO_ORPHANED=I\u0161tryn\u0117te \u0161\u012f kalendori\u0173 eXo, ta\u010diau jo nepavyko i\u0161trinti j\u016bs\u0173 kalendoriaus paskyroje. Jis vis dar ten yra.
caldav.calendarStates.explain.REMOTE_GONE=\u0160io kalendoriaus j\u016bs\u0173 kalendoriaus paskyroje neb\u0117ra. \u012e j\u012f nebepateks nieko naujo, o tai, k\u0105 eXo jau turi, lieka nepaliesta.
caldav.calendarStates.explain.RETIRED_SUBSCRIPTION=Tai su jumis bendrinamo kalendoriaus arba j\u016bs\u0173 prenumeruoto i\u0161tekliaus kopija. Ji nebesinchronizuojama, tod\u0117l \u010dia atlikti pakeitimai niekur nepatenka. I\u0161trinkite j\u0105, ir originalas atsiras skiltyje \u201eBendrinama su manimi\u201c (tik skaityti).
caldav.calendarStates.explain.unknown=\u0160is kalendorius nesinchronizuojamas \u012fprastai.
caldav.calendarStates.lastSynchronised={0}
caldav.calendarStates.syncNow=Sinchronizuoti dabar
caldav.calendarStates.synchronised=J\u016bs\u0173 kalendoriai susinchronizuoti. J\u016bs\u0173 susitikim\u0173 kopijos tikrinamos fone.
caldav.calendarStates.syncFailed=Nepavyko sinchronizuoti j\u016bs\u0173 kalendoriaus paskyros
caldav.deviceSetup.title=J\u016bs\u0173 kalendoriai telefone
