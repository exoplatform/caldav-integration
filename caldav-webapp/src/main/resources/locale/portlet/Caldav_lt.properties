caldav.deviceSetup.action=Nustatyti
caldav.deviceSetup.drawer.title=J\u016bs\u0173 kalendoriai telefone
caldav.deviceSetup.drawer.description=Bet kuri CalDAV kalendoriaus programa gali rodyti j\u016bs\u0173 prijungtus kalendorius. Prid\u0117dami paskyr\u0105 naudokite \u0161iuos duomenis:
caldav.deviceSetup.serverAddress=Serverio adresas
caldav.deviceSetup.username=Vartotojo vardas
caldav.deviceSetup.passwordNote=Naudokite \u0161ios kalendoriaus paskyros slapta\u017eod\u012f, t\u0105 pat\u012f, su kuriuo prijung\u0117te j\u0105 prie eXo. eXo neturi atskiro savo slapta\u017eod\u017eio.
caldav.deviceSetup.copy=Kopijuoti: {0}
caldav.deviceSetup.copied=Nukopijuota: {0}
caldav.deviceSetup.copyFallback=Kopijavimas \u010dia negalimas, reik\u0161m\u0117 pa\u017eym\u0117ta, paspauskite Ctrl+C (Mac kompiuteryje Cmd+C), kad j\u0105 nukopijuotum\u0117te
caldav.admin.servers.quirks.title=K\u0105 daro \u0161is serveris
caldav.admin.servers.quirks.subtitle=Pasteb\u0117ta eXo tikrinant \u010dia perduotas susitikim\u0173 kopijas. Pa\u017eym\u0117kite element\u0105, kad jis nebeb\u016bt\u0173 laikomas pakeitimu.
caldav.admin.servers.quirks.none=N\u0117ra i\u0161im\u010di\u0173: eXo \u0161iame serveryje nerado nieko, k\u0105 laikyt\u0173 pakeitimu. Taip atrodo serveris, tiksliai saugantis kopijas, ir jam d\u0117mesio nereikia.
caldav.admin.servers.quirks.seen.once=Pasteb\u0117ta kart\u0105
caldav.admin.servers.quirks.seen.many=Pasteb\u0117ta kart\u0173: {0}
caldav.admin.servers.quirks.dropsConference.label=\u0160is serveris nei\u0161saugo vaizdo konferencij\u0173 nuorod\u0173
caldav.admin.servers.quirks.dropsConference.cost=eXo nebelaikys tr\u016bkstamos nuorodos pakeitimu ir nebepasteb\u0117s, jei kas nors j\u0105 pa\u0161alins.
caldav.admin.servers.quirks.addsCompatibilityMarkers.label=\u0160is serveris prideda Outlook ir Thunderbird suderinamumo \u017eymes
caldav.admin.servers.quirks.addsCompatibilityMarkers.cost=\u0160iuos laukus prideda ir kitos kalendoriaus programos. eXo juos ignoruoja ir palieka tokius, kokie yra.
caldav.admin.servers.quirks.addsFormattedDescription.label=\u0160is serveris prideda formatuot\u0105 apra\u0161ymo kopij\u0105
caldav.admin.servers.quirks.addsFormattedDescription.cost=Rai\u0161kiojo teksto apra\u0161ymo kopija. eXo j\u0105 ignoruoja ir vietoj jos lygina paprasto teksto versij\u0105.
caldav.admin.servers.quirks.stampsDefaultPriority.label=\u0160is serveris kiekvienam saugomam susitikimui priskiria numatyt\u0105j\u012f prioritet\u0105
caldav.admin.servers.quirks.stampsDefaultPriority.cost=Prioritetas, kurio niekas nepasirinko, pridedamas prie kiekvienos kopijos. eXo prioriteto visai nera\u0161o, tod\u0117l nebelaiko jo pakeitimu ir nebepasteb\u0117s, jei kas nors \u0161iame serveryje nustatys tikr\u0105 prioritet\u0105.
caldav.admin.servers.quirks.rewritesDescription.label=\u0160is serveris perra\u0161o kvietimo tekst\u0105
caldav.admin.servers.quirks.rewritesDescription.cost=eXo nebetikrins kopij\u0173 apra\u0161ymo \u0161iame serveryje, \u012fskaitant jame esan\u010dias atsakymo nuorodas. Perra\u0161yta nuoroda liks nepasteb\u0117ta.
caldav.admin.servers.quirks.generic.added.label=\u0160is serveris prideda element\u0105 {0}, kurio eXo ne\u012fra\u0161o
caldav.admin.servers.quirks.generic.added.cost=eXo nebelaikys to pakeitimu \u0161iame serveryje.
caldav.admin.servers.quirks.generic.dropped.label=\u0160is serveris nei\u0161saugo elemento {0}
caldav.admin.servers.quirks.generic.dropped.cost=eXo nebelaikys jo nebuvimo pakeitimu ir nebepasteb\u0117s, jei kas nors j\u012f pa\u0161alins.
caldav.admin.servers.quirks.generic.rewritten.label=\u0160is serveris perra\u0161o element\u0105 {0}
caldav.admin.servers.quirks.generic.rewritten.cost=eXo nebetikrins \u0161ios reik\u0161m\u0117s \u0161io serverio saugomose kopijose.
caldav.admin.servers.quirks.changesWhatIsWritten=Kei\u010dia tai, k\u0105 eXo \u012fra\u0161o \u012f kalendorius \u0161iame serveryje
caldav.admin.servers.foreignWriters.title=Kiti \u010dia ra\u0161antys eXo diegimai
caldav.admin.servers.foreignWriters.subtitle=Kitas eXo \u012fra\u0161\u0117 susitikim\u0173 kopijas \u012f \u0161io serverio paskyras. Abu taiso tas pa\u010dias kopijas ir n\u0117 vienas negali atskirti kito \u012fra\u0161\u0173 nuo kieno nors atlikto pakeitimo.
caldav.admin.servers.foreignWriters.none=Nepasteb\u0117ta, kad kitas eXo ra\u0161yt\u0173 \u012f \u0161io serverio paskyras. Taip atrodo serveris, \u012f kur\u012f ra\u0161o tik \u0161is diegimas, ir jam d\u0117mesio nereikia.
caldav.admin.servers.foreignWriters.cost=eXo tikrina \u010dia perduotas susitikim\u0173 kopijas ir taiso tai, kas pasikeit\u0117, manydamas, kad visas jas \u012fra\u0161\u0117 pats. \u0160io kito diegimo \u012fra\u0161ytos kopijos skai\u010diuojamos ir lyginamos taip, lyg b\u016bt\u0173 paties eXo.
caldav.admin.servers.foreignWriters.lastSeen=Paskutin\u012f kart\u0105 pasteb\u0117ta: {0}
caldav.admin.servers.foreignWriters.resolution=Prijunkite vien\u0105 i\u0161 dviej\u0173 diegim\u0173 prie kitos CalDAV paskyros. Tuo metu niekas \u010dia neimportuojama, ne\u0161alinama ir netaisoma kitaip, o jau \u012fra\u0161ytos kopijos lieka, kol kas nors jas i\u0161trins.
caldav.admin.servers.quirks.omitsSoloOrganizer.label=\u0160is serveris pa\u0161alina organizatori\u0173 i\u0161 \u012fvykio, kuriame n\u0117ra kit\u0173 dalyvi\u0173
caldav.admin.servers.quirks.omitsSoloOrganizer.cost=Niekas nesikei\u010dia: visuose serveriuose eXo jau ne\u012ftraukia organizatoriaus \u012f \u012fvykius be kit\u0173 dalyvi\u0173. \u012evyki\u0173 su dalyviais kopijose organizatorius vis tiek nurodomas.
caldav.error.mainCalendarUnknown=eXo negali nukopijuoti j\u016bs\u0173 susitikim\u0173 \u012f \u0161i\u0105 paskyr\u0105: ji nenurodo, kuris jos kalendorius yra numatytasis, tod\u0117l n\u0117ra kur j\u0173 d\u0117ti. Susisiekite su administratoriumi.
caldav.error.foreignCopy=\u0160\u012f susitikim\u0105 \u012f j\u016bs\u0173 kalendoriaus paskyr\u0105 jau \u012ftrauk\u0117 ka\u017ekas kitas. eXo tos kopijos nekei\u010dia.
caldav.error.forbidden=\u0160is kalendorius su jumis bendrinamas tik skaityti, tod\u0117l j\u016bs\u0173 pakeitimo \u012f j\u012f i\u0161saugoti negalima.

caldav.server.authProviderUnknown=\u0160is autentifikavimo b\u016bdas \u0161iame serveryje nepasiekiamas. Pasirinkite b\u016bd\u0105 i\u0161 s\u0105ra\u0161o.
caldav.server.writeChannelUnavailable=\u0160is serveris nesi\u016blo tokio susitikim\u0173 kopij\u0173 ra\u0161ymo b\u016bdo. Pasirinkite standartin\u012f CalDAV.
caldav.server.writeChannelNotRecognised=Su \u0161iais nustatymais priedas, si\u016blantis \u0161\u012f susitikim\u0173 kopij\u0173 ra\u0161ymo b\u016bd\u0105, neatpa\u017e\u012fsta \u0161io serverio kaip savo. Patikrinkite, kas pasikeit\u0117 serverio nustatymuose.
caldav.server.url.malformed=Tai netinkamas \u017einiatinklio adresas. Jis turi prasid\u0117ti https:// (arba http:// tuo atveju, jei tai leid\u017eia administratorius) ir nurodyti server\u012f.
caldav.server.url.schemeNotAllowed=Priimami tik https adresai. Jei \u0161is serveris neturi sertifikato, papra\u0161ykite administratoriaus leisti http.
caldav.server.url.credentials=Pa\u0161alinkite vartotojo vard\u0105 ir slapta\u017eod\u012f i\u0161 adreso. eXo naudoja prisijungimo duomenis, su kuriais jungiasi kiekvienas vartotojas, o ne \u012fra\u0161ytus adrese.
caldav.server.url.fragment=Pa\u0161alinkite # ir visk\u0105, kas po jo. Serverio adrese negali b\u016bti fragmento.
caldav.server.url.portNotAllowed=\u0160is prievadas neleid\u017eiamas. Naudokite standartin\u012f prievad\u0105 arba papra\u0161ykite administratoriaus leisti \u0161\u012f.
caldav.server.url.usernameInAuthority=Vietos rezervavimo \u017eenklas {username} gali b\u016bti tik po serverio pavadinimo, kelyje. \u012era\u0161ykite j\u012f kelyje, o ne paties serverio adrese.
caldav.server.url.privateAddress=\u0160is adresas nurodo \u012f j\u016bs\u0173 vidin\u012f tinkl\u0105, tod\u0117l jis nepriimamas. eXo jungiasi i\u0161 serverio, tod\u0117l vidinis adresas gal\u0117t\u0173 b\u016bti panaudotas pasiekti kompiuterius, kurie niekada netur\u0117jo b\u016bti atverti. Jei adresas teisingas, papra\u0161ykite administratoriaus j\u012f leisti.
caldav.server.url.unresolvable=Tokio serverio pavadinimo n\u0117ra. Patikrinkite ra\u0161yb\u0105.
caldav.share.calendarNotFound=\u0160io kalendoriaus neb\u0117ra.
caldav.share.notOwner=Kalendori\u0173 bendrinti gali tik jo savininkas.
caldav.share.notConnected=Prie\u0161 bendrindami kalendori\u0173, prijunkite savo kalendoriaus paskyr\u0105.
caldav.share.calendarNotOnServer=\u0160io kalendoriaus j\u016bs\u0173 kalendori\u0173 serveryje dar n\u0117ra. Bandykite dar kart\u0105 po kito sinchronizavimo.
caldav.share.notSupported=J\u016bs\u0173 kalendori\u0173 serveris neleid\u017eia eXo bendrinti kalendori\u0173.
caldav.share.shareeRequired=Pasirinkite koleg\u0105, su kuriuo norite bendrinti.
caldav.share.shareeUnknown=\u0160is kolega n\u0117ra aktyvus vartotojas.
caldav.share.shareeIsOwner=\u0160is kalendorius jau priklauso jums.
caldav.share.shareeNotConnected=\u0160is kolega neprijungtas prie to paties kalendori\u0173 serverio.
caldav.share.samePrincipal=\u0160is kolega naudoja t\u0105 pa\u010di\u0105 kalendoriaus paskyr\u0105 kaip ir j\u016bs, tod\u0117l jau mato \u0161\u012f kalendori\u0173.
caldav.share.notReadOnly=\u0160is kolega turi daugiau nei per\u017ei\u016bros prieig\u0105, nustatyt\u0105 ne platformoje. Pakeiskite j\u0105 savo kalendoriaus programoje.
caldav.share.aclUnreadable=J\u016bs\u0173 kalendori\u0173 serveris neleid\u017eia platformai matyti, su kuo bendrinamas \u0161is kalendorius.
caldav.share.aclNotUnderstood=\u0160is kalendorius bendrinamas taip, kad platforma negali to saugiai pakeisti. Jo bendrinim\u0105 tvarkykite savo kalendoriaus programoje.
caldav.share.serverRefused=J\u016bs\u0173 kalendori\u0173 serveris atmet\u0117 pakeitim\u0105.
caldav.share.notApplied=J\u016bs\u0173 kalendori\u0173 serveris pri\u0117m\u0117 pakeitim\u0105, bet jo nepritaik\u0117.
caldav.share.serverUnavailable=Nepavyko pasiekti j\u016bs\u0173 kalendori\u0173 serverio. Bandykite dar kart\u0105 v\u0117liau.
caldav.share.credentials=J\u016bs\u0173 kalendori\u0173 serveris atmet\u0117 j\u016bs\u0173 paskyr\u0105. Patikrinkite slapta\u017eod\u012f darbotvark\u0117s nustatymuose.
caldav.share.ownerUnknown=J\u016bs\u0173 kalendori\u0173 serveris nenurod\u0117, kuria paskyra esate prisijung\u0119. Bandykite dar kart\u0105 po kito sinchronizavimo.
caldav.share.foreignAccessNotPreserved=Ka\u017ekas turi daugiau nei per\u017ei\u016bros prieig\u0105 prie \u0161io kalendoriaus, nustatyt\u0105 ne platformoje. Kei\u010diant bendrinim\u0105 \u010dia, ta prieiga gali pasikeisti, tod\u0117l j\u012f tvarkykite savo kalendoriaus programoje.
caldav.share.shareeAddressUnknown=Kalendori\u0173 serveris nepateik\u0117 \u0161io kolegos el. pa\u0161to adreso, tod\u0117l platforma negal\u0117jo pakeisti jo prieigos.
caldav.share.shareeHasOtherAccess=\u0160is kolega turi kitoki\u0105 prieig\u0105 prie \u0161io kalendoriaus, nustatyt\u0105 ne platformoje, pavyzd\u017eiui, mato, kada esate laisvi. Bendrinant \u010dia ji b\u016bt\u0173 pakeista, tod\u0117l j\u0105 keiskite savo kalendoriaus programoje.
caldav.share.notOwnedOnServer=\u0160is kalendorius priklauso ka\u017ekam kitam arba jums neleid\u017eiama tvarkyti jo bendrinimo. I\u0161 platformos galite bendrinti tik savo kalendorius.
