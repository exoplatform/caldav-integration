agenda.caldavCalendar.settings.connection.errorMessage=P\u0159ipojen\u00ed se nezda\u0159ilo
caldav.error.credentials=Server CalDAV toto u\u017eivatelsk\u00e9 jm\u00e9no nebo heslo odm\u00edtl. Zkontrolujte je a zkuste to znovu.
caldav.error.connection=Server CalDAV nen\u00ed dostupn\u00fd. Zkuste to znovu pozd\u011bji nebo kontaktujte sv\u00e9ho spr\u00e1vce.
caldav.error.notCaldav=Tato adresa neodpov\u011bd\u011bla jako kalend\u00e1\u0159 CalDAV. Po\u017e\u00e1dejte sv\u00e9ho spr\u00e1vce o kontrolu nakonfigurovan\u00e9 adresy serveru.
caldav.error.serverNotUsable=Tento kalend\u00e1\u0159ov\u00fd server zat\u00edm nelze pou\u017e\u00edt: slu\u017eba, p\u0159es kterou se p\u0159ihla\u0161uje, nen\u00ed nainstalov\u00e1na. Zkuste to znovu pozd\u011bji nebo se obra\u0165te na sv\u00e9ho spr\u00e1vce.
caldav.error.cors=Server je dostupn\u00fd, ale odm\u00edtl cross-origin po\u017eadavek prohl\u00ed\u017ee\u010de (neodes\u00edl\u00e1 \u017e\u00e1dn\u00e9 hlavi\u010dky CORS). Po\u017e\u00e1dejte sv\u00e9ho spr\u00e1vce, aby jej zp\u0159\u00edstupnil p\u0159es vlastn\u00ed adresu platformy.
caldav.admin.servers.title=Servery CalDAV
caldav.admin.servers.subtitle=P\u0159idejte servery CalDAV, ke kter\u00fdm mohou u\u017eivatel\u00e9 p\u0159ipojit osobn\u00ed \u00fa\u010det. Osobn\u00ed kalend\u00e1\u0159e se synchronizuj\u00ed obousm\u011brn\u011b s M\u00fdmi kalend\u00e1\u0159i. Sch\u016fzky eXo se kop\u00edruj\u00ed jednosm\u011brn\u011b, pouze do osobn\u00edho kalend\u00e1\u0159e.
caldav.admin.servers.add=P\u0159idat
caldav.admin.servers.noServers=Zat\u00edm nebyl deklarov\u00e1n \u017e\u00e1dn\u00fd server CalDAV
caldav.admin.servers.list.name=N\u00e1zev
caldav.admin.servers.list.activate=Aktivovat
caldav.admin.servers.list.actions=Akce
caldav.admin.servers.preset.label=O jak\u00fd server se jedn\u00e1?
caldav.admin.servers.preset.stalwart.label=Stalwart
caldav.admin.servers.preset.stalwart.summary=Vyplnil jsem n\u00e1zev serveru a form\u00e1t adresy. Stalwart zachov\u00e1v\u00e1 to, co eXo odes\u00edl\u00e1, proto je nastaven tak, aby zachoval v\u0161e, m\u00edsto aby p\u0159eb\u00edral v\u00fdjimky platn\u00e9 pro cel\u00e9 nasazen\u00ed.\n\nKopie se ukl\u00e1daj\u00ed do samostatn\u00e9ho kalend\u00e1\u0159e Sch\u016fzky eXo. Odkazy pro odpov\u011b\u010f jsou vypnut\u00e9, proto\u017ee Stalwart p\u0159ij\u00edm\u00e1 odpov\u011bdi z jak\u00e9hokoli kalend\u00e1\u0159e a vlastn\u00ed tla\u010d\u00edtka P\u0159ijmout a Odm\u00edtnout v klientovi u\u017e na kopii funguj\u00ed.\n\nP\u0159ed ulo\u017een\u00edm v\u0161e zkontrolujte.
caldav.admin.servers.preset.other.label=Jin\u00fd server
caldav.admin.servers.preset.other.summary=Nic nen\u00ed vypln\u011bno. Chyb\u011bj\u00edc\u00ed server je takov\u00fd, kter\u00fd jsme netestovali, nikoli nepodporovan\u00fd. Vypl\u0148te formul\u00e1\u0159 sami a eXo navrhne nastaven\u00ed, jakmile se synchronizuj\u00ed prvn\u00ed ud\u00e1losti.
caldav.admin.servers.preset.changesWhatIsWritten=Jedna z t\u011bchto zm\u011bn m\u011bn\u00ed to, co eXo zapisuje do kalend\u00e1\u0159\u016f va\u0161ich u\u017eivatel\u016f, nejen to, co porovn\u00e1v\u00e1.
caldav.admin.servers.name=N\u00e1zev
caldav.admin.servers.name.placeholder=N\u00e1zev zobrazen\u00fd u\u017eivatel\u016fm
caldav.admin.servers.description=Popis
caldav.admin.servers.description.placeholder=Voliteln\u00fd popis zobrazen\u00fd u\u017eivatel\u016fm
caldav.admin.servers.url=URL serveru
caldav.admin.servers.url.placeholder=https://caldav.example.org/dav/cal/{username}/
caldav.admin.servers.url.hint=URL m\u016f\u017ee obsahovat z\u00e1stupn\u00fd symbol {username}, kter\u00fd se nahrad\u00ed \u00fa\u010dtem, kter\u00fdm se ka\u017ed\u00fd u\u017eivatel p\u0159ipojuje.
caldav.admin.servers.url.reachabilityHint=eXo se p\u0159ipojuje ze serveru, nikoli z prohl\u00ed\u017ee\u010de u\u017eivatele, tak\u017ee tato adresa mus\u00ed b\u00fdt dostupn\u00e1 pouze ze serveru. Intern\u00ed adresy jsou odm\u00edtnuty, pokud je va\u0161e nasazen\u00ed nepovoluje, proto\u017ee jinak by eXo mohlo b\u00fdt zneu\u017eito k p\u0159\u00edstupu k po\u010d\u00edta\u010d\u016fm, kter\u00e9 nikdy nem\u011bly b\u00fdt zp\u0159\u00edstupn\u011bny.
caldav.admin.servers.url.corsHint=U\u017eivatel\u00e9 se p\u0159ipojuj\u00ed ze sv\u00e9ho prohl\u00ed\u017ee\u010de, tak\u017ee adresa mus\u00ed m\u00edt stejn\u00fd p\u016fvod (origin) jako platforma, nebo odes\u00edlat hlavi\u010dky CORS. Server t\u0159et\u00ed strany bez nich mus\u00ed b\u00fdt zp\u0159\u00edstupn\u011bn p\u0159es vlastn\u00ed adresu platformy.
caldav.admin.servers.drawer.add.title=P\u0159idat server CalDAV
caldav.admin.servers.drawer.edit.title=Konektor {0}
caldav.admin.servers.drawer.add=P\u0159idat
caldav.admin.servers.drawer.save=Ulo\u017eit
caldav.admin.servers.drawer.cancel=Zru\u0161it
caldav.admin.servers.drawer.updateTheIcon=Aktualizovat ikonu
caldav.admin.servers.drawer.button.chooseIcon=Vybrat
caldav.admin.servers.drawer.upload=Nahr\u00e1t
caldav.admin.servers.drawer.resetDefault=Zp\u011bt na v\u00fdchoz\u00ed ikonu
caldav.admin.servers.drawer.tooBigFile=Obr\u00e1zek mus\u00ed m\u00edt m\u00e9n\u011b ne\u017e 100 kB
caldav.admin.servers.drawer.uploadingError=Obr\u00e1zek se nepoda\u0159ilo nahr\u00e1t. Zkuste to znovu.
caldav.admin.servers.drawer.caldavSettings=Nastaven\u00ed CalDAV
caldav.admin.servers.copies.title=Kopie sch\u016fzek
caldav.admin.servers.answerLinks.label=P\u0159idat ke kopii odkazy pro odpov\u011b\u010f
caldav.admin.servers.answerLinks.hint=P\u0159id\u00e1 do popisu ka\u017ed\u00e9 zkop\u00edrovan\u00e9 sch\u016fzky odkazy P\u0159ijmout, Odm\u00edtnout a Nez\u00e1vazn\u011b. Vypn\u011bte to pouze tehdy, pokud kalend\u00e1\u0159n\u00ed klienti ji\u017e zobrazuj\u00ed vlastn\u00ed tla\u010d\u00edtka pro odpov\u011b\u010f, jinak u\u017eivatel\u00e9 nebudou moci odpov\u011bd\u011bt v\u016fbec.
caldav.admin.servers.mirrorTarget.label=Kam se zapisuj\u00ed kopie sch\u016fzek
caldav.admin.servers.mirrorTarget.appliesTo=Plat\u00ed pro u\u017eivatele, kte\u0159\u00ed maj\u00ed kopie sch\u016fzek zapnut\u00e9 ve vlastn\u00edm nastaven\u00ed kalend\u00e1\u0159e.
caldav.admin.servers.mirrorTarget.dedicated.label=Samostatn\u00fd kalend\u00e1\u0159 Sch\u016fzky eXo
caldav.admin.servers.mirrorTarget.dedicated.consequence=Odd\u011bluje sch\u016fzky eXo od vlastn\u00edch ud\u00e1lost\u00ed u\u017eivatele. Na n\u011bkter\u00fdch serverech je samostatn\u00fd kalend\u00e1\u0159 vynech\u00e1n z dostupnosti, tak\u017ee kolegov\u00e9 vid\u00ed \u010dasy sch\u016fzek eXo jako voln\u00e9 a na kopi\u00edch se nezobraz\u00ed \u017e\u00e1dn\u00e1 tla\u010d\u00edtka pro odpov\u011b\u010f.
caldav.admin.servers.mirrorTarget.main.label=Hlavn\u00ed kalend\u00e1\u0159 \u00fa\u010dtu
caldav.admin.servers.mirrorTarget.main.consequence=Kopie se zapo\u010d\u00edt\u00e1vaj\u00ed do dostupnosti u\u017eivatele a vlastn\u00ed tla\u010d\u00edtka serveru pro odpov\u011b\u010f se zobraz\u00ed tam, kde je server nab\u00edz\u00ed. Tuto mo\u017enost zvolte a\u017e pot\u00e9, co se kopie na tomto serveru synchronizuj\u00ed bez probl\u00e9m\u016f.
caldav.admin.servers.mirrorTarget.moves=Zm\u011bna tohoto nastaven\u00ed p\u0159esune st\u00e1vaj\u00edc\u00ed kopie ka\u017ed\u00e9ho u\u017eivatele b\u011bhem jeho dal\u0161\u00edch synchronizac\u00ed. Star\u00fd kalend\u00e1\u0159 Sch\u016fzky eXo z\u016fstane na m\u00edst\u011b, pr\u00e1zdn\u00fd.
caldav.admin.servers.writeChannel.label=Zp\u016fsob z\u00e1pisu kopi\u00ed sch\u016fzek
caldav.admin.servers.writeChannel.hint=Plat\u00ed pro ka\u017edou kopii, kterou eXo na tomto serveru zap\u00ed\u0161e nebo odstran\u00ed, u v\u0161ech u\u017eivatel\u016f.
caldav.admin.servers.writeChannel.caldav.label=Standardn\u00ed CalDAV
caldav.admin.servers.writeChannel.caldav.consequenceAnyServer=Funguje s ka\u017ed\u00fdm serverem CalDAV. N\u011bkter\u00e9 servery odes\u00edlaj\u00ed vlastn\u00ed pozv\u00e1nky na sch\u016fzku zapsanou t\u00edmto zp\u016fsobem: pozvan\u00ed na stejn\u00e9m serveru ji pak obdr\u017e\u00ed dvakr\u00e1t a odpov\u011b\u010f, kterou daj\u00ed na vlastn\u00ed kopii serveru, se do eXo nikdy nedostane.
caldav.admin.servers.writeChannel.unavailable.label=Zp\u016fsob, kter\u00fd tato platforma ji\u017e nenab\u00edz\u00ed ({0})
caldav.admin.servers.writeChannel.unavailable.consequence=Dopln\u011bk, kter\u00fd zapisuje kopie t\u00edmto zp\u016fsobem, nen\u00ed nainstalov\u00e1n, proto je ka\u017ed\u00e1 kopie pro tento server odm\u00edtnuta, dokud nebude znovu nainstalov\u00e1n nebo dokud nep\u0159epnete na standardn\u00ed CalDAV.
caldav.admin.servers.drawer.add.success=Server CalDAV byl p\u0159id\u00e1n
caldav.admin.servers.drawer.add.error=Server CalDAV se nepoda\u0159ilo p\u0159idat. Zkontrolujte hodnoty a zkuste to znovu.
caldav.admin.servers.drawer.edit.success=Server CalDAV byl aktualizov\u00e1n
caldav.admin.servers.drawer.edit.error=Server CalDAV se nepoda\u0159ilo aktualizovat. Zkontrolujte hodnoty a zkuste to znovu.
caldav.admin.servers.activate.success=Server CalDAV byl aktivov\u00e1n
caldav.admin.servers.deactivate.success=Server CalDAV byl deaktivov\u00e1n
caldav.admin.servers.activate.error=Server CalDAV se nepoda\u0159ilo aktivovat
caldav.admin.servers.deactivate.error=Server CalDAV se nepoda\u0159ilo deaktivovat
caldav.admin.servers.delete.success=Server CalDAV byl odstran\u011bn
caldav.admin.servers.delete.error=Server CalDAV se nepoda\u0159ilo odstranit
caldav.admin.servers.delete.referenced=Po\u010det p\u0159ipojen\u00fdch \u00fa\u010dt\u016f, kter\u00e9 tento server st\u00e1le pou\u017e\u00edvaj\u00ed: {0}. P\u0159ed odstran\u011bn\u00edm jej deaktivujte a nechte u\u017eivatele odpojit.
caldav.admin.servers.modal.delete.title=Odstranit server CalDAV
caldav.admin.servers.modal.delete.message=Server zmiz\u00ed z konektor\u016f v\u0161ech u\u017eivatel\u016f. \u00da\u010dty, kter\u00e9 jsou k n\u011bmu st\u00e1le p\u0159ipojen\u00e9, odstran\u011bn\u00ed blokuj\u00ed.
caldav.admin.servers.modal.delete.confirmDelete=Delete
caldav.admin.servers.modal.delete.cancelDelete=Cancel
agenda.caldavCalendar.calendarDelete.propagates=Tento kalend\u00e1\u0159 je tak\u00e9 na {0}. Jeho odstran\u011bn\u00edm zde se odstran\u00ed i tam, v\u010detn\u011b v\u0161ech jeho ud\u00e1lost\u00ed. To se t\u00fdk\u00e1 i ud\u00e1lost\u00ed, kter\u00e9 jste p\u0159idali z telefonu nebo jin\u00e9 aplikace, a nelze to vr\u00e1tit zp\u011bt.
agenda.caldavCalendar.calendarDelete.keepsRemote=Odpov\u00eddaj\u00edc\u00edho kalend\u00e1\u0159e na {0} se zm\u011bna nedotkne. Z\u016fstane tam se v\u0161emi sv\u00fdmi ud\u00e1lostmi a eXo jej jen p\u0159estane zobrazovat.
caldav.hiddenCalendars.title=Skryt\u00e9 kalend\u00e1\u0159e
caldav.hiddenCalendars.subtitle=Po\u010det kalend\u00e1\u0159\u016f, kter\u00e9 jste zde odstranili a kter\u00e9 jsou st\u00e1le ve va\u0161em kalend\u00e1\u0159n\u00edm \u00fa\u010dtu: {0}
caldav.hiddenCalendars.manage=Spravovat skryt\u00e9 kalend\u00e1\u0159e
caldav.hiddenCalendars.drawer.title=Skryt\u00e9 kalend\u00e1\u0159e
caldav.hiddenCalendars.drawer.description=Tyto kalend\u00e1\u0159e jste odstranili z eXo, ale rozhodli jste se je ponechat ve sv\u00e9m \u00fa\u010dtu. Pokud n\u011bkter\u00fd znovu zobraz\u00edte, vr\u00e1t\u00ed se p\u0159i dal\u0161\u00ed synchronizaci s ud\u00e1lostmi, kter\u00e9 aktu\u00e1ln\u011b obsahuje.
caldav.hiddenCalendars.showAgain=Znovu zobrazit
caldav.hiddenCalendars.showAgainSuccess={0} se vr\u00e1t\u00ed p\u0159i dal\u0161\u00ed synchronizaci
caldav.hiddenCalendars.showAgainError=Tento kalend\u00e1\u0159 se nepoda\u0159ilo znovu zobrazit
caldav.hiddenCalendars.count=Po\u010det kalend\u00e1\u0159\u016f skryt\u00fdch z va\u0161eho Kalend\u00e1\u0159e: {0}
caldav.hiddenCalendars.drawer.about=Kalend\u00e1\u0159e, kter\u00e9 jste v eXo skryli. Zobrazen\u00edm kalend\u00e1\u0159 vr\u00e1t\u00edte: odstran\u011bn\u00fd kalend\u00e1\u0159 se vr\u00e1t\u00ed p\u0159i dal\u0161\u00ed synchronizaci se sv\u00fdmi aktu\u00e1ln\u00edmi ud\u00e1lostmi, sd\u00edlen\u00fd se vr\u00e1t\u00ed okam\u017eit\u011b do \u010d\u00e1sti Sd\u00edleno se mnou.
caldav.hiddenCalendars.deletedHere=Odstran\u011bno zde, ponech\u00e1no ve va\u0161em kalend\u00e1\u0159n\u00edm \u00fa\u010dtu
caldav.hiddenCalendars.sharedBy=Sd\u00edl\u00ed {0}
caldav.hiddenCalendars.sharedWithYou=Sd\u00edleno s v\u00e1mi
caldav.hiddenCalendars.showAgainSharedSuccess={0} je zp\u011bt v \u010d\u00e1sti Sd\u00edleno se mnou
caldav.hiddenCalendars.notAShare=Skr\u00fdt m\u016f\u017eete pouze kalend\u00e1\u0159e, kter\u00e9 jsou s v\u00e1mi sd\u00edlen\u00e9. Pokud nechcete vid\u011bt n\u011bkter\u00fd ze sv\u00fdch vlastn\u00edch, odstra\u0148te jej a po dotazu vyberte \u201ePonechat v m\u00e9m kalend\u00e1\u0159n\u00edm \u00fa\u010dtu\u201c.
caldav.hiddenCalendars.calendarRequired=Vyberte kalend\u00e1\u0159, kter\u00fd chcete skr\u00fdt.
caldav.hiddenCalendars.accountUnavailable=V\u00e1\u0161 kalend\u00e1\u0159n\u00ed \u00fa\u010det nebyl dostupn\u00fd, tak\u017ee tento kalend\u00e1\u0159 nebyl skryt. Zkuste to znovu za chv\u00edli.

caldav.admin.sync.title=Synchronizace kalend\u00e1\u0159\u016f
caldav.admin.sync.description=Jak \u010dasto a v jak\u00e9m rozsahu eXo \u010dte kalend\u00e1\u0159n\u00ed \u00fa\u010dty, kter\u00e9 va\u0161i u\u017eivatel\u00e9 p\u0159ipojuj\u00ed. Zm\u011bny se projev\u00ed p\u0159i dal\u0161\u00ed synchronizaci.
caldav.admin.sync.throttleMinutes.label=Prodleva mezi synchronizacemi
caldav.admin.sync.throttleMinutes.help=Otev\u0159en\u00ed kalend\u00e1\u0159e na\u010dte p\u0159ipojen\u00fd \u00fa\u010det a pot\u00e9 jej po tuto dobu nech\u00e1 b\u00fdt, bez ohledu na to, kolikr\u00e1t se str\u00e1nka otev\u0159e. Zabr\u00e1n\u00ed se tak tomu, aby vyt\u00ed\u017een\u00fd u\u017eivatel vyvolal po\u017eadavek p\u0159i ka\u017ed\u00e9m vykreslen\u00ed.
caldav.admin.sync.pastDays.label=Na\u010d\u00edtat ud\u00e1losti z minulosti
caldav.admin.sync.pastDays.help=Jak daleko do minulosti eXo na\u010d\u00edt\u00e1 ud\u00e1losti. Minul\u00e9 ud\u00e1losti se m\u011bn\u00ed z\u0159\u00eddka, tak\u017ee na\u010d\u00edt\u00e1n\u00ed men\u0161\u00edho po\u010dtu z nich nestoj\u00ed t\u00e9m\u011b\u0159 nic a ka\u017edou synchronizaci odleh\u010d\u00ed.
caldav.admin.sync.futureDays.label=Na\u010d\u00edtat ud\u00e1losti dop\u0159edu
caldav.admin.sync.futureDays.help=Jak daleko dop\u0159edu eXo na\u010d\u00edt\u00e1 ud\u00e1losti. Pr\u00e1v\u011b toto je n\u00e1kladn\u00e9: \u0161irok\u00e9 okno u \u00fa\u010dtu s roky opakovan\u00fdch sch\u016fzek znamen\u00e1 velk\u00e9 stahov\u00e1n\u00ed, kter\u00e9 se plat\u00ed p\u0159i prvn\u00ed synchronizaci ka\u017ed\u00e9ho dne.
caldav.admin.sync.sweepStaleMinutes.label=Obnovit \u00fa\u010dty, kter\u00e9 nebyly otev\u0159eny po dobu
caldav.admin.sync.sweepStaleMinutes.help=eXo na\u010d\u00edt\u00e1 kalend\u00e1\u0159n\u00ed \u00fa\u010det, kdy\u017e jeho vlastn\u00edk otev\u0159e sv\u016fj kalend\u00e1\u0159, a ten \u010dek\u00e1, ne\u017e se na\u010dte. \u00da\u010dty, kter\u00e9 nikdo neotev\u0159el d\u00e9le ne\u017e po tuto dobu, se m\u00edsto toho obnovuj\u00ed na pozad\u00ed, tak\u017ee se dal\u0161\u00ed kalend\u00e1\u0159 otev\u0159e s ji\u017e p\u0159ipraven\u00fdmi ud\u00e1lostmi.\n\nSni\u017ete tuto hodnotu pro aktu\u00e1ln\u011bj\u0161\u00ed kalend\u00e1\u0159e za cenu v\u00edce po\u017eadavk\u016f na server. Zvy\u0161te ji, pokud jsou kalend\u00e1\u0159n\u00ed servery pomal\u00e9 nebo maj\u00ed omezen\u00fd po\u010det po\u017eadavk\u016f.
caldav.admin.sync.sweepBatchSize.label=Kalend\u00e1\u0159\u016f na jedno spu\u0161t\u011bn\u00ed na pozad\u00ed
caldav.admin.sync.sweepBatchSize.help=Ka\u017ed\u00e9 spu\u0161t\u011bn\u00ed obnov\u00ed nejv\u00fd\u0161e tento po\u010det kalend\u00e1\u0159\u016f, od nejstar\u0161\u00edch. Zvy\u0161te jej pro rychlej\u0161\u00ed dohn\u00e1n\u00ed na vyt\u00ed\u017een\u00e9 instanci, sni\u017ete jej pro rozlo\u017een\u00ed z\u00e1t\u011b\u017ee.
