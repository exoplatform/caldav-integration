caldav.calendarStates.drawer.description=Tyto kalend\u00e1\u0159e se nesynchronizuj\u00ed stejn\u011b jako ostatn\u00ed. Ostatn\u00edch va\u0161ich kalend\u00e1\u0159\u016f se to net\u00fdk\u00e1.
caldav.calendarStates.explain.REMOTE_CREATE_REFUSED=V\u00e1\u0161 kalend\u00e1\u0159n\u00ed \u00fa\u010det neumo\u017e\u0148uje eXo vytv\u00e1\u0159et v n\u011bm kalend\u00e1\u0159e, proto se tento kalend\u00e1\u0159 do n\u011bj nekop\u00edruje. Kalend\u00e1\u0159e, kter\u00e9 v \u00fa\u010dtu ji\u017e existuj\u00ed, se v eXo st\u00e1le zobrazuj\u00ed.
caldav.calendarStates.explain.PAUSED=Synchronizace tohoto kalend\u00e1\u0159e opakovan\u011b selhala, a proto ji eXo p\u0159estalo zkou\u0161et. Klikn\u011bte na Synchronizovat nyn\u00ed a za\u010dn\u011bte znovu; pokud selh\u00e1n\u00ed pokra\u010duj\u00ed, p\u0159ipojte \u00fa\u010det znovu.
caldav.calendarStates.explain.EXO_ORPHANED=Tento kalend\u00e1\u0159 jste odstranili v eXo, ale ve va\u0161em kalend\u00e1\u0159n\u00edm \u00fa\u010dtu jej nebylo mo\u017en\u00e9 odstranit. St\u00e1le tam je.
caldav.calendarStates.explain.REMOTE_GONE=Tento kalend\u00e1\u0159 ji\u017e ve va\u0161em kalend\u00e1\u0159n\u00edm \u00fa\u010dtu nen\u00ed. Nic nov\u00e9ho do n\u011bj nep\u0159ibude a to, co eXo ji\u017e obsahuje, z\u016fstane nedot\u010deno.
caldav.calendarStates.explain.RETIRED_SUBSCRIPTION=Toto je kopie kalend\u00e1\u0159e sd\u00edlen\u00e9ho s v\u00e1mi nebo zdroje, kter\u00fd odeb\u00edr\u00e1te. Ji\u017e se nesynchronizuje, tak\u017ee zm\u011bny zde se nikam neprom\u00edtnou. Odstra\u0148te ji a origin\u00e1l se zobraz\u00ed v \u010d\u00e1sti Sd\u00edleno se mnou, pouze pro \u010dten\u00ed.
caldav.calendarStates.explain.unknown=Tento kalend\u00e1\u0159 se nesynchronizuje norm\u00e1ln\u011b.
