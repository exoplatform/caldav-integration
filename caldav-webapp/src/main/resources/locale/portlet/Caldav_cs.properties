caldav.admin.servers.quirks.changesWhatIsWritten=M\u011bn\u00ed to, co eXo zapisuje do kalend\u00e1\u0159\u016f na tomto serveru
caldav.admin.servers.foreignWriters.title=Dal\u0161\u00ed nasazen\u00ed eXo zapisuj\u00edc\u00ed sem
caldav.admin.servers.foreignWriters.subtitle=Jin\u00e1 instance eXo zapsala kopie sch\u016fzek do \u00fa\u010dt\u016f na tomto serveru. Ob\u011b opravuj\u00ed stejn\u00e9 kopie a \u017e\u00e1dn\u00e1 z nich nedok\u00e1\u017ee rozli\u0161it z\u00e1pisy t\u00e9 druh\u00e9 od zm\u011bny, kterou n\u011bkdo provedl.
caldav.admin.servers.foreignWriters.none=Nebylo zji\u0161t\u011bno, \u017ee by do \u00fa\u010dt\u016f na tomto serveru zapisovala jin\u00e1 instance eXo. Tak vypad\u00e1 server, do kter\u00e9ho zapisuje pouze toto nasazen\u00ed, a nevy\u017eaduje \u017e\u00e1dnou pozornost.
caldav.admin.servers.foreignWriters.cost=eXo kontroluje kopie sch\u016fzek, kter\u00e9 sem odeslalo, a opravuje to, co se zm\u011bnilo, za p\u0159edpokladu, \u017ee je v\u0161echny zapsalo samo. Kopie zapsan\u00e9 t\u00edmto jin\u00fdm nasazen\u00edm se po\u010d\u00edtaj\u00ed a porovn\u00e1vaj\u00ed, jako by byly vlastn\u00ed kopie eXo.
caldav.admin.servers.foreignWriters.lastSeen=Naposledy zji\u0161t\u011bno {0}
caldav.admin.servers.foreignWriters.resolution=P\u0159ipojte jedno z obou nasazen\u00ed k jin\u00e9mu \u00fa\u010dtu CalDAV. Mezit\u00edm se zde nic neimportuje, neodstra\u0148uje ani neopravuje jinak a ji\u017e zapsan\u00e9 kopie z\u016fstanou, dokud je n\u011bkdo neodstran\u00ed.
caldav.admin.servers.quirks.omitsSoloOrganizer.label=Tento server vynech\u00e1v\u00e1 organiz\u00e1tora u ud\u00e1losti bez dal\u0161\u00edch \u00fa\u010dastn\u00edk\u016f
caldav.admin.servers.quirks.omitsSoloOrganizer.cost=Nic se nem\u011bn\u00ed: eXo ji\u017e na ka\u017ed\u00e9m serveru vynech\u00e1v\u00e1 organiz\u00e1tora u ud\u00e1lost\u00ed bez dal\u0161\u00edch \u00fa\u010dastn\u00edk\u016f. Kopie ud\u00e1lost\u00ed s \u00fa\u010dastn\u00edky sv\u00e9ho organiz\u00e1tora st\u00e1le uv\u00e1d\u011bj\u00ed.
caldav.error.mainCalendarUnknown=eXo nem\u016f\u017ee kop\u00edrovat va\u0161e sch\u016fzky do tohoto \u00fa\u010dtu: \u00fa\u010det neuv\u00e1d\u00ed, kter\u00fd z jeho kalend\u00e1\u0159\u016f je v\u00fdchoz\u00ed, tak\u017ee je nen\u00ed kam ulo\u017eit. Kontaktujte sv\u00e9ho spr\u00e1vce.
caldav.error.foreignCopy=Tato sch\u016fzka je ji\u017e ve va\u0161em kalend\u00e1\u0159n\u00edm \u00fa\u010dtu, p\u0159idan\u00e1 n\u011bk\u00fdm jin\u00fdm. eXo tuto kopii ponech\u00e1 beze zm\u011bny.
caldav.error.forbidden=Tento kalend\u00e1\u0159 je s v\u00e1mi sd\u00edlen pouze pro \u010dten\u00ed, proto do n\u011bj nelze va\u0161i zm\u011bnu ulo\u017eit.

caldav.server.authProviderUnknown=Tato metoda ov\u011b\u0159ov\u00e1n\u00ed nen\u00ed na tomto serveru k dispozici. Vyberte jednu ze seznamu.
caldav.server.writeChannelUnavailable=Tento server nenab\u00edz\u00ed tento zp\u016fsob z\u00e1pisu kopi\u00ed sch\u016fzek. Vyberte standardn\u00ed CalDAV.
caldav.server.writeChannelNotRecognised=S t\u00edmto nastaven\u00edm dopln\u011bk, kter\u00fd nab\u00edz\u00ed tento zp\u016fsob z\u00e1pisu kopi\u00ed sch\u016fzek, nerozpozn\u00e1v\u00e1 tento server jako jeden ze sv\u00fdch. Zkontrolujte, co se v nastaven\u00ed serveru zm\u011bnilo.
caldav.server.url.malformed=Toto nen\u00ed pou\u017eiteln\u00e1 webov\u00e1 adresa. Mus\u00ed za\u010d\u00ednat https:// (nebo http://, pokud to v\u00e1\u0161 spr\u00e1vce povoluje) a uv\u00e1d\u011bt server.
caldav.server.url.schemeNotAllowed=P\u0159ij\u00edmaj\u00ed se pouze adresy https. Pokud tento server nem\u00e1 certifik\u00e1t, po\u017e\u00e1dejte sv\u00e9ho spr\u00e1vce o povolen\u00ed http.
caldav.server.url.credentials=Odeberte z adresy u\u017eivatelsk\u00e9 jm\u00e9no a heslo. eXo pou\u017e\u00edv\u00e1 p\u0159ihla\u0161ovac\u00ed \u00fadaje, se kter\u00fdmi se p\u0159ipojuje ka\u017ed\u00fd u\u017eivatel, nikdy ne \u00fadaje zapsan\u00e9 v adrese.
caldav.server.url.fragment=Odeberte znak # a v\u0161e za n\u00edm. Adresa serveru neobsahuje fragment.
caldav.server.url.portNotAllowed=Tento port nen\u00ed povolen. Pou\u017eijte standardn\u00ed port nebo po\u017e\u00e1dejte sv\u00e9ho spr\u00e1vce o povolen\u00ed tohoto portu.
caldav.server.url.usernameInAuthority=Z\u00e1stupn\u00fd symbol {username} se m\u016f\u017ee objevit pouze za n\u00e1zvem serveru, v cest\u011b. Um\u00edst\u011bte jej do cesty, ne do adresy samotn\u00e9ho serveru.
caldav.server.url.privateAddress=Tato adresa sm\u011b\u0159uje do va\u0161\u00ed vlastn\u00ed s\u00edt\u011b, a proto nen\u00ed p\u0159ijata. eXo se p\u0159ipojuje ze serveru, tak\u017ee intern\u00ed adresa by mohla b\u00fdt zneu\u017eita k p\u0159\u00edstupu k po\u010d\u00edta\u010d\u016fm, kter\u00e9 nikdy nem\u011bly b\u00fdt zp\u0159\u00edstupn\u011bny. Pokud je spr\u00e1vn\u00e1, po\u017e\u00e1dejte sv\u00e9ho spr\u00e1vce o jej\u00ed povolen\u00ed.
caldav.server.url.unresolvable=Tento n\u00e1zev serveru neexistuje. Zkontrolujte pravopis.
caldav.share.calendarNotFound=Tento kalend\u00e1\u0159 ji\u017e neexistuje.
caldav.share.notOwner=Kalend\u00e1\u0159 m\u016f\u017ee sd\u00edlet pouze jeho vlastn\u00edk.
caldav.share.notConnected=P\u0159ed sd\u00edlen\u00edm kalend\u00e1\u0159e p\u0159ipojte sv\u016fj kalend\u00e1\u0159ov\u00fd \u00fa\u010det.
caldav.share.calendarNotOnServer=Tento kalend\u00e1\u0159 na va\u0161em kalend\u00e1\u0159ov\u00e9m serveru zat\u00edm nen\u00ed. Zkuste to znovu po p\u0159\u00ed\u0161t\u00ed synchronizaci.
caldav.share.notSupported=V\u00e1\u0161 kalend\u00e1\u0159ov\u00fd server neumo\u017e\u0148uje eXo sd\u00edlet kalend\u00e1\u0159e.
caldav.share.shareeRequired=Vyberte kolegu, se kter\u00fdm chcete kalend\u00e1\u0159 sd\u00edlet.
caldav.share.shareeUnknown=Tento kolega nen\u00ed aktivn\u00ed u\u017eivatel.
caldav.share.shareeIsOwner=Tento kalend\u00e1\u0159 ji\u017e vlastn\u00edte.
caldav.share.shareeNotConnected=Tento kolega nen\u00ed p\u0159ipojen ke stejn\u00e9mu kalend\u00e1\u0159ov\u00e9mu serveru.
caldav.share.samePrincipal=Tento kolega pou\u017e\u00edv\u00e1 stejn\u00fd kalend\u00e1\u0159ov\u00fd \u00fa\u010det jako vy, tak\u017ee tento kalend\u00e1\u0159 ji\u017e vid\u00ed.
caldav.share.notReadOnly=Tento kolega m\u00e1 ke kalend\u00e1\u0159i v\u00edce ne\u017e p\u0159\u00edstup pro \u010dten\u00ed, nastaven\u00fd mimo platformu. Zm\u011b\u0148te to ve sv\u00e9 kalend\u00e1\u0159ov\u00e9 aplikaci.
caldav.share.aclUnreadable=V\u00e1\u0161 kalend\u00e1\u0159ov\u00fd server neumo\u017e\u0148uje platform\u011b zjistit, s k\u00fdm je tento kalend\u00e1\u0159 sd\u00edlen.
caldav.share.aclNotUnderstood=Tento kalend\u00e1\u0159 je sd\u00edlen zp\u016fsobem, kter\u00fd platforma nem\u016f\u017ee bezpe\u010dn\u011b zm\u011bnit. Spravujte jeho sd\u00edlen\u00ed ve sv\u00e9 kalend\u00e1\u0159ov\u00e9 aplikaci.
caldav.share.serverRefused=V\u00e1\u0161 kalend\u00e1\u0159ov\u00fd server zm\u011bnu odm\u00edtl.
caldav.share.notApplied=V\u00e1\u0161 kalend\u00e1\u0159ov\u00fd server zm\u011bnu p\u0159ijal, ale neprovedl ji.
caldav.share.serverUnavailable=V\u00e1\u0161 kalend\u00e1\u0159ov\u00fd server nen\u00ed dostupn\u00fd. Zkuste to znovu pozd\u011bji.
caldav.share.credentials=V\u00e1\u0161 kalend\u00e1\u0159ov\u00fd server odm\u00edtl v\u00e1\u0161 \u00fa\u010det. Zkontrolujte heslo v nastaven\u00ed Kalend\u00e1\u0159e.
caldav.share.ownerUnknown=V\u00e1\u0161 kalend\u00e1\u0159ov\u00fd server neuvedl, ke kter\u00e9mu \u00fa\u010dtu jste p\u0159ipojeni. Zkuste to znovu po p\u0159\u00ed\u0161t\u00ed synchronizaci.
caldav.share.foreignAccessNotPreserved=N\u011bkdo m\u00e1 k tomuto kalend\u00e1\u0159i v\u00edce ne\u017e p\u0159\u00edstup pro \u010dten\u00ed, nastaven\u00fd mimo platformu. Zm\u011bna sd\u00edlen\u00ed zde by mohla tento p\u0159\u00edstup ovlivnit, proto ho spravujte ve sv\u00e9 kalend\u00e1\u0159ov\u00e9 aplikaci.
caldav.share.shareeAddressUnknown=Kalend\u00e1\u0159ov\u00fd server neposkytl e-mailovou adresu tohoto kolegy, proto platforma nemohla zm\u011bnit jeho p\u0159\u00edstup.
caldav.share.shareeHasOtherAccess=Tento kolega m\u00e1 k tomuto kalend\u00e1\u0159i jin\u00fd p\u0159\u00edstup, nastaven\u00fd mimo platformu, nap\u0159\u00edklad vid\u00ed, kdy m\u00e1te volno. Sd\u00edlen\u00ed zde by ho nahradilo, proto to zm\u011b\u0148te ve sv\u00e9 kalend\u00e1\u0159ov\u00e9 aplikaci.
caldav.share.notOwnedOnServer=Tento kalend\u00e1\u0159 pat\u0159\u00ed n\u011bkomu jin\u00e9mu nebo nem\u00e1te opr\u00e1vn\u011bn\u00ed spravovat jeho sd\u00edlen\u00ed. Z platformy m\u016f\u017eete sd\u00edlet pouze kalend\u00e1\u0159e, kter\u00e9 vlastn\u00edte.
caldav.admin.servers.drawer.authentication=Ov\u011b\u0159ov\u00e1n\u00ed
caldav.admin.servers.drawer.authProvider=Zp\u016fsob ov\u011b\u0159ov\u00e1n\u00ed u\u017eivatel\u016f
caldav.admin.servers.drawer.disconnection.title=Zm\u011bnit ov\u011b\u0159ov\u00e1n\u00ed
caldav.admin.servers.drawer.disconnection.one=Zm\u011bna ov\u011b\u0159ov\u00e1n\u00ed odpoj\u00ed 1 u\u017eivatele tohoto serveru.
caldav.admin.servers.drawer.disconnection.many=Zm\u011bna ov\u011b\u0159ov\u00e1n\u00ed odpoj\u00ed u\u017eivatele tohoto serveru (po\u010det: {0}).
caldav.admin.servers.drawer.disconnection.question=Opravdu chcete ulo\u017eit?
caldav.admin.servers.drawer.disconnection.confirm=Ulo\u017eit
caldav.admin.servers.drawer.disconnection.cancel=Zru\u0161it
caldav.admin.servers.drawer.disconnection.countFailed=U\u017eivatele tohoto serveru se nepoda\u0159ilo spo\u010d\u00edtat. Nic nebylo ulo\u017eeno, zkuste to znovu.
