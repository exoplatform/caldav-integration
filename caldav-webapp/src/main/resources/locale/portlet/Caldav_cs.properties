caldav.managed.serverNotEligible=Vyberte server, kter\u00fd je nakonfigurovan\u00fd a aktivn\u00ed. Deaktivovan\u00fd server nen\u00ed dostupn\u00fd, tak\u017ee by se v re\u017eimu jednotn\u00e9ho p\u0159ihl\u00e1\u0161en\u00ed nikdo nemohl p\u0159ipojit.
caldav.managed.providerNotEligible=V re\u017eimu jednotn\u00e9ho p\u0159ihl\u00e1\u0161en\u00ed nem\u016f\u017ee tento server pou\u017e\u00edvat poskytovatele, kter\u00fd vy\u017eaduje p\u0159ihla\u0161ovac\u00ed \u00fadaje ka\u017ed\u00e9ho u\u017eivatele. Vypn\u011bte jednotn\u00e9 p\u0159ihl\u00e1\u0161en\u00ed nebo vyberte poskytovatele se slu\u017eebn\u00edm \u00fa\u010dtem.
caldav.admin.servers.list.managedLocked=Tento server nelze deaktivovat ani odstranit, dokud ho pou\u017e\u00edv\u00e1 jednotn\u00e9 p\u0159ihl\u00e1\u0161en\u00ed. Nejprve vypn\u011bte jednotn\u00e9 p\u0159ihl\u00e1\u0161en\u00ed v \u0159\u00e1dku nad seznamem server\u016f.
caldav.managed.serverInUse=Tento server nelze deaktivovat, dokud je zapnut\u00e9 jednotn\u00e9 p\u0159ihl\u00e1\u0161en\u00ed, proto\u017ee se s n\u00edm v\u0161ichni synchronizuj\u00ed. Nejprve vypn\u011bte jednotn\u00e9 p\u0159ihl\u00e1\u0161en\u00ed v \u0159\u00e1dku nad seznamem server\u016f.
caldav.managed.connectionLocked=V\u00e1\u0161 kalend\u00e1\u0159ov\u00fd \u00fa\u010det spravuje va\u0161e organizace: jeho p\u0159ipojen\u00ed nelze zm\u011bnit.
caldav.managed.refused=Kalend\u00e1\u0159ov\u00fd server va\u0161\u00ed organizace nep\u0159ij\u00edm\u00e1 v\u00e1\u0161 \u00fa\u010det. Obra\u0165te se na sv\u00e9ho spr\u00e1vce.
agenda.caldavCalendar.disconnect.warning=Kalend\u00e1\u0159e z {0}, kter\u00e9 eXo zobrazuje, budou odebr\u00e1ny z va\u0161eho Kalend\u00e1\u0159e spolu s kopiemi jejich ud\u00e1lost\u00ed. Na {0} se nic neodstran\u00ed a kalend\u00e1\u0159e, kter\u00e9 jste vytvo\u0159ili v eXo, z\u016fstanou. Po op\u011btovn\u00e9m p\u0159ipojen\u00ed \u00fa\u010dtu se tyto kalend\u00e1\u0159e vr\u00e1t\u00ed.
caldav.pendingCopies.title=Kopie sch\u016fzek, kter\u00e9 jsou st\u00e1le na cest\u011b
caldav.pendingCopies.subtitle=Po\u010det va\u0161ich sch\u016fzek, kter\u00e9 se v eXo zm\u011bnily a jejich\u017e zm\u011bna se do va\u0161eho kalend\u00e1\u0159e je\u0161t\u011b nedostala: {0}. eXo to zkou\u0161\u00ed d\u00e1l; dal\u0161\u00ed synchronizace na pozad\u00ed je obvykle vy\u0159e\u0161\u00ed.
