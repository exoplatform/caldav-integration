caldav.admin.sync.pastDays.help=Wie weit zur\u00fcck eXo Ereignisse liest. Vergangene Ereignisse \u00e4ndern sich selten: Weniger zu lesen kostet fast nichts und entlastet jede Synchronisierung.
caldav.admin.sync.futureDays.label=Im Voraus gelesener Zeitraum
caldav.admin.sync.futureDays.help=Wie weit im Voraus Ereignisse gelesen werden. Ein langer Zeitraum macht die erste Synchronisierung jedes Tages schwerer.
