caldav.tuning.pastDaysOutOfRange=Reading the past must be between 0 and 365 days.
caldav.tuning.futureDaysOutOfRange=Reading ahead must be between 1 and 365 days.
caldav.tuning.sweepStaleOutOfRange=The background refresh delay must be between 1 minute and one week.
caldav.tuning.sweepBatchOutOfRange=The background run must take between 1 and 500 calendars.
caldav.admin.sync.summary=Es werden {1} Tage zur\u00fcck und {2} Tage voraus gelesen. Eine gerade ge\u00f6ffnete Agenda wartet {0} Minuten, bevor sie das Konto erneut liest; ein Konto, das niemand \u00f6ffnet, wird nach {3} Minuten im Hintergrund aktualisiert.
