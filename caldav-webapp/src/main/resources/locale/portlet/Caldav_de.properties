caldav.hiddenCalendars.accountUnavailable=Your calendar account could not be reached, so this calendar was not hidden. Try again in a moment.

caldav.admin.sync.title=Calendar synchronisation
caldav.admin.sync.description=How often and how widely eXo reads the calendar accounts your users connect. Changes take effect on the next synchronisation.
caldav.admin.sync.throttleMinutes.label=Wait between synchronisations
caldav.admin.sync.throttleMinutes.help=Opening the agenda reads the connected account, then leaves it alone for this long however many times the page is opened. It stops a busy user from making a request on every render.
caldav.admin.sync.pastDays.label=Read events from the past
caldav.admin.sync.pastDays.help=How far back into the past eXo reads events. Past events rarely change, so reading fewer of them costs almost nothing and makes every synchronisation lighter.
caldav.admin.sync.futureDays.label=Read events ahead
caldav.admin.sync.futureDays.help=How far ahead eXo reads events. This is the one that costs: a wide window on an account with years of recurring meetings is a large download, paid on the first synchronisation of each day.
caldav.admin.sync.sweepStaleMinutes.label=Refresh accounts left untouched for
caldav.admin.sync.sweepStaleMinutes.help=eXo liest ein Kalenderkonto, wenn sein Eigent\u00fcmer seine Agenda \u00f6ffnet, und dieser wartet, w\u00e4hrend sie geladen wird. Konten, die l\u00e4nger als diese Dauer niemand ge\u00f6ffnet hat, werden stattdessen im Hintergrund aktualisiert, sodass die n\u00e4chste Agenda mit bereits vorhandenen Ereignissen ge\u00f6ffnet wird.\n\nSenken Sie den Wert f\u00fcr aktuellere Agenden, aber mehr Serveranfragen. Erh\u00f6hen Sie ihn, wenn die Kalenderserver langsam oder durch Anfragelimits beschr\u00e4nkt sind.
caldav.admin.sync.sweepBatchSize.label=Calendars per background run
caldav.admin.sync.sweepBatchSize.help=Each run refreshes at most this many calendars, oldest first. Raise it to catch up faster on a busy instance, lower it to spread the load.
caldav.admin.sync.unit.minutes=minutes
caldav.admin.sync.unit.days=days
caldav.admin.sync.unit.calendars=calendars
