caldav.admin.managed.switchNotice=Benutzer, die mit einem anderen Server verbunden sind, werden innerhalb einer Stunde oder bei ihrer n\u00e4chsten Anmeldung auf diesen umgestellt. Kalender aus ihrem vorherigen Konto werden nicht mehr synchronisiert.
