caldav.error.credentials=Der CalDAV-Server hat diesen Benutzernamen oder dieses Passwort abgelehnt. \u00dcberpr\u00fcfen Sie die Angaben und versuchen Sie es erneut.
caldav.error.connection=Der CalDAV-Server ist nicht erreichbar. Versuchen Sie es sp\u00e4ter erneut oder wenden Sie sich an Ihren Administrator.
caldav.error.notCaldav=Diese Adresse hat nicht als CalDAV-Kalender geantwortet. Bitten Sie Ihren Administrator, die konfigurierte Serveradresse zu \u00fcberpr\u00fcfen.
caldav.error.cors=Der Server ist erreichbar, hat aber die ursprungs\u00fcbergreifende Anfrage des Browsers abgelehnt (er sendet keine CORS-Header). Bitten Sie Ihren Administrator, ihn \u00fcber die eigene Adresse der Plattform bereitzustellen.
caldav.admin.servers.title=CalDAV-Server
caldav.admin.servers.subtitle=F\u00fcgen Sie die CalDAV-Server hinzu, mit denen Benutzer ein pers\u00f6nliches Konto verbinden k\u00f6nnen. Pers\u00f6nliche Kalender werden in beide Richtungen mit \u201eMeine Kalender\u201c synchronisiert. eXo-Meetings werden nur in eine Richtung kopiert, ausschlie\u00dflich in den pers\u00f6nlichen Kalender.
caldav.admin.servers.add=Hinzuf\u00fcgen
caldav.admin.servers.noServers=Noch kein CalDAV-Server angelegt
caldav.admin.servers.list.name=Name
caldav.admin.servers.list.activate=Aktivieren
caldav.admin.servers.list.actions=Aktionen
caldav.admin.servers.preset.label=Um welchen Server handelt es sich?
caldav.admin.servers.preset.bluemind.label=Bluemind
caldav.admin.servers.preset.bluemind.summary=Servername, Adressformat und die bekannten Einschr\u00e4nkungen von BlueMind sind ausgef\u00fcllt: keine Videokonferenz-Links, Outlook- und Thunderbird-Markierungen, eine doppelte Beschreibung, eine Standardpriorit\u00e4t bei jedem Ereignis.\n\nKopien werden im Hauptkalender abgelegt, nicht in einem eigenen Kalender, und Antwortlinks bleiben aktiviert. Pr\u00fcfen Sie die ersten Synchronisationen auf Ihrem Server und \u00fcberpr\u00fcfen Sie alles vor dem Speichern.
caldav.admin.servers.preset.stalwart.label=Stalwart
caldav.admin.servers.preset.stalwart.summary=Ich habe den Servernamen und das Adressformat ausgef\u00fcllt. Stalwart bewahrt, was eXo sendet, daher ist festgelegt, dass alles beibehalten wird, statt die bereitstellungsweiten Ausnahmen zu \u00fcbernehmen.\n\nKopien werden in einem eigenen Kalender "eXo Meetings" abgelegt. Antwortlinks sind deaktiviert, da Stalwart Antworten aus jedem Kalender akzeptiert und die Schaltfl\u00e4chen Annehmen und Ablehnen des Programms bereits auf der Kopie funktionieren.\n\n\u00dcberpr\u00fcfen Sie alles vor dem Speichern.
caldav.admin.servers.preset.other.label=Ein anderer Server
caldav.admin.servers.preset.other.summary=Es ist nichts vorausgef\u00fcllt. Ein fehlender Server ist einer, den wir nicht getestet haben, nicht einer, der nicht unterst\u00fctzt wird. F\u00fcllen Sie das Formular selbst aus; eXo schl\u00e4gt Einstellungen vor, sobald die ersten Ereignisse synchronisiert wurden.
caldav.admin.servers.preset.changesWhatIsWritten=Eine dieser Optionen \u00e4ndert, was eXo in die Kalender Ihrer Benutzer schreibt, nicht nur, was es vergleicht.
caldav.admin.servers.name=Name
caldav.admin.servers.name.placeholder=F\u00fcr Benutzer angezeigter Name
caldav.admin.servers.description=Beschreibung
caldav.admin.servers.description.placeholder=Optionale Beschreibung, die den Benutzern angezeigt wird
caldav.admin.servers.url=Server-URL
caldav.admin.servers.url.placeholder=https://caldav.example.org/dav/cal/{username}/
caldav.admin.servers.url.hint=Die URL kann einen Platzhalter {username} enthalten, der durch das Konto ersetzt wird, mit dem sich der jeweilige Benutzer verbindet.
caldav.admin.servers.url.reachabilityHint=eXo verbindet sich vom Server aus, nicht vom Browser des Benutzers, daher muss diese Adresse nur vom Server aus erreichbar sein. Interne Adressen werden abgelehnt, sofern Ihre Bereitstellung sie nicht zul\u00e4sst, da eXo sonst genutzt werden k\u00f6nnte, um Rechner zu erreichen, die nie \u00f6ffentlich zug\u00e4nglich sein sollten.
caldav.admin.servers.url.corsHint=Benutzer verbinden sich \u00fcber ihren Browser, daher muss die Adresse denselben Ursprung wie die Plattform haben oder CORS-Header senden: Ein Drittanbieter-Server ohne diese muss \u00fcber die eigene Adresse der Plattform vorgeschaltet werden.
caldav.admin.servers.drawer.add.title=CalDAV-Server hinzuf\u00fcgen
caldav.admin.servers.drawer.edit.title=Connector {0}
caldav.admin.servers.drawer.add=Hinzuf\u00fcgen
caldav.admin.servers.drawer.save=Speichern
caldav.admin.servers.drawer.cancel=Abbrechen
caldav.admin.servers.drawer.updateTheIcon=Symbol aktualisieren
caldav.admin.servers.drawer.button.chooseIcon=Ausw\u00e4hlen
caldav.admin.servers.drawer.upload=Hochladen
caldav.admin.servers.drawer.resetDefault=Zur\u00fcck zum Standardsymbol
caldav.admin.servers.drawer.tooBigFile=Das Bild muss kleiner als 100 kB sein
caldav.admin.servers.drawer.uploadingError=Das Bild konnte nicht hochgeladen werden. Versuchen Sie es erneut.
caldav.admin.servers.drawer.caldavSettings=CalDAV-Einstellungen
caldav.admin.servers.copies.title=Meeting-Kopien
caldav.admin.servers.answerLinks.label=Antwortlinks zur Kopie hinzuf\u00fcgen
caldav.admin.servers.answerLinks.hint=F\u00fcgt der Beschreibung jedes kopierten Meetings die Links \u201eAnnehmen\u201c, \u201eAblehnen\u201c und \u201eVorl\u00e4ufig\u201c hinzu. Deaktivieren Sie dies nur, wenn die Kalender-Clients bereits eigene Antwortschaltfl\u00e4chen anzeigen, sonst k\u00f6nnen die Benutzer gar nicht antworten.
caldav.admin.servers.mirrorTarget.label=Wohin Meeting-Kopien geschrieben werden
caldav.admin.servers.mirrorTarget.appliesTo=Gilt f\u00fcr Benutzer, die Meeting-Kopien in ihren eigenen Agenda-Einstellungen aktiviert lassen.
caldav.admin.servers.mirrorTarget.dedicated.label=Ein eigener Kalender \u201eeXo Meetings\u201c
caldav.admin.servers.mirrorTarget.dedicated.consequence=H\u00e4lt eXo-Meetings von den eigenen Ereignissen des Benutzers getrennt. Auf manchen Servern wird ein separater Kalender bei der Verf\u00fcgbarkeit nicht ber\u00fccksichtigt, sodass Kollegen die Zeiten von eXo-Meetings als frei sehen und auf den Kopien keine Antwortschaltfl\u00e4chen erscheinen.
caldav.admin.servers.mirrorTarget.main.label=Der Hauptkalender des Kontos
caldav.admin.servers.mirrorTarget.main.consequence=Kopien z\u00e4hlen f\u00fcr die Verf\u00fcgbarkeit des Benutzers, und die eigenen Antwortschaltfl\u00e4chen des Servers erscheinen dort, wo er sie anbietet. W\u00e4hlen Sie dies erst, wenn Kopien auf diesem Server sauber synchronisiert werden.
caldav.admin.servers.mirrorTarget.moves=Eine \u00c4nderung verschiebt die vorhandenen Kopien jedes Benutzers im Laufe seiner n\u00e4chsten Synchronisierungen. Der alte Kalender \u201eeXo Meetings\u201c bleibt leer bestehen.
caldav.admin.servers.writeChannel.label=Wie Meeting-Kopien geschrieben werden
caldav.admin.servers.writeChannel.hint=Gilt f\u00fcr jede Kopie, die eXo auf diesem Server schreibt oder entfernt, f\u00fcr jeden Benutzer.
caldav.admin.servers.writeChannel.caldav.label=Standard-CalDAV
caldav.admin.servers.writeChannel.caldav.consequence=Funktioniert mit jedem CalDAV-Server. Bei BlueMind f\u00fchrt eine auf diese Weise geschriebene Kopie dazu, dass BlueMind eigene Einladungen f\u00fcr das Meeting sendet: Eingeladene auf demselben Server erhalten sie doppelt, und eine Antwort, die sie auf der eigenen Kopie von BlueMind geben, erreicht eXo nie.
caldav.admin.servers.writeChannel.bluemindImport.label=BlueMind-Kalenderimport
caldav.admin.servers.writeChannel.bluemindImport.consequence=Schreibt jede Kopie \u00fcber die eigene Import-API von BlueMind, die keine eigene Einladung sendet, sodass eXo der einzige Absender bleibt. Nur BlueMind. Wechseln Sie zur\u00fcck zu Standard-CalDAV, um dies r\u00fcckg\u00e4ngig zu machen.
caldav.admin.servers.writeChannel.unavailable.label=Ein Weg, den diese Plattform nicht mehr anbietet ({0})
caldav.admin.servers.writeChannel.unavailable.consequence=Das Add-on, das Kopien auf diese Weise schreibt, ist nicht installiert, daher wird jede Kopie f\u00fcr diesen Server abgelehnt, bis es erneut installiert wird oder Sie zu Standard-CalDAV wechseln.
caldav.admin.servers.drawer.add.success=Der CalDAV-Server wurde hinzugef\u00fcgt
caldav.admin.servers.drawer.add.error=Der CalDAV-Server konnte nicht hinzugef\u00fcgt werden. \u00dcberpr\u00fcfen Sie die Werte und versuchen Sie es erneut.
caldav.admin.servers.drawer.edit.success=Der CalDAV-Server wurde aktualisiert
caldav.admin.servers.drawer.edit.error=Der CalDAV-Server konnte nicht aktualisiert werden. \u00dcberpr\u00fcfen Sie die Werte und versuchen Sie es erneut.
caldav.admin.servers.activate.success=Der CalDAV-Server wurde aktiviert
caldav.admin.servers.deactivate.success=Der CalDAV-Server wurde deaktiviert
caldav.admin.servers.activate.error=Der CalDAV-Server konnte nicht aktiviert werden
caldav.admin.servers.deactivate.error=Der CalDAV-Server konnte nicht deaktiviert werden
caldav.admin.servers.delete.success=Der CalDAV-Server wurde gel\u00f6scht
caldav.admin.servers.delete.error=Der CalDAV-Server konnte nicht gel\u00f6scht werden
caldav.admin.servers.delete.referenced=Verbundene Konten, die diesen Server noch nutzen: {0}. Deaktivieren Sie ihn und lassen Sie die Benutzer die Verbindung trennen, bevor Sie ihn l\u00f6schen.
caldav.admin.servers.modal.delete.title=CalDAV-Server l\u00f6schen
caldav.admin.servers.modal.delete.message=Der Server verschwindet aus den Connectors aller Benutzer. Noch damit verbundene Konten verhindern das L\u00f6schen.
caldav.admin.servers.modal.delete.confirmDelete=Delete
caldav.admin.servers.modal.delete.cancelDelete=Cancel
agenda.caldavCalendar.calendarDelete.propagates=Dieser Kalender befindet sich auch auf {0}. Wenn Sie ihn hier l\u00f6schen, wird er dort ebenfalls gel\u00f6scht, mit allen darin enthaltenen Ereignissen. Das betrifft auch Ereignisse, die Sie \u00fcber Ihr Telefon oder eine andere App hinzugef\u00fcgt haben, und kann nicht r\u00fcckg\u00e4ngig gemacht werden.
agenda.caldavCalendar.calendarDelete.keepsRemote=Der entsprechende Kalender auf {0} bleibt unver\u00e4ndert. Er bleibt dort mit allen seinen Ereignissen bestehen, und eXo zeigt ihn einfach nicht mehr an.
caldav.hiddenCalendars.title=Ausgeblendete Kalender
caldav.hiddenCalendars.subtitle={0} Kalender, die Sie hier gel\u00f6scht haben, befinden sich noch in Ihrem Kalenderkonto
caldav.hiddenCalendars.manage=Ausgeblendete Kalender verwalten
caldav.hiddenCalendars.drawer.title=Ausgeblendete Kalender
caldav.hiddenCalendars.drawer.description=Sie haben diese Kalender aus eXo gel\u00f6scht, aber entschieden, sie in Ihrem Konto zu behalten. Wenn Sie einen wieder anzeigen, kehrt er bei der n\u00e4chsten Synchronisierung mit den Ereignissen zur\u00fcck, die er jetzt enth\u00e4lt.
caldav.hiddenCalendars.showAgain=Wieder anzeigen
caldav.hiddenCalendars.showAgainSuccess={0} wird bei der n\u00e4chsten Synchronisierung wieder angezeigt
caldav.hiddenCalendars.showAgainError=Dieser Kalender konnte nicht wieder angezeigt werden
caldav.hiddenCalendars.count={0} Kalender aus Ihrer Agenda ausgeblendet
caldav.hiddenCalendars.drawer.about=Kalender, die Sie in eXo ausgeblendet haben. Zeigen Sie einen an, um ihn zur\u00fcckzuholen: Ein gel\u00f6schter Kalender kehrt bei der n\u00e4chsten Synchronisierung mit seinen aktuellen Ereignissen zur\u00fcck, ein geteilter sofort unter \u201eMit mir geteilt\u201c.
caldav.hiddenCalendars.deletedHere=Hier gel\u00f6scht, in Ihrem Kalenderkonto behalten
caldav.hiddenCalendars.sharedBy=Geteilt von {0}
caldav.hiddenCalendars.sharedWithYou=Mit Ihnen geteilt
caldav.hiddenCalendars.showAgainSharedSuccess={0} ist wieder unter \u201eMit mir geteilt\u201c
caldav.hiddenCalendars.notAShare=Sie k\u00f6nnen nur Kalender ausblenden, die mit Ihnen geteilt wurden. Um einen eigenen nicht mehr zu sehen, l\u00f6schen Sie ihn und w\u00e4hlen Sie bei der Nachfrage \u201eIn meinem Kalenderkonto behalten\u201c.
caldav.hiddenCalendars.calendarRequired=W\u00e4hlen Sie den auszublendenden Kalender.
caldav.hiddenCalendars.accountUnavailable=Ihr Kalenderkonto war nicht erreichbar, daher wurde dieser Kalender nicht ausgeblendet. Versuchen Sie es gleich noch einmal.

caldav.admin.sync.title=Kalendersynchronisierung
caldav.admin.sync.description=Wie oft und wie umfassend eXo die Kalenderkonten liest, die Ihre Benutzer verbinden. \u00c4nderungen werden bei der n\u00e4chsten Synchronisierung wirksam.
caldav.admin.sync.throttleMinutes.label=Wartezeit zwischen Synchronisierungen
caldav.admin.sync.throttleMinutes.help=Beim \u00d6ffnen der Agenda wird das verbundene Konto gelesen und dann so lange in Ruhe gelassen, egal wie oft die Seite ge\u00f6ffnet wird. So l\u00f6st ein aktiver Benutzer nicht bei jeder Anzeige eine Anfrage aus.
caldav.admin.sync.pastDays.label=Ereignisse aus der Vergangenheit lesen
caldav.admin.sync.pastDays.help=Wie weit in die Vergangenheit eXo Ereignisse liest. Vergangene Ereignisse \u00e4ndern sich selten, daher kostet es kaum etwas, weniger davon zu lesen, und jede Synchronisierung wird leichter.
caldav.admin.sync.futureDays.label=Zuk\u00fcnftige Ereignisse lesen
caldav.admin.sync.futureDays.help=Wie weit im Voraus eXo Ereignisse liest. Das ist die kostspielige Einstellung: Ein gro\u00dfes Zeitfenster bei einem Konto mit jahrelangen Serienterminen bedeutet einen gro\u00dfen Download, der bei der ersten Synchronisierung jedes Tages anf\u00e4llt.
caldav.admin.sync.sweepStaleMinutes.label=Konten aktualisieren, die unber\u00fchrt geblieben sind seit
caldav.admin.sync.sweepStaleMinutes.help=eXo liest ein Kalenderkonto, wenn sein Eigent\u00fcmer seine Agenda \u00f6ffnet, und dieser wartet, w\u00e4hrend sie geladen wird. Konten, die l\u00e4nger als diese Dauer niemand ge\u00f6ffnet hat, werden stattdessen im Hintergrund aktualisiert, sodass die n\u00e4chste Agenda mit bereits vorhandenen Ereignissen ge\u00f6ffnet wird.\n\nSenken Sie den Wert f\u00fcr aktuellere Agenden, aber mehr Serveranfragen. Erh\u00f6hen Sie ihn, wenn die Kalenderserver langsam oder durch Anfragelimits beschr\u00e4nkt sind.
caldav.admin.sync.sweepBatchSize.label=Kalender pro Hintergrundlauf
caldav.admin.sync.sweepBatchSize.help=Jeder Lauf aktualisiert h\u00f6chstens so viele Kalender, die \u00e4ltesten zuerst. Erh\u00f6hen Sie den Wert, um auf einer stark ausgelasteten Instanz schneller aufzuholen, verringern Sie ihn, um die Last zu verteilen.
caldav.admin.sync.unit.minutes=Minuten
caldav.admin.sync.unit.days=Tage
caldav.admin.sync.unit.calendars=Kalender
caldav.admin.sync.save=Speichern
caldav.admin.sync.saved=Synchronisierungseinstellungen gespeichert
caldav.admin.sync.saveFailed=Diese Einstellungen konnten nicht gespeichert werden
caldav.tuning.mandatory=Es wurden keine Einstellungen gesendet
caldav.tuning.throttleOutOfRange=Die Wartezeit zwischen Synchronisierungen muss zwischen 0 Minuten und einem Tag liegen.
caldav.tuning.pastDaysOutOfRange=Das Lesen der Vergangenheit muss zwischen 0 und 365 Tagen liegen.
caldav.tuning.futureDaysOutOfRange=Das Lesen im Voraus muss zwischen 1 und 365 Tagen liegen.
caldav.tuning.sweepStaleOutOfRange=Die Verz\u00f6gerung der Hintergrundaktualisierung muss zwischen 1 Minute und einer Woche liegen.
caldav.tuning.sweepBatchOutOfRange=Der Hintergrundlauf muss zwischen 1 und 500 Kalender umfassen.
caldav.admin.sync.summary=Es werden {1} Tage zur\u00fcck und {2} Tage voraus gelesen. Eine gerade ge\u00f6ffnete Agenda wartet {0} Minuten, bevor sie das Konto erneut liest; ein Konto, das niemand \u00f6ffnet, wird nach {3} Minuten im Hintergrund aktualisiert.
caldav.admin.sync.cancel=Abbrechen
caldav.admin.sync.reports.title=Meeting-Kopien pro Benutzer
caldav.admin.sync.reports.subtitle=Wie jeder verbundene Server bei der letzten Synchronisierung mit Meeting-Kopien umgegangen ist. Dies wird nur im Arbeitsspeicher gehalten, daher ist die Tabelle nach einem Neustart leer, bis die Konten wieder synchronisiert werden.
caldav.admin.sync.reports.none=Seit dem letzten Neustart hat noch kein verbundenes Konto seine Meeting-Kopien gepr\u00fcft. Die Tabelle f\u00fcllt sich, sobald sie synchronisiert werden.
caldav.admin.sync.reports.checked={0} Kopien gepr\u00fcft, {1} fehlend, {2} ver\u00e4ndert, {3} neu geschrieben, {4} unver\u00e4ndert gelassen.
caldav.admin.sync.reports.moved=Zum neuen Ziel verschoben: {0} Kopien verschoben, {1} alte Kopien, die der Server nicht entfernen wollte, {2} konnten nicht geschrieben werden.
caldav.admin.sync.reports.notMoved=Es stand keine \u00c4nderung des Ziels aus.
caldav.admin.sync.reports.loadFailed=Diese Z\u00e4hlungen konnten nicht gelesen werden.
caldav.admin.sync.reports.unknownUser=Benutzer {0}
caldav.admin.managed.title=Einheitliche Verbindung
caldav.admin.managed.off=Benutzer verbinden ihr eigenes Konto.
caldav.admin.managed.on=Alle sind mit {0} verbunden.
caldav.admin.managed.noServers=Noch kein Server angelegt.
caldav.admin.managed.onExcept=Alle sind mit {0} verbunden, au\u00dfer {1} ausgeschlossenen Gruppe(n) oder Space(s).
caldav.admin.managed.off.confirm.title=Einheitliche Verbindung deaktivieren?
caldav.admin.managed.off.confirm.message=Benutzer w\u00e4hlen wieder ihren eigenen CalDAV-Server. Konten, die Benutzer selbst mit {0} verbunden haben, werden weiterhin synchronisiert.
caldav.admin.managed.off.confirm.disconnect.one=1 \u00fcber die einheitliche Verbindung verbundenes Konto wird getrennt.
caldav.admin.managed.off.confirm.disconnect.many={0} \u00fcber die einheitliche Verbindung verbundene Konten werden getrennt.
caldav.admin.managed.off.countFailed=Die \u00fcber die einheitliche Verbindung verbundenen Konten konnten nicht gez\u00e4hlt werden. Die einheitliche Verbindung bleibt aktiv, versuchen Sie es erneut.
caldav.admin.managed.off.confirm.question=M\u00f6chten Sie sie wirklich deaktivieren?
caldav.admin.managed.off.confirm.ok=Deaktivieren
caldav.admin.managed.off.confirm.cancel=Aktiviert lassen
caldav.admin.managed.saved=Alle sind jetzt mit {0} verbunden
caldav.admin.managed.cleared=Benutzer w\u00e4hlen wieder ihren eigenen CalDAV-Server
caldav.admin.managed.saveFailed=Die einheitliche Verbindung konnte nicht aktiviert werden
caldav.admin.managed.clearFailed=Die einheitliche Verbindung konnte nicht deaktiviert werden
caldav.managed.serverRequired=W\u00e4hlen Sie den Server, mit dem alle synchronisieren sollen.
caldav.managed.serverNotEligible=W\u00e4hlen Sie einen konfigurierten und aktiven Server. Ein deaktivierter Server ist nicht erreichbar, sodass sich im Modus \u201eEinheitliche Verbindung\u201c niemand verbinden k\u00f6nnte.
caldav.managed.providerNotEligible=Bei der einheitlichen Verbindung kann dieser Server keinen Anbieter verwenden, der die Anmeldedaten jedes Benutzers ben\u00f6tigt. Deaktivieren Sie die einheitliche Verbindung oder w\u00e4hlen Sie einen Anbieter mit einem Dienstkonto.
caldav.admin.servers.list.managedLocked=Sie k\u00f6nnen diesen Server nicht deaktivieren oder l\u00f6schen, solange die einheitliche Verbindung ihn verwendet. Deaktivieren Sie zuerst die einheitliche Verbindung in der Zeile \u00fcber der Serverliste.
caldav.managed.serverInUse=Sie k\u00f6nnen diesen Server nicht deaktivieren, solange die einheitliche Verbindung aktiv ist, da alle mit ihm synchronisieren. Deaktivieren Sie zuerst die einheitliche Verbindung in der Zeile \u00fcber der Serverliste.
agenda.caldavCalendar.disconnect.warning=Die Kalender, die eXo aus {0} anzeigt, werden zusammen mit den Kopien ihrer Ereignisse aus Ihrer Agenda entfernt. Auf {0} wird nichts gel\u00f6scht, und die Kalender, die Sie in eXo erstellt haben, bleiben erhalten. Verbinden Sie das Konto erneut, und diese Kalender erscheinen wieder.
caldav.pendingCopies.title=Meeting-Kopien noch unterwegs
caldav.pendingCopies.subtitle={0} Ihrer Meetings haben sich in eXo ge\u00e4ndert, und die \u00c4nderung hat Ihren Kalender noch nicht erreicht. eXo versucht es weiter; die n\u00e4chste Hintergrundsynchronisierung kl\u00e4rt das in der Regel.
caldav.calendarStates.title=Kalender, die Aufmerksamkeit erfordern
caldav.calendarStates.subtitle={0} Ihrer Kalender werden nicht normal synchronisiert
caldav.calendarStates.manage=Anzeigen, was nicht stimmt
caldav.calendarStates.drawer.title=Kalender, die Aufmerksamkeit erfordern
caldav.calendarStates.drawer.description=Diese Kalender werden nicht wie die anderen synchronisiert. Ihre \u00fcbrigen Kalender sind nicht betroffen.
caldav.calendarStates.explain.REMOTE_CREATE_REFUSED=Ihr Kalenderkonto erlaubt eXo nicht, dort Kalender anzulegen, daher wird dieser nicht dorthin kopiert. Kalender, die bereits im Konto vorhanden sind, erscheinen weiterhin in eXo.
caldav.calendarStates.explain.PAUSED=Die Synchronisierung dieses Kalenders ist wiederholt fehlgeschlagen, daher hat eXo es aufgegeben. Synchronisieren Sie jetzt, um neu zu starten; wenn es weiterhin fehlschl\u00e4gt, verbinden Sie das Konto erneut.
caldav.calendarStates.explain.EXO_ORPHANED=Sie haben diesen Kalender in eXo gel\u00f6scht, er konnte aber in Ihrem Kalenderkonto nicht gel\u00f6scht werden. Er ist dort noch vorhanden.
caldav.calendarStates.explain.REMOTE_GONE=Dieser Kalender befindet sich nicht mehr in Ihrem Kalenderkonto. Es kommt nichts Neues hinzu, und was eXo bereits enth\u00e4lt, bleibt unver\u00e4ndert.
caldav.calendarStates.explain.RETIRED_SUBSCRIPTION=Dies ist eine Kopie eines mit Ihnen geteilten Kalenders oder einer abonnierten Ressource. Sie wird nicht mehr synchronisiert, \u00c4nderungen hier gehen also nirgendwohin. L\u00f6schen Sie sie, und das Original erscheint schreibgesch\u00fctzt unter \u201eMit mir geteilt\u201c.
caldav.calendarStates.explain.unknown=Dieser Kalender wird nicht normal synchronisiert.
caldav.calendarStates.lastSynchronised={0}
caldav.calendarStates.syncNow=Jetzt synchronisieren
caldav.calendarStates.synchronised=Ihre Kalender wurden synchronisiert. Ihre Meeting-Kopien werden im Hintergrund gepr\u00fcft.
caldav.calendarStates.syncFailed=Ihr Kalenderkonto konnte nicht synchronisiert werden
caldav.deviceSetup.title=Ihre Kalender auf Ihrem Telefon
caldav.deviceSetup.subtitle=F\u00fcgen Sie Ihre eXo-Kalender der Kalender-App auf Ihrem Telefon oder Computer hinzu
caldav.deviceSetup.action=Einrichten
caldav.deviceSetup.drawer.title=Ihre Kalender auf Ihrem Telefon
caldav.deviceSetup.drawer.description=Jede CalDAV-Kalender-App kann Ihre verbundenen Kalender anzeigen. Verwenden Sie beim Hinzuf\u00fcgen des Kontos diese Angaben:
caldav.deviceSetup.serverAddress=Serveradresse
caldav.deviceSetup.username=Benutzername
caldav.deviceSetup.passwordNote=Verwenden Sie das Passwort dieses Kalenderkontos, dasselbe, mit dem Sie es mit eXo verbunden haben. eXo hat kein eigenes separates Passwort.
caldav.deviceSetup.copy={0} kopieren
caldav.deviceSetup.copied={0} kopiert
caldav.deviceSetup.copyFallback=Kopieren ist hier nicht verf\u00fcgbar, der Wert ist markiert, dr\u00fccken Sie Strg+C (Cmd+C auf dem Mac), um ihn zu kopieren
caldav.admin.servers.quirks.title=Was dieser Server tut
caldav.admin.servers.quirks.subtitle=Von eXo beim Pr\u00fcfen der hierher \u00fcbertragenen Meeting-Kopien festgestellt. Markieren Sie einen Eintrag, damit er nicht mehr als \u00c4nderung gilt.
caldav.admin.servers.quirks.none=Nichts zu entschuldigen: eXo hat auf diesem Server nichts gefunden, das es als \u00c4nderung wertet. So sieht ein Server aus, der Kopien originalgetreu speichert, und er erfordert keine Aufmerksamkeit.
caldav.admin.servers.quirks.seen.once=Einmal festgestellt
caldav.admin.servers.quirks.seen.many={0} Mal festgestellt
caldav.admin.servers.quirks.dropsConference.label=Dieser Server beh\u00e4lt keine Videokonferenz-Links
caldav.admin.servers.quirks.dropsConference.cost=eXo wertet den fehlenden Link nicht mehr als \u00c4nderung und bemerkt nicht mehr, wenn jemand einen entfernt.
caldav.admin.servers.quirks.addsCompatibilityMarkers.label=Dieser Server f\u00fcgt Kompatibilit\u00e4tsmarkierungen f\u00fcr Outlook und Thunderbird hinzu
caldav.admin.servers.quirks.addsCompatibilityMarkers.cost=Andere Kalender-Apps f\u00fcgen diese Felder hinzu. eXo ignoriert sie und l\u00e4sst sie unver\u00e4ndert.
caldav.admin.servers.quirks.addsFormattedDescription.label=Dieser Server f\u00fcgt eine formatierte Kopie der Beschreibung hinzu
caldav.admin.servers.quirks.addsFormattedDescription.cost=Eine Rich-Text-Kopie der Beschreibung. eXo ignoriert sie und vergleicht stattdessen die Nur-Text-Version.
caldav.admin.servers.quirks.stampsDefaultPriority.label=Dieser Server versieht jedes gespeicherte Meeting mit einer Standardpriorit\u00e4t
caldav.admin.servers.quirks.stampsDefaultPriority.cost=Eine Priorit\u00e4t, die niemand gew\u00e4hlt hat, wird jeder Kopie hinzugef\u00fcgt. eXo schreibt \u00fcberhaupt keine Priorit\u00e4t, daher behandelt es eine solche nicht mehr als \u00c4nderung und bemerkt auch nicht mehr, wenn jemand auf diesem Server eine echte Priorit\u00e4t festlegt.
caldav.admin.servers.quirks.rewritesDescription.label=Dieser Server schreibt den Einladungstext um
caldav.admin.servers.quirks.rewritesDescription.cost=eXo pr\u00fcft die Beschreibung der Kopien auf diesem Server nicht mehr, einschlie\u00dflich der darin enthaltenen Antwortlinks. Ein umgeschriebener Link bleibt unbemerkt.
caldav.admin.servers.quirks.generic.added.label=Dieser Server f\u00fcgt {0} hinzu, was eXo nicht schreibt
caldav.admin.servers.quirks.generic.added.cost=eXo wertet dies auf diesem Server nicht mehr als \u00c4nderung.
caldav.admin.servers.quirks.generic.dropped.label=Dieser Server beh\u00e4lt {0} nicht
caldav.admin.servers.quirks.generic.dropped.cost=eXo wertet das Fehlen nicht mehr als \u00c4nderung und bemerkt nicht mehr, wenn jemand es entfernt.
caldav.admin.servers.quirks.generic.rewritten.label=Dieser Server schreibt {0} um
caldav.admin.servers.quirks.generic.rewritten.cost=eXo pr\u00fcft diesen Wert bei Kopien auf diesem Server nicht mehr.
caldav.admin.servers.quirks.changesWhatIsWritten=\u00c4ndert, was eXo in Kalender auf diesem Server schreibt
caldav.admin.servers.foreignWriters.title=Andere eXo-Bereitstellungen, die hierher schreiben
caldav.admin.servers.foreignWriters.subtitle=Eine andere eXo-Instanz hat Meeting-Kopien in die Konten auf diesem Server geschrieben. Beide reparieren dieselben Kopien, und keine kann die Schreibvorg\u00e4nge der anderen von einer \u00c4nderung durch eine Person unterscheiden.
caldav.admin.servers.foreignWriters.none=Es wurde keine andere eXo-Instanz gesehen, die in die Konten auf diesem Server schreibt. So sieht ein Server aus, in den nur diese Bereitstellung schreibt, und er erfordert keine Aufmerksamkeit.
caldav.admin.servers.foreignWriters.cost=eXo pr\u00fcft die Meeting-Kopien, die es hierher \u00fcbertragen hat, und repariert, was sich ge\u00e4ndert hat, in der Annahme, dass es alle geschrieben hat. Von dieser anderen Bereitstellung geschriebene Kopien werden gez\u00e4hlt und verglichen, als w\u00e4ren es eigene Kopien von eXo.
caldav.admin.servers.foreignWriters.lastSeen=Zuletzt gesehen am {0}
caldav.admin.servers.foreignWriters.resolution=Verbinden Sie eine der beiden Bereitstellungen mit einem anderen CalDAV-Konto. In der Zwischenzeit wird hier nichts anders importiert, entfernt oder repariert, und die bereits geschriebenen Kopien bleiben, bis jemand sie l\u00f6scht.
caldav.admin.servers.quirks.omitsSoloOrganizer.label=Dieser Server entfernt den Organisator bei einem Ereignis ohne weitere Teilnehmer
caldav.admin.servers.quirks.omitsSoloOrganizer.cost=Es \u00e4ndert sich nichts: eXo l\u00e4sst auf jedem Server den Organisator bei Ereignissen ohne weitere Teilnehmer bereits weg. Kopien von Ereignissen mit Teilnehmern nennen ihren Organisator weiterhin.
caldav.error.mainCalendarUnknown=eXo kann Ihre Meetings nicht in dieses Konto kopieren: Es gibt nicht an, welcher seiner Kalender der Standardkalender ist, daher gibt es keinen Ort daf\u00fcr. Wenden Sie sich an Ihren Administrator.
caldav.error.foreignCopy=Dieses Meeting befindet sich bereits in Ihrem Kalenderkonto, hinzugef\u00fcgt von jemand anderem. eXo l\u00e4sst diese Kopie unver\u00e4ndert.
caldav.error.forbidden=Dieser Kalender ist schreibgesch\u00fctzt mit Ihnen geteilt, daher kann Ihre \u00c4nderung nicht darin gespeichert werden.

caldav.server.authProviderUnknown=Diese Authentifizierungsmethode ist auf diesem Server nicht verf\u00fcgbar. W\u00e4hlen Sie eine aus der Liste.
caldav.server.writeChannelNotSupported=Der BlueMind-Kalenderimport funktioniert nur mit einem BlueMind-Server, den eXo an "BlueMind" im Servernamen erkennt. W\u00e4hlen Sie Standard-CalDAV oder behalten Sie BlueMind im Namen bei.
caldav.server.url.malformed=Das ist keine verwendbare Webadresse. Sie muss mit https:// beginnen (oder http://, wenn Ihr Administrator es erlaubt) und einen Server nennen.
caldav.server.url.schemeNotAllowed=Nur https-Adressen werden akzeptiert. Bitten Sie Ihren Administrator, http zu erlauben, wenn dieser Server kein Zertifikat hat.
caldav.server.url.credentials=Entfernen Sie Benutzername und Passwort aus der Adresse. eXo verwendet die Anmeldedaten, mit denen sich jeder Benutzer verbindet, niemals solche, die in der Adresse stehen.
caldav.server.url.fragment=Entfernen Sie das # und alles danach. Eine Serveradresse enth\u00e4lt kein Fragment.
caldav.server.url.portNotAllowed=Dieser Port ist nicht erlaubt. Verwenden Sie den Standardport oder bitten Sie Ihren Administrator, diesen zu erlauben.
caldav.server.url.usernameInAuthority=Der Platzhalter {username} darf nur nach dem Servernamen im Pfad stehen. Setzen Sie ihn in den Pfad, nicht in die Adresse des Servers selbst.
caldav.server.url.privateAddress=Diese Adresse verweist in Ihr eigenes Netzwerk und wird daher nicht akzeptiert. eXo verbindet sich vom Server aus, daher k\u00f6nnte eine interne Adresse genutzt werden, um Rechner zu erreichen, die nie \u00f6ffentlich zug\u00e4nglich sein sollten. Wenn sie korrekt ist, bitten Sie Ihren Administrator, sie zuzulassen.
caldav.server.url.unresolvable=Dieser Servername existiert nicht. \u00dcberpr\u00fcfen Sie die Schreibweise.
caldav.share.calendarNotFound=Dieser Kalender existiert nicht mehr.
caldav.share.notOwner=Nur der Eigent\u00fcmer eines Kalenders kann ihn teilen.
caldav.share.notConnected=Verbinden Sie Ihr Kalenderkonto, bevor Sie einen Kalender teilen.
caldav.share.calendarNotOnServer=Dieser Kalender befindet sich noch nicht auf Ihrem Kalenderserver. Versuchen Sie es nach der n\u00e4chsten Synchronisierung erneut.
caldav.share.notSupported=Ihr Kalenderserver erlaubt eXo nicht, Kalender zu teilen.
caldav.share.shareeRequired=W\u00e4hlen Sie einen Kollegen, mit dem Sie teilen m\u00f6chten.
caldav.share.shareeUnknown=Dieser Kollege ist kein aktiver Benutzer.
caldav.share.shareeIsOwner=Sie sind bereits Eigent\u00fcmer dieses Kalenders.
caldav.share.shareeNotConnected=Dieser Kollege ist nicht mit demselben Kalenderserver verbunden.
caldav.share.samePrincipal=Dieser Kollege verwendet dasselbe Kalenderkonto wie Sie und sieht diesen Kalender daher bereits.
caldav.share.notReadOnly=Dieser Kollege hat mehr als Lesezugriff, der au\u00dferhalb der Plattform festgelegt wurde. \u00c4ndern Sie das in Ihrer Kalender-App.
caldav.share.aclUnreadable=Ihr Kalenderserver l\u00e4sst die Plattform nicht sehen, mit wem dieser Kalender geteilt ist.
caldav.share.aclNotUnderstood=Dieser Kalender ist auf eine Weise geteilt, die die Plattform nicht sicher \u00e4ndern kann. Verwalten Sie die Freigabe in Ihrer Kalender-App.
caldav.share.serverRefused=Ihr Kalenderserver hat die \u00c4nderung abgelehnt.
caldav.share.notApplied=Ihr Kalenderserver hat die \u00c4nderung angenommen, aber nicht angewendet.
caldav.share.serverUnavailable=Ihr Kalenderserver war nicht erreichbar. Versuchen Sie es sp\u00e4ter erneut.
caldav.share.credentials=Ihr Kalenderserver hat Ihr Konto abgelehnt. \u00dcberpr\u00fcfen Sie Ihr Passwort in den Agenda-Einstellungen.
caldav.share.ownerUnknown=Ihr Kalenderserver hat nicht angegeben, mit welchem Konto Sie verbunden sind. Versuchen Sie es nach der n\u00e4chsten Synchronisierung erneut.
caldav.share.foreignAccessNotPreserved=Jemand hat mehr als Lesezugriff auf diesen Kalender, der au\u00dferhalb der Plattform festgelegt wurde. Eine \u00c4nderung der Freigabe hier k\u00f6nnte diesen Zugriff beeintr\u00e4chtigen, verwalten Sie sie daher in Ihrer Kalender-App.
caldav.share.shareeAddressUnknown=Der Kalenderserver hat die E-Mail-Adresse dieses Kollegen nicht bereitgestellt, daher konnte die Plattform seinen Zugriff nicht \u00e4ndern.
caldav.share.shareeHasOtherAccess=Dieser Kollege hat einen anderen Zugriff auf diesen Kalender, der au\u00dferhalb der Plattform festgelegt wurde, etwa die Anzeige Ihrer freien Zeiten. Eine Freigabe hier w\u00fcrde diesen ersetzen, \u00e4ndern Sie ihn daher in Ihrer Kalender-App.
caldav.share.notOwnedOnServer=Dieser Kalender geh\u00f6rt jemand anderem, oder Sie d\u00fcrfen seine Freigabe nicht verwalten. Sie k\u00f6nnen \u00fcber die Plattform nur Kalender freigeben, die Ihnen geh\u00f6ren.
caldav.admin.servers.drawer.authentication=Authentifizierung
caldav.admin.servers.drawer.authProvider=Wie sich Benutzer authentifizieren
caldav.admin.servers.drawer.disconnection.title=Authentifizierung \u00e4ndern
caldav.admin.servers.drawer.disconnection.one=Durch die \u00c4nderung der Authentifizierung wird 1 Benutzer dieses Servers getrennt.
caldav.admin.servers.drawer.disconnection.many=Durch die \u00c4nderung der Authentifizierung werden {0} Benutzer dieses Servers getrennt.
caldav.admin.servers.drawer.disconnection.question=M\u00f6chten Sie wirklich speichern?
caldav.admin.servers.drawer.disconnection.confirm=Speichern
caldav.admin.servers.drawer.disconnection.cancel=Abbrechen
caldav.admin.servers.drawer.disconnection.countFailed=Die Benutzer dieses Servers konnten nicht gez\u00e4hlt werden. Es wurde nichts gespeichert, versuchen Sie es erneut.
