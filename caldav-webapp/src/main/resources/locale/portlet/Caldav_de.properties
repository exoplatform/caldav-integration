caldav.admin.servers.quirks.title=What this server does
caldav.admin.servers.quirks.subtitle=Seen by eXo while checking the meeting copies pushed here. Tick one to stop treating it as a change.
caldav.admin.servers.quirks.none=Nothing to excuse: eXo has found nothing on this server that it treats as a change. That is what a server storing copies faithfully looks like, and it needs no attention.
caldav.admin.servers.quirks.seen.once=Seen once
caldav.admin.servers.quirks.seen.many=Seen {0} times
caldav.admin.servers.quirks.dropsConference.label=This server does not keep video-conference links
caldav.admin.servers.quirks.dropsConference.cost=eXo stops treating the missing link as a change, and will no longer notice if someone removes one.
caldav.admin.servers.quirks.addsCompatibilityMarkers.label=This server adds Outlook and Thunderbird compatibility markers
caldav.admin.servers.quirks.addsCompatibilityMarkers.cost=Other calendar apps add these fields. eXo ignores them and leaves them as they are.
caldav.admin.servers.quirks.addsFormattedDescription.label=This server adds a formatted copy of the description
caldav.admin.servers.quirks.addsFormattedDescription.cost=A rich-text copy of the description. eXo ignores it and compares the plain-text version instead.
caldav.admin.servers.quirks.stampsDefaultPriority.label=Dieser Server versieht jedes gespeicherte Meeting mit einer Standardpriorit\u00e4t
caldav.admin.servers.quirks.stampsDefaultPriority.cost=Eine Priorit\u00e4t, die niemand gew\u00e4hlt hat, wird jeder Kopie hinzugef\u00fcgt. eXo schreibt \u00fcberhaupt keine Priorit\u00e4t, daher behandelt es eine solche nicht mehr als \u00c4nderung und bemerkt auch nicht mehr, wenn jemand auf diesem Server eine echte Priorit\u00e4t festlegt.
caldav.admin.servers.quirks.rewritesDescription.label=This server rewrites the invitation text
caldav.admin.servers.quirks.rewritesDescription.cost=eXo stops checking the description of copies on this server, including the answer links inside. A rewritten link will go undetected.
caldav.admin.servers.quirks.generic.added.label=This server adds {0}, which eXo does not write
caldav.admin.servers.quirks.generic.added.cost=eXo stops treating it as a change on this server.
caldav.admin.servers.quirks.generic.dropped.label=This server does not keep {0}
caldav.admin.servers.quirks.generic.dropped.cost=eXo stops treating its absence as a change, and will no longer notice if someone removes it.
caldav.admin.servers.quirks.generic.rewritten.label=This server rewrites {0}
caldav.admin.servers.quirks.generic.rewritten.cost=eXo stops checking that value on copies stored by this server.
caldav.admin.servers.quirks.changesWhatIsWritten=Changes what eXo writes into calendars on this server
caldav.admin.servers.foreignWriters.title=Andere eXo-Bereitstellungen, die hierher schreiben
caldav.admin.servers.foreignWriters.subtitle=Eine andere eXo-Instanz hat Meeting-Kopien in die Konten auf diesem Server geschrieben. Beide reparieren dieselben Kopien, und keine kann die Schreibvorg\u00e4nge der anderen von einer \u00c4nderung durch eine Person unterscheiden.
caldav.admin.servers.foreignWriters.none=Es wurde keine andere eXo-Instanz gesehen, die in die Konten auf diesem Server schreibt. So sieht ein Server aus, in den nur diese Bereitstellung schreibt, und er erfordert keine Aufmerksamkeit.
caldav.admin.servers.foreignWriters.cost=eXo pr\u00fcft die Meeting-Kopien, die es hierher \u00fcbertragen hat, und repariert, was sich ge\u00e4ndert hat, in der Annahme, dass es alle geschrieben hat. Von dieser anderen Bereitstellung geschriebene Kopien werden gez\u00e4hlt und verglichen, als w\u00e4ren es eigene Kopien von eXo.
caldav.admin.servers.foreignWriters.lastSeen=Zuletzt gesehen am {0}
caldav.admin.servers.foreignWriters.resolution=Verbinden Sie eine der beiden Bereitstellungen mit einem anderen CalDAV-Konto. In der Zwischenzeit wird hier nichts anders importiert, entfernt oder repariert, und die bereits geschriebenen Kopien bleiben, bis jemand sie l\u00f6scht.
caldav.admin.servers.quirks.omitsSoloOrganizer.label=This server drops the organizer from an event with no other participants
caldav.admin.servers.quirks.omitsSoloOrganizer.cost=Nothing changes: on every server, eXo already leaves the organiser off events with no other participants. Copies of events with participants still name theirs.
caldav.error.mainCalendarUnknown=eXo can't copy your meetings to this account: it doesn't report which of its calendars is the default, so there's nowhere to put them. Contact your administrator.
caldav.error.foreignCopy=This meeting is already in your calendar account, added by someone else. eXo leaves that copy as it is.
caldav.error.forbidden=This calendar is shared with you read-only, so your change can't be saved to it.

caldav.server.authProviderUnknown=Diese Authentifizierungsmethode ist auf diesem Server nicht verf\u00fcgbar. W\u00e4hlen Sie eine aus der Liste.
caldav.server.writeChannelNotSupported=Der BlueMind-Kalenderimport funktioniert nur mit einem BlueMind-Server, den eXo an "BlueMind" im Servernamen erkennt. W\u00e4hlen Sie Standard-CalDAV oder behalten Sie BlueMind im Namen bei.
caldav.server.url.malformed=That is not a usable web address. It must start with https:// (or http:// if your administrator allows it) and name a server.
caldav.server.url.schemeNotAllowed=Only https addresses are accepted. Ask your administrator to allow http if this server has no certificate.
caldav.server.url.credentials=Remove the username and password from the address. eXo uses the credentials each user connects with, never ones written into the address.
caldav.server.url.fragment=Remove the # and everything after it. A server address carries no fragment.
caldav.server.url.portNotAllowed=That port is not allowed. Use the standard port, or ask your administrator to allow this one.
caldav.server.url.usernameInAuthority=The {username} placeholder can only appear after the server name, in the path. Put it in the path, not in the address of the server itself.
caldav.server.url.privateAddress=Diese Adresse verweist in Ihr eigenes Netzwerk und wird daher nicht akzeptiert. eXo verbindet sich vom Server aus, daher k\u00f6nnte eine interne Adresse genutzt werden, um Rechner zu erreichen, die nie \u00f6ffentlich zug\u00e4nglich sein sollten. Wenn sie korrekt ist, bitten Sie Ihren Administrator, sie zuzulassen.
caldav.server.url.unresolvable=That server name does not exist. Check the spelling.
caldav.share.calendarNotFound=This calendar no longer exists.
caldav.share.notOwner=Only the owner of a calendar can share it.
caldav.share.notConnected=Connect your calendar account before sharing a calendar.
caldav.share.calendarNotOnServer=This calendar is not on your calendar server yet. Try again after the next synchronisation.
caldav.share.notSupported=Your calendar server does not let eXo share calendars.
caldav.share.shareeRequired=Choose a colleague to share with.
caldav.share.shareeUnknown=This colleague is not an active user.
caldav.share.shareeIsOwner=You already own this calendar.
caldav.share.shareeNotConnected=This colleague is not connected to the same calendar server.
caldav.share.samePrincipal=This colleague uses the same calendar account as you, so they already see this calendar.
caldav.share.notReadOnly=This colleague has more than view access, set outside the platform. Change it in your calendar app.
caldav.share.aclUnreadable=Your calendar server doesn't let the platform see who this calendar is shared with.
caldav.share.aclNotUnderstood=This calendar is shared in a way the platform can't safely change. Manage its sharing in your calendar app.
caldav.share.serverRefused=Your calendar server refused the change.
caldav.share.notApplied=Your calendar server accepted the change but did not apply it.
caldav.share.serverUnavailable=Your calendar server could not be reached. Try again later.
caldav.share.credentials=Your calendar server refused your account. Check your password in the agenda settings.
caldav.share.ownerUnknown=Your calendar server did not say which account you are connected with. Try again after the next synchronisation.
caldav.share.foreignAccessNotPreserved=Someone has more than view access to this calendar, set outside the platform. Changing sharing here could affect that access, so manage it in your calendar app.
caldav.share.shareeAddressUnknown=Der Kalenderserver hat die E-Mail-Adresse dieses Kollegen nicht bereitgestellt, daher konnte die Plattform seinen Zugriff nicht \u00e4ndern.
caldav.share.shareeHasOtherAccess=Dieser Kollege hat einen anderen Zugriff auf diesen Kalender, der au\u00dferhalb der Plattform festgelegt wurde, etwa die Anzeige Ihrer freien Zeiten. Eine Freigabe hier w\u00fcrde diesen ersetzen, \u00e4ndern Sie ihn daher in Ihrer Kalender-App.
caldav.share.notOwnedOnServer=Dieser Kalender geh\u00f6rt jemand anderem, oder Sie d\u00fcrfen seine Freigabe nicht verwalten. Sie k\u00f6nnen \u00fcber die Plattform nur Kalender freigeben, die Ihnen geh\u00f6ren.
