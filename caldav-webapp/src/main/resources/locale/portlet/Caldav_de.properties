caldav.admin.managed.cleared=Users choose their own CalDAV server again
caldav.admin.managed.saveFailed=Managed mode could not be turned on
caldav.admin.managed.clearFailed=Managed mode could not be turned off
caldav.managed.serverRequired=W\u00e4hlen Sie den Server, mit dem alle synchronisieren sollen.
caldav.managed.serverNotEligible=Pick a server that's configured and active. A deactivated server can't be reached, so no one would be able to connect in managed mode.
caldav.managed.providerNotEligible=Bei der einheitlichen Verbindung kann dieser Server keinen Anbieter verwenden, der die Anmeldedaten jedes Benutzers ben\u00f6tigt. Deaktivieren Sie die einheitliche Verbindung oder w\u00e4hlen Sie einen Anbieter mit einem Dienstkonto.
caldav.admin.servers.list.managedLocked=Sie k\u00f6nnen diesen Server nicht deaktivieren oder l\u00f6schen, solange die einheitliche Verbindung ihn verwendet. Deaktivieren Sie zuerst die einheitliche Verbindung in der Zeile \u00fcber der Serverliste.
caldav.managed.serverInUse=You can't deactivate this server while managed mode is on, since everyone syncs with it. Turn managed mode off first, in the row above the server list.
agenda.caldavCalendar.disconnect.warning=Die Kalender, die eXo aus {0} anzeigt, werden zusammen mit den Kopien ihrer Ereignisse aus Ihrer Agenda entfernt. Auf {0} wird nichts gel\u00f6scht, und die Kalender, die Sie in eXo erstellt haben, bleiben erhalten. Verbinden Sie das Konto erneut, und diese Kalender erscheinen wieder.
caldav.pendingCopies.title=Meeting copies still on their way
caldav.pendingCopies.subtitle={0} of your meetings have changed in eXo and the change has not reached your calendar yet. eXo keeps trying; the next background synchronisation usually settles them.
caldav.calendarStates.title=Calendars needing attention
caldav.calendarStates.subtitle={0} of your calendars are not synchronising normally
caldav.calendarStates.manage=See what is wrong
caldav.calendarStates.drawer.title=Calendars needing attention
caldav.calendarStates.drawer.description=These calendars are not synchronising the way the others are. The rest of your calendars are unaffected.
caldav.calendarStates.explain.REMOTE_CREATE_REFUSED=Your calendar account does not let eXo create calendars on it, so this one is not copied there. Calendars that already exist on the account still appear in eXo.
caldav.calendarStates.explain.PAUSED=Synchronising this calendar failed repeatedly, so eXo stopped trying. Synchronise now to start again; if it keeps failing, reconnect the account.
caldav.calendarStates.explain.EXO_ORPHANED=You deleted this calendar in eXo, and it could not be deleted on your calendar account. It is still there.
caldav.calendarStates.explain.REMOTE_GONE=This calendar is no longer on your calendar account. Nothing new will arrive in it, and what eXo already holds is untouched.
caldav.calendarStates.explain.RETIRED_SUBSCRIPTION=This is a copy of a calendar shared with you, or of a resource you subscribed to. It no longer syncs, so changes here go nowhere. Delete it and the original appears under Shared with me, read-only.
