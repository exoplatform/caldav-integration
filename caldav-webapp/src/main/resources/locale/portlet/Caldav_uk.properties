caldav.admin.servers.preset.stalwart.summary=\u042f \u0437\u0430\u043f\u043e\u0432\u043d\u0438\u0432 \u043d\u0430\u0437\u0432\u0443 \u0441\u0435\u0440\u0432\u0435\u0440\u0430 \u0442\u0430 \u0444\u043e\u0440\u043c\u0430\u0442 \u0430\u0434\u0440\u0435\u0441\u0438. Stalwart \u0437\u0431\u0435\u0440\u0456\u0433\u0430\u0454 \u0442\u0435, \u0449\u043e \u043d\u0430\u0434\u0441\u0438\u043b\u0430\u0454 eXo, \u0442\u043e\u043c\u0443 \u043d\u0430\u043b\u0430\u0448\u0442\u043e\u0432\u0430\u043d\u043e \u0437\u0431\u0435\u0440\u0456\u0433\u0430\u0442\u0438 \u0432\u0441\u0435, \u0430 \u043d\u0435 \u0443\u0441\u043f\u0430\u0434\u043a\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u0432\u0438\u043d\u044f\u0442\u043a\u0438, \u0437\u0430\u0434\u0430\u043d\u0456 \u0434\u043b\u044f \u0432\u0441\u044c\u043e\u0433\u043e \u0440\u043e\u0437\u0433\u043e\u0440\u0442\u0430\u043d\u043d\u044f.\n\n\u041a\u043e\u043f\u0456\u0457 \u0437\u0431\u0435\u0440\u0456\u0433\u0430\u044e\u0442\u044c\u0441\u044f \u0432 \u043e\u043a\u0440\u0435\u043c\u043e\u043c\u0443 \u043a\u0430\u043b\u0435\u043d\u0434\u0430\u0440\u0456 \u00ab\u0417\u0443\u0441\u0442\u0440\u0456\u0447\u0456 eXo\u00bb. \u041f\u043e\u0441\u0438\u043b\u0430\u043d\u043d\u044f \u0434\u043b\u044f \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0456 \u0432\u0438\u043c\u043a\u043d\u0435\u043d\u043e, \u043e\u0441\u043a\u0456\u043b\u044c\u043a\u0438 Stalwart \u043f\u0440\u0438\u0439\u043c\u0430\u0454 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0456 \u0437 \u0431\u0443\u0434\u044c-\u044f\u043a\u043e\u0433\u043e \u043a\u0430\u043b\u0435\u043d\u0434\u0430\u0440\u044f, \u0430 \u0432\u043b\u0430\u0441\u043d\u0456 \u043a\u043d\u043e\u043f\u043a\u0438 \u043a\u043b\u0456\u0454\u043d\u0442\u0430 \u00ab\u041f\u0440\u0438\u0439\u043d\u044f\u0442\u0438\u00bb \u0442\u0430 \u00ab\u0412\u0456\u0434\u0445\u0438\u043b\u0438\u0442\u0438\u00bb \u0432\u0436\u0435 \u043f\u0440\u0430\u0446\u044e\u044e\u0442\u044c \u043d\u0430 \u043a\u043e\u043f\u0456\u0457.\n\n\u041f\u