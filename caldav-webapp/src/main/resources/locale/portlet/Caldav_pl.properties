caldav.error.credentials=Serwer CalDAV odrzuci\u0142 t\u0119 nazw\u0119 u\u017cytkownika lub has\u0142o. Sprawd\u017a je i spr\u00f3buj ponownie.
caldav.error.connection=Nie mo\u017cna po\u0142\u0105czy\u0107 si\u0119 z serwerem CalDAV. Spr\u00f3buj ponownie p\u00f3\u017aniej lub skontaktuj si\u0119 z administratorem.
caldav.error.notCaldav=Pod tym adresem nie odpowiada kalendarz CalDAV. Skontaktuj si\u0119 z administratorem, aby sprawdzi\u0107 skonfigurowany adres serwera.
caldav.error.serverNotUsable=Tego serwera kalendarza nie mo\u017cna jeszcze u\u017cywa\u0107: us\u0142uga, przez kt\u00f3r\u0105 si\u0119 loguje, nie jest zainstalowana. Spr\u00f3buj ponownie p\u00f3\u017aniej lub skontaktuj si\u0119 z administratorem.
caldav.error.cors=Serwer jest osi\u0105galny, ale odrzuci\u0142 \u017c\u0105danie cross-origin z przegl\u0105darki (nie wysy\u0142a nag\u0142\u00f3wk\u00f3w CORS). Popro\u015b administratora o udost\u0119pnienie go przez w\u0142asny adres platformy.
caldav.admin.servers.title=Serwery CalDAV
caldav.admin.servers.subtitle=Dodaj serwery CalDAV, z kt\u00f3rymi u\u017cytkownicy mog\u0105 po\u0142\u0105czy\u0107 konto osobiste. Kalendarze osobiste s\u0105 synchronizowane dwukierunkowo z sekcj\u0105 Moje kalendarze. Spotkania eXo s\u0105 kopiowane jednokierunkowo, wy\u0142\u0105cznie do kalendarza osobistego.
caldav.admin.servers.add=Dodaj
caldav.admin.servers.noServers=Nie zadeklarowano jeszcze \u017cadnego serwera CalDAV
caldav.admin.servers.list.name=Nazwa
caldav.admin.servers.list.activate=Aktywuj
caldav.admin.servers.list.actions=Akcje
caldav.admin.servers.preset.label=Jaki to serwer?
caldav.admin.servers.preset.stalwart.label=Stalwart
caldav.admin.servers.preset.stalwart.summary=Uzupe\u0142niono nazw\u0119 serwera i format adresu. Stalwart zachowuje to, co wysy\u0142a eXo, dlatego ustawiono zachowywanie wszystkiego zamiast dziedziczenia wyj\u0105tk\u00f3w obowi\u0105zuj\u0105cych w ca\u0142ym wdro\u017ceniu.\n\nKopie trafiaj\u0105 do dedykowanego kalendarza eXo Meetings. Linki odpowiedzi s\u0105 wy\u0142\u0105czone, poniewa\u017c Stalwart przyjmuje odpowiedzi z dowolnego kalendarza, a w\u0142asne przyciski Akceptuj i Odrzu\u0107 klienta dzia\u0142aj\u0105 ju\u017c na kopii.\n\nSprawd\u017a przed zapisaniem.
caldav.admin.servers.preset.other.label=Inny serwer
caldav.admin.servers.preset.other.summary=Nic nie zosta\u0142o uzupe\u0142nione. Brak serwera na li\u015bcie oznacza, \u017ce nie zosta\u0142 przetestowany, a nie \u017ce nie jest obs\u0142ugiwany. Wype\u0142nij formularz samodzielnie, a eXo zaproponuje ustawienia po zsynchronizowaniu pierwszych wydarze\u0144.
caldav.admin.servers.preset.changesWhatIsWritten=Jedno z tych ustawie\u0144 zmienia to, co eXo zapisuje w kalendarzach u\u017cytkownik\u00f3w, a nie tylko to, co por\u00f3wnuje.
caldav.admin.servers.name=Nazwa
caldav.admin.servers.name.placeholder=Nazwa wy\u015bwietlana u\u017cytkownikom
caldav.admin.servers.description=Opis
caldav.admin.servers.description.placeholder=Opcjonalny opis wy\u015bwietlany u\u017cytkownikom
caldav.admin.servers.url=Adres URL serwera
caldav.admin.servers.url.placeholder=https://caldav.example.org/dav/cal/{username}/
caldav.admin.servers.url.hint=Adres URL mo\u017ce zawiera\u0107 symbol zast\u0119pczy {username}, zast\u0119powany kontem, za pomoc\u0105 kt\u00f3rego \u0142\u0105czy si\u0119 dany u\u017cytkownik.
caldav.admin.servers.url.reachabilityHint=eXo \u0142\u0105czy si\u0119 z serwera, a nie z przegl\u0105darki u\u017cytkownika, wi\u0119c ten adres musi by\u0107 osi\u0105galny tylko z serwera. Adresy wewn\u0119trzne s\u0105 odrzucane, chyba \u017ce wdro\u017cenie na nie zezwala, poniewa\u017c w przeciwnym razie eXo mog\u0142oby pos\u0142u\u017cy\u0107 do uzyskania dost\u0119pu do maszyn, kt\u00f3re nigdy nie mia\u0142y by\u0107 udost\u0119pnione.
caldav.admin.servers.url.corsHint=U\u017cytkownicy \u0142\u0105cz\u0105 si\u0119 ze swojej przegl\u0105darki, wi\u0119c adres musi mie\u0107 to samo \u017ar\u00f3d\u0142o co platforma lub wysy\u0142a\u0107 nag\u0142\u00f3wki CORS. Serwer zewn\u0119trzny bez tych nag\u0142\u00f3wk\u00f3w musi by\u0107 udost\u0119pniany przez w\u0142asny adres platformy.
caldav.admin.servers.drawer.add.title=Dodaj serwer CalDAV
caldav.admin.servers.drawer.edit.title=Konektor {0}
caldav.admin.servers.drawer.add=Dodaj
caldav.admin.servers.drawer.save=Zapisz
