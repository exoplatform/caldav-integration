caldav.admin.servers.drawer.updateTheIcon=Zaktualizuj ikon\u0119
caldav.admin.servers.drawer.button.chooseIcon=Wybierz
caldav.admin.servers.drawer.upload=Prze\u015blij
caldav.admin.servers.drawer.resetDefault=Przywr\u00f3\u0107 domy\u015bln\u0105 ikon\u0119
caldav.admin.servers.drawer.tooBigFile=Obraz musi mie\u0107 mniej ni\u017c 100 kB
caldav.admin.servers.drawer.uploadingError=Nie mo\u017cna przes\u0142a\u0107 obrazu. Spr\u00f3buj ponownie.
caldav.admin.servers.drawer.caldavSettings=Ustawienia CalDAV
caldav.admin.servers.copies.title=Kopie spotka\u0144
caldav.admin.servers.answerLinks.label=Dodaj linki odpowiedzi do kopii
caldav.admin.servers.answerLinks.hint=Dodaje linki Akceptuj, Odrzu\u0107 i Mo\u017ce do opisu ka\u017cdego skopiowanego spotkania. T\u0119 opcj\u0119 nale\u017cy wy\u0142\u0105czy\u0107 tylko wtedy, gdy klienci kalendarza wy\u015bwietlaj\u0105 ju\u017c w\u0142asne przyciski odpowiedzi, w przeciwnym razie u\u017cytkownicy w og\u00f3le nie b\u0119d\u0105 mogli odpowiedzie\u0107.
caldav.admin.servers.mirrorTarget.label=Miejsce zapisu kopii spotka\u0144
caldav.admin.servers.mirrorTarget.appliesTo=Dotyczy u\u017cytkownik\u00f3w, kt\u00f3rzy maj\u0105 w\u0142\u0105czone kopie spotka\u0144 we w\u0142asnych ustawieniach Agendy.
caldav.admin.servers.mirrorTarget.dedicated.label=Dedykowany kalendarz eXo Meetings
caldav.admin.servers.mirrorTarget.dedicated.consequence=Oddziela spotkania eXo od w\u0142asnych wydarze\u0144 u\u017cytkownika. Na niekt\u00f3rych serwerach osobny kalendarz nie jest uwzgl\u0119dniany w dost\u0119pno\u015bci, wi\u0119c wsp\u00f3\u0142pracownicy widz\u0105 godziny spotka\u0144 eXo jako wolne, a na kopiach nie pojawiaj\u0105 si\u0119 przyciski odpowiedzi.
caldav.admin.servers.mirrorTarget.main.label=G\u0142\u00f3wny kalendarz konta
caldav.admin.servers.mirrorTarget.main.consequence=Kopie s\u0105 uwzgl\u0119dniane w dost\u0119pno\u015bci u\u017cytkownika, a w\u0142asne przyciski odpowiedzi serwera pojawiaj\u0105 si\u0119 tam, gdzie je udost\u0119pnia. T\u0119 opcj\u0119 nale\u017cy wybra\u0107 dopiero wtedy, gdy kopie synchronizuj\u0105 si\u0119 na tym serwerze bez problem\u00f3w.
caldav.admin.servers.mirrorTarget.moves=Zmiana tego ustawienia przenosi istniej\u0105ce kopie ka\u017cdego u\u017cytkownika podczas kolejnych synchronizacji. Stary kalendarz eXo Meetings pozostaje na miejscu, pusty.
caldav.admin.servers.writeChannel.label=Spos\u00f3b zapisywania kopii spotka\u0144
caldav.admin.servers.writeChannel.hint=Dotyczy ka\u017cdej kopii, kt\u00f3r\u0105 eXo zapisuje lub usuwa na tym serwerze, dla ka\u017cdego u\u017cytkownika.
caldav.admin.servers.writeChannel.caldav.label=Standardowy CalDAV
caldav.admin.servers.writeChannel.caldav.consequenceAnyServer=Dzia\u0142a z ka\u017cdym serwerem CalDAV. Niekt\u00f3re serwery wysy\u0142aj\u0105 w\u0142asne zaproszenia na spotkanie zapisane w ten spos\u00f3b: zaproszeni na tym samym serwerze otrzymuj\u0105 je wtedy dwukrotnie, a odpowied\u017a udzielona na w\u0142asnej kopii serwera nigdy nie dociera do eXo.
caldav.admin.servers.writeChannel.unavailable.label=Kana\u0142, kt\u00f3rego ta platforma ju\u017c nie oferuje ({0})
caldav.admin.servers.writeChannel.unavailable.consequence=Dodatek, kt\u00f3ry zapisuje kopie w ten spos\u00f3b, nie jest zainstalowany, wi\u0119c ka\u017cda kopia dla tego serwera jest odrzucana, dop\u00f3ki nie zostanie ponownie zainstalowany lub nie nast\u0105pi prze\u0142\u0105czenie na standardowy CalDAV.
caldav.admin.servers.drawer.add.success=Serwer CalDAV zosta\u0142 dodany
caldav.admin.servers.drawer.add.error=Nie mo\u017cna doda\u0107 serwera CalDAV. Sprawd\u017a warto\u015bci i spr\u00f3buj ponownie.
caldav.admin.servers.drawer.edit.success=Serwer CalDAV zosta\u0142 zaktualizowany
caldav.admin.servers.drawer.edit.error=Nie mo\u017cna zaktualizowa\u0107 serwera CalDAV. Sprawd\u017a warto\u015bci i spr\u00f3buj ponownie.
caldav.admin.servers.activate.success=Serwer CalDAV zosta\u0142 aktywowany
caldav.admin.servers.deactivate.success=Serwer CalDAV zosta\u0142 dezaktywowany
caldav.admin.servers.activate.error=Nie mo\u017cna aktywowa\u0107 serwera CalDAV
caldav.admin.servers.deactivate.error=Nie mo\u017cna dezaktywowa\u0107 serwera CalDAV
caldav.admin.servers.delete.success=Serwer CalDAV zosta\u0142 usuni\u0119ty
caldav.admin.servers.delete.error=Nie mo\u017cna usun\u0105\u0107 serwera CalDAV
caldav.admin.servers.delete.referenced=Po\u0142\u0105czone konta, kt\u00f3re nadal u\u017cywaj\u0105 tego serwera: {0}. Przed usuni\u0119ciem nale\u017cy go dezaktywowa\u0107 i poczeka\u0107 na roz\u0142\u0105czenie kont.
caldav.admin.servers.modal.delete.title=Usu\u0144 serwer CalDAV
caldav.admin.servers.modal.delete.message=Serwer zniknie z konektor\u00f3w wszystkich u\u017cytkownik\u00f3w. Konta nadal z nim po\u0142\u0105czone blokuj\u0105 usuni\u0119cie.
caldav.admin.servers.modal.delete.confirmDelete=Delete
caldav.admin.servers.modal.delete.cancelDelete=Cancel
agenda.caldavCalendar.calendarDelete.propagates=Ten kalendarz istnieje r\u00f3wnie\u017c w us\u0142udze {0}. Usuni\u0119cie go tutaj usuwa go r\u00f3wnie\u017c tam, wraz ze wszystkimi wydarzeniami. Dotyczy to tak\u017ce wydarze\u0144 dodanych z telefonu lub innej aplikacji. Tej operacji nie mo\u017cna cofn\u0105\u0107.
agenda.caldavCalendar.calendarDelete.keepsRemote=Odpowiadaj\u0105cy mu kalendarz w us\u0142udze {0} nie zostanie zmieniony. Pozostanie tam ze wszystkimi wydarzeniami, a eXo po prostu przestanie go wy\u015bwietla\u0107.
caldav.hiddenCalendars.title=Ukryte kalendarze
caldav.hiddenCalendars.subtitle=Kalendarze usuni\u0119te tutaj, kt\u00f3re nadal znajduj\u0105 si\u0119 na koncie kalendarza: {0}
caldav.hiddenCalendars.manage=Zarz\u0105dzaj ukrytymi kalendarzami
caldav.hiddenCalendars.drawer.title=Ukryte kalendarze
caldav.hiddenCalendars.drawer.description=Te kalendarze zosta\u0142y usuni\u0119te z eXo, ale zachowane na koncie. Ponowne wy\u015bwietlenie kalendarza przywraca go przy nast\u0119pnej synchronizacji, z wydarzeniami, kt\u00f3re obecnie zawiera.
caldav.hiddenCalendars.showAgain=Poka\u017c ponownie
caldav.hiddenCalendars.showAgainSuccess={0} wr\u00f3ci przy nast\u0119pnej synchronizacji
caldav.hiddenCalendars.showAgainError=Nie mo\u017cna ponownie wy\u015bwietli\u0107 tego kalendarza
caldav.hiddenCalendars.count=Kalendarze ukryte w Agendzie: {0}
caldav.hiddenCalendars.drawer.about=Kalendarze ukryte w eXo. Wy\u015bwietl kalendarz, aby go przywr\u00f3ci\u0107: usuni\u0119ty kalendarz wraca przy nast\u0119pnej synchronizacji z bie\u017c\u0105cymi wydarzeniami, a udost\u0119pniony wraca natychmiast w sekcji Udost\u0119pnione mi.
caldav.hiddenCalendars.deletedHere=Usuni\u0119ty tutaj, zachowany na koncie kalendarza
caldav.hiddenCalendars.sharedBy=Udost\u0119pnione przez: {0}
caldav.hiddenCalendars.sharedWithYou=Udost\u0119pnione mi
caldav.hiddenCalendars.showAgainSharedSuccess={0} jest ponownie w sekcji Udost\u0119pnione mi
caldav.hiddenCalendars.notAShare=Ukry\u0107 mo\u017cna tylko kalendarze udost\u0119pnione przez innych. Aby przesta\u0107 widzie\u0107 w\u0142asny kalendarz, nale\u017cy go usun\u0105\u0107 i po wy\u015bwietleniu pytania wybra\u0107 \u201eZachowaj na moim koncie kalendarza\u201d.
caldav.hiddenCalendars.calendarRequired=Wybierz kalendarz do ukrycia.
caldav.hiddenCalendars.accountUnavailable=Nie mo\u017cna po\u0142\u0105czy\u0107 si\u0119 z kontem kalendarza, wi\u0119c ten kalendarz nie zosta\u0142 ukryty. Spr\u00f3buj ponownie za chwil\u0119.

caldav.admin.sync.title=Synchronizacja kalendarzy
caldav.admin.sync.description=Jak cz\u0119sto i w jakim zakresie eXo odczytuje konta kalendarzy po\u0142\u0105czone przez u\u017cytkownik\u00f3w. Zmiany zaczynaj\u0105 obowi\u0105zywa\u0107 od nast\u0119pnej synchronizacji.
caldav.admin.sync.throttleMinutes.label=Odst\u0119p mi\u0119dzy synchronizacjami
caldav.admin.sync.throttleMinutes.help=Otwarcie Agendy odczytuje po\u0142\u0105czone konto, a nast\u0119pnie pozostawia je w spokoju przez ten czas, niezale\u017cnie od tego, ile razy strona zostanie otwarta. Zapobiega to wysy\u0142aniu \u017c\u0105dania przy ka\u017cdym wy\u015bwietleniu przez aktywnego u\u017cytkownika.
caldav.admin.sync.pastDays.label=Odczytuj wydarzenia z przesz\u0142o\u015bci
caldav.admin.sync.pastDays.help=Jak daleko wstecz eXo odczytuje wydarzenia. Wydarzenia z przesz\u0142o\u015bci rzadko si\u0119 zmieniaj\u0105, wi\u0119c odczytywanie mniejszej ich liczby prawie nic nie kosztuje, a odci\u0105\u017ca ka\u017cd\u0105 synchronizacj\u0119.
caldav.admin.sync.futureDays.label=Odczytuj przysz\u0142e wydarzenia
caldav.admin.sync.futureDays.help=Jak daleko w prz\u00f3d eXo odczytuje wydarzenia. To ustawienie ma najwi\u0119kszy koszt: szerokie okno na koncie z latami spotka\u0144 cyklicznych oznacza du\u017ce pobieranie, ponoszone przy pierwszej synchronizacji ka\u017cdego dnia.
caldav.admin.sync.sweepStaleMinutes.label=Od\u015bwie\u017caj konta nieu\u017cywane przez
caldav.admin.sync.sweepStaleMinutes.help=eXo odczytuje konto kalendarza, gdy jego w\u0142a\u015bciciel otwiera Agend\u0119, a ten czeka na za\u0142adowanie. Konta, kt\u00f3rych nikt nie otwiera\u0142 d\u0142u\u017cej ni\u017c przez ten czas, s\u0105 zamiast tego od\u015bwie\u017cane w tle, wi\u0119c przy nast\u0119pnym otwarciu Agendy wydarzenia s\u0105 ju\u017c na miejscu.\n\nNi\u017csza warto\u015b\u0107 zapewnia aktualniejsze Agendy, ale wi\u0119cej \u017c\u0105da\u0144 do serwera. Wy\u017csz\u0105 warto\u015b\u0107 warto ustawi\u0107, je\u015bli serwery kalendarzy s\u0105 wolne lub maj\u0105 limity \u017c\u0105da\u0144.
caldav.admin.sync.sweepBatchSize.label=Kalendarze na jedno uruchomienie w tle
caldav.admin.sync.sweepBatchSize.help=Ka\u017cde uruchomienie od\u015bwie\u017ca co najwy\u017cej tyle kalendarzy, zaczynaj\u0105c od najstarszych. Wy\u017csza warto\u015b\u0107 pozwala szybciej nadrobi\u0107 zaleg\u0142o\u015bci na obci\u0105\u017conej instancji, ni\u017csza rozk\u0142ada obci\u0105\u017cenie.
caldav.admin.sync.unit.minutes=min
caldav.admin.sync.unit.days=dni
caldav.admin.sync.unit.calendars=kalendarze
caldav.admin.sync.save=Zapisz
caldav.admin.sync.saved=Zapisano ustawienia synchronizacji
caldav.admin.sync.saveFailed=Nie mo\u017cna zapisa\u0107 tych ustawie\u0144
caldav.tuning.mandatory=Nie przes\u0142ano \u017cadnych ustawie\u0144
caldav.tuning.throttleOutOfRange=Odst\u0119p mi\u0119dzy synchronizacjami musi wynosi\u0107 od 0 minut do jednego dnia.
caldav.tuning.pastDaysOutOfRange=Zakres odczytu przesz\u0142o\u015bci musi wynosi\u0107 od 0 do 365 dni.
caldav.tuning.futureDaysOutOfRange=Zakres odczytu przysz\u0142o\u015bci musi wynosi\u0107 od 1 do 365 dni.
caldav.tuning.sweepStaleOutOfRange=Op\u00f3\u017anienie od\u015bwie\u017cania w tle musi wynosi\u0107 od 1 minuty do jednego tygodnia.
caldav.tuning.sweepBatchOutOfRange=Uruchomienie w tle musi obejmowa\u0107 od 1 do 500 kalendarzy.
caldav.admin.sync.summary=Odczyt dni wstecz: {1}, dni w prz\u00f3d: {2}. W\u0142a\u015bnie otwarta Agenda czeka {0} min przed ponownym odczytem konta; konto, kt\u00f3rego nikt nie otwiera, jest od\u015bwie\u017cane w tle po {3} min.
caldav.admin.sync.cancel=Anuluj
caldav.admin.sync.reports.title=Kopie spotka\u0144 wed\u0142ug u\u017cytkownik\u00f3w
caldav.admin.sync.reports.subtitle=Jak ka\u017cdy po\u0142\u0105czony serwer obs\u0142u\u017cy\u0142 kopie spotka\u0144 podczas ostatniej synchronizacji. Dane s\u0105 przechowywane tylko w pami\u0119ci, wi\u0119c po ponownym uruchomieniu tabela jest pusta, dop\u00f3ki konta ponownie si\u0119 nie zsynchronizuj\u0105.
caldav.admin.sync.reports.none=Od ostatniego ponownego uruchomienia \u017cadne po\u0142\u0105czone konto nie sprawdzi\u0142o swoich kopii spotka\u0144. Tabela zape\u0142ni si\u0119 w miar\u0119 synchronizacji kont.
caldav.admin.sync.reports.checked=Sprawdzone kopie: {0}, brakuj\u0105ce: {1}, zmienione: {2}, przepisane: {3}, pozostawione bez zmian: {4}.
caldav.admin.sync.reports.moved=Przeniesienie do nowego miejsca docelowego: przeniesione kopie: {0}, stare kopie, kt\u00f3rych serwer nie usun\u0105\u0142: {1}, kopie, kt\u00f3rych nie mo\u017cna by\u0142o zapisa\u0107: {2}.
caldav.admin.sync.reports.notMoved=Brak oczekuj\u0105cej zmiany miejsca docelowego.
caldav.admin.sync.reports.loadFailed=Nie mo\u017cna odczyta\u0107 tych zestawie\u0144.
caldav.admin.sync.reports.unknownUser=U\u017cytkownik {0}
caldav.admin.managed.title=Ujednolicone logowanie
caldav.admin.managed.off=U\u017cytkownicy \u0142\u0105cz\u0105 w\u0142asne konta.
caldav.admin.managed.on=Wszyscy s\u0105 przypisani do: {0}.
caldav.admin.managed.noServers=Nie zadeklarowano jeszcze \u017cadnego serwera.
caldav.admin.managed.switchNotice=U\u017cytkownicy po\u0142\u0105czeni z innym serwerem zostan\u0105 przeniesieni na ten serwer w ci\u0105gu godziny lub przy nast\u0119pnym logowaniu. Kalendarze z ich poprzedniego konta przestan\u0105 si\u0119 synchronizowa\u0107.
caldav.admin.managed.onExcept=Wszyscy s\u0105 przypisani do: {0}, z wyj\u0105tkiem wykluczonych grup lub przestrzeni (liczba: {1}).
caldav.admin.managed.off.confirm.title=Wy\u0142\u0105czy\u0107 ujednolicone logowanie?
caldav.admin.managed.off.confirm.kept=U\u017cytkownicy ponownie b\u0119d\u0105 wybiera\u0107 w\u0142asny serwer CalDAV. Konta przypisane do {0} przez ujednolicone logowanie zostan\u0105 od\u0142\u0105czone. Pozosta\u0142e konta nadal b\u0119d\u0105 synchronizowane.
caldav.admin.managed.off.confirm.disconnect.one=1 konto przypisane przez ujednolicone logowanie zostanie od\u0142\u0105czone.
caldav.admin.managed.off.confirm.disconnect.many=Konta przypisane przez ujednolicone logowanie, kt\u00f3re zostan\u0105 od\u0142\u0105czone: {0}.
caldav.admin.managed.off.countFailed=Nie mo\u017cna policzy\u0107 kont przypisanych przez ujednolicone logowanie. Ujednolicone logowanie pozostaje w\u0142\u0105czone. Spr\u00f3buj ponownie.
caldav.admin.managed.off.confirm.question=Czy na pewno je wy\u0142\u0105czy\u0107?
caldav.admin.managed.off.confirm.ok=Wy\u0142\u0105cz
caldav.admin.managed.off.confirm.cancel=Pozostaw w\u0142\u0105czone
caldav.admin.managed.saved=Wszyscy s\u0105 teraz przypisani do: {0}
caldav.admin.managed.cleared=U\u017cytkownicy ponownie wybieraj\u0105 w\u0142asny serwer CalDAV
caldav.admin.managed.saveFailed=Nie mo\u017cna w\u0142\u0105czy\u0107 ujednoliconego logowania
caldav.admin.managed.clearFailed=Nie mo\u017cna wy\u0142\u0105czy\u0107 ujednoliconego logowania
caldav.managed.serverRequired=Wybierz serwer, z kt\u00f3rym wszyscy maj\u0105 si\u0119 synchronizowa\u0107.
caldav.managed.serverNotEligible=Wybierz skonfigurowany i aktywny serwer. Z dezaktywowanym serwerem nie mo\u017cna si\u0119 po\u0142\u0105czy\u0107, wi\u0119c nikt nie m\u00f3g\u0142by po\u0142\u0105czy\u0107 si\u0119 w trybie ujednoliconego logowania.
caldav.managed.providerNotEligible=W trybie ujednoliconego logowania ten serwer nie mo\u017ce u\u017cywa\u0107 dostawcy, kt\u00f3ry wymaga danych logowania ka\u017cdego u\u017cytkownika. Wy\u0142\u0105cz ujednolicone logowanie lub wybierz dostawc\u0119 z kontem us\u0142ugi.
caldav.admin.servers.list.managedLocked=Nie mo\u017cna dezaktywowa\u0107 ani usun\u0105\u0107 tego serwera, gdy korzysta z niego ujednolicone logowanie. Najpierw nale\u017cy wy\u0142\u0105czy\u0107 ujednolicone logowanie w wierszu nad list\u0105 serwer\u00f3w.
caldav.managed.serverInUse=Nie mo\u017cna dezaktywowa\u0107 tego serwera, gdy ujednolicone logowanie jest w\u0142\u0105czone, poniewa\u017c wszyscy si\u0119 z nim synchronizuj\u0105. Najpierw nale\u017cy wy\u0142\u0105czy\u0107 ujednolicone logowanie w wierszu nad list\u0105 serwer\u00f3w.
caldav.managed.connectionLocked=Konto kalendarza jest zarz\u0105dzane przez organizacj\u0119: jego po\u0142\u0105czenia nie mo\u017cna zmieni\u0107.
caldav.managed.refused=Serwer kalendarza organizacji nie akceptuje tego konta. Skontaktuj si\u0119 z administratorem.
agenda.caldavCalendar.disconnect.warning=Kalendarze wy\u015bwietlane przez eXo z us\u0142ugi {0} zostan\u0105 usuni\u0119te z Agendy wraz z kopiami ich wydarze\u0144. W us\u0142udze {0} nic nie zostanie usuni\u0119te, a kalendarze utworzone w eXo pozostan\u0105. Po ponownym po\u0142\u0105czeniu konta te kalendarze wr\u00f3c\u0105.
caldav.pendingCopies.title=Kopie spotka\u0144 w trakcie przesy\u0142ania
caldav.pendingCopies.subtitle=Spotkania zmienione w eXo, kt\u00f3rych zmiana nie dotar\u0142a jeszcze do kalendarza: {0}. eXo ponawia pr\u00f3by; zwykle nast\u0119pna synchronizacja w tle rozwi\u0105zuje problem.
caldav.calendarStates.title=Kalendarze wymagaj\u0105ce uwagi
caldav.calendarStates.subtitle=Kalendarze, kt\u00f3re nie synchronizuj\u0105 si\u0119 prawid\u0142owo: {0}
caldav.calendarStates.manage=Zobacz, co jest nie tak
caldav.calendarStates.drawer.title=Kalendarze wymagaj\u0105ce uwagi
caldav.calendarStates.drawer.description=Te kalendarze nie synchronizuj\u0105 si\u0119 tak jak pozosta\u0142e. Nie ma to wp\u0142ywu na pozosta\u0142e kalendarze.
caldav.calendarStates.explain.REMOTE_CREATE_REFUSED=Konto kalendarza nie pozwala eXo tworzy\u0107 na nim kalendarzy, wi\u0119c ten kalendarz nie jest tam kopiowany. Kalendarze, kt\u00f3re ju\u017c istniej\u0105 na koncie, nadal s\u0105 widoczne w eXo.
caldav.calendarStates.explain.PAUSED=Synchronizacja tego kalendarza wielokrotnie si\u0119 nie powiod\u0142a, wi\u0119c eXo przesta\u0142o pr\u00f3bowa\u0107. Nale\u017cy zsynchronizowa\u0107 go teraz, aby wznowi\u0107; je\u015bli b\u0142\u0105d b\u0119dzie si\u0119 powtarza\u0142, nale\u017cy ponownie po\u0142\u0105czy\u0107 konto.
caldav.calendarStates.explain.EXO_ORPHANED=Ten kalendarz zosta\u0142 usuni\u0119ty w eXo, ale nie mo\u017cna by\u0142o usun\u0105\u0107 go na koncie kalendarza. Nadal tam jest.
caldav.calendarStates.explain.REMOTE_GONE=Tego kalendarza nie ma ju\u017c na koncie kalendarza. Nic nowego do niego nie trafi, a to, co eXo ju\u017c przechowuje, pozostaje nienaruszone.
caldav.calendarStates.explain.RETIRED_SUBSCRIPTION=To kopia kalendarza udost\u0119pnionego lub zasobu, kt\u00f3ry zosta\u0142 zasubskrybowany. Nie jest ju\u017c synchronizowana, wi\u0119c wprowadzone tu zmiany nigdzie nie trafiaj\u0105. Po jej usuni\u0119ciu orygina\u0142 pojawi si\u0119 w sekcji Udost\u0119pnione mi, tylko do odczytu.
caldav.calendarStates.explain.unknown=Ten kalendarz nie synchronizuje si\u0119 prawid\u0142owo.
caldav.calendarStates.lastSynchronised={0}
caldav.calendarStates.syncNow=Synchronizuj teraz
caldav.calendarStates.synchronised=Kalendarze zosta\u0142y zsynchronizowane. Kopie spotka\u0144 s\u0105 sprawdzane w tle.
caldav.calendarStates.syncFailed=Nie mo\u017cna zsynchronizowa\u0107 konta kalendarza
caldav.deviceSetup.title=Kalendarze w telefonie
caldav.deviceSetup.subtitle=Dodaj kalendarze eXo do aplikacji kalendarza w telefonie lub na komputerze
caldav.deviceSetup.action=Skonfiguruj
caldav.deviceSetup.drawer.title=Kalendarze w telefonie
caldav.deviceSetup.drawer.description=Ka\u017cda aplikacja kalendarza obs\u0142uguj\u0105ca CalDAV mo\u017ce wy\u015bwietla\u0107 po\u0142\u0105czone kalendarze. Podczas dodawania konta nale\u017cy u\u017cy\u0107 tych danych:
caldav.deviceSetup.serverAddress=Adres serwera
caldav.deviceSetup.username=Nazwa u\u017cytkownika
caldav.deviceSetup.passwordNote=Nale\u017cy u\u017cy\u0107 has\u0142a do tego konta kalendarza, tego samego, za pomoc\u0105 kt\u00f3rego po\u0142\u0105czono je z eXo. eXo nie ma w\u0142asnego, oddzielnego has\u0142a.
caldav.deviceSetup.copy=Kopiuj: {0}
caldav.deviceSetup.copied=Skopiowano: {0}
caldav.deviceSetup.copyFallback=Kopiowanie nie jest tu dost\u0119pne, warto\u015b\u0107 zosta\u0142a zaznaczona, naci\u015bnij Ctrl+C (Cmd+C na Macu), aby j\u0105 skopiowa\u0107
caldav.admin.servers.quirks.title=Dzia\u0142anie tego serwera
caldav.admin.servers.quirks.subtitle=Wykryte przez eXo podczas sprawdzania kopii spotka\u0144 przes\u0142anych na ten serwer. Zaznacz pozycj\u0119, aby przesta\u0107 traktowa\u0107 j\u0105 jako zmian\u0119.
caldav.admin.servers.quirks.none=Nic do zignorowania: eXo nie wykry\u0142o na tym serwerze niczego, co traktuje jako zmian\u0119. Tak wygl\u0105da serwer, kt\u00f3ry wiernie przechowuje kopie, i nie wymaga on uwagi.
caldav.admin.servers.quirks.seen.once=Wykryto raz
caldav.admin.servers.quirks.seen.many=Liczba wykry\u0107: {0}
caldav.admin.servers.quirks.dropsConference.label=Ten serwer nie zachowuje link\u00f3w do wideokonferencji
caldav.admin.servers.quirks.dropsConference.cost=eXo przestaje traktowa\u0107 brakuj\u0105cy link jako zmian\u0119 i nie zauwa\u017cy ju\u017c, je\u015bli kto\u015b go usunie.
caldav.admin.servers.quirks.addsCompatibilityMarkers.label=Ten serwer dodaje znaczniki zgodno\u015bci z Outlookiem i Thunderbirdem
caldav.admin.servers.quirks.addsCompatibilityMarkers.cost=Inne aplikacje kalendarza dodaj\u0105 te pola. eXo je ignoruje i pozostawia bez zmian.
caldav.admin.servers.quirks.addsFormattedDescription.label=Ten serwer dodaje sformatowan\u0105 kopi\u0119 opisu
caldav.admin.servers.quirks.addsFormattedDescription.cost=Kopia opisu w formacie tekstu sformatowanego. eXo j\u0105 ignoruje i zamiast tego por\u00f3wnuje wersj\u0119 w postaci zwyk\u0142ego tekstu.
caldav.admin.servers.quirks.stampsDefaultPriority.label=Ten serwer nadaje domy\u015blny priorytet ka\u017cdemu przechowywanemu spotkaniu
caldav.admin.servers.quirks.stampsDefaultPriority.cost=Priorytet, kt\u00f3rego nikt nie wybra\u0142, dodawany do ka\u017cdej kopii. eXo nie zapisuje \u017cadnego priorytetu, wi\u0119c przestaje traktowa\u0107 go jako zmian\u0119 i nie zauwa\u017cy ju\u017c, je\u015bli kto\u015b ustawi rzeczywisty priorytet na tym serwerze.
caldav.admin.servers.quirks.rewritesDescription.label=Ten serwer przepisuje tekst zaproszenia
caldav.admin.servers.quirks.rewritesDescription.cost=eXo przestaje sprawdza\u0107 opis kopii na tym serwerze, w tym zawarte w nim linki odpowiedzi. Przepisany link nie zostanie wykryty.
caldav.admin.servers.quirks.generic.added.label=Ten serwer dodaje element {0}, kt\u00f3rego eXo nie zapisuje
caldav.admin.servers.quirks.generic.added.cost=eXo przestaje traktowa\u0107 to jako zmian\u0119 na tym serwerze.
caldav.admin.servers.quirks.generic.dropped.label=Ten serwer nie zachowuje elementu {0}
caldav.admin.servers.quirks.generic.dropped.cost=eXo przestaje traktowa\u0107 jego brak jako zmian\u0119 i nie zauwa\u017cy ju\u017c, je\u015bli kto\u015b go usunie.
caldav.admin.servers.quirks.generic.rewritten.label=Ten serwer przepisuje element {0}
caldav.admin.servers.quirks.generic.rewritten.cost=eXo przestaje sprawdza\u0107 t\u0119 warto\u015b\u0107 w kopiach przechowywanych przez ten serwer.
caldav.admin.servers.quirks.changesWhatIsWritten=Zmienia to, co eXo zapisuje w kalendarzach na tym serwerze
caldav.admin.servers.foreignWriters.title=Inne wdro\u017cenia eXo zapisuj\u0105ce na tym serwerze
caldav.admin.servers.foreignWriters.subtitle=Inna instancja eXo zapisa\u0142a kopie spotka\u0144 na kontach na tym serwerze. Obie naprawiaj\u0105 te same kopie i \u017cadna nie potrafi odr\u00f3\u017cni\u0107 zapis\u00f3w drugiej od zmiany wprowadzonej przez kogo\u015b.
caldav.admin.servers.foreignWriters.none=Nie wykryto, aby inna instancja eXo zapisywa\u0142a na kontach na tym serwerze. Tak wygl\u0105da serwer, na kt\u00f3rym zapisuje tylko to wdro\u017cenie, i nie wymaga on uwagi.
caldav.admin.servers.foreignWriters.cost=eXo sprawdza kopie spotka\u0144 przes\u0142ane na ten serwer i naprawia to, co si\u0119 zmieni\u0142o, zak\u0142adaj\u0105c, \u017ce wszystkie zapisa\u0142o samo. Kopie zapisane przez to drugie wdro\u017cenie s\u0105 liczone i por\u00f3wnywane tak, jakby by\u0142y kopiami eXo.
caldav.admin.servers.foreignWriters.lastSeen=Ostatnio wykryto: {0}
caldav.admin.servers.foreignWriters.resolution=Po\u0142\u0105cz jedno z dw\u00f3ch wdro\u017ce\u0144 z innym kontem CalDAV. W mi\u0119dzyczasie nic nie jest importowane, usuwane ani naprawiane w inny spos\u00f3b, a ju\u017c zapisane kopie pozostaj\u0105, dop\u00f3ki kto\u015b ich nie usunie.
caldav.admin.servers.quirks.omitsSoloOrganizer.label=Ten serwer usuwa organizatora z wydarzenia bez innych uczestnik\u00f3w
caldav.admin.servers.quirks.omitsSoloOrganizer.cost=Nic si\u0119 nie zmienia: na ka\u017cdym serwerze eXo i tak pomija organizatora w wydarzeniach bez innych uczestnik\u00f3w. Kopie wydarze\u0144 z uczestnikami nadal wskazuj\u0105 organizatora.
caldav.error.mainCalendarUnknown=eXo nie mo\u017ce kopiowa\u0107 spotka\u0144 na to konto: nie zg\u0142asza ono, kt\u00f3ry z jego kalendarzy jest domy\u015blny, wi\u0119c nie ma gdzie ich umie\u015bci\u0107. Skontaktuj si\u0119 z administratorem.
caldav.error.foreignCopy=To spotkanie jest ju\u017c na koncie kalendarza, dodane przez kogo\u015b innego. eXo pozostawia t\u0119 kopi\u0119 bez zmian.
caldav.error.forbidden=Ten kalendarz jest udost\u0119pniony tylko do odczytu, wi\u0119c nie mo\u017cna zapisa\u0107 w nim zmiany.

caldav.server.authProviderUnknown=Ta metoda uwierzytelniania nie jest dost\u0119pna na tym serwerze. Wybierz metod\u0119 z listy.
caldav.server.writeChannelUnavailable=Ten serwer nie oferuje tego sposobu zapisywania kopii spotka\u0144. Wybierz standardowy CalDAV.
caldav.server.writeChannelNotRecognised=Przy tych ustawieniach dodatek oferuj\u0105cy ten spos\u00f3b zapisywania kopii spotka\u0144 nie rozpoznaje tego serwera jako w\u0142asnego. Sprawd\u017a, co zmieni\u0142o si\u0119 w ustawieniach serwera.
caldav.server.url.malformed=To nie jest prawid\u0142owy adres internetowy. Musi zaczyna\u0107 si\u0119 od https:// (lub http://, je\u015bli zezwala na to administrator) i wskazywa\u0107 serwer.
caldav.server.url.schemeNotAllowed=Akceptowane s\u0105 tylko adresy https. Je\u015bli ten serwer nie ma certyfikatu, popro\u015b administratora o zezwolenie na http.
caldav.server.url.credentials=Usu\u0144 nazw\u0119 u\u017cytkownika i has\u0142o z adresu. eXo u\u017cywa danych logowania, za pomoc\u0105 kt\u00f3rych \u0142\u0105czy si\u0119 ka\u017cdy u\u017cytkownik, nigdy tych zapisanych w adresie.
caldav.server.url.fragment=Usu\u0144 znak # i wszystko, co po nim nast\u0119puje. Adres serwera nie zawiera fragmentu.
caldav.server.url.portNotAllowed=Ten port jest niedozwolony. U\u017cyj standardowego portu lub popro\u015b administratora o zezwolenie na ten port.
caldav.server.url.usernameInAuthority=Symbol zast\u0119pczy {username} mo\u017ce wyst\u0119powa\u0107 tylko po nazwie serwera, w \u015bcie\u017cce. Umie\u015b\u0107 go w \u015bcie\u017cce, a nie w adresie samego serwera.
caldav.server.url.privateAddress=Ten adres wskazuje na sie\u0107 wewn\u0119trzn\u0105, wi\u0119c nie jest akceptowany. eXo \u0142\u0105czy si\u0119 z serwera, wi\u0119c adres wewn\u0119trzny m\u00f3g\u0142by pos\u0142u\u017cy\u0107 do uzyskania dost\u0119pu do maszyn, kt\u00f3re nigdy nie mia\u0142y by\u0107 udost\u0119pnione. Je\u015bli adres jest prawid\u0142owy, popro\u015b administratora o zezwolenie na niego.
caldav.server.url.unresolvable=Taka nazwa serwera nie istnieje. Sprawd\u017a pisowni\u0119.
caldav.share.calendarNotFound=Ten kalendarz ju\u017c nie istnieje.
caldav.share.notOwner=Tylko w\u0142a\u015bciciel kalendarza mo\u017ce go udost\u0119pni\u0107.
caldav.share.notConnected=Przed udost\u0119pnieniem kalendarza nale\u017cy po\u0142\u0105czy\u0107 konto kalendarza.
caldav.share.calendarNotOnServer=Tego kalendarza nie ma jeszcze na serwerze kalendarza. Spr\u00f3buj ponownie po nast\u0119pnej synchronizacji.
caldav.share.notSupported=Serwer kalendarza nie pozwala eXo udost\u0119pnia\u0107 kalendarzy.
caldav.share.shareeRequired=Wybierz wsp\u00f3\u0142pracownika, kt\u00f3remu ma zosta\u0107 udost\u0119pniony kalendarz.
caldav.share.shareeUnknown=Ten wsp\u00f3\u0142pracownik nie jest aktywnym u\u017cytkownikiem.
caldav.share.shareeIsOwner=Ten kalendarz ju\u017c nale\u017cy do bie\u017c\u0105cego u\u017cytkownika.
caldav.share.shareeNotConnected=Ten wsp\u00f3\u0142pracownik nie jest po\u0142\u0105czony z tym samym serwerem kalendarza.
caldav.share.samePrincipal=Ten wsp\u00f3\u0142pracownik u\u017cywa tego samego konta kalendarza, wi\u0119c ju\u017c widzi ten kalendarz.
caldav.share.notReadOnly=Ten wsp\u00f3\u0142pracownik ma uprawnienia wykraczaj\u0105ce poza wy\u015bwietlanie, ustawione poza platform\u0105. Nale\u017cy je zmieni\u0107 w aplikacji kalendarza.
caldav.share.aclUnreadable=Serwer kalendarza nie pozwala platformie sprawdzi\u0107, komu udost\u0119pniono ten kalendarz.
caldav.share.aclNotUnderstood=Ten kalendarz jest udost\u0119pniony w spos\u00f3b, kt\u00f3rego platforma nie mo\u017ce bezpiecznie zmieni\u0107. Udost\u0119pnianiem nale\u017cy zarz\u0105dza\u0107 w aplikacji kalendarza.
caldav.share.serverRefused=Serwer kalendarza odrzuci\u0142 zmian\u0119.
caldav.share.notApplied=Serwer kalendarza zaakceptowa\u0142 zmian\u0119, ale jej nie zastosowa\u0142.
caldav.share.serverUnavailable=Nie mo\u017cna po\u0142\u0105czy\u0107 si\u0119 z serwerem kalendarza. Spr\u00f3buj ponownie p\u00f3\u017aniej.
caldav.share.credentials=Serwer kalendarza odrzuci\u0142 konto. Sprawd\u017a has\u0142o w ustawieniach Agendy.
caldav.share.ownerUnknown=Serwer kalendarza nie wskaza\u0142, z kt\u00f3rym kontem nawi\u0105zano po\u0142\u0105czenie. Spr\u00f3buj ponownie po nast\u0119pnej synchronizacji.
caldav.share.foreignAccessNotPreserved=Kto\u015b ma uprawnienia do tego kalendarza wykraczaj\u0105ce poza wy\u015bwietlanie, ustawione poza platform\u0105. Zmiana udost\u0119pniania w tym miejscu mo\u017ce wp\u0142yn\u0105\u0107 na te uprawnienia, dlatego nale\u017cy zarz\u0105dza\u0107 nimi w aplikacji kalendarza.
caldav.share.shareeAddressUnknown=Serwer kalendarza nie poda\u0142 adresu e-mail tego wsp\u00f3\u0142pracownika, wi\u0119c platforma nie mog\u0142a zmieni\u0107 jego uprawnie\u0144.
caldav.share.shareeHasOtherAccess=Ten wsp\u00f3\u0142pracownik ma inne uprawnienia do tego kalendarza, ustawione poza platform\u0105, na przyk\u0142ad wgl\u0105d w dost\u0119pno\u015b\u0107. Udost\u0119pnienie kalendarza w tym miejscu zast\u0105pi\u0142oby je, dlatego nale\u017cy to zmieni\u0107 w aplikacji kalendarza.
caldav.share.notOwnedOnServer=Ten kalendarz nale\u017cy do kogo\u015b innego lub brak uprawnie\u0144 do zarz\u0105dzania jego udost\u0119pnianiem. Z poziomu platformy mo\u017cna udost\u0119pnia\u0107 tylko w\u0142asne kalendarze.
caldav.admin.servers.drawer.authentication=Uwierzytelnianie
caldav.admin.servers.drawer.authProvider=Spos\u00f3b uwierzytelniania u\u017cytkownik\u00f3w
caldav.admin.servers.drawer.disconnection.title=Zmie\u0144 uwierzytelnianie
caldav.admin.servers.drawer.disconnection.one=Zmiana uwierzytelniania od\u0142\u0105czy 1 u\u017cytkownika tego serwera.
caldav.admin.servers.drawer.disconnection.many=U\u017cytkownicy tego serwera, kt\u00f3rych od\u0142\u0105czy zmiana uwierzytelniania: {0}.
