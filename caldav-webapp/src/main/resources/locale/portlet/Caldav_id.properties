caldav.admin.servers.answerLinks.hint=Tambahkan tautan Terima, Tolak, dan Tentatif ke deskripsi setiap rapat yang disalin. Nonaktifkan ini hanya jika klien kalender sudah menampilkan tombol jawabannya sendiri, atau pengguna sama sekali tidak dapat menjawab.
caldav.admin.servers.mirrorTarget.label=Tempat salinan rapat ditulis
caldav.admin.servers.mirrorTarget.appliesTo=Berlaku untuk pengguna yang tetap mengaktifkan salinan rapat di pengaturan agenda mereka sendiri.
caldav.admin.servers.mirrorTarget.dedicated.label=Kalender eXo Meetings khusus
caldav.admin.servers.mirrorTarget.dedicated.consequence=Memisahkan rapat eXo dari acara milik pengguna sendiri. Di beberapa server, kalender terpisah tidak diperhitungkan dalam ketersediaan, sehingga rekan kerja melihat waktu rapat eXo sebagai luang dan tidak ada tombol jawaban yang muncul pada salinan.
caldav.admin.servers.mirrorTarget.main.label=Kalender utama akun
caldav.admin.servers.mirrorTarget.main.consequence=Salinan diperhitungkan dalam ketersediaan pengguna, dan tombol jawaban milik server muncul jika server menyediakannya. Pilih ini hanya setelah salinan tersinkronisasi dengan baik di server ini.
caldav.admin.servers.mirrorTarget.moves=Mengubah ini akan memindahkan salinan yang sudah ada milik setiap pengguna selama sinkronisasi berikutnya. Kalender eXo Meetings yang lama tetap ada, dalam keadaan kosong.
caldav.admin.servers.writeChannel.label=Cara salinan rapat ditulis
caldav.admin.servers.writeChannel.hint=Berlaku untuk setiap salinan yang ditulis atau dihapus eXo di server ini, untuk setiap pengguna.
caldav.admin.servers.writeChannel.caldav.label=CalDAV standar
caldav.admin.servers.writeChannel.caldav.consequenceAnyServer=Works with every CalDAV server. Some servers send their own invitations for a meeting written this way: invitees on the same server then receive it twice, and an answer they give on the server's own copy never reaches eXo.
caldav.admin.servers.writeChannel.unavailable.label=Jalur yang tidak lagi disediakan platform ini ({0})
caldav.admin.servers.writeChannel.unavailable.consequence=Add-on yang menulis salinan dengan cara ini tidak terpasang, sehingga setiap salinan untuk server ini ditolak sampai add-on tersebut dipasang kembali atau Anda beralih ke CalDAV standar.
caldav.admin.servers.drawer.add.success=Server CalDAV telah ditambahkan
caldav.admin.servers.drawer.add.error=Server CalDAV tidak dapat ditambahkan. Periksa nilainya dan coba lagi.
caldav.admin.servers.drawer.edit.success=Server CalDAV telah diperbarui
caldav.admin.servers.drawer.edit.error=Server CalDAV tidak dapat diperbarui. Periksa nilainya dan coba lagi.
