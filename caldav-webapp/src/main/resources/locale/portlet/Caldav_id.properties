caldav.admin.managed.noServers=Belum ada server yang didaftarkan.
caldav.admin.managed.switchNotice=Users connected to another server are switched to this one within the hour, or at their next login, and their calendars from the previous account are no longer synchronized.
caldav.admin.managed.onExcept=Semua orang dikaitkan ke {0}, kecuali {1} grup atau ruang yang dikecualikan.
