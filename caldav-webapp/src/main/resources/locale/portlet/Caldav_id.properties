caldav.admin.servers.preset.label=Server apa ini?
caldav.admin.servers.preset.stalwart.label=Stalwart
caldav.admin.servers.preset.stalwart.summary=Saya telah mengisi nama server dan format alamat. Stalwart mempertahankan apa yang dikirim eXo, sehingga server ini diatur untuk menyimpan semuanya alih-alih mewarisi pengecualian yang berlaku untuk seluruh penerapan.\n\nSalinan masuk ke kalender eXo Meetings khusus. Tautan jawaban dinonaktifkan, karena Stalwart menerima jawaban dari kalender mana pun dan tombol Terima dan Tolak milik klien sendiri sudah berfungsi pada salinan.\n\nTinjau sebelum menyimpan.
caldav.admin.servers.preset.other.label=Server lain
caldav.admin.servers.preset.other.summary=Tidak ada yang diisi. Server yang tidak tercantum adalah server yang belum kami uji, bukan server yang tidak didukung. Isi formulir sendiri, dan eXo akan menyarankan pengaturan setelah acara pertama tersinkronisasi.
caldav.admin.servers.preset.changesWhatIsWritten=Salah satu dari ini mengubah apa yang ditulis eXo ke kalender pengguna Anda, bukan hanya apa yang dibandingkannya.
caldav.admin.servers.name=Nama
caldav.admin.servers.name.placeholder=Nama yang ditampilkan kepada pengguna
caldav.admin.servers.description=Deskripsi
caldav.admin.servers.description.placeholder=Deskripsi opsional yang ditampilkan kepada pengguna
caldav.admin.servers.url=URL server
