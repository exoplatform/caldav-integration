caldav.admin.servers.quirks.dropsConference.cost=eXo tidak lagi menganggap tautan yang hilang sebagai perubahan, dan tidak akan lagi menyadari jika seseorang menghapusnya.
caldav.admin.servers.quirks.addsCompatibilityMarkers.label=Server ini menambahkan penanda kompatibilitas Outlook dan Thunderbird
caldav.admin.servers.quirks.addsCompatibilityMarkers.cost=Aplikasi kalender lain menambahkan kolom ini. eXo mengabaikannya dan membiarkannya apa adanya.
caldav.admin.servers.quirks.addsFormattedDescription.label=Server ini menambahkan salinan deskripsi yang diformat
caldav.admin.servers.quirks.addsFormattedDescription.cost=Salinan deskripsi dalam teks kaya. eXo mengabaikannya dan membandingkan versi teks biasa sebagai gantinya.
caldav.admin.servers.quirks.stampsDefaultPriority.label=Server ini memberikan prioritas default pada setiap rapat yang disimpannya
caldav.admin.servers.quirks.stampsDefaultPriority.cost=Prioritas yang tidak dipilih siapa pun, ditambahkan ke setiap salinan. eXo tidak menulis prioritas sama sekali, sehingga eXo tidak lagi menganggapnya sebagai perubahan, dan tidak akan lagi menyadari jika seseorang menetapkan prioritas yang sebenarnya di server ini.
caldav.admin.servers.quirks.rewritesDescription.label=Server ini menulis ulang teks undangan
caldav.admin.servers.quirks.rewritesDescription.cost=eXo berhenti memeriksa deskripsi salinan di server ini, termasuk tautan jawaban di dalamnya. Tautan yang ditulis ulang tidak akan terdeteksi.
caldav.admin.servers.quirks.generic.added.label=Server ini menambahkan {0}, yang tidak ditulis oleh eXo
caldav.admin.servers.quirks.generic.added.cost=eXo tidak lagi menganggapnya sebagai perubahan di server ini.
caldav.admin.servers.quirks.generic.dropped.label=Server ini tidak menyimpan {0}
caldav.admin.servers.quirks.generic.dropped.cost=eXo tidak lagi menganggap ketiadaannya sebagai perubahan, dan tidak akan lagi menyadari jika seseorang menghapusnya.
caldav.admin.servers.quirks.generic.rewritten.label=Server ini menulis ulang {0}
caldav.admin.servers.quirks.generic.rewritten.cost=eXo berhenti memeriksa nilai tersebut pada salinan yang disimpan oleh server ini.
caldav.admin.servers.quirks.changesWhatIsWritten=Mengubah apa yang ditulis eXo ke dalam kalender di server ini
caldav.admin.servers.foreignWriters.title=Penerapan eXo lain yang menulis di sini
caldav.admin.servers.foreignWriters.subtitle=eXo lain telah menulis salinan rapat ke akun-akun di server ini. Keduanya memperbaiki salinan yang sama, dan tidak satu pun dapat membedakan tulisan pihak lain dari perubahan yang dibuat seseorang.
caldav.admin.servers.foreignWriters.none=Tidak ada eXo lain yang terlihat menulis ke akun-akun di server ini. Seperti itulah server yang hanya ditulisi oleh penerapan ini, dan tidak memerlukan perhatian.
caldav.admin.servers.foreignWriters.cost=eXo memeriksa salinan rapat yang dikirimnya ke sini dan memperbaiki yang berubah, dengan asumsi bahwa eXo yang menulis semuanya. Salinan yang ditulis oleh penerapan lain ini dihitung dan dibandingkan seolah-olah milik eXo sendiri.
caldav.admin.servers.foreignWriters.lastSeen=Terakhir terlihat pada {0}
caldav.admin.servers.foreignWriters.resolution=Hubungkan salah satu dari kedua penerapan ke akun CalDAV yang berbeda. Sementara itu, tidak ada yang diimpor, dihapus, atau diperbaiki secara berbeda di sini, dan salinan yang sudah ditulis tetap ada sampai seseorang menghapusnya.
caldav.admin.servers.quirks.omitsSoloOrganizer.label=Server ini menghapus penyelenggara dari acara tanpa peserta lain
caldav.admin.servers.quirks.omitsSoloOrganizer.cost=Tidak ada yang berubah: di setiap server, eXo memang sudah tidak mencantumkan penyelenggara pada acara tanpa peserta lain. Salinan acara yang memiliki peserta tetap mencantumkan penyelenggaranya.
caldav.error.mainCalendarUnknown=eXo tidak dapat menyalin rapat Anda ke akun ini: akun ini tidak memberi tahu kalender mana yang menjadi default, sehingga tidak ada tempat untuk menyimpannya. Hubungi administrator Anda.
caldav.error.foreignCopy=Rapat ini sudah ada di akun kalender Anda, ditambahkan oleh orang lain. eXo membiarkan salinan tersebut apa adanya.
caldav.error.forbidden=Kalender ini dibagikan dengan Anda dalam mode hanya-baca, sehingga perubahan Anda tidak dapat disimpan ke kalender ini.

caldav.server.authProviderUnknown=Metode autentikasi tersebut tidak tersedia di server ini. Pilih salah satu dari daftar.
caldav.server.writeChannelUnavailable=This server does not offer that way of writing meeting copies. Choose standard CalDAV.
caldav.server.writeChannelNotRecognised=With these settings, the add-on that offers this way of writing meeting copies does not recognize this server as one of its own. Check what changed in the server's settings.
caldav.server.url.malformed=Itu bukan alamat web yang dapat digunakan. Alamat harus diawali dengan https:// (atau http:// jika administrator Anda mengizinkannya) dan menyebutkan nama server.
caldav.server.url.schemeNotAllowed=Hanya alamat https yang diterima. Minta administrator Anda untuk mengizinkan http jika server ini tidak memiliki sertifikat.
caldav.server.url.credentials=Hapus nama pengguna dan kata sandi dari alamat. eXo menggunakan kredensial yang dipakai setiap pengguna untuk terhubung, bukan yang tertulis di alamat.
caldav.server.url.fragment=Hapus tanda # dan semua yang ada setelahnya. Alamat server tidak memuat fragmen.
caldav.server.url.portNotAllowed=Port tersebut tidak diizinkan. Gunakan port standar, atau minta administrator Anda untuk mengizinkan port ini.
caldav.server.url.usernameInAuthority=Placeholder {username} hanya boleh muncul setelah nama server, di bagian path. Letakkan di path, bukan di alamat server itu sendiri.
caldav.server.url.privateAddress=Alamat tersebut mengarah ke dalam jaringan Anda sendiri, sehingga tidak diterima. eXo terhubung dari server, sehingga alamat internal dapat digunakan untuk menjangkau mesin yang tidak pernah dimaksudkan untuk diekspos. Jika alamat ini benar, minta administrator Anda untuk mengizinkannya.
caldav.server.url.unresolvable=Nama server tersebut tidak ada. Periksa ejaannya.
caldav.share.calendarNotFound=Kalender ini sudah tidak ada.
caldav.share.notOwner=Hanya pemilik kalender yang dapat membagikannya.
caldav.share.notConnected=Hubungkan akun kalender Anda sebelum membagikan kalender.
caldav.share.calendarNotOnServer=Kalender ini belum ada di server kalender Anda. Coba lagi setelah sinkronisasi berikutnya.
caldav.share.notSupported=Server kalender Anda tidak mengizinkan eXo membagikan kalender.
caldav.share.shareeRequired=Pilih rekan kerja untuk berbagi.
caldav.share.shareeUnknown=Rekan kerja ini bukan pengguna aktif.
caldav.share.shareeIsOwner=Anda sudah memiliki kalender ini.
caldav.share.shareeNotConnected=Rekan kerja ini tidak terhubung ke server kalender yang sama.
caldav.share.samePrincipal=Rekan kerja ini menggunakan akun kalender yang sama dengan Anda, sehingga mereka sudah melihat kalender ini.
caldav.share.notReadOnly=Rekan kerja ini memiliki akses lebih dari sekadar melihat, yang diatur di luar platform. Ubah akses tersebut di aplikasi kalender Anda.
caldav.share.aclUnreadable=Server kalender Anda tidak mengizinkan platform melihat dengan siapa kalender ini dibagikan.
caldav.share.aclNotUnderstood=Kalender ini dibagikan dengan cara yang tidak dapat diubah dengan aman oleh platform. Kelola pembagiannya di aplikasi kalender Anda.
caldav.share.serverRefused=Server kalender Anda menolak perubahan tersebut.
caldav.share.notApplied=Server kalender Anda menerima perubahan tersebut tetapi tidak menerapkannya.
caldav.share.serverUnavailable=Server kalender Anda tidak dapat dijangkau. Coba lagi nanti.
caldav.share.credentials=Server kalender Anda menolak akun Anda. Periksa kata sandi Anda di pengaturan agenda.
caldav.share.ownerUnknown=Server kalender Anda tidak memberi tahu akun mana yang Anda gunakan untuk terhubung. Coba lagi setelah sinkronisasi berikutnya.
caldav.share.foreignAccessNotPreserved=Seseorang memiliki akses lebih dari sekadar melihat ke kalender ini, yang diatur di luar platform. Mengubah pembagian di sini dapat memengaruhi akses tersebut, jadi kelola di aplikasi kalender Anda.
caldav.share.shareeAddressUnknown=Server kalender tidak memberikan alamat email rekan kerja ini, sehingga platform tidak dapat mengubah akses mereka.
caldav.share.shareeHasOtherAccess=Rekan kerja ini memiliki akses lain ke kalender ini yang diatur di luar platform, seperti melihat kapan Anda luang. Membagikannya di sini akan menggantikan akses tersebut, jadi ubah di aplikasi kalender Anda.
caldav.share.notOwnedOnServer=Kalender ini milik orang lain, atau Anda tidak diizinkan mengelola pembagiannya. Anda hanya dapat membagikan kalender milik Anda sendiri dari platform.
caldav.admin.servers.drawer.authentication=Autentikasi
caldav.admin.servers.drawer.authProvider=Cara pengguna melakukan autentikasi
caldav.admin.servers.drawer.disconnection.title=Ubah autentikasi
caldav.admin.servers.drawer.disconnection.one=Mengubah autentikasi akan memutuskan 1 pengguna server ini.
caldav.admin.servers.drawer.disconnection.many=Mengubah autentikasi akan memutuskan {0} pengguna server ini.
caldav.admin.servers.drawer.disconnection.question=Apakah Anda yakin ingin menyimpan?
caldav.admin.servers.drawer.disconnection.confirm=Simpan
caldav.admin.servers.drawer.disconnection.cancel=Batal
caldav.admin.servers.drawer.disconnection.countFailed=Pengguna server ini tidak dapat dihitung. Tidak ada yang disimpan, coba lagi.
