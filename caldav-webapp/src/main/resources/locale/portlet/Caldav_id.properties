agenda.caldavCalendar.calendarDelete.propagates=Kalender ini juga ada di {0}. Menghapusnya di sini juga akan menghapusnya di sana, beserta semua acara di dalamnya. Termasuk acara yang Anda tambahkan dari ponsel atau aplikasi lain, dan tindakan ini tidak dapat dibatalkan.
agenda.caldavCalendar.calendarDelete.keepsRemote=Kalender yang sesuai di {0} tidak akan diubah. Kalender itu tetap ada di sana dengan semua acaranya, dan eXo hanya akan berhenti menampilkannya.
caldav.hiddenCalendars.title=Kalender tersembunyi
caldav.hiddenCalendars.subtitle={0} kalender yang Anda hapus di sini masih ada di akun kalender Anda
caldav.hiddenCalendars.manage=Kelola kalender tersembunyi
caldav.hiddenCalendars.drawer.title=Kalender tersembunyi
caldav.hiddenCalendars.drawer.description=Anda menghapus kalender ini dari eXo tetapi memilih untuk tetap menyimpannya di akun Anda. Menampilkan salah satunya lagi akan mengembalikannya pada sinkronisasi berikutnya, dengan acara yang ada di dalamnya saat ini.
caldav.hiddenCalendars.showAgain=Tampilkan lagi
caldav.hiddenCalendars.showAgainSuccess={0} akan kembali pada sinkronisasi berikutnya
caldav.hiddenCalendars.showAgainError=Kalender ini tidak dapat ditampilkan lagi
caldav.hiddenCalendars.count={0} kalender disembunyikan dari agenda Anda
caldav.hiddenCalendars.drawer.about=Kalender yang Anda sembunyikan di eXo. Tampilkan salah satunya untuk mengembalikannya: kalender yang dihapus akan kembali pada sinkronisasi berikutnya dengan acara terkininya, kalender yang dibagikan langsung kembali di bawah Dibagikan dengan saya.
caldav.hiddenCalendars.deletedHere=Dihapus di sini, tetap disimpan di akun kalender Anda
caldav.hiddenCalendars.sharedBy=Dibagikan oleh {0}
caldav.hiddenCalendars.sharedWithYou=Dibagikan dengan Anda
caldav.hiddenCalendars.showAgainSharedSuccess={0} kembali di bawah Dibagikan dengan saya
caldav.hiddenCalendars.notAShare=Anda hanya dapat menyembunyikan kalender yang dibagikan dengan Anda. Agar tidak lagi melihat salah satu kalender Anda sendiri, hapus kalender tersebut dan pilih "Simpan di akun kalender saya" saat diminta.
caldav.hiddenCalendars.calendarRequired=Pilih kalender yang akan disembunyikan.
caldav.hiddenCalendars.accountUnavailable=Akun kalender Anda tidak dapat dijangkau, sehingga kalender ini tidak disembunyikan. Coba lagi sebentar lagi.

caldav.admin.sync.title=Sinkronisasi kalender
caldav.admin.sync.description=Seberapa sering dan seberapa luas eXo membaca akun kalender yang dihubungkan pengguna Anda. Perubahan berlaku pada sinkronisasi berikutnya.
caldav.admin.sync.throttleMinutes.label=Jeda antar-sinkronisasi
caldav.admin.sync.throttleMinutes.help=Membuka agenda akan membaca akun yang terhubung, lalu membiarkannya selama waktu ini, berapa kali pun halaman dibuka. Ini mencegah pengguna yang sibuk mengirim permintaan setiap kali halaman ditampilkan.
caldav.admin.sync.pastDays.label=Baca acara dari masa lalu
caldav.admin.sync.pastDays.help=Seberapa jauh ke masa lalu eXo membaca acara. Acara yang sudah lewat jarang berubah, sehingga membaca lebih sedikit acara hampir tidak memakan biaya dan membuat setiap sinkronisasi lebih ringan.
caldav.admin.sync.futureDays.label=Baca acara ke depan
caldav.admin.sync.futureDays.help=Seberapa jauh ke depan eXo membaca acara. Inilah yang memakan biaya: rentang yang lebar pada akun dengan rapat berulang selama bertahun-tahun berarti unduhan yang besar, yang terjadi pada sinkronisasi pertama setiap hari.
caldav.admin.sync.sweepStaleMinutes.label=Segarkan akun yang tidak disentuh selama
caldav.admin.sync.sweepStaleMinutes.help=eXo membaca akun kalender saat pemiliknya membuka agenda, dan pemilik harus menunggu selama proses pemuatan. Akun yang tidak dibuka siapa pun lebih lama dari waktu ini akan disegarkan di latar belakang, sehingga agenda berikutnya terbuka dengan acara yang sudah tersedia.\n\nTurunkan nilai ini agar agenda lebih mutakhir, tetapi dengan lebih banyak permintaan ke server. Naikkan jika server kalender lambat atau dibatasi lajunya.
caldav.admin.sync.sweepBatchSize.label=Kalender per proses latar belakang
caldav.admin.sync.sweepBatchSize.help=Setiap proses menyegarkan paling banyak sejumlah kalender ini, dimulai dari yang paling lama. Naikkan untuk mengejar ketertinggalan lebih cepat pada instans yang sibuk, turunkan untuk menyebarkan beban.
