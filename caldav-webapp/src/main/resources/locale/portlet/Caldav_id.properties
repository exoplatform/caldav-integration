caldav.admin.managed.off.confirm.kept=Users will choose their own CalDAV server again. Accounts connected to {0} while managed mode governed their user are disconnected; the others keep synchronising.
caldav.admin.managed.off.confirm.disconnect.one=1 akun yang dikaitkan oleh Koneksi terpadu akan diputuskan.
caldav.admin.managed.off.confirm.disconnect.many={0} akun yang dikaitkan oleh Koneksi terpadu akan diputuskan.
caldav.admin.managed.off.countFailed=Akun yang dikaitkan oleh Koneksi terpadu tidak dapat dihitung. Koneksi terpadu tetap aktif, coba lagi.
