caldav.admin.servers.quirks.title=Apa yang dilakukan server ini
caldav.admin.servers.quirks.subtitle=Terlihat oleh eXo saat memeriksa salinan rapat yang dikirim ke sini. Centang salah satunya agar tidak lagi dianggap sebagai perubahan.
caldav.admin.servers.quirks.none=Tidak ada yang perlu dimaklumi: eXo tidak menemukan apa pun di server ini yang dianggapnya sebagai perubahan. Seperti itulah server yang menyimpan salinan dengan setia, dan server ini tidak memerlukan perhatian.
