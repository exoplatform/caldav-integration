caldav.admin.servers.url.hint=URL dapat berisi placeholder {username}, yang diganti dengan akun yang digunakan setiap pengguna untuk terhubung.
caldav.admin.servers.url.reachabilityHint=eXo terhubung dari server, bukan dari browser pengguna, sehingga alamat ini hanya perlu dapat dijangkau dari server. Alamat internal ditolak kecuali penerapan Anda mengizinkannya, karena jika tidak, eXo dapat digunakan untuk menjangkau mesin yang tidak pernah dimaksudkan untuk diekspos.
caldav.admin.servers.url.corsHint=Pengguna terhubung dari browser mereka, sehingga alamat harus memiliki asal (origin) yang sama dengan platform atau mengirim header CORS. Server pihak ketiga tanpa header tersebut harus ditempatkan di balik alamat platform itu sendiri.
