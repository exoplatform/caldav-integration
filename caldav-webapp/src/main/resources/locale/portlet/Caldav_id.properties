caldav.admin.managed.saved=Semua orang kini dikaitkan ke {0}
caldav.admin.managed.cleared=Pengguna kembali memilih server CalDAV mereka sendiri
caldav.admin.managed.saveFailed=Koneksi terpadu tidak dapat diaktifkan
caldav.admin.managed.clearFailed=Koneksi terpadu tidak dapat dinonaktifkan
caldav.managed.serverRequired=Pilih server yang harus digunakan semua orang untuk sinkronisasi.
caldav.managed.serverNotEligible=Pilih server yang sudah dikonfigurasi dan aktif. Server yang dinonaktifkan tidak dapat dijangkau, sehingga tidak ada yang dapat terhubung dalam Koneksi terpadu.
caldav.managed.providerNotEligible=Dalam Koneksi terpadu, server ini tidak dapat menggunakan penyedia yang memerlukan kredensial setiap pengguna. Nonaktifkan Koneksi terpadu, atau pilih penyedia dengan akun layanan.
caldav.admin.servers.list.managedLocked=Anda tidak dapat menonaktifkan atau menghapus server ini selama Koneksi terpadu menggunakannya. Nonaktifkan Koneksi terpadu terlebih dahulu, di baris di atas daftar server.
caldav.managed.serverInUse=Anda tidak dapat menonaktifkan server ini selama Koneksi terpadu aktif, karena semua orang tersinkronisasi dengannya. Nonaktifkan Koneksi terpadu terlebih dahulu, di baris di atas daftar server.
caldav.managed.connectionLocked=Your organization manages your calendar account: its connection can't be changed.
caldav.managed.refused=Your organization's calendar server does not accept your account. Contact your administrator.
agenda.caldavCalendar.disconnect.warning=Kalender yang ditampilkan eXo dari {0} akan dihapus dari agenda Anda, beserta salinan acaranya. Tidak ada yang dihapus di {0}, dan kalender yang Anda buat di eXo tetap ada. Hubungkan kembali akun tersebut dan kalender-kalender itu akan kembali.
caldav.pendingCopies.title=Salinan rapat yang masih dalam proses
caldav.pendingCopies.subtitle={0} rapat Anda telah berubah di eXo dan perubahannya belum sampai ke kalender Anda. eXo terus mencoba; sinkronisasi latar belakang berikutnya biasanya menyelesaikannya.
caldav.calendarStates.title=Kalender yang memerlukan perhatian
caldav.calendarStates.subtitle={0} kalender Anda tidak tersinkronisasi dengan normal
caldav.calendarStates.manage=Lihat masalahnya
caldav.calendarStates.drawer.title=Kalender yang memerlukan perhatian
caldav.calendarStates.drawer.description=Kalender ini tidak tersinkronisasi seperti kalender lainnya. Kalender Anda yang lain tidak terpengaruh.
caldav.calendarStates.explain.REMOTE_CREATE_REFUSED=Akun kalender Anda tidak mengizinkan eXo membuat kalender di dalamnya, sehingga kalender ini tidak disalin ke sana. Kalender yang sudah ada di akun tersebut tetap muncul di eXo.
caldav.calendarStates.explain.PAUSED=Sinkronisasi kalender ini gagal berulang kali, sehingga eXo berhenti mencoba. Sinkronkan sekarang untuk memulai lagi; jika terus gagal, hubungkan kembali akun tersebut.
caldav.calendarStates.explain.EXO_ORPHANED=Anda menghapus kalender ini di eXo, dan kalender ini tidak dapat dihapus di akun kalender Anda. Kalender ini masih ada di sana.
caldav.calendarStates.explain.REMOTE_GONE=Kalender ini sudah tidak ada di akun kalender Anda. Tidak ada hal baru yang akan masuk ke dalamnya, dan apa yang sudah disimpan eXo tidak diubah.
caldav.calendarStates.explain.RETIRED_SUBSCRIPTION=Ini adalah salinan kalender yang dibagikan dengan Anda, atau salinan sumber daya yang Anda langgani. Kalender ini tidak lagi tersinkronisasi, sehingga perubahan di sini tidak dikirim ke mana pun. Hapus kalender ini dan kalender aslinya akan muncul di bawah Dibagikan dengan saya, dalam mode hanya-baca.
caldav.calendarStates.explain.unknown=Kalender ini tidak tersinkronisasi dengan normal.
caldav.calendarStates.lastSynchronised={0}
caldav.calendarStates.syncNow=Sinkronkan sekarang
caldav.calendarStates.synchronised=Kalender Anda telah disinkronkan. Salinan rapat Anda sedang diperiksa di latar belakang.
caldav.calendarStates.syncFailed=Akun kalender Anda tidak dapat disinkronkan
