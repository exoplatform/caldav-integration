caldav.error.serverNotUsable=This calendar server cannot be used yet: the service it signs in with is not installed. Try again later or contact your administrator.
caldav.error.cors=Server dapat dijangkau tetapi menolak permintaan lintas asal (cross-origin) dari browser (server tidak mengirim header CORS). Minta administrator Anda untuk menyajikannya dari alamat platform itu sendiri.
caldav.admin.servers.title=Server CalDAV
caldav.admin.servers.subtitle=Tambahkan server CalDAV tempat pengguna dapat menghubungkan akun pribadi. Kalender pribadi tersinkronisasi dua arah dengan Kalender Saya. Rapat eXo disalin satu arah, hanya ke kalender pribadi.
