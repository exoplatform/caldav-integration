caldav.tuning.throttleOutOfRange=Jeda antar-sinkronisasi harus antara 0 menit dan satu hari.
caldav.tuning.pastDaysOutOfRange=Pembacaan ke masa lalu harus antara 0 dan 365 hari.
caldav.tuning.futureDaysOutOfRange=Pembacaan ke depan harus antara 1 dan 365 hari.
caldav.tuning.sweepStaleOutOfRange=Jeda penyegaran latar belakang harus antara 1 menit dan satu minggu.
caldav.tuning.sweepBatchOutOfRange=Proses latar belakang harus mencakup antara 1 dan 500 kalender.
caldav.admin.sync.summary=Membaca {1} hari ke belakang dan {2} hari ke depan. Agenda yang baru saja dibuka menunggu {0} menit sebelum membaca akun lagi; akun yang tidak dibuka siapa pun disegarkan di latar belakang setelah {3} menit.
caldav.admin.sync.cancel=Batal
caldav.admin.sync.reports.title=Salinan rapat, per pengguna
caldav.admin.sync.reports.subtitle=Cara setiap server yang terhubung menangani salinan rapat selama sinkronisasi terakhir. Data ini hanya disimpan di memori, sehingga tabel kosong setelah server dimulai ulang hingga akun tersinkronisasi lagi.
caldav.admin.sync.reports.none=Belum ada akun terhubung yang memeriksa salinan rapatnya sejak server terakhir dimulai ulang. Tabel ini akan terisi seiring akun tersinkronisasi.
caldav.admin.sync.reports.checked={0} salinan diperiksa, {1} hilang, {2} diubah, {3} ditulis ulang, {4} dibiarkan.
caldav.admin.sync.reports.moved=Dipindahkan ke tujuan baru: {0} salinan dipindahkan, {1} salinan lama tidak dihapus oleh server, {2} tidak dapat ditulis.
caldav.admin.sync.reports.notMoved=Tidak ada perubahan tujuan yang tertunda.
caldav.admin.sync.reports.loadFailed=Hitungan ini tidak dapat dibaca.
caldav.admin.sync.reports.unknownUser=Pengguna {0}
