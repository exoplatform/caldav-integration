caldav.error.serverNotUsable=Acest server de calendar nu poate fi folosit \u00eenc\u0103: serviciul prin care se autentific\u0103 nu este instalat. \u00cencerca\u021bi din nou mai t\u00e2rziu sau contacta\u021bi administratorul.
caldav.error.cors=Serverul poate fi accesat, dar a refuzat cererea cross-origin a browserului (nu trimite anteturi CORS). Cere\u021bi administratorului s\u0103 \u00eel publice prin adresa proprie a platformei.
caldav.admin.servers.title=Servere CalDAV
caldav.admin.servers.subtitle=Ad\u0103uga\u021bi serverele CalDAV la care utilizatorii \u00ee\u0219i pot conecta un cont personal. Calendarele personale se sincronizeaz\u0103 \u00een ambele sensuri cu Calendarele mele. \u00cent\u00e2lnirile eXo sunt copiate \u00eentr-un singur sens, doar \u00een calendarul personal.
caldav.admin.servers.add=Ad\u0103uga\u021bi
caldav.admin.servers.noServers=Niciun server CalDAV declarat \u00eenc\u0103
caldav.admin.servers.list.name=Nume
caldav.admin.servers.list.activate=Activare
caldav.admin.servers.list.actions=Ac\u021biuni
caldav.admin.servers.preset.label=Ce server este acesta?
caldav.admin.servers.preset.stalwart.label=Stalwart
caldav.admin.servers.preset.stalwart.summary=Am completat numele serverului \u0219i formatul adresei. Stalwart p\u0103streaz\u0103 ce trimite eXo, a\u0219a c\u0103 este setat s\u0103 p\u0103streze totul, \u00een loc s\u0103 preia excep\u021biile valabile pentru \u00eentreaga implementare.\n\nCopiile ajung \u00eentr-un calendar dedicat \u00cent\u00e2lniri eXo. Linkurile de r\u0103spuns sunt dezactivate, deoarece Stalwart accept\u0103 r\u0103spunsuri din orice calendar, iar butoanele Acceptare \u0219i Refuz ale clientului func\u021bioneaz\u0103 deja pe copie.\n\nVerifica\u021bi \u00eenainte de a salva.
caldav.admin.servers.preset.other.label=Alt server
caldav.admin.servers.preset.other.summary=Nu este completat nimic. Un server care lipse\u0219te este unul pe care nu l-am testat, nu unul neacceptat. Completa\u021bi formularul singur, iar eXo va sugera set\u0103ri dup\u0103 ce primele evenimente au fost sincronizate.
caldav.admin.servers.preset.changesWhatIsWritten=Una dintre acestea schimb\u0103 ce scrie eXo \u00een calendarele utilizatorilor dumneavoastr\u0103, nu doar ce compar\u0103.
caldav.admin.servers.name=Nume
caldav.admin.servers.name.placeholder=Nume afi\u0219at utilizatorilor
caldav.admin.servers.description=Descriere
caldav.admin.servers.description.placeholder=Descriere op\u021bional\u0103 afi\u0219at\u0103 utilizatorilor
caldav.admin.servers.url=URL-ul serverului
caldav.admin.servers.url.placeholder=https://caldav.example.org/dav/cal/{username}/
caldav.admin.servers.url.hint=URL-ul poate con\u021bine substituentul {username}, \u00eenlocuit cu contul cu care se conecteaz\u0103 fiecare utilizator.
caldav.admin.servers.url.reachabilityHint=eXo se conecteaz\u0103 de pe server, nu din browserul utilizatorului, a\u0219a c\u0103 aceast\u0103 adres\u0103 trebuie s\u0103 fie accesibil\u0103 doar de pe server. Adresele interne sunt refuzate, cu excep\u021bia cazului \u00een care implementarea dumneavoastr\u0103 le permite, deoarece altfel eXo ar putea fi folosit pentru a accesa ma\u0219ini care nu au fost niciodat\u0103 destinate expunerii.
caldav.admin.servers.url.corsHint=Utilizatorii se conecteaz\u0103 din browser, a\u0219a c\u0103 adresa trebuie s\u0103 aib\u0103 aceea\u0219i origine ca platforma sau s\u0103 trimit\u0103 anteturi CORS. Un server ter\u021b f\u0103r\u0103 acestea trebuie publicat prin adresa proprie a platformei.
