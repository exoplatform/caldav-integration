caldav.admin.servers.answerLinks.label=Ad\u0103uga\u021bi linkuri de r\u0103spuns \u00een copie
caldav.admin.servers.answerLinks.hint=Ad\u0103uga\u021bi linkurile Acceptare, Refuz \u0219i Provizoriu \u00een descrierea fiec\u0103rei \u00eent\u00e2lniri copiate. Dezactiva\u021bi aceast\u0103 op\u021biune doar dac\u0103 clien\u021bii de calendar afi\u0219eaz\u0103 deja propriile butoane de r\u0103spuns, altfel utilizatorii nu vor putea r\u0103spunde deloc.
caldav.admin.servers.mirrorTarget.label=Unde sunt scrise copiile \u00eent\u00e2lnirilor
caldav.admin.servers.mirrorTarget.appliesTo=Se aplic\u0103 utilizatorilor care p\u0103streaz\u0103 activate copiile \u00eent\u00e2lnirilor \u00een propriile set\u0103ri ale agendei.
caldav.admin.servers.mirrorTarget.dedicated.label=Un calendar dedicat \u00cent\u00e2lniri eXo
caldav.admin.servers.mirrorTarget.dedicated.consequence=P\u0103streaz\u0103 \u00eent\u00e2lnirile eXo separat de evenimentele proprii ale utilizatorului. Pe unele servere, un calendar separat nu este luat \u00een calcul la disponibilitate, a\u0219a c\u0103 colegii v\u0103d orele \u00eent\u00e2lnirilor eXo ca libere \u0219i pe copii nu apar butoane de r\u0103spuns.
caldav.admin.servers.mirrorTarget.main.label=Calendarul principal al contului
caldav.admin.servers.mirrorTarget.main.consequence=Copiile sunt luate \u00een calcul la disponibilitatea utilizatorului, iar butoanele de r\u0103spuns proprii ale serverului apar acolo unde le ofer\u0103. Alege\u021bi aceast\u0103 op\u021biune doar dup\u0103 ce copiile se sincronizeaz\u0103 corect pe acest server.
caldav.admin.servers.mirrorTarget.moves=Modificarea acestei set\u0103ri mut\u0103 copiile existente ale fiec\u0103rui utilizator \u00een cursul urm\u0103toarelor sincroniz\u0103ri. Vechiul calendar \u00cent\u00e2lniri eXo r\u0103m\u00e2ne pe loc, gol.
caldav.admin.servers.writeChannel.label=Cum sunt scrise copiile \u00eent\u00e2lnirilor
caldav.admin.servers.writeChannel.hint=Se aplic\u0103 fiec\u0103rei copii pe care eXo o scrie sau o elimin\u0103 pe acest server, pentru fiecare utilizator.
caldav.admin.servers.writeChannel.caldav.label=CalDAV standard
caldav.admin.servers.writeChannel.caldav.consequenceAnyServer=Func\u021bioneaz\u0103 cu orice server CalDAV. Unele servere trimit propriile invita\u021bii pentru o \u00eent\u00e2lnire scris\u0103 \u00een acest mod: invita\u021bii de pe acela\u0219i server o primesc atunci de dou\u0103 ori, iar un r\u0103spuns dat pe copia serverului nu ajunge niciodat\u0103 la eXo.
caldav.admin.servers.writeChannel.unavailable.label=O cale pe care aceast\u0103 platform\u0103 nu o mai ofer\u0103 ({0})
caldav.admin.servers.writeChannel.unavailable.consequence=Suplimentul care scrie copiile \u00een acest mod nu este instalat, a\u0219a c\u0103 fiecare copie pentru acest server este refuzat\u0103 p\u00e2n\u0103 c\u00e2nd este reinstalat sau p\u00e2n\u0103 c\u00e2nd trece\u021bi la CalDAV standard.
caldav.admin.servers.drawer.add.success=Serverul CalDAV a fost ad\u0103ugat
caldav.admin.servers.drawer.add.error=Serverul CalDAV nu a putut fi ad\u0103ugat. Verifica\u021bi valorile \u0219i \u00eencerca\u021bi din nou.
caldav.admin.servers.drawer.edit.success=Serverul CalDAV a fost actualizat
caldav.admin.servers.drawer.edit.error=Serverul CalDAV nu a putut fi actualizat. Verifica\u021bi valorile \u0219i \u00eencerca\u021bi din nou.
caldav.admin.servers.activate.success=Serverul CalDAV a fost activat
caldav.admin.servers.deactivate.success=Serverul CalDAV a fost dezactivat
caldav.admin.servers.activate.error=Serverul CalDAV nu a putut fi activat
caldav.admin.servers.deactivate.error=Serverul CalDAV nu a putut fi dezactivat
caldav.admin.servers.delete.success=Serverul CalDAV a fost \u0219ters
caldav.admin.servers.delete.error=Serverul CalDAV nu a putut fi \u0219ters
caldav.admin.servers.delete.referenced=Conturi conectate care \u00eenc\u0103 folosesc acest server: {0}. Dezactiva\u021bi-l \u0219i l\u0103sa\u021bi-le s\u0103 se deconecteze \u00eenainte de a-l \u0219terge.
caldav.admin.servers.modal.delete.title=\u0218terge\u021bi serverul CalDAV
caldav.admin.servers.modal.delete.message=Serverul va disp\u0103rea din conectorii tuturor utilizatorilor. Conturile \u00eenc\u0103 conectate la el blocheaz\u0103 \u0219tergerea.
caldav.admin.servers.modal.delete.confirmDelete=Delete
caldav.admin.servers.modal.delete.cancelDelete=Cancel
agenda.caldavCalendar.calendarDelete.propagates=Acest calendar exist\u0103 \u0219i pe {0}. Dac\u0103 \u00eel \u0219terge\u021bi aici, va fi \u0219ters \u0219i acolo, cu toate evenimentele din el. Aceasta include evenimentele ad\u0103ugate de pe telefon sau din alt\u0103 aplica\u021bie, iar ac\u021biunea nu poate fi anulat\u0103.
agenda.caldavCalendar.calendarDelete.keepsRemote=Calendarul corespunz\u0103tor de pe {0} nu va fi modificat. R\u0103m\u00e2ne acolo cu toate evenimentele sale, iar eXo va \u00eenceta pur \u0219i simplu s\u0103 \u00eel afi\u0219eze.
caldav.hiddenCalendars.title=Calendare ascunse
caldav.hiddenCalendars.subtitle=Calendare \u0219terse aici care se afl\u0103 \u00eenc\u0103 \u00een contul dumneavoastr\u0103 de calendar: {0}
caldav.hiddenCalendars.manage=Gestiona\u021bi calendarele ascunse
caldav.hiddenCalendars.drawer.title=Calendare ascunse
caldav.hiddenCalendars.drawer.description=A\u021bi \u0219ters aceste calendare din eXo, dar a\u021bi ales s\u0103 le p\u0103stra\u021bi \u00een cont. Dac\u0103 afi\u0219a\u021bi din nou unul dintre ele, acesta revine la urm\u0103toarea sincronizare, cu evenimentele pe care le con\u021bine \u00een acel moment.
caldav.hiddenCalendars.showAgain=Afi\u0219a\u021bi din nou
caldav.hiddenCalendars.showAgainSuccess={0} va reveni la urm\u0103toarea sincronizare
caldav.hiddenCalendars.showAgainError=Acest calendar nu a putut fi afi\u0219at din nou
caldav.hiddenCalendars.count=Calendare ascunse din agenda dumneavoastr\u0103: {0}
caldav.hiddenCalendars.drawer.about=Calendarele pe care le-a\u021bi ascuns \u00een eXo. Afi\u0219a\u021bi unul pentru a-l readuce: un calendar \u0219ters revine la urm\u0103toarea sincronizare cu evenimentele sale actuale, iar unul partajat revine imediat \u00een Partajate cu mine.
caldav.hiddenCalendars.deletedHere=\u0218ters aici, p\u0103strat \u00een contul dumneavoastr\u0103 de calendar
caldav.hiddenCalendars.sharedBy=Partajat de {0}
caldav.hiddenCalendars.sharedWithYou=Partajat cu dumneavoastr\u0103
caldav.hiddenCalendars.showAgainSharedSuccess={0} este din nou \u00een Partajate cu mine
caldav.hiddenCalendars.notAShare=Pute\u021bi ascunde doar calendarele partajate cu dumneavoastr\u0103. Pentru a nu mai vedea unul dintre calendarele proprii, \u0219terge\u021bi-l \u0219i selecta\u021bi \u201eP\u0103stra\u021bi \u00een contul meu de calendar\u201d c\u00e2nd vi se cere.
caldav.hiddenCalendars.calendarRequired=Alege\u021bi calendarul de ascuns.
caldav.hiddenCalendars.accountUnavailable=Contul dumneavoastr\u0103 de calendar nu a putut fi accesat, a\u0219a c\u0103 acest calendar nu a fost ascuns. \u00cencerca\u021bi din nou peste c\u00e2teva momente.

caldav.admin.sync.title=Sincronizarea calendarelor
caldav.admin.sync.description=C\u00e2t de des \u0219i c\u00e2t de extins cite\u0219te eXo conturile de calendar conectate de utilizatori. Modific\u0103rile intr\u0103 \u00een vigoare la urm\u0103toarea sincronizare.
caldav.admin.sync.throttleMinutes.label=A\u0219teptare \u00eentre sincroniz\u0103ri
caldav.admin.sync.throttleMinutes.help=Deschiderea agendei cite\u0219te contul conectat, apoi nu \u00eel mai acceseaz\u0103 timp de aceast\u0103 durat\u0103, indiferent de c\u00e2te ori este deschis\u0103 pagina. Astfel, un utilizator foarte activ nu trimite o cerere la fiecare afi\u0219are.
caldav.admin.sync.pastDays.label=Citire evenimente din trecut
caldav.admin.sync.pastDays.help=C\u00e2t de departe \u00een trecut cite\u0219te eXo evenimentele. Evenimentele trecute se schimb\u0103 rar, a\u0219a c\u0103 citirea unui num\u0103r mai mic dintre ele nu cost\u0103 aproape nimic \u0219i face fiecare sincronizare mai u\u0219oar\u0103.
caldav.admin.sync.futureDays.label=Citire evenimente viitoare
caldav.admin.sync.futureDays.help=C\u00e2t de departe \u00een viitor cite\u0219te eXo evenimentele. Aceasta este setarea costisitoare: o fereastr\u0103 larg\u0103 pe un cont cu ani de \u00eent\u00e2lniri recurente \u00eenseamn\u0103 o desc\u0103rcare mare, pl\u0103tit\u0103 la prima sincronizare din fiecare zi.
caldav.admin.sync.sweepStaleMinutes.label=Re\u00eemprosp\u0103ta\u021bi conturile neaccesate de
caldav.admin.sync.sweepStaleMinutes.help=eXo cite\u0219te un cont de calendar atunci c\u00e2nd proprietarul \u00ee\u0219i deschide agenda, iar acesta a\u0219teapt\u0103 c\u00e2t timp se \u00eencarc\u0103. Conturile pe care nu le-a deschis nimeni de mai mult de at\u00e2t sunt re\u00eemprosp\u0103tate \u00een fundal, astfel \u00eenc\u00e2t agenda se deschide data viitoare cu evenimentele deja prezente.\n\nReduce\u021bi valoarea pentru agende mai actuale, dar cu mai multe cereri c\u0103tre server. M\u0103ri\u021bi-o dac\u0103 serverele de calendar sunt lente sau au limite de cereri.
caldav.admin.sync.sweepBatchSize.label=Calendare per rulare \u00een fundal
caldav.admin.sync.sweepBatchSize.help=Fiecare rulare re\u00eemprosp\u0103teaz\u0103 cel mult acest num\u0103r de calendare, \u00eencep\u00e2nd cu cele mai vechi. M\u0103ri\u021bi valoarea pentru a recupera mai repede pe o instan\u021b\u0103 aglomerat\u0103, reduce\u021bi-o pentru a distribui \u00eenc\u0103rcarea.
caldav.admin.sync.unit.minutes=minute
caldav.admin.sync.unit.days=zile
caldav.admin.sync.unit.calendars=calendare
caldav.admin.sync.save=Salva\u021bi
caldav.admin.sync.saved=Set\u0103rile de sincronizare au fost salvate
caldav.admin.sync.saveFailed=Aceste set\u0103ri nu au putut fi salvate
caldav.tuning.mandatory=Nu a fost trimis\u0103 nicio setare
caldav.tuning.throttleOutOfRange=A\u0219teptarea \u00eentre sincroniz\u0103ri trebuie s\u0103 fie \u00eentre 0 minute \u0219i o zi.
caldav.tuning.pastDaysOutOfRange=Citirea trecutului trebuie s\u0103 fie \u00eentre 0 \u0219i 365 de zile.
caldav.tuning.futureDaysOutOfRange=Citirea \u00een avans trebuie s\u0103 fie \u00eentre 1 \u0219i 365 de zile.
caldav.tuning.sweepStaleOutOfRange=\u00cent\u00e2rzierea re\u00eemprosp\u0103t\u0103rii \u00een fundal trebuie s\u0103 fie \u00eentre 1 minut \u0219i o s\u0103pt\u0103m\u00e2n\u0103.
caldav.tuning.sweepBatchOutOfRange=Rularea \u00een fundal trebuie s\u0103 preia \u00eentre 1 \u0219i 500 de calendare.
caldav.admin.sync.summary=Se citesc {1} zile \u00een urm\u0103 \u0219i {2} zile \u00een avans. O agend\u0103 tocmai deschis\u0103 a\u0219teapt\u0103 {0} minute \u00eenainte de a citi din nou contul; un cont pe care nu \u00eel deschide nimeni este re\u00eemprosp\u0103tat \u00een fundal dup\u0103 {3} minute.
caldav.admin.sync.cancel=Anula\u021bi
caldav.admin.sync.reports.title=Copii ale \u00eent\u00e2lnirilor, per utilizator
caldav.admin.sync.reports.subtitle=Cum a gestionat fiecare server conectat copiile \u00eent\u00e2lnirilor la ultima sincronizare. Aceste date sunt p\u0103strate doar \u00een memorie, a\u0219a c\u0103 tabelul este gol dup\u0103 o repornire p\u00e2n\u0103 c\u00e2nd conturile se sincronizeaz\u0103 din nou.
caldav.admin.sync.reports.none=Niciun cont conectat nu \u0219i-a verificat copiile \u00eent\u00e2lnirilor de la ultima repornire. Tabelul se completeaz\u0103 pe m\u0103sur\u0103 ce conturile se sincronizeaz\u0103.
caldav.admin.sync.reports.checked=Copii verificate: {0}, lips\u0103: {1}, modificate: {2}, rescrise: {3}, l\u0103sate neschimbate: {4}.
caldav.admin.sync.reports.moved=Mutare la noua destina\u021bie: copii mutate: {0}, copii vechi pe care serverul nu le-a eliminat: {1}, copii care nu au putut fi scrise: {2}.
caldav.admin.sync.reports.notMoved=Nu era \u00een a\u0219teptare nicio schimbare de destina\u021bie.
caldav.admin.sync.reports.loadFailed=Aceste totaluri nu au putut fi citite.
caldav.admin.sync.reports.unknownUser=Utilizator {0}
caldav.admin.managed.title=Conectare unificat\u0103
caldav.admin.managed.off=Utilizatorii \u00ee\u0219i conecteaz\u0103 propriul cont.
caldav.admin.managed.on=To\u021bi utilizatorii sunt ata\u0219a\u021bi la {0}.
caldav.admin.managed.noServers=Niciun server declarat \u00eenc\u0103.
caldav.admin.managed.switchNotice=Utilizatorii conecta\u021bi la un alt server trec la acesta \u00een decurs de o or\u0103 sau la urm\u0103toarea lor conectare. Calendarele din contul lor anterior nu se mai sincronizeaz\u0103.
caldav.admin.managed.onExcept=Toat\u0103 lumea este ata\u0219at\u0103 la {0}, cu excep\u021bia a {1} grup(uri) sau spa\u021biu(i) excluse.
caldav.admin.managed.off.confirm.title=Dezactiva\u021bi conectarea unificat\u0103?
caldav.admin.managed.off.confirm.kept=Utilizatorii \u00ee\u0219i vor alege din nou propriul server CalDAV. Conturile ata\u0219ate la {0} prin conectarea unificat\u0103 vor fi deconectate. Celelalte conturi continu\u0103 s\u0103 se sincronizeze.
caldav.admin.managed.off.confirm.disconnect.one=1 cont ata\u0219at prin conectarea unificat\u0103 va fi deconectat.
caldav.admin.managed.off.confirm.disconnect.many={0} conturi ata\u0219ate prin conectarea unificat\u0103 vor fi deconectate.
caldav.admin.managed.off.countFailed=Conturile ata\u0219ate prin conectarea unificat\u0103 nu au putut fi num\u0103rate. Conectarea unificat\u0103 r\u0103m\u00e2ne activat\u0103. \u00cencerca\u021bi din nou.
caldav.admin.managed.off.confirm.question=Sigur dori\u021bi s\u0103 o dezactiva\u021bi?
caldav.admin.managed.off.confirm.ok=Dezactiva\u021bi
caldav.admin.managed.off.confirm.cancel=P\u0103stra\u021bi-o activat\u0103
caldav.admin.managed.saved=To\u021bi utilizatorii sunt acum ata\u0219a\u021bi la {0}
caldav.admin.managed.cleared=Utilizatorii \u00ee\u0219i aleg din nou propriul server CalDAV
caldav.admin.managed.saveFailed=Conectarea unificat\u0103 nu a putut fi activat\u0103
caldav.admin.managed.clearFailed=Conectarea unificat\u0103 nu a putut fi dezactivat\u0103
caldav.managed.serverRequired=Alege\u021bi serverul cu care ar trebui s\u0103 se sincronizeze toat\u0103 lumea.
caldav.managed.serverNotEligible=Alege\u021bi un server configurat \u0219i activ. Un server dezactivat nu poate fi accesat, a\u0219a c\u0103 nimeni nu s-ar putea conecta \u00een modul de conectare unificat\u0103.
caldav.managed.providerNotEligible=\u00cen modul conectare unificat\u0103, acest server nu poate folosi un furnizor care necesit\u0103 datele de autentificare ale fiec\u0103rui utilizator. Dezactiva\u021bi conectarea unificat\u0103 sau alege\u021bi un furnizor cu un cont de serviciu.
caldav.admin.servers.list.managedLocked=Nu pute\u021bi dezactiva sau \u0219terge acest server c\u00e2t timp este folosit de conectarea unificat\u0103. Dezactiva\u021bi mai \u00eent\u00e2i conectarea unificat\u0103, din r\u00e2ndul de deasupra listei de servere.
caldav.managed.serverInUse=Nu pute\u021bi dezactiva acest server c\u00e2t timp conectarea unificat\u0103 este activ\u0103, deoarece to\u021bi utilizatorii se sincronizeaz\u0103 cu el. Dezactiva\u021bi mai \u00eent\u00e2i conectarea unificat\u0103, din r\u00e2ndul de deasupra listei de servere.
caldav.managed.connectionLocked=Organiza\u021bia dumneavoastr\u0103 gestioneaz\u0103 contul dvs. de calendar: conexiunea acestuia nu poate fi modificat\u0103.
caldav.managed.refused=Serverul de calendar al organiza\u021biei dumneavoastr\u0103 nu accept\u0103 contul dvs. Contacta\u021bi administratorul.
agenda.caldavCalendar.disconnect.warning=Calendarele pe care eXo le afi\u0219eaz\u0103 din {0} vor fi eliminate din agenda dumneavoastr\u0103, \u00eempreun\u0103 cu copiile evenimentelor lor. Nu se \u0219terge nimic pe {0}, iar calendarele create \u00een eXo r\u0103m\u00e2n. Reconecta\u021bi contul \u0219i acele calendare revin.
caldav.pendingCopies.title=Copii ale \u00eent\u00e2lnirilor \u00eenc\u0103 \u00een curs de transmitere
caldav.pendingCopies.subtitle=\u00cent\u00e2lniri modificate \u00een eXo a c\u0103ror modificare nu a ajuns \u00eenc\u0103 \u00een calendarul dumneavoastr\u0103: {0}. eXo continu\u0103 s\u0103 \u00eencerce; urm\u0103toarea sincronizare \u00een fundal le rezolv\u0103 de obicei.
caldav.calendarStates.title=Calendare care necesit\u0103 aten\u021bie
caldav.calendarStates.subtitle=Calendare care nu se sincronizeaz\u0103 normal: {0}
caldav.calendarStates.manage=Vede\u021bi ce nu func\u021bioneaz\u0103
caldav.calendarStates.drawer.title=Calendare care necesit\u0103 aten\u021bie
caldav.calendarStates.drawer.description=Aceste calendare nu se sincronizeaz\u0103 la fel ca celelalte. Restul calendarelor dumneavoastr\u0103 nu sunt afectate.
caldav.calendarStates.explain.REMOTE_CREATE_REFUSED=Contul dumneavoastr\u0103 de calendar nu permite eXo s\u0103 creeze calendare \u00een el, a\u0219a c\u0103 acesta nu este copiat acolo. Calendarele care exist\u0103 deja \u00een cont apar \u00een continuare \u00een eXo.
caldav.calendarStates.explain.PAUSED=Sincronizarea acestui calendar a e\u0219uat \u00een mod repetat, a\u0219a c\u0103 eXo a \u00eencetat s\u0103 mai \u00eencerce. Sincroniza\u021bi acum pentru a reporni; dac\u0103 e\u0219ueaz\u0103 \u00een continuare, reconecta\u021bi contul.
caldav.calendarStates.explain.EXO_ORPHANED=A\u021bi \u0219ters acest calendar \u00een eXo, dar nu a putut fi \u0219ters din contul dumneavoastr\u0103 de calendar. Este \u00eenc\u0103 acolo.
caldav.calendarStates.explain.REMOTE_GONE=Acest calendar nu mai exist\u0103 \u00een contul dumneavoastr\u0103 de calendar. Nu va mai primi nimic nou, iar ceea ce de\u021bine deja eXo r\u0103m\u00e2ne neatins.
caldav.calendarStates.explain.RETIRED_SUBSCRIPTION=Aceasta este o copie a unui calendar partajat cu dumneavoastr\u0103 sau a unei resurse la care v-a\u021bi abonat. Nu se mai sincronizeaz\u0103, a\u0219a c\u0103 modific\u0103rile f\u0103cute aici nu ajung nic\u0103ieri. \u0218terge\u021bi-o, iar originalul apare \u00een Partajate cu mine, doar \u00een citire.
caldav.calendarStates.explain.unknown=Acest calendar nu se sincronizeaz\u0103 normal.
caldav.calendarStates.lastSynchronised={0}
caldav.calendarStates.syncNow=Sincroniza\u021bi acum
caldav.calendarStates.synchronised=Calendarele dumneavoastr\u0103 au fost sincronizate. Copiile \u00eent\u00e2lnirilor sunt verificate \u00een fundal.
caldav.calendarStates.syncFailed=Contul dumneavoastr\u0103 de calendar nu a putut fi sincronizat
caldav.deviceSetup.title=Calendarele dumneavoastr\u0103 pe telefon
caldav.deviceSetup.subtitle=Ad\u0103uga\u021bi calendarele eXo \u00een aplica\u021bia de calendar de pe telefon sau de pe computer
caldav.deviceSetup.action=Configura\u021bi
caldav.deviceSetup.drawer.title=Calendarele dumneavoastr\u0103 pe telefon
caldav.deviceSetup.drawer.description=Orice aplica\u021bie de calendar CalDAV poate afi\u0219a calendarele conectate. Folosi\u021bi aceste detalii c\u00e2nd ad\u0103uga\u021bi contul:
caldav.deviceSetup.serverAddress=Adresa serverului
caldav.deviceSetup.username=Nume de utilizator
caldav.deviceSetup.passwordNote=Folosi\u021bi parola acestui cont de calendar, aceea\u0219i cu care l-a\u021bi conectat la eXo. eXo nu are o parol\u0103 separat\u0103 proprie.
caldav.deviceSetup.copy=Copia\u021bi {0}
caldav.deviceSetup.copied={0} copiat
caldav.deviceSetup.copyFallback=Copierea nu este disponibil\u0103 aici; valoarea este selectat\u0103, ap\u0103sa\u021bi Ctrl+C (Cmd+C pe Mac) pentru a o copia
caldav.admin.servers.quirks.title=Ce face acest server
caldav.admin.servers.quirks.subtitle=Observat de eXo la verificarea copiilor \u00eent\u00e2lnirilor trimise aici. Bifa\u021bi un element pentru a nu-l mai trata ca modificare.
caldav.admin.servers.quirks.none=Nimic de scuzat: eXo nu a g\u0103sit pe acest server nimic pe care s\u0103-l trateze ca modificare. A\u0219a arat\u0103 un server care stocheaz\u0103 copiile fidel \u0219i nu necesit\u0103 nicio aten\u021bie.
caldav.admin.servers.quirks.seen.once=Observat o dat\u0103
caldav.admin.servers.quirks.seen.many=Observat de {0} ori
caldav.admin.servers.quirks.dropsConference.label=Acest server nu p\u0103streaz\u0103 linkurile de conferin\u021b\u0103 video
caldav.admin.servers.quirks.dropsConference.cost=eXo nu mai trateaz\u0103 linkul lips\u0103 ca modificare \u0219i nu va mai observa dac\u0103 cineva elimin\u0103 unul.
caldav.admin.servers.quirks.addsCompatibilityMarkers.label=Acest server adaug\u0103 marcaje de compatibilitate Outlook \u0219i Thunderbird
caldav.admin.servers.quirks.addsCompatibilityMarkers.cost=Alte aplica\u021bii de calendar adaug\u0103 aceste c\u00e2mpuri. eXo le ignor\u0103 \u0219i le las\u0103 a\u0219a cum sunt.
caldav.admin.servers.quirks.addsFormattedDescription.label=Acest server adaug\u0103 o copie formatat\u0103 a descrierii
caldav.admin.servers.quirks.addsFormattedDescription.cost=O copie rich text a descrierii. eXo o ignor\u0103 \u0219i compar\u0103 \u00een schimb versiunea text simplu.
caldav.admin.servers.quirks.stampsDefaultPriority.label=Acest server aplic\u0103 o prioritate implicit\u0103 fiec\u0103rei \u00eent\u00e2lniri pe care o stocheaz\u0103
caldav.admin.servers.quirks.stampsDefaultPriority.cost=O prioritate pe care nu a ales-o nimeni, ad\u0103ugat\u0103 fiec\u0103rei copii. eXo nu mai scrie nicio prioritate, astfel \u00eenc\u00e2t nu o mai consider\u0103 o modificare \u0219i nu va mai observa dac\u0103 cineva seteaz\u0103 o prioritate real\u0103 pe acest server.
caldav.admin.servers.quirks.rewritesDescription.label=Acest server rescrie textul invita\u021biei
caldav.admin.servers.quirks.rewritesDescription.cost=eXo nu mai verific\u0103 descrierea copiilor de pe acest server, inclusiv linkurile de r\u0103spuns din ea. Un link rescris nu va fi detectat.
caldav.admin.servers.quirks.generic.added.label=Acest server adaug\u0103 {0}, pe care eXo nu \u00eel scrie
caldav.admin.servers.quirks.generic.added.cost=eXo nu mai trateaz\u0103 acest lucru ca modificare pe acest server.
caldav.admin.servers.quirks.generic.dropped.label=Acest server nu p\u0103streaz\u0103 {0}
caldav.admin.servers.quirks.generic.dropped.cost=eXo nu mai trateaz\u0103 absen\u021ba sa ca modificare \u0219i nu va mai observa dac\u0103 cineva \u00eel elimin\u0103.
caldav.admin.servers.quirks.generic.rewritten.label=Acest server rescrie {0}
caldav.admin.servers.quirks.generic.rewritten.cost=eXo nu mai verific\u0103 aceast\u0103 valoare pe copiile stocate de acest server.
caldav.admin.servers.quirks.changesWhatIsWritten=Schimb\u0103 ce scrie eXo \u00een calendarele de pe acest server
caldav.admin.servers.foreignWriters.title=Alte implement\u0103ri eXo care scriu aici
caldav.admin.servers.foreignWriters.subtitle=O alt\u0103 instan\u021b\u0103 eXo a scris copii ale \u00eent\u00e2lnirilor \u00een conturile de pe acest server. Ambele repar\u0103 acelea\u0219i copii \u0219i niciuna nu poate deosebi scrierile celeilalte de o modificare f\u0103cut\u0103 de cineva.
caldav.admin.servers.foreignWriters.none=Nu s-a observat nicio alt\u0103 instan\u021b\u0103 eXo scriind \u00een conturile de pe acest server. A\u0219a arat\u0103 un server \u00een care scrie doar aceast\u0103 implementare \u0219i nu necesit\u0103 nicio aten\u021bie.
caldav.admin.servers.foreignWriters.cost=eXo verific\u0103 copiile \u00eent\u00e2lnirilor pe care le-a trimis aici \u0219i repar\u0103 ce s-a modificat, presupun\u00e2nd c\u0103 le-a scris pe toate. Copiile scrise de aceast\u0103 alt\u0103 implementare sunt num\u0103rate \u0219i comparate ca \u0219i cum ar fi ale eXo.
caldav.admin.servers.foreignWriters.lastSeen=V\u0103zut ultima dat\u0103 pe {0}
caldav.admin.servers.foreignWriters.resolution=Conecta\u021bi una dintre cele dou\u0103 implement\u0103ri la un alt cont CalDAV. \u00centre timp, nimic de aici nu este importat, eliminat sau reparat altfel, iar copiile deja scrise r\u0103m\u00e2n p\u00e2n\u0103 c\u00e2nd cineva le \u0219terge.
caldav.admin.servers.quirks.omitsSoloOrganizer.label=Acest server elimin\u0103 organizatorul dintr-un eveniment f\u0103r\u0103 al\u021bi participan\u021bi
caldav.admin.servers.quirks.omitsSoloOrganizer.cost=Nu se schimb\u0103 nimic: pe toate serverele, eXo omite deja organizatorul din evenimentele f\u0103r\u0103 al\u021bi participan\u021bi. Copiile evenimentelor cu participan\u021bi \u00ee\u0219i p\u0103streaz\u0103 organizatorul.
caldav.error.mainCalendarUnknown=eXo nu poate copia \u00eent\u00e2lnirile dumneavoastr\u0103 \u00een acest cont: contul nu indic\u0103 ce calendar al s\u0103u este cel implicit, a\u0219a c\u0103 nu exist\u0103 unde s\u0103 fie puse. Contacta\u021bi administratorul.
caldav.error.foreignCopy=Aceast\u0103 \u00eent\u00e2lnire se afl\u0103 deja \u00een contul dumneavoastr\u0103 de calendar, ad\u0103ugat\u0103 de altcineva. eXo las\u0103 acea copie a\u0219a cum este.
caldav.error.forbidden=Acest calendar este partajat cu dumneavoastr\u0103 doar \u00een citire, a\u0219a c\u0103 modificarea nu poate fi salvat\u0103 \u00een el.

caldav.server.authProviderUnknown=Aceast\u0103 metod\u0103 de autentificare nu este disponibil\u0103 pe acest server. Alege\u021bi una din list\u0103.
caldav.server.writeChannelUnavailable=Acest server nu ofer\u0103 acest mod de scriere a copiilor \u00eent\u00e2lnirilor. Alege\u021bi CalDAV standard.
caldav.server.writeChannelNotRecognised=Cu aceste set\u0103ri, suplimentul care ofer\u0103 acest mod de scriere a copiilor \u00eent\u00e2lnirilor nu recunoa\u0219te acest server ca fiind unul dintre ale sale. Verifica\u021bi ce s-a modificat \u00een set\u0103rile serverului.
caldav.server.url.malformed=Aceasta nu este o adres\u0103 web utilizabil\u0103. Trebuie s\u0103 \u00eenceap\u0103 cu https:// (sau http://, dac\u0103 administratorul permite) \u0219i s\u0103 indice un server.
caldav.server.url.schemeNotAllowed=Sunt acceptate doar adrese https. Cere\u021bi administratorului s\u0103 permit\u0103 http dac\u0103 acest server nu are certificat.
caldav.server.url.credentials=Elimina\u021bi numele de utilizator \u0219i parola din adres\u0103. eXo folose\u0219te datele de autentificare cu care se conecteaz\u0103 fiecare utilizator, niciodat\u0103 pe cele scrise \u00een adres\u0103.
caldav.server.url.fragment=Elimina\u021bi # \u0219i tot ce urmeaz\u0103 dup\u0103 el. O adres\u0103 de server nu con\u021bine fragment.
caldav.server.url.portNotAllowed=Acest port nu este permis. Folosi\u021bi portul standard sau cere\u021bi administratorului s\u0103 \u00eel permit\u0103 pe acesta.
caldav.server.url.usernameInAuthority=Substituentul {username} poate ap\u0103rea doar dup\u0103 numele serverului, \u00een cale. Pune\u021bi-l \u00een cale, nu \u00een adresa serverului propriu-zis.
caldav.server.url.privateAddress=Aceast\u0103 adres\u0103 indic\u0103 o loca\u021bie din propria re\u021bea, a\u0219a c\u0103 nu este acceptat\u0103. eXo se conecteaz\u0103 de pe server, deci o adres\u0103 intern\u0103 ar putea fi folosit\u0103 pentru a accesa ma\u0219ini care nu au fost niciodat\u0103 destinate expunerii. Dac\u0103 adresa este corect\u0103, cere\u021bi administratorului s\u0103 o permit\u0103.
caldav.server.url.unresolvable=Acest nume de server nu exist\u0103. Verifica\u021bi ortografia.
caldav.share.calendarNotFound=Acest calendar nu mai exist\u0103.
caldav.share.notOwner=Doar proprietarul unui calendar \u00eel poate partaja.
caldav.share.notConnected=Conecta\u021bi contul de calendar \u00eenainte de a partaja un calendar.
caldav.share.calendarNotOnServer=Acest calendar nu este \u00eenc\u0103 pe serverul dumneavoastr\u0103 de calendar. \u00cencerca\u021bi din nou dup\u0103 urm\u0103toarea sincronizare.
caldav.share.notSupported=Serverul dumneavoastr\u0103 de calendar nu permite eXo s\u0103 partajeze calendare.
caldav.share.shareeRequired=Alege\u021bi un coleg cu care s\u0103 partaja\u021bi.
caldav.share.shareeUnknown=Acest coleg nu este un utilizator activ.
caldav.share.shareeIsOwner=Sunte\u021bi deja proprietarul acestui calendar.
caldav.share.shareeNotConnected=Acest coleg nu este conectat la acela\u0219i server de calendar.
caldav.share.samePrincipal=Acest coleg folose\u0219te acela\u0219i cont de calendar ca dumneavoastr\u0103, a\u0219a c\u0103 vede deja acest calendar.
caldav.share.notReadOnly=Acest coleg are mai mult dec\u00e2t acces de vizualizare, setat \u00een afara platformei. Modifica\u021bi-l \u00een aplica\u021bia dumneavoastr\u0103 de calendar.
caldav.share.aclUnreadable=Serverul dumneavoastr\u0103 de calendar nu permite platformei s\u0103 vad\u0103 cu cine este partajat acest calendar.
caldav.share.aclNotUnderstood=Acest calendar este partajat \u00eentr-un mod pe care platforma nu \u00eel poate modifica \u00een siguran\u021b\u0103. Gestiona\u021bi-i partajarea \u00een aplica\u021bia dumneavoastr\u0103 de calendar.
caldav.share.serverRefused=Serverul dumneavoastr\u0103 de calendar a refuzat modificarea.
caldav.share.notApplied=Serverul dumneavoastr\u0103 de calendar a acceptat modificarea, dar nu a aplicat-o.
caldav.share.serverUnavailable=Serverul dumneavoastr\u0103 de calendar nu a putut fi accesat. \u00cencerca\u021bi din nou mai t\u00e2rziu.
caldav.share.credentials=Serverul dumneavoastr\u0103 de calendar a refuzat contul. Verifica\u021bi parola \u00een set\u0103rile agendei.
caldav.share.ownerUnknown=Serverul dumneavoastr\u0103 de calendar nu a indicat cu ce cont sunte\u021bi conectat. \u00cencerca\u021bi din nou dup\u0103 urm\u0103toarea sincronizare.
caldav.share.foreignAccessNotPreserved=Cineva are mai mult dec\u00e2t acces de vizualizare la acest calendar, setat \u00een afara platformei. Modificarea partaj\u0103rii aici ar putea afecta acel acces, a\u0219a c\u0103 gestiona\u021bi-l \u00een aplica\u021bia dumneavoastr\u0103 de calendar.
caldav.share.shareeAddressUnknown=Serverul de calendar nu a furnizat adresa de e-mail a acestui coleg, a\u0219a c\u0103 platforma nu i-a putut modifica accesul.
caldav.share.shareeHasOtherAccess=Acest coleg are alt tip de acces la acest calendar, setat \u00een afara platformei, de exemplu vizualizarea perioadelor \u00een care sunte\u021bi liber. Partajarea aici l-ar \u00eenlocui, a\u0219a c\u0103 modifica\u021bi-l \u00een aplica\u021bia dumneavoastr\u0103 de calendar.
caldav.share.notOwnedOnServer=Acest calendar apar\u021bine altcuiva sau nu ave\u021bi dreptul s\u0103 \u00eei gestiona\u021bi partajarea. Din platform\u0103 pute\u021bi partaja doar calendarele proprii.
caldav.admin.servers.drawer.authentication=Autentificare
caldav.admin.servers.drawer.authProvider=Cum se autentific\u0103 utilizatorii
caldav.admin.servers.drawer.disconnection.title=Modifica\u021bi autentificarea
caldav.admin.servers.drawer.disconnection.one=Modificarea autentific\u0103rii deconecteaz\u0103 1 utilizator al acestui server.
caldav.admin.servers.drawer.disconnection.many=Modificarea autentific\u0103rii deconecteaz\u0103 {0} utilizatori ai acestui server.
caldav.admin.servers.drawer.disconnection.question=Sigur dori\u021bi s\u0103 salva\u021bi?
caldav.admin.servers.drawer.disconnection.confirm=Salva\u021bi
caldav.admin.servers.drawer.disconnection.cancel=Anula\u021bi
caldav.admin.servers.drawer.disconnection.countFailed=Utilizatorii acestui server nu au putut fi num\u0103ra\u021bi. Nu s-a salvat nimic, \u00eencerca\u021bi din nou.
