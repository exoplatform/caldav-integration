caldav.admin.servers.mirrorTarget.appliesTo=Applies to users who keep meeting copies enabled in their own agenda settings.
caldav.admin.servers.mirrorTarget.dedicated.label=A dedicated eXo Meetings calendar
caldav.admin.servers.mirrorTarget.dedicated.consequence=Keeps eXo meetings separate from the user's own events. On some servers, a separate calendar is left out of availability, so colleagues see eXo meeting times as free and no answer buttons appear on the copies.
caldav.admin.servers.mirrorTarget.main.label=The account main calendar
caldav.admin.servers.mirrorTarget.main.consequence=Copies count toward the user's availability, and the server's own answer buttons appear where it offers them. Choose this only once copies synchronise cleanly on this server.
caldav.admin.servers.mirrorTarget.moves=\u0391\u03c5\u03c4\u03ae \u03b7 \u03b1\u03bb\u03bb\u03b1\u03b3\u03ae \u03bc\u03b5\u03c4\u03b1\u03ba\u03b9\u03bd\u03b5\u03af \u03c4\u03b1 \u03c5\u03c0\u03ac\u03c1\u03c7\u03bf\u03bd\u03c4\u03b1 \u03b1\u03bd\u03c4\u03af\u03b3\u03c1\u03b1\u03c6\u03ac \u03c3\u03b1\u03c2 \u03c3\u03c4\u03bf\u03bd \u03b5\u03c0\u03cc\u03bc\u03b5\u03bd\u03bf \u03c3\u03c5\u03b3\u03c7\u03c1\u03bf\u03bd\u03b9\u03c3\u03bc\u03cc. \u03a4\u03bf \u03c0\u03b1\u03bb\u03b9\u03cc \u03b7\u03bc\u03b5\u03c1\u03bf\u03bb\u03cc\u03b3\u03b9\u03bf \u03c0\u03b1\u03c1\u03b1\u03bc\u03ad\u03bd\u03b5\u03b9 \u03c3\u03c4\u03b7 \u03b8\u03ad\u03c3\u03b7 \u03c4\u03bf\u03c5, \u03ba\u03b5\u03bd\u03cc.
caldav.admin.servers.writeChannel.label=How meeting copies are written
caldav.admin.servers.writeChannel.hint=Applies to every copy eXo writes or removes on this server, for every user.
caldav.admin.servers.writeChannel.caldav.label=Standard CalDAV
caldav.admin.servers.writeChannel.caldav.consequenceAnyServer=Works with every CalDAV server. Some servers send their own invitations for a meeting written this way: invitees on the same server then receive it twice, and an answer they give on the server's own copy never reaches eXo.
