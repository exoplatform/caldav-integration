caldav.admin.servers.preset.bluemind.label=Bluemind
caldav.admin.servers.preset.bluemind.summary=Server name, address format and BlueMind's known limitations are filled in: no video-conference links, Outlook and Thunderbird markers, a duplicate description, a default priority on every event.\n\nCopies go to the main calendar, not a dedicated one, and answer links stay on. Check the first few syncs on your server, and review everything before saving.
caldav.admin.servers.preset.stalwart.label=Stalwart
caldav.admin.servers.preset.stalwart.summary=I've filled in the server name and address format. Stalwart preserves what eXo sends, so it's set to keep everything rather than inherit the deployment-wide exceptions.\n\nCopies go to a dedicated eXo Meetings calendar. Answer links are off, since Stalwart accepts answers from any calendar and the client's own Accept and Decline already work on the copy.\n\nReview before saving.
caldav.admin.servers.preset.other.label=Another server
caldav.admin.servers.preset.other.summary=Nothing is filled in. A missing server is one we haven't tested, not one that's unsupported. Fill in the form yourself, and eXo will suggest settings once the first events have synced.
caldav.admin.servers.preset.changesWhatIsWritten=One of these changes what eXo writes into your users' calendars, not only what it compares.
