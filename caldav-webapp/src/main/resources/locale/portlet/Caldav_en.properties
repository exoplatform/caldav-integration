caldav.admin.servers.url.hint=The URL may hold a {username} placeholder, replaced by the account each user connects with.
caldav.admin.servers.url.reachabilityHint=eXo connects from the server, not the user's browser, so this address only needs to be reachable from the server. Internal addresses are refused unless your deployment allows them, since eXo could otherwise be used to reach machines that were never meant to be exposed.
caldav.admin.servers.url.corsHint=Users connect from their browser, so the address must share the platform's origin or send CORS headers \u2014 a third-party server without them must be fronted on the platform's own address.
