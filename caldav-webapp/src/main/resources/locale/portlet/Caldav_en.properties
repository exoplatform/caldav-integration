caldav.admin.servers.answerLinks.label=Add answer links to the copy
caldav.admin.servers.answerLinks.hint=Write Accept / Decline / Tentative links into each meeting copy description. Keep this on unless the calendar clients used with this server offer their own answer buttons on the copies, because without either, users cannot answer from their calendar.
caldav.admin.servers.mirrorTarget.label=Where meeting copies are written
caldav.admin.servers.mirrorTarget.appliesTo=Applies to users who keep meeting copies enabled in their own agenda settings.
caldav.admin.servers.mirrorTarget.dedicated.label=A dedicated eXo Meetings calendar
caldav.admin.servers.mirrorTarget.dedicated.consequence=Keeps eXo meetings separate from the user's own events. Some servers leave a separate calendar out of availability and show no answer buttons on it, so colleagues scheduling around the user may not see their eXo meetings as busy.
caldav.admin.servers.mirrorTarget.main.label=The account main calendar
caldav.admin.servers.mirrorTarget.main.consequence=Copies count toward the user's availability, and the server's own answer buttons appear where it offers them. Choose this only once copies synchronise cleanly on this server.
caldav.admin.servers.mirrorTarget.moves=Changing this moves each user's existing copies over their next synchronisations. The old eXo Meetings calendar is left in place, empty.
