caldav.admin.servers.quirks.title=What this server does
caldav.admin.servers.quirks.subtitle=Seen by eXo while checking the meeting copies pushed here. Tick one to stop treating it as a change.
caldav.admin.servers.quirks.none=Nothing to excuse: eXo has found nothing on this server that it treats as a change. That is what a server storing copies faithfully looks like, and it needs no attention.
