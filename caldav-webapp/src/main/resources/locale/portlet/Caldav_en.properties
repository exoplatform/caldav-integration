caldav.calendarStates.manage=See what is wrong
caldav.calendarStates.drawer.title=Calendars needing attention
caldav.calendarStates.drawer.description=These calendars are not synchronising the way the others are. The rest of your calendars are unaffected.
caldav.calendarStates.explain.REMOTE_CREATE_REFUSED=Your calendar account does not let eXo create calendars on it, so this one is not copied there. Calendars that already exist on the account still appear in eXo.
caldav.calendarStates.explain.PAUSED=Synchronising this calendar failed repeatedly, so eXo stopped trying. Synchronise now to start again; if it keeps failing, reconnect the account.
caldav.calendarStates.explain.EXO_ORPHANED=You deleted this calendar in eXo, and it could not be deleted on your calendar account. It is still there.
caldav.calendarStates.explain.REMOTE_GONE=This calendar is no longer on your calendar account. Nothing new will arrive in it, and what eXo already holds is untouched.
caldav.calendarStates.explain.unknown=This calendar is not synchronising normally.
