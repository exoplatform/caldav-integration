caldav.admin.servers.preset.label=Which server is this?
caldav.admin.servers.preset.bluemind.label=BlueMind
caldav.admin.servers.preset.bluemind.summary=Filled in the name, the address shape, and what BlueMind is known to do with a copy: it does not keep video-conference links, it adds Outlook and Thunderbird compatibility markers and a formatted duplicate of the description, and it drops the organizer of an event with no other participants. Copies are set to go to the account main calendar rather than to a dedicated one, because on BlueMind a dedicated calendar is left out of the account availability, so colleagues booking around the user see eXo meeting times as free, and it carries no answer buttons. The caution on that option still applies here: watch the first synchronisations on your own server. Answer links are left on, because BlueMind shows its own answer buttons on the default calendar only. Change anything you disagree with before saving.
caldav.admin.servers.preset.stalwart.label=Stalwart
caldav.admin.servers.preset.stalwart.summary=Filled in the name and the address shape. Nothing to excuse: Stalwart stores back what eXo writes, so this server is declared as keeping everything rather than inheriting the deployment-wide exceptions. Copies are set to go to a dedicated eXo Meetings calendar. Answer links are turned off, because Stalwart accepts an answer sent from any calendar: the calendar client's own Accept and Decline already work on a copy wherever it sits, so eXo's links would only add text to every copy. Change anything you disagree with before saving.
caldav.admin.servers.preset.other.label=Another server
caldav.admin.servers.preset.other.summary=Nothing is filled in. A server missing from this list is one we have not characterised, not one that does not work — fill the form yourself, and the drawer will offer whatever it observes once the first copies are compared.
caldav.admin.servers.preset.changesWhatIsWritten=One of these changes what eXo writes into your users' calendars, not only what it compares.
caldav.admin.servers.name=Name
caldav.admin.servers.name.placeholder=Name shown to users
caldav.admin.servers.description=Description
caldav.admin.servers.description.placeholder=Optional description shown to users
caldav.admin.servers.url=Server URL
caldav.admin.servers.url.placeholder=https://caldav.example.org/dav/cal/{username}/
caldav.admin.servers.url.hint=The URL may hold a {username} placeholder, replaced by the account each user connects with.
caldav.admin.servers.url.reachabilityHint=The platform itself connects to this address, not the user's browser, so it only has to be reachable from the server. An address on your internal network is refused unless the deployment allows it, because eXo reaching it on a user's behalf is how machines that were never meant to be reachable get reached.
