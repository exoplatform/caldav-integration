caldav.admin.servers.title=CalDAV servers
caldav.admin.servers.subtitle=Declare the CalDAV servers users can connect a personal account to. Their calendars synchronise both ways with My Calendars; their eXo meetings are copied one way into their calendar.
caldav.admin.servers.add=Add
