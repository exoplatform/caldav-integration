caldav.tuning.futureDaysOutOfRange=Reading ahead must be between 1 and 3650 days.
caldav.tuning.sweepStaleOutOfRange=The background refresh delay must be between 1 minute and one week.
caldav.tuning.sweepBatchOutOfRange=The background run must take between 1 and 500 calendars.
