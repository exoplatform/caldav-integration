spring.liquibase.change-log=classpath:db/changelog/caldav-rdbms.db.changelog-master.xml

# The synchronisation sweep. It keeps connected accounts fresh so that an
# agenda opened afterwards finds the work already done, rather than waiting on
# a server outside the platform before it can list anything.
#
# Set the cron to - to turn it off, which is the right answer for an instance
# with a handful of CalDAV users: their own page loads already synchronise them.
exo.agenda.caldav.sync.sweep.cron=0 */5 * * * ?
# How long since a successful sync makes a binding worth sweeping. Longer than
# the on-access throttle on purpose: anything younger would have been refused
# by the throttle anyway, and sweeping it would only race the owner's own page.
exo.agenda.caldav.sync.sweep.staleMinutes=30
# How many stale bindings one run looks at. Bindings, not accounts: several of
# one account collapse into a single pass.
exo.agenda.caldav.sync.sweep.batchSize=50

# How many times one pushed copy may be written again before eXo stops trying.
# An object that keeps disappearing — a server refusing writes it pretends to
# accept, a rule on the account deleting what eXo sends — is said out loud and
# left alone rather than re-pushed on every synchronisation for ever.
exo.agenda.caldav.mirror.maxRepairs=3

# What a declared CalDAV server address may be (EXO-89774). Once declared, a
# server is an address the PLATFORM connects to, with server-side credentials,
# on behalf of connected users — so what an administrator may type here is a
# security boundary, not a preference. Each of the four narrows or widens one
# thing, and none of them is implied by another.
#
# Schemes an administrator may declare. https alone by default: a deployment
# fronting a plain-http CalDAV server has to say so.
exo.agenda.caldav.server.allowedSchemes=https
# Ports a declared URL may reach, implicit default ports included.
exo.agenda.caldav.server.allowedPorts=80,443
# Hosts exempted from the private-address block — the narrow opt-out, for the
# deployment whose CalDAV server genuinely is internal. Comma-separated, empty
# by default. Prefer this over allowPrivateAddresses below: it names the one
# server you mean instead of opening the whole address space.
exo.agenda.caldav.server.allowedHosts=
# Whether ANY loopback, link-local or private address may be declared. The
# blunt instrument; leave it false unless the internal CalDAV server's address
# cannot be named ahead of time.
exo.agenda.caldav.server.allowPrivateAddresses=false
#
# These four also decide whether the rows seeded into an EMPTY registry at
# startup arrive switched ON (EXO-89794). A seed whose address passes the check
# is active, exactly as before; anything else — the two shipped .invalid
# placeholders included — is seeded INACTIVE and said out loud in the boot log.
# So a fresh install ships no live registration nobody vouched for, and the
# local development rig is reached because this file says so rather than
# because a product default pointed at it. A deployment that already holds rows
# is never seeded again and is not judged by any of this.
