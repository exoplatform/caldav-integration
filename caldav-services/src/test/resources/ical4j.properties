# ical4j's TimeZoneUpdater fetches a zone's TZURL the first time that zone is
# loaded, with connect and read timeouts of 0. In a test run that turns a
# missing or black-holed egress into a hang rather than a failure, and makes
# the suite depend on the network for a purely local computation.
#
# The registry ships the zone definitions already, so the update buys nothing
# here. Disabling it keeps the suite offline-deterministic.
net.fortuna.ical4j.timezone.update.enabled=false
